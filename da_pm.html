<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f3;color:#1a1a1a;min-height:100vh}
.app{max-width:900px;margin:0 auto;padding:1.5rem 1rem}
.card{background:#fff;border:1px solid #e5e5e0;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem}
.sec-label{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:8px;font-size:13px;border:1px solid #e0e0db;background:#fff;cursor:pointer;color:#1a1a1a;font-family:inherit}
.btn:hover{background:#f5f5f3}
.btn-primary{background:#3B4BC8;color:#fff;border-color:#3B4BC8}
.btn-primary:hover{background:#2d3db0}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-danger{background:#fef2f2;color:#dc2626;border-color:#fca5a5}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;font-weight:600}
.badge-ok{background:#EAF3DE;color:#3B6D11}
.badge-pend{background:#F1EFE8;color:#5F5E5A}
.badge-warn{background:#FAEEDA;color:#854F0B}
.badge-err{background:#FCEBEB;color:#A32D2D}
.badge-blue{background:#E6F1FB;color:#185FA5}
.tab-row{display:flex;gap:0;border-bottom:1px solid #e5e5e0;margin-bottom:1.5rem}
.tab{padding:10px 18px;font-size:13px;cursor:pointer;color:#888;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.tab.active{color:#3B4BC8;border-bottom-color:#3B4BC8;font-weight:600}
.month-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.month-card{border-radius:8px;padding:10px 12px;border:1px solid #e5e5e0;background:#fafafa;cursor:pointer;transition:border-color .15s}
.month-card:hover{border-color:#3B4BC8}
.month-card.loaded{border-color:#3B6D11;background:#f0f7f0}
.month-card.extracting{border-color:#3B4BC8;background:#f0f4ff;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.month-name{font-size:12px;font-weight:600;margin-bottom:6px;color:#1a1a1a}
.doc-row{display:flex;align-items:center;justify-content:space-between;font-size:10px;margin-bottom:3px}
.progress-bar{height:4px;border-radius:999px;background:#e5e5e0;margin-top:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:999px;background:#3B4BC8;transition:width .3s}
.paper-item{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid #e5e5e0;border-radius:8px;background:#fafafa;margin-bottom:6px}
.paper-num{width:24px;height:24px;border-radius:50%;background:#EEEDFE;color:#3B4BC8;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.paper-body{flex:1}
.paper-title{font-size:13px;font-weight:600;color:#1a1a1a}
.paper-sub{font-size:11px;color:#888;margin-top:2px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-box{background:#fff;border-radius:12px;padding:1.5rem;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:700;margin-bottom:4px}
.modal-sub{font-size:12px;color:#888;margin-bottom:16px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #e0e0db;border-radius:8px;font-size:13px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:#3B4BC8}
.err-msg{background:#fef2f2;color:#dc2626;font-size:12px;padding:8px;border-radius:6px;display:none;margin-bottom:8px}
.loading{display:flex;align-items:center;gap:8px;color:#888;font-size:13px;padding:1rem 0}
.spinner{width:18px;height:18px;border:2px solid #e5e5e0;border-top-color:#3B4BC8;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1rem}
.kpi{background:#f5f5f3;border-radius:8px;padding:10px 12px}
.kpi-label{font-size:10px;color:#888;margin-bottom:3px}
.kpi-val{font-size:16px;font-weight:700}
.upload-area{border:2px dashed #e0e0db;border-radius:8px;padding:24px;text-align:center;cursor:pointer;transition:border-color .15s}
.upload-area:hover,.upload-area.dragover{border-color:#3B4BC8;background:#f0f4ff}
.cifras-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cifra-item{background:#f5f5f3;border-radius:6px;padding:8px 10px}
.cifra-label{font-size:10px;color:#888;margin-bottom:2px}
.cifra-val{font-size:13px;font-weight:600;color:#1a1a1a}
select[multiple]{height:auto;min-height:80px}
.header-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:8px}
</style>
</head>

// ===== SUPABASE HELPERS =====
async function sbGet(table,qs=''){
  const r=await fetch(`${SB_URL}/rest/v1/${table}${qs}`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'}});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbPost(table,body,prefer='return=minimal'){
  const r=await fetch(`${SB_URL}/rest/v1/${table}`,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':prefer},body:JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
  return r;
}
async function sbPatch(table,qs,body){
  const r=await fetch(`${SB_URL}/rest/v1/${table}${qs}`,{method:'PATCH',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
  return r;
}
async function sbDelete(table,qs){
  const r=await fetch(`${SB_URL}/rest/v1/${table}${qs}`,{method:'DELETE',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
  if(!r.ok) throw new Error(await r.text());
  return r;
}
function fmtMXN(n){return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:0,maximumFractionDigits:0}).format(parseFloat(n)||0);}
function todayKey(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Tijuana'});}
function nowISO(){return new Date().toISOString();}
function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ===== INICIO =====
async function init(){
  clientesCache=await sbGet('clientes','?select=id,nombre&order=nombre.asc')||[];
  decCache=await sbGet('da_declaraciones','?select=*&order=ejercicio.desc,cliente_nombre.asc')||[];
  renderLista();
}

// ===== LISTA DE DECLARACIONES =====
function renderLista(){
  const anioActual=new Date().getFullYear();
  const porEjercicio={};
  decCache.forEach(d=>{if(!porEjercicio[d.ejercicio])porEjercicio[d.ejercicio]=[];porEjercicio[d.ejercicio].push(d);});

  let html=`
  <div class="header-bar">
    <div>
      <div style="font-size:18px;font-weight:700">Declaración Anual — Personas Morales</div>
      <div style="font-size:12px;color:#888;margin-top:2px">MSST Consulting SC</div>
    </div>
    <button class="btn btn-primary" onclick="renderNuevaDeclaracion()">+ Nueva declaración</button>
  </div>`;

  if(!decCache.length){
    html+='<div class="card"><div style="font-size:14px;color:#888;text-align:center;padding:2rem">Sin declaraciones. Crea la primera con "+ Nueva declaración".</div></div>';
  } else {
    Object.keys(porEjercicio).sort((a,b)=>b-a).forEach(ej=>{
      html+=`<div class="sec-label">Ejercicio ${ej}</div>`;
      html+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:1.5rem">';
      porEjercicio[ej].forEach(d=>{
        const pct=d.pct_avance||0;
        const statusColor=pct===100?'#3B6D11':pct>0?'#185FA5':'#888';
        html+=`
        <div class="card" style="cursor:pointer;margin-bottom:0" onclick="abrirDeclaracion('${d.id}')">
          <div style="font-size:14px;font-weight:700;margin-bottom:3px">${escH(d.cliente_nombre)}</div>
          <div style="font-size:11px;color:#888;margin-bottom:10px">Ejercicio ${d.ejercicio}</div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <span style="font-size:11px;color:${statusColor};font-weight:600">${pct===100?'Completa':pct>0?'En proceso':'Sin iniciar'}</span>
            <span style="font-size:11px;color:#888">${pct}%</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${pct===100?'#3B6D11':'#3B4BC8'}"></div></div>
        </div>`;
      });
      html+='</div>';
    });
  }
  app.innerHTML=html;
}

// ===== NUEVA DECLARACIÓN =====
function renderNuevaDeclaracion(){
  const anioActual=new Date().getFullYear();
  const anios=[];for(let y=2020;y<=anioActual;y++)anios.push(y);anios.reverse();
  const cliOpts=clientesCache.map(c=>`<option value="${c.id}" data-nombre="${escH(c.nombre)}">${escH(c.nombre)}</option>`).join('');
  const anioOpts=anios.map(y=>`<option value="${y}" ${y===anioActual-1?'selected':''}>${y}</option>`).join('');

  app.innerHTML=`
  <div class="header-bar">

    <div style="font-size:16px;font-weight:700">Nueva declaración anual</div>
  </div>
  <div class="card">
    <div class="sec-label">Datos generales</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
      <div>
        <div style="font-size:12px;color:#888;margin-bottom:4px">Cliente *</div>
        <select id="da-cliente" onchange="document.getElementById('da-cli-nombre').value=this.options[this.selectedIndex].dataset.nombre||''">
          <option value="">Selecciona cliente...</option>${cliOpts}
        </select>
        <input type="hidden" id="da-cli-nombre">
      </div>
      <div>
        <div style="font-size:12px;color:#888;margin-bottom:4px">Ejercicio *</div>
        <select id="da-ejercicio">${anioOpts}</select>
      </div>
    </div>
    <div style="margin-bottom:12px">
      <div style="font-size:12px;color:#888;margin-bottom:4px">Notas</div>
      <input id="da-notas" type="text" placeholder="Observaciones iniciales...">
    </div>
    <div class="err-msg" id="da-err"></div>
    <button class="btn btn-primary" style="width:100%" onclick="guardarDeclaracion()">Crear declaración</button>
  </div>`;
}

async function guardarDeclaracion(){
  const cliSel=document.getElementById('da-cliente');
  const cliente_id=cliSel.value||null;
  const cliente_nombre=document.getElementById('da-cli-nombre').value||(cliSel.selectedIndex>0?cliSel.options[cliSel.selectedIndex].text:'');
  const ejercicio=parseInt(document.getElementById('da-ejercicio').value);
  const notas=document.getElementById('da-notas').value.trim()||null;
  const err=document.getElementById('da-err');err.style.display='none';
  if(!cliente_nombre||!ejercicio){err.textContent='Cliente y ejercicio son obligatorios.';err.style.display='block';return;}

  const res=await sbPost('da_declaraciones',{cliente_id,cliente_nombre,ejercicio,notas,status:'en_proceso'},'return=representation');
  const data=await res.json();
  const newDec=Array.isArray(data)?data[0]:data;

  // Crear registros de documentos pendientes (12 balanzas + ER)
  const tiposDoc=[...TIPOS_BALANZA,'er_anual'];
  for(const tipo of tiposDoc){
    await sbPost('da_documentos',{declaracion_id:newDec.id,tipo,status:'pendiente'},'return=minimal');
  }
  // Crear registros de papeles de trabajo
  for(const p of PAPELES){
    await sbPost('da_papeles',{declaracion_id:newDec.id,numero:p.num,tipo:p.tipo,status:'pendiente'},'return=minimal');
  }

  decCache=await sbGet('da_declaraciones','?select=*&order=ejercicio.desc,cliente_nombre.asc')||[];
  abrirDeclaracion(newDec.id);
}

// ===== DETALLE DE DECLARACIÓN =====
async function abrirDeclaracion(id){
  app.innerHTML='<div class="loading"><div class="spinner"></div>Cargando...</div>';
  const [dec,docs,papeles]=await Promise.all([
    sbGet('da_declaraciones','?id=eq.'+id+'&select=*').then(d=>d[0]),
    sbGet('da_documentos','?declaracion_id=eq.'+id+'&select=*&order=tipo.asc'),
    sbGet('da_papeles','?declaracion_id=eq.'+id+'&select=*&order=numero.asc')
  ]);
  // Parsear balanza_catalogo si viene como string
  let balanza_catalogo=dec.balanza_catalogo||null;
  if(typeof balanza_catalogo==='string'){try{balanza_catalogo=JSON.parse(balanza_catalogo);}catch(e){balanza_catalogo=null;}}
  let datos_sat=dec.datos_sat||{};
  if(typeof datos_sat==='string'){try{datos_sat=JSON.parse(datos_sat);}catch(e){datos_sat={};}}
  currentDec={...dec,docs:docs||[],papeles:papeles||[],balanza_catalogo,datos_sat};
  renderDetalle();
}

function renderDetalle(){
  const d=currentDec;
  const docsMap={};
  d.docs.forEach(doc=>docsMap[doc.tipo]=doc);

  // Calcular progreso
  const totalDocs=13; // 12 balanzas + 1 ER
  const docsOk=d.docs.filter(doc=>doc.status==='extraido'||doc.status==='cargado').length;
  const papOk=d.papeles.filter(p=>p.status==='listo').length;
  const pct=Math.round((docsOk+papOk)/(totalDocs+PAPELES.length)*100);

  app.innerHTML=`
  <div class="header-bar">
    <button class="btn btn-sm" onclick="init()">← Declaraciones</button>
    <div style="flex:1;padding:0 10px">
      <div style="font-size:16px;font-weight:700">${escH(d.cliente_nombre)} — Ejercicio ${d.ejercicio}</div>
      <div style="font-size:11px;color:#888">Avance: ${pct}% · ${docsOk}/${totalDocs} documentos · ${papOk}/${PAPELES.length} papeles</div>
    </div>
    <button class="btn btn-sm btn-danger" onclick="eliminarDeclaracion('${d.id}')">🗑</button>
  </div>

  <div class="tab-row">
    <button class="tab ${currentTab==='docs'?'active':''}" onclick="setTab('docs')">Documentos fuente</button>
    <button class="tab ${currentTab==='papeles'?'active':''}" onclick="setTab('papeles')">Papeles de trabajo</button>
    <button class="tab ${currentTab==='resultado'?'active':''}" onclick="setTab('resultado')">Resultado final</button>
  </div>

  <div id="tab-content"></div>`;

  renderTabContent();
}

function setTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>{if(t.textContent.toLowerCase().includes(tab==='docs'?'doc':tab==='papeles'?'papel':'resultado'))t.classList.add('active');});
  renderTabContent();
}

function renderTabContent(){
  const el=document.getElementById('tab-content');
  if(!el)return;
  if(currentTab==='docs') el.innerHTML=renderTabDocs();
  else if(currentTab==='papeles') el.innerHTML=renderTabPapeles();
  else el.innerHTML=renderTabResultado();
  bindDocEvents();
}

// ===== TAB: DOCUMENTOS =====
function renderTabDocs(){
  const d=currentDec;
  const docsMap={};
  d.docs.forEach(doc=>docsMap[doc.tipo]=doc);

  // Balanzas
  const docsOk=TIPOS_BALANZA.filter(t=>docsMap[t]&&(docsMap[t].status==='extraido'||docsMap[t].status==='cargado')).length;

  let html=`
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div>
        <div class="sec-label" style="margin-bottom:2px">Balanzas de comprobación — 12 meses</div>
        <div style="font-size:11px;color:#888">${docsOk} de 12 cargadas</div>
      </div>
      <label class="btn btn-primary btn-sm" style="cursor:pointer">
        <input type="file" accept=".pdf,.csv,.xlsx,.xls" multiple style="display:none" id="input-multi-balanza" onchange="handleMultiUpload(event)">
        ↑ Subir varias balanzas
      </label>
    </div>
    <div class="month-grid">`;

  MESES.forEach((mes,i)=>{
    const tipo=TIPOS_BALANZA[i];
    const doc=docsMap[tipo]||{status:'pendiente'};
    const isOk=doc.status==='extraido'||doc.status==='cargado';
    const isExtracting=doc.status==='extrayendo';
    html+=`
    <div class="month-card ${isOk?'loaded':''} ${isExtracting?'extracting':''}" data-tipo="${tipo}" data-mes="${mes}">
      <div class="month-name">${mes}</div>
      <div class="doc-row">
        <span style="font-size:10px;color:#888">Balanza</span>
        <span class="badge ${isOk?'badge-ok':isExtracting?'badge-blue':'badge-pend'}">
          ${isOk?'Cargada':isExtracting?'Extrayendo...':'Pendiente'}
        </span>
      </div>
      ${isOk&&doc.archivo_nombre?`<div style="font-size:9px;color:#888;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escH(doc.archivo_nombre)}</div>`:''}
      ${isOk&&doc.cifras?`<div style="font-size:9px;color:#3B6D11;margin-top:3px">✓ Cifras extraídas</div>`:''}

// ===== TAB: PAPELES =====
function renderTabPapeles(){
  const d=currentDec;
  const papelMap={};
  d.papeles.forEach(p=>papelMap[p.tipo]=p);
  const docsMap={};
  d.docs.forEach(doc=>docsMap[doc.tipo]=doc);
  const docsOk=TIPOS_BALANZA.filter(t=>docsMap[t]&&(docsMap[t].status==='extraido'||docsMap[t].status==='cargado')).length;
  const erOk=docsMap['er_anual']&&(docsMap['er_anual'].status==='extraido'||docsMap['er_anual'].status==='cargado');

  let html='<div class="card"><div class="sec-label">Papeles de trabajo — ISR anual</div>';

  if(docsOk<12||!erOk){
    html+=`<div style="background:#FAEEDA;border-radius:8px;padding:12px;margin-bottom:14px;font-size:12px;color:#854F0B">
      <strong>⚠ Documentos incompletos</strong> — Para generar los papeles de trabajo necesitas subir las 12 balanzas y el ER anual.
      Faltan: ${docsOk<12?'balanzas ('+(12-docsOk)+' pendientes)':''}${docsOk<12&&!erOk?' y ':''}${!erOk?'ER anual':''}.
    </div>`;
  }

  PAPELES.forEach(p=>{
    const papel=papelMap[p.tipo]||{status:'pendiente'};
    const isListo=papel.status==='listo';
    const isGenerando=papel.status==='generando';
    const requiereBalanzas=[4,5,6].includes(p.num);
    const bloqueado=requiereBalanzas&&docsOk<12;

    html+=`
    <div class="paper-item" style="${bloqueado?'opacity:.5':''}">
      <div class="paper-num">${p.num}</div>
      <div class="paper-body">
        <div class="paper-title">${p.titulo}</div>
        <div class="paper-sub">${p.sub}</div>
        ${papel.datos&&isListo?`<div style="font-size:10px;color:#3B6D11;margin-top:4px">✓ Generado · Haz clic para revisar</div>`:''}
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
        <span class="badge ${isListo?'badge-ok':isGenerando?'badge-blue':'badge-pend'}">
          ${isListo?'Listo':isGenerando?'Generando...':'Pendiente'}
        </span>
        ${!bloqueado?`<button class="btn btn-sm ${isListo?'':'btn-primary'}" onclick="abrirPapel('${p.tipo}')">
          ${isListo?'Ver':'Generar'}
        </button>`:''}
      </div>
    </div>`;
  });

  html+='</div>';
  return html;
}

// ===== TAB: RESULTADO =====
function renderTabResultado(){
  const d=currentDec;
  const pm={};
  d.papeles.forEach(p=>pm[p.tipo]=p);

  // Extraer datos de cada papel
  const j5=pm['er_fiscal']?.datos||{};
  const j8=pm['ajuste_inflacion']?.datos||{};
  const j11=pm['depreciacion_fiscal']?.datos||{};
  const j13=pm['gastos']?.datos||{};
  const j17=pm['perdidas_fiscales']?.datos||{};
  const j19=pm['cuca']?.datos||{};
  const j20=pm['cufin']?.datos||{};
  const pp=pm['pagos_provisionales']?.datos||{};

  // Leer datos capturados manualmente (campos adicionales SAT)
  const extra=d.datos_sat||{};

  // ---- INGRESOS ACUMULABLES ----
  const ing_propios      = v(j5.ingresos_propios);
  const ing_nominales    = v(j5.ingresos_propios);  // base pp
  const ajuste_acum      = v(j8.ajuste_acumulable||j5.ajuste_inflacion_acumulable);
  const otros_ing        = v(j5.otros_ingresos);
  const prod_fin         = v(j5.productos_financieros);
  const ing_ej_ant       = v(j5.ingresos_ejercicio_anterior);
  const ing_extran       = v(extra.ingresos_extranjero||0);
  const dividendos_ext   = v(extra.dividendos_extranjero||0);
  const total_ing        = ing_propios+ajuste_acum+otros_ing+prod_fin+ing_ej_ant+ing_extran+dividendos_ext;

  // ---- DEDUCCIONES AUTORIZADAS ----
  const sueldos_ded      = v(extra.sueldos_deducibles||0);
  const sueldos_no_ded   = v(extra.sueldos_no_deducibles||0);
  const subsidio_emp     = v(extra.subsidio_empleo||0);
  const costo_ventas     = v(j5.costo_obra);
  const honorarios       = v(extra.honorarios||0);
  const arrendamiento    = v(extra.arrendamiento||0);
  const gastos_ded       = v(j13.total_deducibles||j5.gastos_generales);
  const devoluciones     = v(j5.devoluciones);
  const dep_fiscal       = v(j11.total_depreciacion||j5.depreciacion_fiscal);
  const ajuste_ded       = v(j8.ajuste_deducible||j5.ajuste_inflacion_deducible);
  const estimulos_ded    = v(extra.estimulos_deducibles||0);
  const total_ded        = costo_ventas+gastos_ded+sueldos_ded+honorarios+arrendamiento+devoluciones+dep_fiscal+ajuste_ded+subsidio_emp+estimulos_ded;

  // ---- DETERMINACIÓN ISR ----
  const util_antes_ptu   = total_ing-total_ded;
  const ptu_pagada       = v(extra.ptu||j5.ptu);
  const util_fiscal      = Math.max(0,util_antes_ptu-ptu_pagada);
  const perdidas_ant     = v(j17.total_amortizado||j5.perdidas_fiscales);
  const resultado_fiscal = Math.max(0,util_fiscal-perdidas_ant);
  const isr_causado      = resultado_fiscal*0.30;
  const estimulos_isr    = v(extra.estimulos_isr||0);
  const isr_ejercicio    = Math.max(0,isr_causado-estimulos_isr);
  const isr_acred_div    = v(extra.isr_acreditable_dividendos||0);
  const isr_acred_ext    = v(extra.isr_acreditable_extranjero||0);
  const pp_efectuados    = v(pp.total||extra.pagos_provisionales||j5.pagos_provisionales);
  const isr_retenido     = v(extra.isr_retenido||0);
  const total_acred      = pp_efectuados+isr_retenido+isr_acred_div+isr_acred_ext;
  const isr_cargo        = isr_ejercicio-total_acred;
  const isr_favor        = -isr_cargo;
  const cu               = total_ing>0?(util_fiscal/total_ing)*100:0;

  function fila(id,label,valor,indent,bold,color,fuente){
    const c=color||(valor<0?'#dc2626':'#1a1a1a');
    const fw=bold?'700':'400';
    const bg=bold?'background:#f8f9ff;':'';
    const pl='padding-left:'+(8+(indent||0)*16)+'px';
    const fuenteTag=fuente?'<span style="font-size:9px;color:#aaa;margin-left:6px">'+fuente+'</span>':'';
    return '<tr style="'+bg+'" id="sat-'+id+'"><td style="padding:5px 8px;font-size:12px;font-weight:'+fw+';color:'+c+';'+pl+'">'+label+fuenteTag+'</td>'+
      '<td style="padding:5px 8px;font-size:12px;text-align:right;font-weight:'+fw+';color:'+c+'">'+fmtMXN(valor)+'</td>'+
      '<td style="padding:3px 6px">'+
        (bold?'':'<input type="number" data-campo="'+id+'" value="'+valor+'" onchange="actualizarDatoSAT(this.dataset.campo,parseFloat(this.value)||0)" '+
        'style="font-size:10px;width:110px;border-radius:4px;padding:2px 4px;border:1px solid #e0e0db;text-align:right">')+
      '</td></tr>';
  }
  function sec(label){
    return '<tr style="background:#3B4BC8"><td colspan="3" style="padding:6px 10px;font-size:11px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.06em">'+label+'</td></tr>';
  }
  function subtotal(label,valor,color){
    const c=color||(valor>=0?'#3B4BC8':'#dc2626');
    return '<tr style="border-top:2px solid #e0e0db;background:#f0f4ff"><td style="padding:7px 10px;font-size:13px;font-weight:700;color:'+c+'">'+label+'</td>'+
      '<td style="padding:7px 10px;font-size:13px;font-weight:700;text-align:right;color:'+c+'">'+fmtMXN(valor)+'</td><td></td></tr>';
  }
  function v(x){ return parseFloat(x||0); }

  // Estado de papeles para badges
  function badge(tipo){
    const p=pm[tipo];
    if(!p) return '<span style="font-size:9px;background:#f0f0ec;color:#888;padding:1px 5px;border-radius:4px">Sin papel</span>';
    if(p.status==='listo') return '<span style="font-size:9px;background:#EAF3DE;color:#3B6D11;padding:1px 5px;border-radius:4px">✓</span>';
    return '<span style="font-size:9px;background:#FAEEDA;color:#854F0B;padding:1px 5px;border-radius:4px">Pendiente</span>';
  }

  return `
  <div class="card" style="margin-bottom:12px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div>
        <div class="sec-label" style="margin-bottom:2px">Declaración Anual ISR — Ejercicio ${d.ejercicio}</div>
        <div style="font-size:11px;color:#888">${escH(d.cliente_nombre)} · Régimen General · Art. 9 LISR</div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm" onclick="imprimirResultadoFinal()">🖨️ PDF</button>
        <button class="btn btn-sm btn-primary" onclick="recalcularResultado()">🔄 Recalcular</button>
      </div>
    </div>

    <!-- KPIs principales -->
    <div class="kpi-grid" style="margin-bottom:14px">
      <div class="kpi" style="border-left:3px solid #3B4BC8">
        <div class="kpi-label">Total ingresos acumulables</div>
        <div class="kpi-val" style="color:#3B4BC8">${fmtMXN(total_ing)}</div>
        <div style="font-size:10px;color:#888;margin-top:2px">J-3 / J-5 ${badge('er_fiscal')}</div>
      </div>
      <div class="kpi" style="border-left:3px solid #854F0B">
        <div class="kpi-label">Total deducciones autorizadas</div>
        <div class="kpi-val" style="color:#854F0B">${fmtMXN(total_ded)}</div>
        <div style="font-size:10px;color:#888;margin-top:2px">J-5 / J-11 / J-13 ${badge('gastos')}</div>
      </div>
      <div class="kpi" style="border-left:3px solid ${util_fiscal>=0?'#2e7d52':'#dc2626'}">
        <div class="kpi-label">Utilidad / (Pérdida) fiscal</div>
        <div class="kpi-val" style="color:${util_fiscal>=0?'#2e7d52':'#dc2626'}">${fmtMXN(util_fiscal)}</div>
        <div style="font-size:10px;color:#888;margin-top:2px">J-5</div>
      </div>
      <div class="kpi" style="border-left:3px solid ${isr_cargo>0?'#dc2626':'#2e7d52'}">
        <div class="kpi-label" style="font-weight:700">${isr_cargo>0?'ISR A CARGO':'SALDO A FAVOR'}</div>
        <div class="kpi-val" style="color:${isr_cargo>0?'#dc2626':'#2e7d52'};font-size:22px">${fmtMXN(Math.abs(isr_cargo))}</div>
        <div style="font-size:10px;color:#888;margin-top:2px">Art. 9 LISR · 30%</div>
      </div>
    </div>

    <!-- Tabla detalle alineada a guía SAT -->
    <div style="font-size:11px;font-weight:700;color:#3B4BC8;margin-bottom:6px">
      Detalle de la determinación — Guía SAT 2025 · Los campos editables permiten ajustes manuales

    <div style="overflow-x:auto">

        </tr></thead>
        <tbody>
          ${sec('INGRESOS ACUMULABLES — Arts. 17-24 LISR')}
          ${fila('ing_propios','Ingresos propios (ventas / servicios)',ing_propios,1,false,'','J-3')}
          ${fila('ajuste_acum','(+) Ajuste anual por inflación acumulable',ajuste_acum,1,false,'','J-8')}
          ${fila('otros_ing','(+) Otros ingresos acumulables',otros_ing,1,false,'','J-5')}

          ${fila('dividendos_ext','(+) Dividendos del extranjero',dividendos_ext,1,false,'',' Manual')}

          <tr style="background:#f8f9ff"><td style="padding:5px 8px;font-size:12px;color:#888;padding-left:24px">(×) Tasa ISR 30% — Art. 9 LISR</td><td colspan="2"></td></tr>

async function handleMultiUpload(event){
  const files=Array.from(event.target.files);
  if(!files.length)return;
  // Intentar asignar por nombre de archivo
  for(const file of files){
    const nombre=file.name.toLowerCase();
    let tipoAsignado=null;
    MESES.forEach((mes,i)=>{
      const mCorto=MESES_CORTO[i].toLowerCase();
      if(nombre.includes(mCorto)||nombre.includes(mes.toLowerCase())) tipoAsignado=TIPOS_BALANZA[i];
    });
    if(!tipoAsignado){
      // Si no se puede identificar, pedir al usuario que lo asigne
      const idx=await pedirMes(file.name);
      if(idx>=0) tipoAsignado=TIPOS_BALANZA[idx];
    }
    if(tipoAsignado) await subirDocumento(file,tipoAsignado,MESES[TIPOS_BALANZA.indexOf(tipoAsignado)]);
  }
}

function pedirMes(nombreArchivo){
  return new Promise(resolve=>{

async function subirDocumento(file,tipo,mesLabel){
  const decId=currentDec.id;
  const docExist=currentDec.docs.find(d=>d.tipo===tipo);
  const ext=file.name.split('.').pop().toLowerCase();
  const esCSV=ext==='csv';
  const esExcel=ext==='xlsx'||ext==='xls';
  const esPDF=ext==='pdf';
  const esBalanza=tipo.startsWith('balanza_');

  // Actualizar UI
  const docIdx=currentDec.docs.findIndex(d=>d.tipo===tipo);
  if(docIdx>=0) currentDec.docs[docIdx].status='extrayendo';
  else currentDec.docs.push({tipo,status:'extrayendo'});
  renderTabContent();

  try{
    // 1. Subir a Storage
    const contentType=esPDF?'application/pdf':esCSV?'text/csv':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    const path=decId+'/'+tipo+'-'+Date.now()+'.'+ext;
    const uploadRes=await fetch(SB_URL+'/storage/v1/object/financieros/'+path,{
      method:'POST',
      headers:{'Authorization':'Bearer '+ANON_KEY,'apikey':ANON_KEY,'Content-Type':contentType,'x-upsert':'true'},
      body:file
    });
    if(!uploadRes.ok) throw new Error('Error al subir archivo ('+uploadRes.status+'): '+await uploadRes.text());
    const url=SB_URL+'/storage/v1/object/authenticated/financieros/'+path;

    // 2. Actualizar registro
    const docData={archivo_url:url,archivo_nombre:file.name,archivo_size:file.size,status:'cargado',updated_at:nowISO()};
    if(docExist?.id) await sbPatch('da_documentos','?id=eq.'+docExist.id,docData);
    else await sbPost('da_documentos',{declaracion_id:decId,tipo,...docData},'return=minimal');

    // 3. Extraer cifras según tipo de archivo
    let cifras={};

    if(esCSV||esExcel){
      // CSV/Excel: procesar localmente sin llamar a Claude
      const text=esCSV?await file.text():null;
      if(esExcel) throw new Error('Por ahora sube el archivo como CSV. En Excel: Archivo → Guardar como → CSV UTF-8.');
      cifras=extraerCifrasDeCSV(text, esBalanza, mesLabel);

    } else {
      // PDF: enviar a Claude
      const base64=await new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onloadend=()=>resolve(reader.result.split(',')[1]);
        reader.onerror=()=>reject(new Error('Error leyendo archivo'));
        reader.readAsDataURL(file);
      });
      const prompt=esBalanza?
        `De esta balanza extrae estas cifras en MXN para ${mesLabel}. Solo JSON sin markdown: {"ingresos":0,"costo_ventas":0,"gastos_operacion":0,"otros_ingresos":0,"otros_gastos":0,"activo_fijo_bruto":0,"depreciacion_acumulada":0,"cuentas_por_cobrar":0,"cuentas_por_pagar":0,"inventarios":0,"bancos":0}`:
        `De este Estado de Resultados extrae estas cifras en MXN. Solo JSON sin markdown: {"ingresos":0,"costo_ventas":0,"utilidad_bruta":0,"gastos_operacion":0,"utilidad_operacion":0,"otros_ingresos":0,"otros_gastos":0,"utilidad_antes_isr":0,"isr":0,"utilidad_neta":0}`;
      const apiRes=await fetch(SB_URL+'/functions/v1/claude-analysis',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+ANON_KEY},
        body:JSON.stringify({prompt,pdf_base64:base64,pdf_media_type:'application/pdf'})
      });
      const apiData=await apiRes.json();
      if(!apiRes.ok) throw new Error(apiData.error||'Error API');
      let raw=(apiData.text||'').replace(/```json|```/g,'').trim();
      try{ cifras=JSON.parse(raw); }
      catch(e){
        const lastComma=raw.lastIndexOf(',');
        const fixed=lastComma>0?raw.substring(0,lastComma)+'}':raw+'}';
        try{ cifras=JSON.parse(fixed); }
        catch(e2){
          cifras={};
          for(const m of raw.matchAll(/"([^"]+)":\s*([\d.-]+)/g)) cifras[m[1]]=parseFloat(m[2]);
          if(!Object.keys(cifras).length) throw new Error('No se pudieron extraer cifras del PDF. Usa CSV para mejores resultados.');
        }
      }
    }

    // 4. Guardar cifras
    const docFinal=currentDec.docs.find(d=>d.tipo===tipo);
    if(docFinal?.id) await sbPatch('da_documentos','?id=eq.'+docFinal.id,{cifras,status:'extraido',updated_at:nowISO()});

    // 5. Recargar
    const docs=await sbGet('da_documentos','?declaracion_id=eq.'+decId+'&select=*&order=tipo.asc');
    currentDec.docs=docs||[];
    renderTabContent();

  }catch(e){
    console.error('Error subiendo documento:',e);
    const docIdx2=currentDec.docs.findIndex(d=>d.tipo===tipo);
    if(docIdx2>=0) currentDec.docs[docIdx2].status='error';
    renderTabContent();
    alert('Error al procesar el documento: '+e.message);
  }
}

function extraerCifrasDeCSV(text, esBalanza, mesLabel){
  const lines=text.split('\n').map(l=>l.replace(/\r/,'')).filter(l=>l.trim());
  if(!lines.length) return {};
  const sep=lines[0].includes(';')?';':',';
  const header=lines[0].split(sep).map(h=>h.replace(/^"|"$/g,'').trim().toUpperCase());

  // Detectar índices de columnas
  let iCuenta=-1,iNombre=-1,iSaldo=-1;
  header.forEach((h,i)=>{
    if(/^CUENTA$|^COD/.test(h)) iCuenta=i;
    else if(/^NOMBRE$|^DESCRIPCION/.test(h)) iNombre=i;
    else if(/SALDO.?ACTUAL.?NETO|SALDO.?FINAL|SALDO.?NETO/.test(h)) iSaldo=i;
  });
  if(iCuenta<0) iCuenta=1;
  if(iNombre<0) iNombre=2;
  if(iSaldo<0){
    for(let i=0;i<header.length;i++){ if(/SALDO/i.test(header[i])){ iSaldo=i; break; } }
    if(iSaldo<0) iSaldo=header.length-2;
  }

  // Acumular saldos por tipo de cuenta
  let ingresos=0,costo_ventas=0,gastos_operacion=0,otros_ingresos=0,otros_gastos=0;
  let activo_fijo_bruto=0,depreciacion_acumulada=0,cuentas_por_cobrar=0,cuentas_por_pagar=0,inventarios=0,bancos=0;

  for(let i=1;i<lines.length;i++){
    const cols=lines[i].split(sep).map(c=>c.replace(/^"|"$/g,'').trim());
    const num=(cols[iCuenta]||'').trim();
    const nom=(cols[iNombre]||'').toUpperCase();
    const saldo=parseFloat((cols[iSaldo]||'').replace(/[$, ]/g,''))||0;
    if(!num||saldo===0) continue;
    const prim=num.charAt(0);
    const partes=num.split('-');
    const esTitulo=partes.slice(-2).filter(p=>/^0+$/.test(p)).length>=2;
    if(esTitulo) continue; // Solo cuentas de detalle

    if(prim==='4') ingresos+=saldo;
    else if(prim==='5') costo_ventas+=saldo;
    else if(prim==='6'||prim==='7'){
      if(/FINANCIERO|INTERES|CAMBIARIO/.test(nom)) otros_gastos+=saldo;
      else gastos_operacion+=saldo;
    }
    else if(prim==='1'){
      if(/BANCO|CAJA/.test(nom)) bancos+=Math.abs(saldo);
      else if(/CLIENTE|DEUDOR/.test(nom)) cuentas_por_cobrar+=Math.abs(saldo);
      else if(/INVENTARIO|MERCANCIA|ALMACEN/.test(nom)) inventarios+=Math.abs(saldo);
      else if(/TERRENO|EDIFICIO|MAQUINARIA|EQUIPO|MOBILIARIO|VEHICULO/.test(nom)&&!/DEPRECIA/.test(nom)) activo_fijo_bruto+=Math.abs(saldo);
      else if(/DEPRECIA|AMORT/.test(nom)) depreciacion_acumulada+=Math.abs(saldo);
    }
    else if(prim==='2'){
      if(/PROVEEDOR|ACREEDOR/.test(nom)) cuentas_por_pagar+=Math.abs(saldo);
    }
  }

  if(esBalanza){
    return {ingresos,costo_ventas,gastos_operacion,otros_ingresos,otros_gastos,
      activo_fijo_bruto,depreciacion_acumulada,cuentas_por_cobrar,cuentas_por_pagar,inventarios,bancos};
  } else {
    // ER: calcular utilidades
    const utilidad_bruta=ingresos-costo_ventas;
    const utilidad_operacion=utilidad_bruta-gastos_operacion;
    const utilidad_antes_isr=utilidad_operacion+otros_ingresos-otros_gastos;
    return {ingresos,costo_ventas,utilidad_bruta,gastos_operacion,utilidad_operacion,
      otros_ingresos,otros_gastos,utilidad_antes_isr,isr:0,utilidad_neta:utilidad_antes_isr};
  }
}

// Abre el papel correcto según su tipo
async function abrirPapel(tipo){
  const papel=currentDec.papeles.find(p=>p.tipo===tipo);
  const def=PAPELES.find(p=>p.tipo===tipo);
  if(!papel||!def)return;

  // Papeles que requieren datos adicionales antes de generar
  // J-13 gastos: siempre va al flujo manual
  if(tipo==='gastos'){
    // Si ya tiene cuentas (en_proceso o listo), abrir la tabla de clasificación
    if(papel.datos&&papel.datos.cuentas&&papel.datos.cuentas.length>0){
      mostrarTablaJ13(papel.datos.cuentas);
    } else {
      abrirJ13Manual();
    }
    return;
  }

  // J-3: si J-13 ya está lista, regenerar automáticamente para mostrar desglose
  // J-2: comparativo ER empresa vs balanza
  if(tipo==='comparativo_er'){
    generarComparativoER(papel);
    return;
  }

  if(tipo==='er_contable'){
    const j13=currentDec.papeles.find(p=>p.tipo==='gastos');
    const j13Lista=j13&&j13.status==='listo'&&j13.datos?.cuentas?.length>0;
    if(papel.status==='listo'&&papel.datos){
      // Re-renderizar siempre para tomar datos actuales de J-13
      mostrarPapelGenerado(tipo,papel,def);
    } else if(j13Lista){
      // Generar J-3 directo si hay ER cargado
      generarPapel(tipo);
    } else {
      confirmarGenerarPapel(tipo,def);
    }
    return;
  }

  // J-11: siempre tabla manual
  if(tipo==='depreciacion_fiscal'){
    mostrarTablaJ11(papel.datos?.activos||[]);
    return;
  }

  const papelesManuales=['perdidas_fiscales','cufin','cuca'];
  if(papelesManuales.includes(tipo)&&papel.status!=='listo'){
    abrirCapturaDatosAdicionales(tipo,papel);
    return;
  }
  // Papeles que se generan directo de documentos
  if(papel.status==='listo'&&papel.datos){
    mostrarPapelGenerado(tipo,papel,def);
  } else {
    confirmarGenerarPapel(tipo,def);
  }
}

        <div style="font-size:10px;color:#888;margin-top:2px">CONFIDENCIAL</div>

  }

  function tabla2col(filas){
    return `<table style="width:100%;border-collapse:collapse;margin-bottom:12px">
      <tbody>${filas.join('')}</tbody>
    </table>`;
  }

  // ===== J-3: ESTADO DE RESULTADOS CONTABLE =====
  if(tipo==='er_contable'){
    const d=datos;
    const papelJ13=currentDec?.papeles?.find(p=>p.tipo==='gastos');
    const cuentasJ13=(papelJ13?.datos?.cuentas)||[];
    const sumJ13=(te)=>cuentasJ13.filter(c=>c.tipo_erogacion===te).reduce((s,c)=>s+parseFloat(c.saldo||0),0);
    const tieneJ13=cuentasJ13.length>0;
    const ingresos=parseFloat(d.ingresos||0);
    const costo_ventas=tieneJ13?sumJ13('costo_ventas'):parseFloat(d.costo_ventas||0);
    const costo_prod=tieneJ13?sumJ13('costo_produccion'):0;
    const gastos_venta=tieneJ13?sumJ13('gastos_venta'):parseFloat(d.gastos_venta||0);
    const gastos_admin=tieneJ13?sumJ13('gastos_administracion'):parseFloat(d.gastos_admin||0);
    const gastos_op=tieneJ13?sumJ13('gastos_operacion'):parseFloat(d.gastos_operacion||0);
    const dep_cont=tieneJ13?0:parseFloat(d.depreciacion_contable||0);
    const gastos_fin=tieneJ13?sumJ13('gastos_financieros'):parseFloat(d.gastos_financieros||0);
    const otros_gastos=tieneJ13?sumJ13('otros_gastos'):parseFloat(d.otros_gastos||0);
    const prod_fin=parseFloat(d.productos_financieros||0);
    const otros_prod=parseFloat(d.otros_productos||0);
    const util_bruta=ingresos-costo_ventas-costo_prod;
    const total_gastos_op=gastos_venta+gastos_admin+gastos_op+dep_cont;
    const util_op=util_bruta-total_gastos_op;
    const util_neta=util_op+prod_fin+otros_prod-gastos_fin-otros_gastos;
    const er_ingresos=parseFloat(d.er_ingresos||0);
    const er_util_neta=parseFloat(d.er_utilidad_neta||0);
    const dif_ing=parseFloat(d.diferencia_ingresos||0);
    const dif_util=parseFloat(d.diferencia_utilidad||0);
    const nota_dif=d.nota_diferencia||'';
    const fuente=d.fuente||'er_subido';
    const hayDifIng=Math.abs(dif_ing)>1;
    const hayDifUtil=Math.abs(dif_util)>1;
    const j13_total=tieneJ13?cuentasJ13.reduce((s,c)=>s+parseFloat(c.saldo||0),0):0;
    const er_total_g=parseFloat(d.total_gastos||0);
    const dif_j13=tieneJ13&&er_total_g>0?Math.round((j13_total-er_total_g)*100)/100:0;
    const hayDifJ13=Math.abs(dif_j13)>1;

    function fr(lbl,imp,ind,bold,col){
      if(imp==null||imp===0) return '';
      const c=col||'#1a1a1a';const fw=bold?'700':'400';
      const pl='padding-left:'+(8+(ind||0)*14)+'px';
      return '<tr style="'+(bold?'background:#f8f9ff;':'')+'"><td style="padding:5px 8px;font-size:12px;font-weight:'+fw+';color:'+c+';'+pl+'">'+escH(lbl)+'</td>'+
        '<td style="padding:5px 8px;font-size:12px;text-align:right;font-weight:'+fw+';color:'+c+'">'+fmtMXN(imp)+'</td></tr>';
    }
    function sec(lbl){return '<tr style="background:#f0f4ff"><td colspan="2" style="padding:6px 8px;font-size:11px;font-weight:700;color:#3B4BC8;text-transform:uppercase">'+escH(lbl)+'</td></tr>';}
    function sub(lbl,imp){const c=parseFloat(imp||0)>=0?'#3B4BC8':'#dc2626';return '<tr style="border-top:1px solid #e5e5e0"><td style="padding:6px 8px;font-size:12px;font-weight:700">'+escH(lbl)+'</td><td style="padding:6px 8px;font-size:12px;text-align:right;font-weight:700;color:'+c+'">'+fmtMXN(imp)+'</td></tr>';}

    const filas=sec('INGRESOS')+fr('Ventas / Ingresos netos',ingresos,1)+
      sec('COSTO DE VENTAS / OBRA')+fr('Costo de ventas / obra',costo_ventas,1)+(costo_prod>0?fr('Costo de producción',costo_prod,1):'')+
      sub('UTILIDAD BRUTA',util_bruta)+
      sec('GASTOS DE OPERACIÓN')+(gastos_venta>0?fr('Gastos de venta',gastos_venta,1):'')+(gastos_admin>0?fr('Gastos de administración',gastos_admin,1):'')+(gastos_op>0?fr('Gastos de operación',gastos_op,1):'')+(dep_cont>0?fr('Depreciación contable',dep_cont,1):'')+
      sub('UTILIDAD DE OPERACIÓN',util_op)+
      ((prod_fin||gastos_fin||otros_prod||otros_gastos)?sec('OTROS INGRESOS Y GASTOS'):'')+
      (prod_fin>0?fr('Productos financieros',prod_fin,1):'')+(gastos_fin>0?fr('Gastos financieros',gastos_fin,1):'')+(otros_prod>0?fr('Otros productos',otros_prod,1):'')+(otros_gastos>0?fr('Otros gastos',otros_gastos,1):'');

    const fuenteLbl=fuente==='balanza_dic'?
      '<div style="font-size:10px;color:#3B6D11;margin-top:6px;font-style:italic">✓ Determinado de la balanza de comprobación al 31 de diciembre de '+ej+'.</div>':
      '<div style="font-size:10px;color:#888;margin-top:6px;font-style:italic">Fuente: Estado de Resultados del ejercicio '+ej+'. Sube la balanza de Diciembre para determinar desde balanza.</div>';
    const j13Lbl=tieneJ13?'<div style="font-size:10px;color:#3B6D11;margin-top:4px;font-style:italic">✓ Gastos desglosados desde J-13 ('+cuentasJ13.length+' cuentas).'+(hayDifJ13?' <strong style="color:#854F0B">Diferencia vs ER: '+fmtMXN(dif_j13)+'</strong>':'')+'</div>':'';

    const tablaComp=(fuente==='balanza_dic'&&(er_ingresos||er_util_neta))?
      '<div style="margin-top:12px;padding:10px 14px;background:#f5f5f3;border-radius:8px;border:0.5px solid #e5e5e0">'+
      '<div style="font-size:11px;font-weight:700;color:#3B4BC8;margin-bottom:8px">Comparativo vs Estado de Resultados subido</div>'+
      '<table style="width:100%;border-collapse:collapse;font-size:11px"><thead><tr>'+
        '<th style="padding:4px 8px;background:#f0f0ec;text-align:left;font-size:10px;color:#888">Concepto</th>'+
        '<th style="padding:4px 8px;background:#f0f0ec;text-align:right;font-size:10px;color:#888">Balanza Dic</th>'+
        '<th style="padding:4px 8px;background:#f0f0ec;text-align:right;font-size:10px;color:#888">ER subido</th>'+
        '<th style="padding:4px 8px;background:#f0f0ec;text-align:right;font-size:10px;color:#888">Diferencia</th>'+
      '</tr></thead><tbody>'+
        '<tr><td style="padding:4px 8px">Ingresos</td>'+
          '<td style="padding:4px 8px;text-align:right;font-weight:600">'+fmtMXN(ingresos)+'</td>'+
          '<td style="padding:4px 8px;text-align:right;color:#888">'+fmtMXN(er_ingresos)+'</td>'+
          '<td style="padding:4px 8px;text-align:right;font-weight:600;color:'+(hayDifIng?'#dc2626':'#2e7d52')+'">'+fmtMXN(dif_ing)+'</td></tr>'+
        '<tr style="background:#f9f9f9"><td style="padding:4px 8px">Utilidad neta</td>'+
          '<td style="padding:4px 8px;text-align:right;font-weight:600">'+fmtMXN(util_neta)+'</td>'+
          '<td style="padding:4px 8px;text-align:right;color:#888">'+fmtMXN(er_util_neta)+'</td>'+
          '<td style="padding:4px 8px;text-align:right;font-weight:600;color:'+(hayDifUtil?'#dc2626':'#2e7d52')+'">'+fmtMXN(dif_util)+'</td></tr>'+
      '</tbody></table>'+
      ((hayDifIng||hayDifUtil)&&nota_dif?'<div style="margin-top:8px;font-size:10px;color:#854F0B;background:#FAEEDA;padding:8px;border-radius:6px"><strong>Nota:</strong> '+escH(nota_dif)+'</div>':(!hayDifIng&&!hayDifUtil?'<div style="font-size:10px;color:#2e7d52;margin-top:6px">✓ Sin diferencias significativas.</div>':''))+
      '</div>':'';

    return headerPapel('J-3','Estado de Resultados Contable')+
      '<table style="width:100%;border-collapse:collapse;margin-bottom:8px">'+
      '<thead><tr><th style="padding:6px 8px;background:#3B4BC8;color:#fff;text-align:left">Concepto</th><th style="padding:6px 8px;background:#3B4BC8;color:#fff;text-align:right">Importe</th></tr></thead>'+
      '<tbody>'+filas+
      '<tr style="background:#EAF3DE;border-top:2px solid #3B6D11"><td style="padding:8px;font-size:13px;font-weight:700;color:#2e7d52">UTILIDAD (PÉRDIDA) NETA CONTABLE</td>'+
      '<td style="padding:8px;font-size:13px;font-weight:700;text-align:right;color:'+(util_neta>=0?'#2e7d52':'#dc2626')+'">'+fmtMXN(util_neta)+'</td></tr>'+
      '</tbody></table>'+fuenteLbl+j13Lbl+tablaComp;
  }

  // ===== J-5: ESTADO DE RESULTADOS FISCAL =====
  if(tipo==='er_fiscal'){
    const d=datos;
    return headerPapel('J-5','Determinación del ISR — Estado de Resultados Fiscal')+
    tabla2col([
      filaConc('INGRESOS ACUMULABLES',null,0,true,'#3B4BC8'),
      filaConc('Ingresos propios',d.ingresos_propios,1),
      filaConc('Ajuste anual por inflación acumulable',d.ajuste_inflacion_acumulable,1),
      filaConc('Otros ingresos',d.otros_ingresos,1),
      filaConc('Productos financieros',d.productos_financieros,1),
      filaConc('Ingresos de ejercicio anterior acumulables',d.ingresos_ejercicio_anterior||0,1),
      filaConc('SUMA DE INGRESOS ACUMULABLES',d.total_ingresos_acumulables,0,true,'#3B4BC8'),
      filaConc('DEDUCCIONES AUTORIZADAS',null,0,true,'#3B4BC8'),
      filaConc('Devoluciones s/ventas',d.devoluciones,1),
      filaConc('Costo de obra / ventas',d.costo_obra,1),
      filaConc('Gastos generales deducibles',d.gastos_generales,1),
      filaConc('Gastos financieros',d.gastos_financieros,1),
      filaConc('(-) No deducibles',d.no_deducibles!=null?-Math.abs(d.no_deducibles):0,1),
      filaConc('(-) Deducciones contables no fiscales',d.deducciones_contables!=null?-Math.abs(d.deducciones_contables):0,1),
      filaConc('Depreciación fiscal',d.depreciacion_fiscal,1),
      filaConc('Ajuste anual por inflación deducible',d.ajuste_inflacion_deducible,1),
      filaConc('SUMA DE DEDUCCIONES AUTORIZADAS',d.total_deducciones,0,true,'#3B4BC8'),
      filaConc('UTILIDAD O (PÉRDIDA) FISCAL',d.utilidad_fiscal,0,true,d.utilidad_fiscal>=0?'#2e7d52':'#dc2626'),
      filaConc('CU = Utilidad fiscal / Ingresos acumulables',null,0,false,'#888'),
      filaConc(d.cu!=null?'CU = '+parseFloat(d.cu).toFixed(4)+'%':'CU = N/D',null,1,false,'#3B4BC8'),
      filaConc('(-) Pérdidas fiscales de ejercicios anteriores',d.perdidas_fiscales!=null?-Math.abs(d.perdidas_fiscales):0,1),
      filaConc('RESULTADO FISCAL',d.resultado_fiscal,0,true,d.resultado_fiscal>=0?'#2e7d52':'#dc2626'),
      filaConc('(-) PTU pagada en el ejercicio',d.ptu!=null?-Math.abs(d.ptu):0,1),
      filaConc('BASE GRAVABLE',d.base_gravable!=null?d.base_gravable:d.resultado_fiscal,0,true,'#3B4BC8'),
      filaConc('(×) Tasa ISR 30% — Art. 9 LISR',null,0,false,'#888'),
      filaConc('IMPUESTO SOBRE LA RENTA',d.isr_causado,0,true,'#dc2626'),
      filaConc('(-) Pagos provisionales',d.pagos_provisionales!=null?-Math.abs(d.pagos_provisionales):0,1),
      filaConc(d.isr_a_cargo>=0?'ISR A CARGO':'ISR A FAVOR',d.isr_a_cargo,0,true,d.isr_a_cargo>0?'#dc2626':'#2e7d52'),
    ])+
    `<div style="font-size:10px;color:#888;margin-top:4px;font-style:italic">Art. 9 LISR. Tasa del 30%. Ejercicio ${ej}.</div>`;
  }

  // ===== J-6: CONCILIACIÓN CONTABLE-FISCAL =====
  if(tipo==='conciliacion'){
    const d=datos;
    const acumRows=(d.ingresos_fiscales_no_contables||[]).map(a=>filaConc(escH(a.concepto),a.importe,1)).join('');
    const dedContRows=(d.deducciones_contables_no_fiscales||[]).map(a=>filaConc(escH(a.concepto),a.importe,1)).join('');
    const ingContRows=(d.ingresos_contables_no_fiscales||[]).map(a=>filaConc(escH(a.concepto),a.importe,1)).join('');
    const dedFiscRows=(d.deducciones_fiscales_no_contables||[]).map(a=>filaConc(escH(a.concepto),a.importe,1)).join('');
    return headerPapel('J-6','Conciliación Contable-Fiscal')+
    tabla2col([
      filaConc('Utilidad contable (antes de ISR y PTU)',d.utilidad_contable,0,true),
      filaConc('(+) INGRESOS FISCALES NO CONTABLES',null,0,true,'#5a8a1a'),
      acumRows,
      filaConc('Subtotal ingresos fiscales no contables',d.total_ingresos_fiscales_no_contables,1,true,'#5a8a1a'),
      filaConc('(+) DEDUCCIONES CONTABLES NO FISCALES',null,0,true,'#5a8a1a'),
      dedContRows,
      filaConc('Subtotal deducciones contables no fiscales',d.total_deducciones_contables_no_fiscales,1,true,'#5a8a1a'),
      filaConc('(-) INGRESOS CONTABLES NO FISCALES',null,0,true,'#dc2626'),
      ingContRows,
      filaConc('Subtotal ingresos contables no fiscales',d.total_ingresos_contables_no_fiscales!=null?-Math.abs(d.total_ingresos_contables_no_fiscales):0,1,true,'#dc2626'),
      filaConc('(-) DEDUCCIONES FISCALES NO CONTABLES',null,0,true,'#dc2626'),
      dedFiscRows,
      filaConc('Subtotal deducciones fiscales no contables',d.total_deducciones_fiscales_no_contables!=null?-Math.abs(d.total_deducciones_fiscales_no_contables):0,1,true,'#dc2626'),
      filaConc('UTILIDAD O (PÉRDIDA) FISCAL',d.utilidad_fiscal,0,true,d.utilidad_fiscal>=0?'#2e7d52':'#dc2626'),
    ])+
    `<div style="font-size:10px;color:#888;margin-top:4px;font-style:italic">Art. 9 LISR. Diferencias temporales y permanentes. Ejercicio ${ej}.</div>`;
  }

  // ===== J-8: AJUSTE ANUAL POR INFLACIÓN =====
  if(tipo==='ajuste_inflacion'){
    const d=datos;
    const credRows=(d.creditos||[]).map(c=>`<tr>
      <td style="padding:4px 8px;font-size:11px">${escH(c.concepto)}</td>
      ${MESES_CORTO.map(m=>`<td style="padding:4px 8px;font-size:10px;text-align:right;color:#888">${c.saldos&&c.saldos[m]!=null?fmtMXN(c.saldos[m]):'-'}</td>`).join('')}
      <td style="padding:4px 8px;font-size:11px;text-align:right;font-weight:600">${fmtMXN(c.promedio)}</td>
    </tr>`).join('');
    const deudRows=(d.deudas||[]).map(c=>`<tr>
      <td style="padding:4px 8px;font-size:11px">${escH(c.concepto)}</td>
      ${MESES_CORTO.map(m=>`<td style="padding:4px 8px;font-size:10px;text-align:right;color:#888">${c.saldos&&c.saldos[m]!=null?fmtMXN(c.saldos[m]):'-'}</td>`).join('')}
      <td style="padding:4px 8px;font-size:11px;text-align:right;font-weight:600">${fmtMXN(c.promedio)}</td>
    </tr>`).join('');
    const mHead=MESES_CORTO.map(m=>`<th style="padding:4px 8px;font-size:10px;color:#fff;background:#3B4BC8;text-align:right">${m}</th>`).join('');
    return headerPapel('J-8','Ajuste Anual por Inflación — Arts. 44-46 LISR')+
    `<div style="font-size:11px;font-weight:700;color:#3B4BC8;margin-bottom:6px">Créditos</div>
    <div style="overflow-x:auto;margin-bottom:12px"><table style="width:100%;border-collapse:collapse;font-size:11px">
      <thead><tr><th style="padding:4px 8px;font-size:10px;color:#fff;background:#3B4BC8;text-align:left">Concepto</th>${mHead}<th style="padding:4px 8px;font-size:10px;color:#fff;background:#3B4BC8;text-align:right">Promedio</th></tr></thead>
      <tbody>${credRows}<tr style="background:#f0f4ff"><td style="padding:5px 8px;font-weight:700">Total créditos</td>${MESES_CORTO.map(()=>'<td></td>').join('')}<td style="padding:5px 8px;text-align:right;font-weight:700">${fmtMXN(d.total_creditos)}</td></tr></tbody>
    </table></div>
    <div style="font-size:11px;font-weight:700;color:#3B4BC8;margin-bottom:6px">Deudas</div>
    <div style="overflow-x:auto;margin-bottom:12px"><table style="width:100%;border-collapse:collapse;font-size:11px">
      <thead><tr><th style="padding:4px 8px;font-size:10px;color:#fff;background:#3B4BC8;text-align:left">Concepto</th>${mHead}<th style="padding:4px 8px;font-size:10px;color:#fff;background:#3B4BC8;text-align:right">Promedio</th></tr></thead>
      <tbody>${deudRows}<tr style="background:#f0f4ff"><td style="padding:5px 8px;font-weight:700">Total deudas</td>${MESES_CORTO.map(()=>'<td></td>').join('')}<td style="padding:5px 8px;text-align:right;font-weight:700">${fmtMXN(d.total_deudas)}</td></tr></tbody>
    </table></div>`+
    tabla2col([
      filaConc('Promedio de créditos',d.total_creditos,0),
      filaConc('Promedio de deudas',d.total_deudas,0),
      filaConc('Diferencia (créditos > deudas)',d.diferencia,0,true),
      filaConc('(×) Factor de ajuste anual (INPC cierre / INPC inicio - 1)',d.factor_ajuste,0),
      filaConc(d.ajuste_acumulable>0?'Ajuste anual acumulable':'Ajuste anual deducible',d.ajuste_acumulable>0?d.ajuste_acumulable:d.ajuste_deducible,0,true,d.ajuste_acumulable>0?'#dc2626':'#2e7d52'),
    ])+
    `<div style="font-size:10px;color:#888;margin-top:4px;font-style:italic">INPC inicio: ${d.inpc_inicio||'—'} · INPC cierre: ${d.inpc_cierre||'—'}. Arts. 44-46 LISR.</div>`;
  }

  // ===== J-11: DEPRECIACIÓN FISCAL =====
  if(tipo==='depreciacion_fiscal'){
    const d=datos;
    const rows=(d.activos||[]).map((a,i)=>`<tr style="background:${i%2===0?'#fff':'#fafafa'}">
      <td style="padding:5px 8px;font-size:11px">${escH(a.descripcion)}</td>

      <td style="padding:5px 8px;font-size:11px;text-align:right">${fmtMXN(a.moi)}</td>
      <td style="padding:5px 8px;font-size:11px;text-align:center">${a.pct_dep||0}%</td>
      <td style="padding:5px 8px;font-size:11px;text-align:right">${fmtMXN(a.dep_mensual)}</td>

    </tr>`).join('');
    return headerPapel('J-11','Determinación de la Depreciación Fiscal — Arts. 31-38 LISR')+
    `<div style="overflow-x:auto;margin-bottom:12px"><table style="width:100%;border-collapse:collapse;font-size:11px;min-width:800px">
      <thead><tr>
        <th style="padding:6px 8px;background:#3B4BC8;color:#fff;text-align:left">Descripción del bien</th>
        <th style="padding:6px 8px;background:#3B4BC8;color:#fff">Fecha adq.</th>
        <th style="padding:6px 8px;background:#3B4BC8;color:#fff;text-align:right">MOI</th>
        <th style="padding:6px 8px;background:#3B4BC8;color:#fff;text-align:center">% Dep.</th>
        <th style="padding:6px 8px;background:#3B4BC8;color:#fff;text-align:right">Dep. mensual</th>
        <th style="padding:6px 8px;background:#3B4BC8;color:#fff;text-align:center">Meses</th>
        <th style="padding:6px 8px;background:#3B4BC8;color:#fff;text-align:right">Dep. ejercicio</th>
        <th style="padding:6px 8px;background:#3B4BC8;color:#fff;text-align:right">Factor act.</th>

      </tr></thead>
      <tbody>${rows}
      <tr style="background:#f0f4ff;font-weight:700">
        <td colspan="8" style="padding:6px 8px;font-size:12px">TOTAL DEDUCCIÓN POR INVERSIONES</td>
        <td style="padding:6px 8px;font-size:12px;text-align:right;color:#3B4BC8">${fmtMXN(d.total_depreciacion)}</td>
      </tr></tbody>
    </table></div>
    <div style="font-size:10px;color:#888;font-style:italic">Art. 31 LISR — Deducción de inversiones. % según Art. 34-40 LISR. Factor de actualización = INPC último mes 1a. mitad del periodo / INPC mes de adquisición.</div>`;
  }

  // ===== J-13: INTEGRACIÓN DE GASTOS =====
  if(tipo==='gastos'){
    const d=datos;

window.guardarPerdidas=function(){
  const rows=document.querySelectorAll('.perdida-row');
  const perdidas=[];
  rows.forEach(r=>{
    const ej=parseInt(r.querySelector('.p-ej').value);
    const imp=parseFloat(r.querySelector('.p-imp').value)||0;
    const amort=parseFloat(r.querySelector('.p-amort').value)||0;
    if(ej&&imp) perdidas.push({ejercicio:ej,perdida_pendiente:imp,amortizacion:amort});
  });
  document.getElementById('modal-papel')?.remove();
  // Guardar en datos adicionales y generar
  const papel=currentDec.papeles.find(p=>p.tipo==='perdidas_fiscales');
  if(papel) papel.datos_extra={perdidas};
  generarPapel('perdidas_fiscales');
};

async function extraerCuentasBalanzaDic(fileOverride){
  const papel=currentDec.papeles.find(p=>p.tipo==='gastos');
  const docDic=currentDec.docs.find(d=>d.tipo==='balanza_dic');
  if(!papel) return;

  papel.status='generando';
  renderTabContent();

  try{
    let base64;

    // Si se pasa el file directamente (desde input), usarlo
    if(fileOverride){
      base64=await new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onloadend=()=>resolve(reader.result.split(',')[1]);
        reader.onerror=()=>reject(new Error('Error leyendo archivo'));
        reader.readAsDataURL(fileOverride);
      });
    } else if(docDic?.archivo_url){
      // Intentar descargar desde Storage
      const res=await fetch(docDic.archivo_url,{
        headers:{'Authorization':'Bearer '+ANON_KEY,'apikey':ANON_KEY}
      });
      if(!res.ok) throw new Error('No se pudo leer el PDF del Storage ('+res.status+'). Usa el botón "Subir balanza Dic" para volver a cargarla.');
      const blob=await res.blob();
      base64=await new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onloadend=()=>resolve(reader.result.split(',')[1]);
        reader.onerror=()=>reject(new Error('Error leyendo archivo'));
        reader.readAsDataURL(blob);
      });
    } else {
      throw new Error('No hay balanza de Diciembre cargada. Súbela primero en la pestaña Documentos.');
    }

    const prompt=`De esta balanza de comprobación al 31 de diciembre extrae SOLO las cuentas de GASTOS con saldo mayor a cero. Incluye cuentas de costo, gasto, depreciación, sueldos, honorarios, renta, mantenimiento, impuestos, contribuciones. Excluye ingresos, activos, pasivos y capital. Responde SOLO con JSON sin texto adicional ni markdown: {"cuentas":[{"numero_cuenta":"601","nombre_cuenta":"Sueldos y salarios","saldo":1200000}]}`;

    const apiRes=await fetch(SB_URL+'/functions/v1/claude-analysis',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+ANON_KEY},
      body:JSON.stringify({prompt,pdf_base64:base64,pdf_media_type:'application/pdf'})
    });
    const apiData=await apiRes.json();
    if(!apiRes.ok) throw new Error(apiData.error||'Error API');
    let raw=(apiData.text||'').replace(/```json|```/g,'').trim();
    // Si el JSON está truncado, intentar repararlo
    let resultado;
    try{
      resultado=JSON.parse(raw);
    }catch(e){
      // Intentar cerrar el JSON truncado
      const lastComma=raw.lastIndexOf(',{"');
      if(lastComma>0) raw=raw.substring(0,lastComma)+']}';
      else{
        const lastBrace=raw.lastIndexOf('}');
        if(lastBrace>0) raw=raw.substring(0,lastBrace+1)+']}';
      }
      try{
        resultado=JSON.parse(raw);
      }catch(e2){
        throw new Error('La balanza tiene demasiadas cuentas. La Edge Function necesita max_tokens:4000. Ve a Supabase → Edge Functions → claude-analysis → Code y cambia max_tokens a 4000, luego Deploy.');
      }
    }

    // Agregar clasificación pendiente a cada cuenta
    const cuentas=(resultado.cuentas||[]).map(c=>({
      ...c,
      clasificacion:'pendiente', // pendiente | deducible | no_deducible | contable_no_fiscal
      fundamento:'',
      nota:''
    }));

    // Guardar en Supabase
    const datos={cuentas,total_deducibles:0,total_no_deducibles:0,total_contables_no_fiscales:0};
    await sbPatch('da_papeles','?id=eq.'+papel.id,{datos,status:'en_proceso',updated_at:nowISO()});
    papel.status='en_proceso';
    papel.datos=datos;

    renderTabContent();
    mostrarTablaJ13(cuentas);

  }catch(e){
    console.error('Error extrayendo cuentas:',e);
    papel.status='pendiente';
    renderTabContent();
    alert('Error: '+e.message);
  }
}

function esEnDolares(numero, nombre){
  const n=(nombre||'').toUpperCase();
  const num=(numero||'').toString();
  // Indicadores comunes de cuentas en dólares
  return /DOLAR|USD|DOLLAR|DLLS?|MONEDA EXTR|ME|DIVISA|EXTRANJERA/.test(n);
}

function sugerirRubroFiscal(numero, nombre){
  const n=(nombre||'').toUpperCase();
  const enDol=esEnDolares(numero,nombre);
  const prim=parseInt((numero||'').toString().charAt(0));

  // Créditos (activos monetarios) — Art. 44 LISR
  if(/BANCO|CAJA|CAJA CHICA/.test(n))
    return enDol?'credito_dolares':'credito_pesos';
  if(/CLIENTE|DEUDOR|CUENTA POR COBRAR|DOC.*COBRAR|ANTICIPO A PROVEEDOR/.test(n))
    return enDol?'credito_dolares':'credito_pesos';
  if(/IVA A FAVOR|ISR A FAVOR|IVA ACREDITABLE|IMPUESTO A FAVOR/.test(n))
    return 'credito_pesos';

  // Deudas (pasivos monetarios) — Art. 44 LISR
  if(/PROVEEDOR|ACREEDOR|CUENTA POR PAGAR|DOC.*PAGAR|ANTICIPO DE CLIENTE/.test(n))
    return enDol?'deuda_dolares':'deuda_pesos';
  if(/IVA POR PAGAR|ISR POR PAGAR|IMPUESTO POR PAGAR|PTU POR PAGAR/.test(n))
    return 'deuda_pesos';
  if(/PRESTAMO|CREDITO BANCARIO|HIPOTECA|DEUDA A LARGO/.test(n))
    return enDol?'deuda_dolares':'deuda_pesos';

  // Activo fijo — J-11
  if(/TERRENO|EDIFICIO|MAQUINARIA|EQUIPO|MOBILIARIO|VEHICULO|AUTOMOVIL|COMPUTADORA|HERRAMIENTA/.test(n)
    && !/DEPRECIACION|AMORTIZACION/.test(n))
    return 'activo_fijo';
  if(/DEPRECIACION|AMORTIZACION/.test(n))
    return 'deduccion_contable';

  // Ingresos
  if(prim===4) return 'ingresos_acumulables';
  if(/VENTA|INGRESO|SERVICIO/.test(n)) return 'ingresos_acumulables';

  // Costos
  if(prim===5||/COSTO DE VENTA|COSTO DE OBRA/.test(n)) return 'costo_ventas';

  // Gastos
  if(prim===6||prim===7) return 'gasto_deducible';
  if(/MULTA|RECARGO|SANCION|ISR A CARGO/.test(n)) return 'gasto_no_deducible';
  if(/DEPRECIACION|AMORTIZACION|PROVISION|RESERVA/.test(n)) return 'deduccion_contable';
  if(/GASTO|SUELDO|NOMINA|RENTA|HONORARIO|COMBUSTIBLE|SEGURO|MANTENIMIENTO/.test(n))
    return 'gasto_deducible';

  return 'no_aplica';
}

function sugerirClasificacion(nombre){
  const n=(nombre||'').toUpperCase();
  // No deducibles
  if(/MULTA|RECARGO|SANCION|GASTOS NO DEDUCIBLE|ISR A CARGO|IMPUESTO EMPRESAR|IETU|IDE|IMPUESTO SOBRE LA RENTA/.test(n)) return {clas:'no_deducible',fund:'Art. 28 Fr. I LISR'};
  if(/REPRESENTA|HOSPEDAJE|VIATICO|RESTAURAN|ALIMENT/.test(n)&&/REPRESEN/.test(n)) return {clas:'no_deducible',fund:'Art. 28 Fr. V LISR'};
  if(/DONATIVO/.test(n)) return {clas:'no_deducible',fund:'Art. 28 Fr. IV LISR (verificar límite)'};
  // Contables no fiscales
  if(/DEPRECIACION|DEPRECIACI|AMORTIZACION|AMORTIZACI/.test(n)) return {clas:'contable_no_fiscal',fund:'Art. 32 LISR — Se sustituye por deducción fiscal'};
  if(/PROVISION|RESERVA|ESTIMACION|DETERIORO/.test(n)) return {clas:'contable_no_fiscal',fund:'Art. 31 Fr. I LISR — No pagado en el ejercicio'};
  // Deducibles
  if(/SUELDO|SALARIO|NOMINA|NÓMINA|AGUINALDO|VACACION|PRIMA VAC|BONO|COMISION/.test(n)) return {clas:'deducible',fund:'Art. 25 Fr. I LISR'};
  if(/IMSS|ISSSTE|INFONAVIT|RCV|AFORE|SEGURO SOCIAL/.test(n)) return {clas:'deducible',fund:'Art. 25 Fr. I LISR'};
  if(/HONORARIO|SERVICIO PROFES|ASESORIA|CONSULTOR/.test(n)) return {clas:'deducible',fund:'Art. 25 Fr. II LISR'};
  if(/RENTA|ARRENDAMIENT/.test(n)) return {clas:'deducible',fund:'Art. 25 Fr. II LISR'};
  if(/COMBUSTIBLE|GASOLINA|DIESEL|LUBRICANTE/.test(n)) return {clas:'deducible',fund:'Art. 25 Fr. II LISR — Req. monedero electrónico Art. 28 Fr. XX'};
  if(/MANTENIMIENT|REPARACION|CONSERVACION/.test(n)) return {clas:'deducible',fund:'Art. 25 Fr. II LISR'};
  if(/SEGURO|FIANZA/.test(n)) return {clas:'deducible',fund:'Art. 25 Fr. II LISR'};
  if(/INTERES|COMISION BANCARIA|GASTO FINANCIERO/.test(n)) return {clas:'deducible',fund:'Art. 25 Fr. VII LISR'};
  if(/IMPUESTO NOMINA|IMPUESTO S\/NOMINA|IMPUESTO SOBRE NOMINA/.test(n)) return {clas:'deducible',fund:'Art. 25 Fr. II LISR'};
  if(/PUBLICIDAD|PROPAGANDA|MARKETING/.test(n)) return {clas:'deducible',fund:'Art. 25 Fr. II LISR'};
  if(/PAPELERIA|UTILES|OFICINA/.test(n)) return {clas:'deducible',fund:'Art. 25 Fr. II LISR'};
  if(/TELEFON|INTERNET|COMUNICACION/.test(n)) return {clas:'deducible',fund:'Art. 25 Fr. II LISR'};
  if(/FLETES|ACARREO|TRANSPORTE/.test(n)) return {clas:'deducible',fund:'Art. 25 Fr. II LISR'};
  if(/COSTO DE OBRA|COSTO DE VENTA|MATERIA PRIMA|MATERIAL/.test(n)) return {clas:'deducible',fund:'Art. 25 Fr. II LISR'};
  if(/PTU|PARTICIPACION DE UTILIDADES/.test(n)) return {clas:'deducible',fund:'Art. 25 Fr. III LISR'};
  return {clas:'deducible',fund:'Art. 25 Fr. II LISR'};
}

function sugerirTipoErogacion(nombre){
  const n=(nombre||'').toUpperCase();
  if(/COSTO DE OBRA|COSTO DE VENTA|MATERIA PRIMA|SUBCONTRAT|MANO DE OBRA DIRECTA/.test(n)) return 'costo_ventas';
  if(/SUELDO|SALARIO|NOMINA|AGUINALDO|VACACION|PRIMA VAC|PTU|IMSS|INFONAVIT|RCV/.test(n)){
    if(/DIRECT|OBRA|PRODUCCION|PLANTA/.test(n)) return 'costo_produccion';
    return 'gastos_operacion';
  }
  if(/DEPRECIACION|AMORTIZACION/.test(n)){
    if(/EQUIPO DE PRODUCCION|MAQUINARIA|PLANTA/.test(n)) return 'costo_produccion';
    return 'gastos_operacion';
  }
  if(/VENTA|PUBLICIDAD|PROPAGANDA|MARKETING|COMISION DE VENTA/.test(n)) return 'gastos_venta';
  if(/INTERES|COMISION BANCARIA|CAMBIARIA|FINANCIERO/.test(n)) return 'gastos_financieros';
  if(/COSTO DE PRODUCCION|PRODUCCION/.test(n)) return 'costo_produccion';
  if(/ADMINSTRACION|ADMINISTRACION|PAPELERIA|TELEFON|RENTA|ARRENDAMIENT|HONORARIO|ASESORIA|SERVICIO PROFES/.test(n)) return 'gastos_administracion';
  if(/MANTENIMIENT|REPARACION|COMBUSTIBLE|GASOLINA|SEGURO|FLETES/.test(n)) return 'gastos_operacion';
  if(/MULTA|RECARGO|SANCION/.test(n)) return 'otros_gastos';
  return 'gastos_operacion';
}

function clasificarCuentaJ13(idx,valor){
  if(!window._j13Cuentas) return;
  window._j13Cuentas[idx].clasificacion=valor;
  // Actualizar fondo del select
  const row=document.getElementById('j13-row-'+idx);
  if(row){

    const bg={deducible:'#EAF3DE',no_deducible:'#FCEBEB',contable_no_fiscal:'#FAEEDA',pendiente:'#fff8ed'}[valor]||'#fff8ed';
    if(sel){sel.style.background=bg;sel.style.borderColor=valor==='pendiente'?'#EF9F27':'#c5d5c5';}
  }
  actualizarTotalesJ13();
  // Actualizar fundamento sugerido si está vacío
  const sug=sugerirClasificacion(window._j13Cuentas[idx].nombre_cuenta);
  if(!window._j13Cuentas[idx].fundamento){
    window._j13Cuentas[idx].fundamento=sug.fund;
    if(row){const inp=row.querySelector('input[type=text]');if(inp) inp.value=sug.fund;}
  }
}

  const total_contables_no_fiscales=cuentas.filter(c=>c.clasificacion==='contable_no_fiscal').reduce((s,c)=>s+parseFloat(c.saldo||0),0);
  const datos={cuentas,total_deducibles,total_no_deducibles,total_contables_no_fiscales};
  await sbPatch('da_papeles','?id=eq.'+papel.id,{datos,status:'listo',updated_at:nowISO()});

}

async function generarPapel(tipo){
  const def=PAPELES.find(p=>p.tipo===tipo);
  const papel=currentDec.papeles.find(p=>p.tipo===tipo);
  if(!papel||!def)return;

  papel.status='generando';
  renderTabContent();

  try{
    const docsMap={};
    currentDec.docs.forEach(d=>{
      if(d.cifras) docsMap[d.tipo]=d.cifras;
    });
    // Debug: mostrar qué datos tenemos
    console.log('docsMap keys:', Object.keys(docsMap));
    console.log('erAnual cifras:', docsMap['er_anual']);
    console.log('balanzas disponibles:', Object.keys(docsMap).filter(k=>k.startsWith('balanza_')));
    
    // Si no hay cifras extraídas pero hay docs cargados, avisar
    const docsConCifras=Object.keys(docsMap).length;
    if(docsConCifras===0){
      throw new Error('No hay cifras extraídas de los documentos. Primero sube los PDFs y espera a que Claude extraiga las cifras.');
    }
    const datosExtra=papel.datos_extra||{};
    const prompt=buildPromptPapel(tipo,docsMap,currentDec,datosExtra);

    let datos;
    // Si buildPromptPapel devuelve JSON directo (sin llamar a Claude)
    if(prompt.trim().startsWith('{')){
      datos=JSON.parse(prompt);
    } else {
      const apiRes=await fetch(SB_URL+'/functions/v1/claude-analysis',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+ANON_KEY},
        body:JSON.stringify({prompt})
      });
      const apiData=await apiRes.json();
      if(!apiRes.ok) throw new Error(apiData.error||'Error API');
      const raw=(apiData.text||'').replace(/```json|```/g,'').trim();
      datos=JSON.parse(raw);
    }

    await sbPatch('da_papeles','?id=eq.'+papel.id,{datos,status:'listo',updated_at:nowISO()});
    papel.status='listo';
    papel.datos=datos;
    renderTabContent();

// ===== RE-EXTRAER DOCUMENTO =====
async function reExtraerDoc(tipo){
  const doc=currentDec.docs.find(d=>d.tipo===tipo);
  if(!doc||!doc.archivo_url){
    alert('No hay archivo cargado para este documento.');
    return;
  }
  // Simular el flujo de subida con el archivo ya guardado
  // Obtener el PDF desde la URL y re-procesar
  const statusEl=document.getElementById('er-reextract-status');
  if(statusEl) statusEl.textContent='Extrayendo cifras...';

  try{
    // Descargar el PDF con autenticación
    const res=await fetch(doc.archivo_url,{
      headers:{'Authorization':'Bearer '+ANON_KEY,'apikey':ANON_KEY}
    });
    if(!res.ok) throw new Error('No se pudo obtener el archivo ('+res.status+')');
    const blob=await res.blob();
    const base64=await new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onloadend=()=>resolve(reader.result.split(',')[1]);
      reader.onerror=()=>reject(new Error('Error leyendo archivo'));
      reader.readAsDataURL(blob);
    });

    const mesLabel=tipo==='er_anual'?'Estado de Resultados Anual':
      MESES[TIPOS_BALANZA.indexOf(tipo)]||tipo;
    const esBalanza=tipo.startsWith('balanza_');
    const prompt=esBalanza?
      `Eres contador experto. De esta balanza de comprobación extrae las cifras en MXN del mes de ${mesLabel}. Responde SOLO con JSON sin markdown: {"ingresos":0,"costo_ventas":0,"gastos_operacion":0,"otros_ingresos":0,"otros_gastos":0,"activo_fijo_bruto":0,"depreciacion_acumulada":0,"cuentas_por_cobrar":0,"cuentas_por_pagar":0,"inventarios":0,"bancos":0}`:
      `Eres contador experto. De este Estado de Resultados anual extrae TODAS las cifras en MXN. Responde SOLO con JSON sin markdown: {"ingresos":0,"costo_ventas":0,"utilidad_bruta":0,"gastos_operacion":0,"gastos_venta":0,"gastos_admin":0,"depreciacion_contable":0,"utilidad_operacion":0,"productos_financieros":0,"gastos_financieros":0,"otros_productos":0,"otros_gastos":0,"utilidad_antes_isr":0,"isr_contable":0,"utilidad_neta":0}`;

    const apiRes=await fetch(SB_URL+'/functions/v1/claude-analysis',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+ANON_KEY},
      body:JSON.stringify({prompt,pdf_base64:base64,pdf_media_type:'application/pdf'})
    });
    const apiData=await apiRes.json();
    if(!apiRes.ok) throw new Error(apiData.error||'Error API');
    const raw=(apiData.text||'').replace(/```json|```/g,'').trim();
    const cifras=JSON.parse(raw);

    // Guardar cifras
    if(doc.id){
      await sbPatch('da_documentos','?id=eq.'+doc.id,{cifras,status:'extraido',updated_at:nowISO()});
      doc.cifras=cifras;
      doc.status='extraido';
    }

    // Recargar docs
    const docs=await sbGet('da_documentos','?declaracion_id=eq.'+currentDec.id+'&select=*&order=tipo.asc');
    currentDec.docs=docs||[];
    renderTabContent();
    alert('✅ Cifras extraídas correctamente. Ahora puedes generar los papeles de trabajo.');

  }catch(e){
    console.error('Error re-extrayendo:',e);
    alert('Error al extraer cifras: '+e.message);
  }
}

// ===== PROCESAR CSV PARA CATÁLOGO =====
async function procesarCSVCatalogo(file){
  if(!file) return;

  const overlay=document.createElement('div');
  overlay.className='modal-overlay';overlay.id='modal-catalogo';
  overlay.innerHTML='<div class="modal-box" style="max-width:400px"><div class="loading"><div class="spinner"></div>Procesando CSV...</div></div>';
  document.body.appendChild(overlay);

  try{
    const text=await file.text();
    const cuentas=parsearCSVBalanza(text);
    if(!cuentas.length) throw new Error('No se encontraron cuentas en el archivo.');

    // Conservar clasificaciones existentes si ya hay catálogo
    const guardadas={};
    (currentDec.balanza_catalogo||[]).forEach(c=>{
      guardadas[c.numero]={tipo_cuenta:c.tipo_cuenta,es_titulo:c.es_titulo,rubro_fiscal:c.rubro_fiscal,cedulas_destino:c.cedulas_destino};
    });

    const cuentasFinales=cuentas.map(c=>{
      const g=guardadas[c.numero];
      if(g) return {...c,tipo_cuenta:g.tipo_cuenta??c.tipo_cuenta,es_titulo:g.es_titulo??c.es_titulo,rubro_fiscal:g.rubro_fiscal||c.rubro_fiscal,cedulas_destino:g.cedulas_destino||c.cedulas_destino};
      return c;
    });

    document.getElementById('modal-catalogo')?.remove();
    await guardarBalanzaCatalogo(cuentasFinales);
    mostrarBalanzaCatalogo(cuentasFinales);

    const msg=document.createElement('div');
    msg.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;font-size:13px;padding:12px 20px;border-radius:8px;z-index:99999;line-height:1.6';
    msg.innerHTML='✅ Catálogo generado — '+cuentasFinales.length+' cuentas<br><span style="font-size:11px;color:#aaa">'+cuentasFinales.filter(c=>c.es_titulo).length+' títulos · '+cuentasFinales.filter(c=>!c.es_titulo).length+' detalle</span>';
    document.body.appendChild(msg);
    setTimeout(()=>msg.remove(),4000);

  }catch(e){
    document.getElementById('modal-catalogo')?.remove();
    alert('Error al procesar CSV: '+e.message);
  }
}

function parsearCSVBalanza(text){
  const lines=text.split('\n').map(l=>l.replace(/\r/,'')).filter(l=>l.trim());
  if(!lines.length) return [];

  // Detectar separador
  const sep=lines[0].includes(';')?';':',';
  const header=lines[0].split(sep).map(h=>h.replace(/^"|"$/g,'').trim());

  // Buscar columnas clave (flexible — soporta distintos formatos)
  const idx={};
  header.forEach((h,i)=>{
    const hu=h.toUpperCase();
    if(/^CUENTA$|^NO\.?\s*CUENTA|^ACCOUNT|^COD/.test(hu)) idx.cuenta=i;
    else if(/^NOMBRE$|^DESCRIPCION|^NAME|^CONCEPTO/.test(hu)) idx.nombre=i;
    else if(/SALDO.?ACTUAL.?NETO|SALDO.?FINAL|SALDO.?NETO|BALANCE$/.test(hu)) idx.saldo=i;
    else if(/NATURALEZA|NATURE|TIPO.?SALDO/.test(hu)) idx.naturaleza=i;
  });

  // Si no encuentra columnas exactas, usar posiciones por defecto
  if(idx.cuenta===undefined) idx.cuenta=1;
  if(idx.nombre===undefined) idx.nombre=2;
  if(idx.saldo===undefined){
    // Buscar columna con "Saldo" en el nombre
    for(let i=0;i<header.length;i++){
      if(/saldo/i.test(header[i])){ idx.saldo=i; break; }
    }
    if(idx.saldo===undefined) idx.saldo=header.length-2;
  }

  const cuentas=[];
  for(let i=1;i<lines.length;i++){
    const cols=lines[i].split(sep).map(c=>c.replace(/^"|"$/g,'').trim());
    const numero=(cols[idx.cuenta]||'').trim();
    const nombre=(cols[idx.nombre]||'').trim();
    const saldoStr=(cols[idx.saldo]||'').replace(/[$, ]/g,'');
    if(!numero) continue;
    const saldo=parseFloat(saldoStr)||0;

    // Detectar cuenta título por número de segmentos en cero
    const partes=numero.split('-');
    const ceros=partes.slice(-2).filter(p=>/^0+$/.test(p)).length;
    const es_titulo=ceros>=2;

    const tipo=sugerirTipoCuenta(numero,nombre);
    const rubro=es_titulo?'no_aplica':sugerirRubroFiscal(numero,nombre);
    const cedulas=es_titulo?[]:sugerirCedulasDestino(numero,nombre,rubro);

    cuentas.push({numero,nombre,saldo,es_titulo,tipo_cuenta:tipo,rubro_fiscal:rubro,cedulas_destino:cedulas});
  }
  return cuentas;
}

function sugerirCedulasDestino(numero,nombre,rubro){
  if(['ingresos_acumulables','devoluciones','costo_ventas'].includes(rubro)) return ['J-3','J-5'];
  if(['gasto_deducible','gasto_no_deducible','deduccion_contable'].includes(rubro)) return ['J-3','J-5','J-13'];
  if(rubro==='activo_fijo') return ['J-11'];
  if(['credito_pesos','credito_dolares','deuda_pesos','deuda_dolares'].includes(rubro)) return ['J-8'];
  return ['N/A'];
}

// ===== BALANZA CATÁLOGO TAXIA =====
function sugerirTipoCuenta(numero, nombre){
  const n=(numero||'').toString().trim();
  const nom=(nombre||'').toUpperCase();
  const prim=parseInt(n.charAt(0));

  if(prim===1) return 'activo';
  if(prim===2) return 'pasivo';
  if(prim===3) return 'capital';
  if(prim===4) return 'ingresos';
  if(prim===5) return 'costo';
  if(prim===6||prim===7) return 'gastos';
  if(prim===8) return 'gastos';
  if(prim===9) return 'orden';

  // Por nombre si no hay número claro
  if(/ACTIVO|BANCO|CAJA|CLIENTE|DEUDOR|INVENTARIO|TERRENO|EDIFICIO|EQUIPO|MOBILIARIO|VEHICULO|DEPOSITO|ANTICIPO A PROVEEDOR|IVA A FAVOR|ISR A FAVOR/.test(nom)) return 'activo';
  if(/PASIVO|PROVEEDOR|ACREEDOR|PRESTAMO|CREDITO|HIPOTECA|IVA POR PAGAR|ISR POR PAGAR|ANTICIPO DE CLIENTE/.test(nom)) return 'pasivo';
  if(/CAPITAL|PATRIMONIO|UTILIDAD DEL EJERCICIO|RESERVA/.test(nom)) return 'capital';
  if(/INGRESO|VENTA|SERVICIO/.test(nom)) return 'ingresos';
  if(/COSTO/.test(nom)) return 'costo';
  if(/GASTO|SUELDO|NOMINA|DEPRECIACION|AMORTIZACION|COMISION|COMBUSTIBLE|MANTENIMIENTO|SEGURO|HONORARIO PAGADO/.test(nom)) return 'gastos';
  return 'activo';
}

function tipoCuentaConfig(tipo){
  const cfg={
    activo:   {label:'Activo',        icon:'📊',color:'#166534',bg:'#dcfce7',grupo:'Balance'},
    pasivo:   {label:'Pasivo',        icon:'📊',color:'#991b1b',bg:'#fee2e2',grupo:'Balance'},
    capital:  {label:'Capital',       icon:'📊',color:'#1e40af',bg:'#dbeafe',grupo:'Balance'},
    ingresos: {label:'Ingresos',      icon:'📈',color:'#065f46',bg:'#d1fae5',grupo:'Resultados'},
    costo:    {label:'Costo de ventas',icon:'📈',color:'#92400e',bg:'#fef3c7',grupo:'Resultados'},
    gastos:   {label:'Gastos',        icon:'📈',color:'#7c3aed',bg:'#ede9fe',grupo:'Resultados'},
    orden:    {label:'Orden',         icon:'📊',color:'#374151',bg:'#f3f4f6',grupo:'Balance'},
  };
  return cfg[tipo]||cfg['activo'];
}

// Calcular nivel de sangría basado en jerarquía del catálogo
function calcularNiveles(cuentas){
  // Para cada cuenta, determinar su nivel contando cuántas cuentas título la contienen
  return cuentas.map((c,idx)=>{
    const num=c.numero.toString().replace(/[-./]/g,'');
    let nivel=0;
    for(let j=0;j<idx;j++){
      if(!cuentas[j].es_titulo) continue;
      const tNum=cuentas[j].numero.toString().replace(/[-./]/g,'');
      // Si el número de la cuenta empieza con el número del título, es subcuenta
      if(num!==tNum&&num.startsWith(tNum)) nivel++;
    }
    return nivel;
  });
}

      let raw=(d.text||'').replace(/```json|```/g,'').trim();
      try{ return JSON.parse(raw); }
      catch(e){
        const lastObj=raw.lastIndexOf('"}');
        const fixed=lastObj>0?raw.substring(0,lastObj+2)+']}':raw+']}';

    const [r1,r2]=await Promise.all([extraerPartesCatalogo(p1),extraerPartesCatalogo(p2)]);
    const resultado={
      cuentas:[...(r1.cuentas||[]),...(r2.cuentas||[])]
        .sort((a,b)=>String(a.numero).localeCompare(String(b.numero),undefined,{numeric:true}))
    };


    // Agregar columnas vacías a cada cuenta
    const cuentas=(resultado.cuentas||[]).map(c=>({
      numero:c.numero||'',
      nombre:c.nombre||'',
      saldo:parseFloat(c.saldo||0),

    overlay.innerHTML=`<div class="modal-box">
      <div class="modal-title">Balanza Catálogo TaxIA</div>

    </div>`;

  }
}
