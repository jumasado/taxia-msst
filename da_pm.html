    });

    // Procesar en 2 partes para balanzas con muchas cuentas
    async function extraerParte(instruccion){
      const apiRes=await fetch(SB_URL+'/functions/v1/claude-analysis',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+ANON_KEY},
        body:JSON.stringify({prompt:instruccion,pdf_base64:base64,pdf_media_type:'application/pdf'})
      });
      const apiData=await apiRes.json();
      if(!apiRes.ok) throw new Error(apiData.error||'Error API');
      let raw=(apiData.text||'').replace(/```json|```/g,'').trim();
      try{ return JSON.parse(raw); }
      catch(e){
        // Reparar JSON truncado
        const last=raw.lastIndexOf('{"numero"');
        const lastObj=raw.lastIndexOf('"}');
        let fixed=last>0?raw.substring(0,lastObj+2)+']}':raw;
        try{ return JSON.parse(fixed); }
        catch(e2){ return {cuentas:[]}; }
      }
    }

    if(loadOverlay) loadOverlay.querySelector('div div').textContent='Extrayendo cuentas 1/2...';

    const prompt1=`De esta balanza extrae SOLO las cuentas del ACTIVO y PASIVO (1xx y 2xx). Para cada una: número, nombre, saldo final, si es título o detalle. Responde SOLO con JSON: {"cuentas":[{"numero":"101","nombre":"Caja","saldo":0,"es_titulo":false}]}`;
    const prompt2=`De esta balanza extrae SOLO las cuentas de CAPITAL, INGRESOS, COSTOS y GASTOS (3xx, 4xx, 5xx, 6xx, 7xx, 8xx, 9xx). Para cada una: número, nombre, saldo final, si es título o detalle. Responde SOLO con JSON: {"cuentas":[{"numero":"301","nombre":"Capital social","saldo":0,"es_titulo":false}]}`;

    const [parte1, parte2]=await Promise.all([
      extraerParte(prompt1),
      extraerParte(prompt2)
    ]);

    if(loadOverlay) loadOverlay.querySelector('div div').textContent='Consolidando catálogo...';

    const resultado={
      cuentas:[...(parte1.cuentas||[]),...(parte2.cuentas||[])]
        .sort((a,b)=>a.numero.localeCompare(b.numero,undefined,{numeric:true}))
    };

    // Mapear nuevas cuentas conservando clasificaciones existentes
    let recuperadas=0;let nuevas=0;
    const cuentas=(resultado.cuentas||[]).map(c=>{
      const guardado=clasificacionesGuardadas[c.numero];
      if(guardado){
        recuperadas++;
        return {
          numero:c.numero||'',
          nombre:c.nombre||'',
          saldo:parseFloat(c.saldo||0),
          es_titulo:guardado.es_titulo!==undefined?guardado.es_titulo:(c.es_titulo===true),
          tipo_cuenta:guardado.tipo_cuenta||sugerirTipoCuenta(c.numero,c.nombre),
          rubro_fiscal:guardado.rubro_fiscal||'',
          cedulas_destino:guardado.cedulas_destino||[]
        };
      } else {
        nuevas++;
        return {
          numero:c.numero||'',
          nombre:c.nombre||'',
          saldo:parseFloat(c.saldo||0),
          es_titulo:c.es_titulo===true,
          tipo_cuenta:sugerirTipoCuenta(c.numero,c.nombre),
          rubro_fiscal:sugerirRubroFiscal(c.numero,c.nombre),
          cedulas_destino:[]
        };
      }
    });

    document.getElementById('modal-catalogo')?.remove();
    await guardarBalanzaCatalogo(cuentas);
    mostrarBalanzaCatalogo(cuentas);

    // Toast informativo
    const msg=document.createElement('div');
    msg.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;font-size:13px;padding:12px 20px;border-radius:8px;z-index:99999;line-height:1.6';
    msg.innerHTML='✅ Catálogo actualizado — '+cuentas.length+' cuentas<br>'+
      '<span style="font-size:11px;color:#aaa">'+recuperadas+' clasificaciones conservadas · '+nuevas+' cuentas nuevas</span>';
    document.body.appendChild(msg);
    setTimeout(()=>msg.remove(),4000);

  }catch(e){
    document.getElementById('modal-catalogo')?.remove();
    alert('Error al actualizar: '+e.message);
  }
};

window.j11Update=function(idx,campo,valor){
  if(!window._j11Activos) return;
  window._j11Activos[idx][campo]=valor;
};

window.j11SetTasa=function(idx,valor){
  if(!valor||!window._j11Activos) return;
  const [tasa,art]=valor.split('|');
  window._j11Activos[idx].pct_dep=parseFloat(tasa)||0;
  window._j11Activos[idx].art_lisr=art||'';
  // Actualizar campos en la UI
  const pctEl=document.getElementById('j11-pct-'+idx);
  const artEl=document.getElementById('j11-art-'+idx);
  if(pctEl) pctEl.value=tasa;
  if(artEl) artEl.textContent=art;
  j11Calcular(idx);
};

window.j11Calcular=function(idx){
  if(!window._j11Activos) return;
  const a=window._j11Activos[idx];
  const moi=parseFloat(a.moi)||0;
  const pct=(parseFloat(a.pct_dep)||0)/100;
  const meses=parseInt(a.meses_ej)||12;
  const factor=parseFloat(a.factor_act)||1;
  const dep_ejercicio=(moi*pct/12)*meses;
  const dep_actualizada=dep_ejercicio*factor;
  window._j11Activos[idx].dep_ejercicio=dep_ejercicio;
  window._j11Activos[idx].dep_actualizada=dep_actualizada;
  const el=document.getElementById('j11-dep-'+idx);
  if(el) el.textContent=fmtMXN(dep_actualizada);
  j11ActualizarTotal();
};

window.j11AgregarFila=function(){
  if(!window._j11Activos) window._j11Activos=[];
  const idx=window._j11Activos.length;
  const nuevoActivo={descripcion:'',fecha_adq:'',moi:0,pct_dep:0,meses_ej:12,factor_act:1,dep_ejercicio:0,dep_actualizada:0,art_lisr:''};
  window._j11Activos.push(nuevoActivo);
  // Agregar fila en la tabla
  const tbody=document.getElementById('j11-tbody');
  if(tbody){
    const tasaOpts=TASAS_LISR_2022.map(g=>
      '<optgroup label="'+g.grupo+'">'+
      g.items.map(it=>'<option value="'+it.tasa+'|'+it.art+'">'+it.desc+' ('+it.tasa+'%)</option>').join('')+
      '</optgroup>'
    ).join('');
    const tr=document.createElement('tr');
    tr.id='j11-row-'+idx;
    tr.style.background=idx%2===0?'#fff':'#fafafa';
    tr.innerHTML=`
      <td style="padding:4px 6px"><input type="text" onchange="j11Update(${idx},'descripcion',this.value)" placeholder="Descripción del bien" style="font-size:11px;width:100%;border-radius:4px;padding:2px 6px;border:1px solid #e0e0db;min-width:160px"></td>
      <td style="padding:4px 6px"><input type="date" onchange="j11Update(${idx},'fecha_adq',this.value)" style="font-size:11px;width:100%;border-radius:4px;padding:2px 4px;border:1px solid #e0e0db"></td>
      <td style="padding:4px 6px"><input type="number" onchange="j11Update(${idx},'moi',parseFloat(this.value)||0);j11Calcular(${idx})" placeholder="0.00" style="font-size:11px;width:90px;border-radius:4px;padding:2px 6px;border:1px solid #e0e0db;text-align:right"></td>
      <td style="padding:4px 6px"><select onchange="j11SetTasa(${idx},this.value)" style="font-size:11px;width:100%;border-radius:4px;padding:2px 4px;border:1px solid #e0e0db;min-width:180px"><option value="">— Seleccionar —</option>${tasaOpts}</select></td>
      <td style="padding:4px 6px;text-align:center"><input type="number" id="j11-pct-${idx}" onchange="j11Update(${idx},'pct_dep',parseFloat(this.value)||0);j11Calcular(${idx})" placeholder="%" style="font-size:11px;width:50px;border-radius:4px;padding:2px 4px;border:1px solid #e0e0db;text-align:center"></td>
      <td style="padding:4px 6px;text-align:center"><input type="number" id="j11-meses-${idx}" value="12" onchange="j11Update(${idx},'meses_ej',parseInt(this.value)||0);j11Calcular(${idx})" min="1" max="12" style="font-size:11px;width:45px;border-radius:4px;padding:2px 4px;border:1px solid #e0e0db;text-align:center"></td>
      <td style="padding:4px 6px;text-align:center"><input type="number" id="j11-fact-${idx}" value="1" step="0.0001" onchange="j11Update(${idx},'factor_act',parseFloat(this.value)||1);j11Calcular(${idx})" style="font-size:11px;width:60px;border-radius:4px;padding:2px 4px;border:1px solid #e0e0db;text-align:center"></td>
      <td style="padding:4px 6px;text-align:right;font-weight:600;color:#3B4BC8" id="j11-dep-${idx}">${fmtMXN(0)}</td>
      <td style="padding:4px 6px;text-align:right;font-size:10px;color:#888" id="j11-art-${idx}"></td>
      <td style="padding:4px 6px;text-align:center"><button onclick="j11Eliminar(${idx})" style="background:none;border:none;cursor:pointer;color:#dc2626;font-size:14px">🗑</button></td>
    `;
    tbody.appendChild(tr);
  }
};

window.j11Eliminar=function(idx){
  if(!window._j11Activos) return;
  window._j11Activos.splice(idx,1);
  mostrarTablaJ11(window._j11Activos);
};

function j11ActualizarTotal(){
  const total=(window._j11Activos||[]).reduce((s,a)=>s+parseFloat(a.dep_actualizada||0),0);
  const el=document.getElementById('j11-total');
  if(el) el.textContent=fmtMXN(total);
}

async function guardarJ11(){
  const papel=currentDec.papeles.find(p=>p.tipo==='depreciacion_fiscal');
  if(!papel||!window._j11Activos) return;
  const activos=window._j11Activos;
  const total_depreciacion=activos.reduce((s,a)=>s+parseFloat(a.dep_actualizada||0),0);
  const datos={activos,total_depreciacion};
  await sbPatch('da_papeles','?id=eq.'+papel.id,{datos,status:'listo',updated_at:nowISO()});
  papel.status='listo';
  papel.datos=datos;
  document.getElementById('modal-papel')?.remove();
  renderTabContent();
  const def=PAPELES.find(p=>p.tipo==='depreciacion_fiscal');
  mostrarPapelGenerado('depreciacion_fiscal',papel,def);
}

function imprimirJ11(){
  const activos=window._j11Activos||[];
  const cliente=currentDec.cliente_nombre;
  const ej=currentDec.ejercicio;
  const total=activos.reduce((s,a)=>s+parseFloat(a.dep_actualizada||0),0);
  const rows=activos.map((a,i)=>`<tr style="background:${i%2===0?'#fff':'#f9f9f9'}">
    <td style="padding:4px 6px;font-size:10.5px;font-weight:500">${escH(a.descripcion||'')}</td>
    <td style="padding:4px 6px;font-size:10px;color:#888">${escH(a.fecha_adq||'')}</td>

    <td style="padding:4px 6px;font-size:10px;text-align:center">${a.pct_dep||0}%</td>
    <td style="padding:4px 6px;font-size:10px;text-align:center">${a.meses_ej||12}</td>
    <td style="padding:4px 6px;font-size:10px;text-align:right">${fmtMXN(a.dep_ejercicio)}</td>

    <td style="padding:4px 6px;font-size:9.5px;color:#888">${escH(a.art_lisr||'')}</td>
  </tr>`).join('');
  const win=window.open('','_blank');
  win.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
  <title>J-11 Depreciación Fiscal — ${cliente} ${ej}</title>
  <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,sans-serif;padding:20px;color:#1a1a1a}
  .header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #3B4BC8;padding-bottom:10px;margin-bottom:16px}
  .ref{background:#EEEDFE;color:#3B4BC8;padding:4px 10px;border-radius:6px;font-weight:700;font-size:12px}
  table{width:100%;border-collapse:collapse;margin-bottom:14px}
  th{background:#3B4BC8;color:#fff;padding:6px 8px;font-size:10px}th.r{text-align:right}th.c{text-align:center}
  td{padding:4px 6px;border-bottom:1px solid #f0f0ec}
  .total{background:#EEEDFE;font-weight:700;font-size:12px;color:#3B4BC8}
  .footer{border-top:1px solid #e5e5e0;padding-top:8px;font-size:9px;color:#aaa;display:flex;justify-content:space-between;margin-top:16px}
  @page{size:letter landscape;margin:12mm}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style>
  </head><body>
  <div class="header">
    <div><div style="font-size:11px;color:#888">${escH(cliente)} · Declaración Anual ${ej}</div>
    <div style="font-size:16px;font-weight:700;margin-top:2px">Determinación de la Depreciación Fiscal</div></div>
    <div><div class="ref">J-11</div><div style="font-size:9px;color:#888;margin-top:3px;text-align:right">CONFIDENCIAL</div></div>
  </div>
  <table><thead><tr>
    <th style="text-align:left">Descripción del bien</th>
    <th class="c">Fecha adq.</th><th class="r">MOI</th>
    <th class="c">% Dep.</th><th class="c">Meses</th>
    <th class="r">Dep. ejercicio</th><th class="c">Factor act.</th>
    <th class="r">Dep. actualizada</th><th>Art. LISR</th>
  </tr></thead><tbody>${rows}
  <tr class="total"><td colspan="7" style="padding:6px 8px">TOTAL DEDUCCIÓN POR INVERSIONES</td>
  <td style="padding:6px 8px;text-align:right">${fmtMXN(total)}</td><td></td></tr>
  </tbody></table>
  <div class="footer">
    <span>Arts. 31-40 LISR. Factor = INPC último mes 1a. mitad del período ÷ INPC mes adquisición.</span>
    <span>MSST Consulting SC · Confidencial</span>
  </div></body></html>`);
  win.document.close();
  setTimeout(()=>win.print(),500);
}

init().catch(e=>{app.innerHTML='<div style="padding:2rem;color:#dc2626">Error: '+e.message+'</div>';});
