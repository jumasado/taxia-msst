// Comparar totales de activos vs balanzas
async function afCompararConBalanzas(){
  if(!docClienteActual) return;
  const clienteId=String(docClienteActual.id);
  const af=afCache||await afCargar(clienteId);
  if(!af.length){docToast('Sin activos registrados para comparar','warn');return;}

  // Obtener balanzas del ejercicio actual con cifras
  try{
    const docs=await sbGet('client_documents',
      '?cliente_id=eq.'+encodeURIComponent(clienteId)+
      '&ejercicio=eq.'+docEjercicio+'&tipo=eq.balanza&select=cifras,mes,nombre_archivo');
    if(!docs||!docs.length){docToast('No hay balanzas del '+docEjercicio+' para comparar','warn');return;}

    // Agrupar activos por mes/año de adquisición en el ejercicio
    const afPorMes={};
    af.forEach(a=>{
      if(!a.fecha_adquisicion) return;
      const d=new Date(a.fecha_adquisicion+'T00:00:00');
      if(d.getFullYear()!==docEjercicio) return;
      const mes=d.getMonth()+1;
      if(!afPorMes[mes]) afPorMes[mes]=0;
      afPorMes[mes]+=a.monto_adquisicion||0;
    });

    if(!Object.keys(afPorMes).length){
      docToast('No hay activos adquiridos en '+docEjercicio+' para comparar','warn');
      return;
    }

    // Comparar con cifras de balanzas
    const fmtM=v=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2}).format(v||0);
    const filas=[];
    let hayDiscrepancia=false;

    docs.forEach(doc=>{
      const mes=doc.mes;
      const afMes=afPorMes[mes]||0;
      if(!afMes) return; // Solo mostrar meses con adquisiciones
      const det=(doc.cifras&&doc.cifras.detalle)||{};
      // Sumar activos fijos en balanza
      const balMes=Object.entries(det).filter(([k])=>k.startsWith('activo_fijo')).reduce((s,[,v])=>s+v,0);
      const diff=Math.abs(afMes-balMes);
      const ok=diff<1;
      if(!ok) hayDiscrepancia=true;
      filas.push('<tr style="background:'+(ok?'#f0f7f0':'#FFFBF0')+'">'+
        '<td style="padding:8px 12px;font-size:12px;font-weight:600">'+DOC_MESES_L[mes-1]+'</td>'+
        '<td style="padding:8px 12px;font-size:12px;text-align:right">'+fmtM(afMes)+'</td>'+
        '<td style="padding:8px 12px;font-size:12px;text-align:right">'+fmtM(balMes)+'</td>'+
        '<td style="padding:8px 12px;font-size:12px;text-align:right;color:'+(ok?'#3B6D11':'#A32D2D')+';font-weight:700">'+
          (ok?'✓ Cuadra':'⚠ '+fmtM(diff)+' diferencia')+'</td>'+
      '</tr>');
    });

    if(!filas.length){docToast('No hay meses con adquisiciones para comparar','warn');return;}

    const m=document.createElement('div');m.className='modal-overlay';m.id='af-modal-comp';
    m.innerHTML='<div class="modal-box" style="max-width:620px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'+
        '<div><div style="font-size:15px;font-weight:700">📊 Comparación Activos vs Balanzas — '+docEjercicio+'</div>'+
        '<div style="font-size:11px;color:#888">Adquisiciones del ejercicio vs cifras extractas de balanzas</div></div>'+
        '<button onclick="document.getElementById(\'af-modal-comp\').remove()" style="background:none;border:none;cursor:pointer;font-size:20px;color:#888">✕</button>'+
      '</div>'+
      (hayDiscrepancia?
        '<div style="background:#FFFBF0;border:1px solid #e0b44a;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:#854F0B">'+
        '⚠ Hay diferencias entre la integración de activos y los saldos de la balanza. Revisa los activos del mes correspondiente.</div>':
        '<div style="background:#EAF3DE;border:1px solid #b7d9a0;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:#3B6D11">'+
        '✓ Todos los meses con adquisiciones cuadran con las balanzas.</div>')+
      '<table style="width:100%;border-collapse:collapse">'+
      '<thead><tr style="background:#3B4BC8;color:#fff">'+
        '<th style="padding:8px 12px;font-size:11px;text-align:left">Mes</th>'+
        '<th style="padding:8px 12px;font-size:11px;text-align:right">Integración AF</th>'+
        '<th style="padding:8px 12px;font-size:11px;text-align:right">Balanza</th>'+
        '<th style="padding:8px 12px;font-size:11px;text-align:right">Resultado</th>'+
      '</tr></thead><tbody>'+filas.join('')+'</tbody></table>'+
      '<button class="btn" style="width:100%;margin-top:12px" onclick="document.getElementById(\'af-modal-comp\').remove()">Cerrar</button>'+
    '</div>';
    document.body.appendChild(m);
  }catch(e){docToast('Error en comparación: '+e.message,'err');}
}


// ===== API para consulta desde otros módulos =====
async function docGetCifrasCliente(clienteId,ejercicio,tipo,mes){
  try{
    let qs='?cliente_id=eq.'+encodeURIComponent(String(clienteId))+'&ejercicio=eq.'+ejercicio+'&tipo=eq.'+tipo+'&select=cifras,nombre_archivo,status,archivo_url';
    if(mes!==null&&mes!==undefined)qs+='&mes=eq.'+mes;
    const rows=await sbGet('client_documents',qs);
    return rows&&rows[0]?rows[0]:null;
  }catch(e){return null;}
}
