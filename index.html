async function loadCaches(force=false){
  const now=Date.now();
  if(!force&&_cacheTs>0&&(now-_cacheTs)<CACHE_TTL&&clientesCache.length>0) return;
  const [g,c]=await Promise.all([
    sbGet('grupos','?select=*&order=nombre.asc'),
    sbGet('clientes','?select=*,grupos(nombre)&order=nombre.asc')
  ]);
  gruposCache=g||[];
  const todos=c||[];
  // Filtrar por accesosCache cargado al login — sin query extra en cada navegación
  if(!session||session.role==='admin'||!accesosCache){
    clientesCache=todos;
  } else {
    clientesCache=todos.filter(c=>accesosCache.has(String(c.id)));
  }
  _cacheTs=Date.now();
}

async function getActiveTareas(email){
  const today=todayKey();
  const {data:tareas}=await sbGet('tareas',`?email=eq.${encodeURIComponent(email)}&select=*&order=orden.asc,created_at.asc`).then(r=>({data:r}));
  if(!tareas) return [];
  // pendientes de cualquier fecha + concluidas de hoy
  return tareas.filter(t=>t.status==='pendiente'||t.status==='standby'||t.status==='eliminada'||(t.status==='concluida'&&t.fecha_conclusion&&t.fecha_conclusion.startsWith(today)));
}

let currentSessionId=null;

async function registrarLogin(email){
  try{
    const res=await sbPost('sesiones',{email,login_at:nowISO()},'return=representation');
    const data=await res.json();
    currentSessionId=(Array.isArray(data)?data[0]:data)?.id||null;
  }catch(e){console.warn('Session log error:',e);}
}

async function registrarLogout(){
  if(!currentSessionId||!session)return;
  try{
    const loginRes=await sbGet('sesiones',`?id=eq.${currentSessionId}&select=login_at`);
    const loginAt=loginRes?.[0]?.login_at;
    const logoutAt=nowISO();
    let duracion_min=null;
    if(loginAt){
      const diff=new Date(logoutAt)-new Date(loginAt);
      duracion_min=Math.round(diff/60000);
    }
    await sbPatch('sesiones',`?id=eq.${currentSessionId}`,{logout_at:logoutAt,duracion_min});
    currentSessionId=null;
  }catch(e){console.warn('Logout log error:',e);}
}

async function doLogout(porInactividad=false){
  await registrarLogout();
  session=null;usersCache={};clientesCache=[];gruposCache=[];accesosCache=null;_cacheTs=0;
  clearInactivityTimer();
  if(porInactividad){
    renderLogin();
    setTimeout(()=>{
      const msg=document.createElement('div');
      msg.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;font-size:13px;padding:10px 20px;border-radius:8px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.2)';
      msg.textContent='Sesión cerrada por inactividad (10 min)';
      document.body.appendChild(msg);
      setTimeout(()=>msg.remove(),3500);
    },100);
  } else {
    renderLogin();
  }
}

// ===== AUTO-LOGOUT POR INACTIVIDAD =====
let inactivityTimer=null;
const INACTIVITY_MS=10*60*1000; // 10 minutos

function resetInactivityTimer(){
  if(!session)return;
  clearTimeout(inactivityTimer);
  inactivityTimer=setTimeout(()=>{
    if(session) doLogout(true);
  },INACTIVITY_MS);
}

function clearInactivityTimer(){
  clearTimeout(inactivityTimer);
  inactivityTimer=null;
}

function startInactivityWatcher(){
  ['mousemove','mousedown','keydown','touchstart','scroll','click'].forEach(ev=>{
    document.addEventListener(ev,resetInactivityTimer,{passive:true});
  });
  resetInactivityTimer();
}
function nav(s){
  if(!userCanAccess(session.email,s)&&s!=='cierres'){renderPortada();return;}
  const t=todayKey();
  if(s==='dashboard') renderDashboard(t);

  else if(s==='proyeccion') renderProyeccion();

  else if(s==='admin') renderAdmin();
  else if(s==='permisos') renderPermisos();

  else if(s==='pp') renderPagosProv();
  else if(s==='doc') renderDocumentacion();
  else if(s==='portada') renderPortada();
}

async function solicitarCodigo(){
  const email=(document.getElementById('rec-email')?.value||'').trim().toLowerCase();
  const btn=document.getElementById('rec-btn1');
  const err=document.getElementById('rec-err1');
  if(!email){err.textContent='Ingresa tu correo';err.style.display='block';return;}
  btn.innerHTML='<span class="spinner"></span> Enviando...';btn.disabled=true;
  try{
    const users=await sbGet('users','?email=eq.'+encodeURIComponent(email)+'&select=email,name');
    if(!users||!users.length){err.textContent='No existe una cuenta con ese correo';err.style.display='block';btn.innerHTML='Enviar código';btn.disabled=false;return;}
    const codigo=String(Math.floor(100000+Math.random()*900000));
    const exp=new Date(Date.now()+15*60*1000).toISOString();
    await sbPatch('users','?email=eq.'+encodeURIComponent(email),{reset_code:codigo,reset_exp:exp});
    await fetch('https://api.resend.com/emails',{
      method:'POST',
      headers:{'Authorization':'Bearer '+RESEND_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({
        from:FROM_EMAIL,to:[email],
        subject:'TaxIA — Código de recuperación',
        html:`<div style="font-family:sans-serif;max-width:480px;margin:0 auto;padding:2rem">
          <h2 style="color:#3B4BC8">Recuperación de contraseña</h2>
          <p>Hola ${users[0].name||email},</p>
          <p>Tu código de recuperación es:</p>
          <div style="font-size:36px;font-weight:800;letter-spacing:12px;color:#3B4BC8;background:#EEEDFE;padding:1.5rem;border-radius:12px;text-align:center;margin:1.5rem 0">${codigo}</div>
          <p style="color:#888;font-size:13px">Válido por 15 minutos.</p>
          <p style="color:#888;font-size:12px">— TaxIA · MSST Consulting</p>
        </div>`
      })
    });
    document.getElementById('rec-step1').style.display='none';
    document.getElementById('rec-step2').style.display='block';
    window._recEmail=email;
  }catch(e){err.textContent='Error: '+e.message;err.style.display='block';btn.innerHTML='Enviar código';btn.disabled=false;}
}

  err.style.display='none';
  if(!codigo||codigo.length!==6){err.textContent='Ingresa el código de 6 dígitos';err.style.display='block';return;}
  if(newpass.length<4){err.textContent='La contraseña debe tener al menos 4 caracteres';err.style.display='block';return;}
  if(newpass!==confpass){err.textContent='Las contraseñas no coinciden';err.style.display='block';return;}
  btn.innerHTML='<span class="spinner"></span> Verificando...';btn.disabled=true;
  try{
    const users=await sbGet('users','?email=eq.'+encodeURIComponent(window._recEmail)+'&select=reset_code,reset_exp');
    if(!users||!users.length) throw new Error('Usuario no encontrado');
    if(users[0].reset_code!==codigo) throw new Error('Código incorrecto');
    if(!users[0].reset_exp||new Date(users[0].reset_exp)<new Date()) throw new Error('El código expiró — solicita uno nuevo');
    await sbPatch('users','?email=eq.'+encodeURIComponent(window._recEmail),{pass:newpass,reset_code:null,reset_exp:null});
    err.style.background='#EAF3DE';err.style.color='#3B6D11';
    err.textContent='✓ Contraseña actualizada correctamente';err.style.display='block';
    btn.style.display='none';
    setTimeout(()=>renderLogin(),2500);
  }catch(e){err.textContent='Error: '+e.message;err.style.display='block';btn.innerHTML='Cambiar contraseña';btn.disabled=false;}
}


// ===== HASH DE CONTRASEÑAS (SHA-256 + salt) =====
const APP_SALT='TaxIA-MSST-2026-Salt-Fijo-Seguridad';
async function hashPassword(plainPass){
  const data=new TextEncoder().encode(plainPass+APP_SALT);
  const hashBuffer=await crypto.subtle.digest('SHA-256',data);
  const hashArray=Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ===== BLOQUEO POR INTENTOS FALLIDOS =====
const LOGIN_MAX_INTENTOS=5;
const LOGIN_BLOQUEO_MS=10*60*1000; // 10 minutos
function getLoginIntentos(em){
  try{
    const raw=localStorage.getItem('taxia_login_guard_'+em);
    if(!raw) return {count:0,blockedUntil:0};
    return JSON.parse(raw);
  }catch(e){return {count:0,blockedUntil:0};}
}
function setLoginIntentos(em,data){
  try{localStorage.setItem('taxia_login_guard_'+em,JSON.stringify(data));}catch(e){}
}
function clearLoginIntentos(em){
  try{localStorage.removeItem('taxia_login_guard_'+em);}catch(e){}
}
function checkLoginBloqueado(em){
  const g=getLoginIntentos(em);
  if(g.blockedUntil && Date.now()<g.blockedUntil){
    const minRestantes=Math.ceil((g.blockedUntil-Date.now())/60000);
    return minRestantes;
  }
  return 0;
}
function registrarIntentoFallido(em){
  const g=getLoginIntentos(em);
  g.count=(g.count||0)+1;
  if(g.count>=LOGIN_MAX_INTENTOS){
    g.blockedUntil=Date.now()+LOGIN_BLOQUEO_MS;
    g.count=0;
  }
  setLoginIntentos(em,g);
}

async function doLogin(){
  const em=document.getElementById('lemail').value.trim().toLowerCase();
  const pw=document.getElementById('lpass').value;
  const btn=document.getElementById('lbtn');
  const errEl=document.getElementById('lerr');
  errEl.textContent='Correo o contraseña incorrectos';
  // Verificar si está bloqueado por intentos fallidos
  const minBloqueo=checkLoginBloqueado(em);
  if(minBloqueo>0){
    errEl.textContent='Demasiados intentos fallidos. Intenta de nuevo en '+minBloqueo+' minuto(s).';
    errEl.style.display='block';
    return;
  }
  btn.innerHTML='<span class="spinner"></span> Verificando...';btn.disabled=true;
  try{
    const pwHash=await hashPassword(pw);
    const data=await sbGet('users',`?email=eq.${encodeURIComponent(em)}&pass=eq.${encodeURIComponent(pwHash)}&select=*`);
    if(!data||!data.length){
      registrarIntentoFallido(em);
      const minAhora=checkLoginBloqueado(em);
      if(minAhora>0){
        errEl.textContent='Demasiados intentos fallidos. Cuenta bloqueada '+minAhora+' minuto(s).';
      } else {
        errEl.textContent='Correo o contraseña incorrectos';
      }
      errEl.style.display='block';btn.innerHTML='Entrar';btn.disabled=false;return;
    }
    clearLoginIntentos(em);
    session={...data[0]};
    const [allU]=await Promise.all([sbGet('users','?select=*'),loadCaches()]);
    allU.forEach(u=>{usersCache[u.email]=u;});
    // Cargar accesos del usuario una sola vez al login
    if(session.role!=='admin'){
      try{
        const acc=await sbGet('cliente_usuarios','?user_email=eq.'+encodeURIComponent(session.email)+'&select=cliente_id');
        accesosCache=new Set((acc||[]).map(a=>String(a.cliente_id)));
      }catch(e){accesosCache=null;}
    } else { accesosCache=null; }
    await registrarLogin(session.email);
    startInactivityWatcher();
    initReporteGerencial();
    renderPortada();
  }catch(e){
    console.error('doLogin error:',e.message,e.stack);
    document.getElementById('lerr').textContent='Error: '+e.message;document.getElementById('lerr').style.display='block';btn.innerHTML='Entrar';btn.disabled=false;
  }
}

  genera_nueva:'Genera nueva tarea',

async function confirmarConclusion(tareaId,targetEmail){
  const btn=document.getElementById('btn-confirmar-conclusion');
  const motivoId=btn?.dataset?.motivo;
  if(!motivoId) return;
  cerrarModal();
  const motivoTxt=MOTIVOS_TEXTO[motivoId]||motivoId;
  const generaNueva=motivoId==='genera_nueva';
  const {data:t}=await sbGet('tareas',`?id=eq.${tareaId}&select=bitacora,descripcion,client_id,client_name,fecha_creacion`).then(r=>({data:r?.[0]}));
  const bits=[...(t?.bitacora||[]),{fecha:nowISO(),evento:`Concluida por ${session.name} — ${motivoTxt}`}];
  await sbPatch('tareas',`?id=eq.${tareaId}`,{status:'concluida',fecha_conclusion:nowISO(),updated_at:nowISO(),motivo_conclusion:motivoTxt,genera_nueva_tarea:generaNueva,bitacora:bits});
  if(generaNueva){
    const today=todayKey();
    const tareas=await getActiveTareas(targetEmail);
    const pendientes=tareas.filter(x=>x.status==='pendiente');
    if(pendientes.length<5){
      const bitNueva=[{fecha:nowISO(),evento:`Generada por conclusión de tarea anterior — ${session.name}`}];
      await sbPost('tareas',{email:targetEmail,descripcion:'[NUEVA] '+escH(t?.descripcion||''),client_id:t?.client_id||null,client_name:t?.client_name||'',fecha_creacion:today,status:'pendiente',orden:tareas.length,asignada_por:session.email,bitacora:bitNueva});
    }
  }
  renderMisPlan(targetEmail);
}

async function addTareaRemota(idx,targetEmail){
  const desc=document.getElementById(`ndesc-${idx}`).value.trim();
  const cliId=document.getElementById(`ncli-${idx}`).value;
  const cliName=cliId?(clientesCache.find(c=>c.id===cliId)||{}).nombre||'':'';
  const err=document.getElementById('tarea-err');
  if(!desc){err.textContent='Escribe una descripción.';err.style.display='block';setTimeout(()=>err.style.display='none',2500);return;}
  const today=todayKey();
  const tareas=await getActiveTareas(targetEmail);
  const pendientes=tareas.filter(t=>t.status==='pendiente');
  if(pendientes.length>=5){
    const nm=usersCache[targetEmail]?.name||targetEmail;
    err.textContent=`${nm} ya tiene 5 tareas pendientes activas.`;err.style.display='block';
    setTimeout(()=>err.style.display='none',3000);return;
  }
  const asignadaPor=targetEmail!==session.email?session.email:null;
  const nombreCorto=session.name.split(' ').slice(0,2).join(' ');
  const bitInicial=[{fecha:nowISO(),evento:asignadaPor?`Asignada por ${nombreCorto}`:`Creada por ${nombreCorto}`}];
  await sbPost('tareas',{email:targetEmail,descripcion:desc,client_id:cliId||null,client_name:cliName,fecha_creacion:today,status:'pendiente',orden:tareas.length,asignada_por:asignadaPor,bitacora:bitInicial});
  await sendPlanNotification([...tareas,{descripcion:desc,client_name:cliName,status:'pendiente'}],targetEmail);
  const ok=document.getElementById('tarea-ok');
  const nm=targetEmail!==session.email?` a ${usersCache[targetEmail]?.name||targetEmail}`:'';
  ok.textContent=`Tarea asignada${nm}.`;ok.style.display='block';
  setTimeout(()=>ok.style.display='none',2000);
  renderMisPlan(targetEmail);
}

async function toggleStandby(id,currentlyStandby,targetEmail){
  const email=targetEmail||session.email;
  const isStandby=currentlyStandby==='true'||currentlyStandby===true;
  const newStatus=isStandby?'pendiente':'standby';
  const evento=isStandby?'Reactivada desde Stand By':'Puesta en Stand By';
  const {data:t}=await sbGet('tareas',`?id=eq.${id}&select=bitacora,fecha_creacion,updated_at`).then(r=>({data:r?.[0]}));
  const bits=[...(t?.bitacora||[]),{fecha:nowISO(),evento}];
  await sbPatch('tareas',`?id=eq.${id}`,{status:newStatus,updated_at:nowISO(),fecha_standup:isStandby?null:nowISO(),bitacora:bits});
  renderMisPlan(email);
}

async function sendPlanNotification(tareas,targetEmail){
  const recipients=targetEmail&&targetEmail!==session.email
    ? [...new Set([targetEmail,...getNotifyEmails()])]
    : getNotifyEmails();
  if(!recipients.length) return;

function buildCharts(visible,allTareas,byEmail){
  // Historial: últimos 14 días, tareas concluidas por día por persona
  const dateMap={};
  allTareas.forEach(t=>{
    if(!visible.includes(t.email)||t.status!=='concluida'||!t.fecha_conclusion)return;
    const d=t.fecha_conclusion.slice(0,10);
    if(!dateMap[d])dateMap[d]={};
    dateMap[d][t.email]=(dateMap[d][t.email]||0)+1;
  });
  const dates=Object.keys(dateMap).sort().slice(-14);
  const labels=dates.map(formatDateShort);
  const datasets=visible.map(em=>{
    const u=usersCache[em];
    return{label:u?u.name.split(' ')[0]:em,data:dates.map(d=>(dateMap[d]||{})[em]||0),borderColor:pc(em),backgroundColor:pc(em)+'33',tension:.3,fill:false,pointRadius:4};
  });
  const ctx1=document.getElementById('chart-hist');
  if(ctx1&&labels.length) new Chart(ctx1,{type:'line',data:{labels,datasets},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}},scales:{y:{min:0,ticks:{stepSize:1},grid:{color:'#f0f0ec'}},x:{grid:{display:false},ticks:{font:{size:10}}}}}});
  else if(ctx1) ctx1.parentElement.innerHTML+='<div style="font-size:13px;color:#bbb;padding:1rem 0;text-align:center">Sin historial aún</div>';

  const ctx2=document.getElementById('chart-comp');
  if(ctx2) new Chart(ctx2,{type:'bar',data:{
    labels:visible.map(em=>usersCache[em]?usersCache[em].name.split(' ')[0]:em),
    datasets:[
      {label:'Total',data:visible.map(em=>(byEmail[em]||[]).length),backgroundColor:'#e5e5e0'},
      {label:'Concluidas',data:visible.map(em=>(byEmail[em]||[]).filter(t=>t.status==='concluida').length),backgroundColor:visible.map(em=>pc(em))}
    ]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}},scales:{y:{min:0,ticks:{stepSize:1},grid:{color:'#f0f0ec'}},x:{grid:{display:false}}}}});
}

async function runAnalysis(){

    const res=await fetch(SB_URL+'/functions/v1/claude-analysis',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+ANON_KEY},body:JSON.stringify({prompt})});
    const data=await res.json();

async function loadHistorial(){
  const sel=document.getElementById('hist-user-sel');
  const desde=document.getElementById('hist-desde')?.value||todayKey();
  const hasta=document.getElementById('hist-hasta')?.value||todayKey();
  const filterEmail=sel?sel.value:'all';
  const body=document.getElementById('hist-body');
  if(!body)return;
  body.innerHTML='<div class="loading"><span class="spinner"></span>Cargando reporte...</div>';

  const visible=visibleEmails();
  const emailSafe=filterEmail==='all'||!visible.includes(filterEmail)?'all':filterEmail;
  const emails=emailSafe==='all'?visible:[emailSafe];

  // Cargar sesiones y tareas en paralelo
  const emailFilter='('+emails.map(e=>'"'+e+'"').join(',')+')';
  const [sesiones,tareas]=await Promise.all([
    sbGet('sesiones','?email=in.'+emailFilter+'&order=login_at.desc&select=*'),
    sbGet('tareas','?email=in.'+emailFilter+'&select=*&order=created_at.asc')
  ]);

  // Filtrar por rango de fechas
  const desdeDt=new Date(desde+'T00:00:00');
  const hastaDt=new Date(hasta+'T23:59:59');

  const sesionesFilt=(sesiones||[]).filter(s=>{
    const d=new Date(s.login_at);return d>=desdeDt&&d<=hastaDt;
  });

  // Agrupar sesiones por email
  const sesByEmail={};
  emails.forEach(e=>{sesByEmail[e]=[];});
  sesionesFilt.forEach(s=>{if(sesByEmail[s.email])sesByEmail[s.email].push(s);});

  // Agrupar tareas por email y fecha
  const tareasByEmail={};
  emails.forEach(e=>{tareasByEmail[e]=[];});
  (tareas||[]).forEach(t=>{
    const fechaAlta=t.created_at?t.created_at.slice(0,10):t.fecha_creacion;
    const fechaCon=t.fecha_conclusion?t.fecha_conclusion.slice(0,10):null;
    const enRango=(fechaAlta&&new Date(fechaAlta+'T12:00:00')>=desdeDt&&new Date(fechaAlta+'T12:00:00')<=hastaDt)||
                  (fechaCon&&new Date(fechaCon+'T12:00:00')>=desdeDt&&new Date(fechaCon+'T12:00:00')<=hastaDt);
    if(enRango&&tareasByEmail[t.email])tareasByEmail[t.email].push(t);
  });

  if(!emails.length){body.innerHTML='<div class="card"><div style="font-size:14px;color:#888">Sin datos.</div></div>';return;}

  let html='';
  emails.forEach(em=>{
    const u=usersCache[em];if(!u)return;
    const sesUser=sesByEmail[em]||[];
    const tareasUser=tareasByEmail[em]||[];

    // Estadísticas resumen
    const totalSes=sesUser.length;
    const totalMin=sesUser.reduce((s,x)=>s+(x.duracion_min||0),0);
    const totalHrs=Math.floor(totalMin/60);
    const restMin=totalMin%60;
    const tareasAlta=tareasUser.filter(t=>{
      const f=t.created_at?t.created_at.slice(0,10):t.fecha_creacion;
      return f&&new Date(f+'T12:00:00')>=desdeDt&&new Date(f+'T12:00:00')<=hastaDt;
    });
    const tareasCon=tareasUser.filter(t=>t.status==='concluida'&&t.fecha_conclusion&&new Date(t.fecha_conclusion.slice(0,10)+'T12:00:00')>=desdeDt);

    // Tabla de sesiones
    let sesRows='';
    if(sesUser.length){
      sesRows=sesUser.map(s=>{
        const entrada=new Date(s.login_at).toLocaleString('es-MX',{timeZone:'America/Tijuana',dateStyle:'short',timeStyle:'short'});
        const salida=s.logout_at?new Date(s.logout_at).toLocaleString('es-MX',{timeZone:'America/Tijuana',dateStyle:'short',timeStyle:'short'}):'<span style="color:#EF9F27;font-weight:500">Activa</span>';
        const dur=s.duracion_min!=null?(s.duracion_min>=60?Math.floor(s.duracion_min/60)+'h '+(s.duracion_min%60)+'min':s.duracion_min+' min'):'—';
        return '<tr>'+
          '<td>'+entrada+'</td>'+
          '<td>'+salida+'</td>'+
          '<td style="font-weight:600">'+dur+'</td>'+
        '</tr>';
      }).join('');
    } else {
      sesRows='<tr><td colspan="3" style="color:#bbb;text-align:center">Sin sesiones en este período</td></tr>';
    }

    // Tabla de tareas
    let tarRows='';
    if(tareasUser.length){
      // Ordenar: primero por fecha de alta, luego concluidas
      const sorted=[...tareasUser].sort((a,b)=>{
        const fa=a.created_at||a.fecha_creacion||'';
        const fb=b.created_at||b.fecha_creacion||'';
        return fa.localeCompare(fb);
      });
      tarRows=sorted.map(t=>{
        const fechaAlta=t.created_at?new Date(t.created_at).toLocaleString('es-MX',{timeZone:'America/Tijuana',dateStyle:'short',timeStyle:'short'}):t.fecha_creacion||'—';
        const fechaCon=t.fecha_conclusion?new Date(t.fecha_conclusion).toLocaleString('es-MX',{timeZone:'America/Tijuana',dateStyle:'short',timeStyle:'short'}):'—';
        const statusBadge=t.status==='concluida'?
          '<span style="background:#f0f7d4;color:#5a8a1a;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600">Concluida</span>':
          t.status==='standby'?
          '<span style="background:#E6F1FB;color:#3B4BC8;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600">Stand By</span>':
          t.status==='eliminada'?
          '<span style="background:#fef2f2;color:#dc2626;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600">Eliminada</span>':
          '<span style="background:#FEF3C7;color:#92400E;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600">Pendiente</span>';
        const asig=t.asignada_por&&t.asignada_por!==em&&usersCache[t.asignada_por]?
          '<div style="font-size:10px;color:#888;margin-top:2px">Asignada por '+escH(usersCache[t.asignada_por].name)+'</div>':'';
        const motivo=t.motivo_conclusion?'<div style="font-size:10px;color:#888;margin-top:2px">'+escH(t.motivo_conclusion)+'</div>':'';
        return '<tr>'+
          '<td><div style="font-size:13px;font-weight:500">'+escH(t.descripcion)+'</div>'+
            (t.client_name?'<div style="font-size:11px;color:#888">'+escH(t.client_name)+'</div>':'')+asig+'</td>'+
          '<td>'+statusBadge+motivo+'</td>'+
          '<td style="font-size:12px;color:#555">'+fechaAlta+'</td>'+
          '<td style="font-size:12px;color:#555">'+fechaCon+'</td>'+
        '</tr>';
      }).join('');
    } else {
      tarRows='<tr><td colspan="4" style="color:#bbb;text-align:center">Sin tareas en este período</td></tr>';
    }

    html+='<div class="card" style="margin-bottom:1.25rem">'+
      // Header usuario
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid #e5e5e0">'+
        '<div class="avatar '+av(u.av)+'" style="width:40px;height:40px;font-size:14px">'+(u.initials||'??')+'</div>'+
        '<div style="flex:1">'+
          '<div style="font-size:15px;font-weight:700">'+escH(u.name)+'</div>'+
          '<div style="font-size:12px;color:#888">'+escH(u.email)+'</div>'+
        '</div>'+
        roleBadge(u.role)+
      '</div>'+
      // Métricas resumen
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem">'+
        '<div style="background:#f5f5f3;border-radius:8px;padding:10px;text-align:center">'+
          '<div style="font-size:11px;color:#888;margin-bottom:4px">Sesiones</div>'+
          '<div style="font-size:20px;font-weight:700;color:#3B4BC8">'+totalSes+'</div>'+
        '</div>'+
        '<div style="background:#f5f5f3;border-radius:8px;padding:10px;text-align:center">'+
          '<div style="font-size:11px;color:#888;margin-bottom:4px">Tiempo total</div>'+
          '<div style="font-size:20px;font-weight:700;color:#3B4BC8">'+(totalMin>0?totalHrs+'h '+restMin+'m':'—')+'</div>'+
        '</div>'+
        '<div style="background:#f5f5f3;border-radius:8px;padding:10px;text-align:center">'+
          '<div style="font-size:11px;color:#888;margin-bottom:4px">Tareas dadas de alta</div>'+
          '<div style="font-size:20px;font-weight:700;color:#EF9F27">'+tareasAlta.length+'</div>'+
        '</div>'+
        '<div style="background:#f5f5f3;border-radius:8px;padding:10px;text-align:center">'+
          '<div style="font-size:11px;color:#888;margin-bottom:4px">Tareas concluidas</div>'+
          '<div style="font-size:20px;font-weight:700;color:#8DC63F">'+tareasCon.length+'</div>'+
        '</div>'+
      '</div>'+
      // Tabla sesiones
      '<div style="font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Sesiones</div>'+
      '<div class="table-wrap" style="margin-bottom:1rem">'+
        '<table class="data-table">'+
          '<thead><tr><th>Entrada</th><th>Salida</th><th>Duración</th></tr></thead>'+
          '<tbody>'+sesRows+'</tbody>'+
        '</table>'+
      '</div>'+
      // Tabla tareas
      '<div style="font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Tareas del período</div>'+
      '<div class="table-wrap">'+
        '<table class="data-table">'+
          '<thead><tr><th>Descripción</th><th>Estatus</th><th>Alta</th><th>Conclusión</th></tr></thead>'+
          '<tbody>'+tarRows+'</tbody>'+
        '</table>'+
      '</div>'+
    '</div>';
  });

  // ===== GRÁFICA GLOBAL: tareas por día =====
  // Recopilar todos los datos de tareas de todos los usuarios visibles
  const allTareasGraf=await sbGet('tareas','?email=in.'+emailFilter+'&select=created_at,fecha_creacion,fecha_conclusion,status&order=created_at.asc');
  const desdeDt2=new Date(document.getElementById('hist-desde').value+'T00:00:00');
  const hastaDt2=new Date(document.getElementById('hist-hasta').value+'T23:59:59');

  // Construir mapa de días en el rango
  const diasMap={};
  const cursor=new Date(desdeDt2);
  while(cursor<=hastaDt2){
    const k=cursor.toLocaleDateString('en-CA',{timeZone:'America/Tijuana'});
    diasMap[k]={alta:0,concluida:0};
    cursor.setDate(cursor.getDate()+1);
  }

  (allTareasGraf||[]).forEach(t=>{
    const fa=t.created_at?t.created_at.slice(0,10):t.fecha_creacion;
    const fc=t.fecha_conclusion?t.fecha_conclusion.slice(0,10):null;
    if(fa&&diasMap[fa])diasMap[fa].alta++;
    if(fc&&diasMap[fc]&&t.status==='concluida')diasMap[fc].concluida++;
  });

  const dias=Object.keys(diasMap).sort();
  const labelsGraf=dias.map(d=>new Date(d+'T12:00:00').toLocaleDateString('es-MX',{month:'short',day:'numeric'}));
  const dataAlta=dias.map(d=>diasMap[d].alta);
  const dataCon=dias.map(d=>diasMap[d].concluida);

  // Agregar canvas de gráfica al final del html
  html+='<div class="card" id="hist-graf-card" style="margin-bottom:1.25rem">'+
    '<div style="font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px">Tareas registradas vs concluidas por día</div>'+
    '<canvas id="hist-chart" height="120"></canvas>'+
  '</div>';

  body.innerHTML=html||'<div class="card"><div style="font-size:14px;color:#888">Sin actividad en el período seleccionado.</div></div>';

  // Renderizar gráfica con Chart.js
  const ctx=document.getElementById('hist-chart');
  if(ctx&&dias.length){
    new Chart(ctx,{
      type:'bar',
      data:{
        labels:labelsGraf,
        datasets:[
          {label:'Dadas de alta',data:dataAlta,backgroundColor:'#EF9F2788',borderColor:'#EF9F27',borderWidth:1.5,borderRadius:4},
          {label:'Concluidas',data:dataCon,backgroundColor:'#8DC63F88',borderColor:'#8DC63F',borderWidth:1.5,borderRadius:4}
        ]
      },
      options:{
        responsive:true,
        plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}},
        scales:{
          y:{min:0,ticks:{stepSize:1},grid:{color:'#f0f0ec'}},
          x:{grid:{display:false},ticks:{font:{size:10},maxRotation:45}}
        }
      }
    });
  }
}

async function loadSesiones(){

  const hasta=document.getElementById('ses-hasta')?.value||todayKey();

  body.innerHTML='<div class="loading"><span class="spinner"></span>Cargando sesiones...</div>';

  const visible=visibleEmails();
  const emailSafe=filterEmail==='all'||!visible.includes(filterEmail)?'all':filterEmail;
  const emails=emailSafe==='all'?visible:[emailSafe];

  const desdeDt=new Date(desde+'T00:00:00');
  const hastaDt=new Date(hasta+'T23:59:59');
  const emailFilter='('+emails.map(e=>'"'+e+'"').join(',')+')';

  const sesiones=await sbGet('sesiones','?email=in.'+emailFilter+'&order=login_at.desc&select=*');
  const sesFilt=(sesiones||[]).filter(s=>{
    const d=new Date(s.login_at);return d>=desdeDt&&d<=hastaDt;
  });

  if(!sesFilt.length){
    body.innerHTML='<div style="font-size:13px;color:#888;padding:8px 0">Sin sesiones en el período seleccionado.</div>';
    return;
  }

  // Agrupar por usuario
  const byUser={};
  emails.forEach(e=>{byUser[e]=[];});
  sesFilt.forEach(s=>{if(byUser[s.email])byUser[s.email].push(s);});

  let html='';
  emails.forEach(em=>{
    const u=usersCache[em];if(!u)return;
    const sess=byUser[em]||[];
    if(!sess.length)return;
    const totalMin=sess.reduce((s,x)=>s+(x.duracion_min||0),0);
    const hrs=Math.floor(totalMin/60);
    const mins=totalMin%60;

    html+='<div style="margin-bottom:14px">'+
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;padding-bottom:6px;border-bottom:0.5px solid #e5e5e0">'+

        '<div style="flex:1;font-size:13px;font-weight:600">'+escH(u.name)+'</div>'+
        '<div style="font-size:11px;color:#888">'+sess.length+' sesiones · '+(totalMin>0?hrs+'h '+mins+'m total':'—')+'</div>'+
      '</div>'+
      '<div class="table-wrap">'+
        '<table class="data-table">'+
          '<thead><tr><th>Entrada</th><th>Salida</th><th>Duración</th><th>Estado</th></tr></thead>'+
          '<tbody>'+
          sess.map(s=>{
            const entrada=new Date(s.login_at).toLocaleString('es-MX',{timeZone:'America/Tijuana',dateStyle:'short',timeStyle:'short'});
            const salida=s.logout_at?new Date(s.logout_at).toLocaleString('es-MX',{timeZone:'America/Tijuana',dateStyle:'short',timeStyle:'short'}):'—';
            const dur=s.duracion_min!=null?(s.duracion_min>=60?Math.floor(s.duracion_min/60)+'h '+(s.duracion_min%60)+'min':s.duracion_min+' min'):'—';
            const estado=s.logout_at?
              '<span style="background:#f0f7d4;color:#5a8a1a;padding:1px 8px;border-radius:999px;font-size:10px;font-weight:600">Cerrada</span>':
              '<span style="background:#FEF3C7;color:#92400E;padding:1px 8px;border-radius:999px;font-size:10px;font-weight:600">Activa</span>';
            return '<tr><td>'+entrada+'</td><td>'+salida+'</td><td style="font-weight:500">'+dur+'</td><td>'+estado+'</td></tr>';
          }).join('')+
          '</tbody>'+
        '</table>'+
      '</div>'+
    '</div>';
  });

  body.innerHTML=html;
}

  const filas = users.map(u=>{
    const tiene = conAcceso.has(u.email);
    const nombre = u.name||u.email;

        <input type="checkbox" data-email="${escH(u.email)}" ${tiene?'checked':''}

        <span style="font-size:12px;color:${tiene?'#3B6D11':'#888'}">${tiene?'Con acceso':'Sin acceso'}</span>

  const sinColabs = users.length===0 ?
    '<div style="text-align:center;padding:1.5rem;color:#888;font-size:13px">No hay colaboradores registrados.<br>Agrega usuarios en el módulo 10 — Usuarios.</div>' : '';

  const m = document.createElement('div');
  m.className = 'modal-overlay';
  m.id = 'modal-accesos';
  m.innerHTML = `<div class="modal-box" style="max-width:520px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">

        <div style="font-size:15px;font-weight:700">👥 Accesos al cliente</div>
        <div style="font-size:12px;color:#888;margin-top:2px">${escH(clienteNombre)}</div>
      </div>

      ✓ <strong>Admin (tú)</strong> siempre tiene acceso a todos los clientes.<br>
      Activa o desactiva el acceso de cada colaborador a este cliente.
    </div>

    <div style="max-height:360px;overflow-y:auto">
      ${sinColabs}${filas}
    </div>

    <button class="btn" style="width:100%;margin-top:14px" onclick="document.getElementById('modal-accesos').remove()">Cerrar</button>
  </div>`;
  document.body.appendChild(m);
}

async function cliToggleAcceso(clienteId, email, dar, el){
  const span = el?.closest('label')?.querySelector('span');
  const toast=(msg,ok)=>{
    const t=document.createElement('div');
    t.style.cssText='position:fixed;bottom:60px;right:16px;z-index:9999;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.2);background:'+(ok?'#EAF3DE':'#FCEBEB')+';color:'+(ok?'#3B6D11':'#A32D2D');
    t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000);
  };
  try{
    if(dar){
      // Usar Prefer: resolution=ignore-duplicates para evitar error de constraint único
      const r=await fetch(SB_URL+'/rest/v1/cliente_usuarios',{
        method:'POST',
        headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,
          'Content-Type':'application/json',
          'Prefer':'return=minimal,resolution=ignore-duplicates'},
        body:JSON.stringify({cliente_id:String(clienteId),user_email:email,
          created_at:nowISO(),created_by:session.email})
      });
      if(!r.ok){const err=await r.text();throw new Error(err);}
      if(span){span.textContent='Con acceso';span.style.color='#3B6D11';}
      toast('✓ Acceso activado — '+email, true);
    } else {
      const r=await fetch(SB_URL+'/rest/v1/cliente_usuarios'
        +'?cliente_id=eq.'+encodeURIComponent(String(clienteId))
        +'&user_email=eq.'+encodeURIComponent(email),{
        method:'DELETE',
        headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
      });
      if(!r.ok){const err=await r.text();throw new Error(err);}
      if(span){span.textContent='Sin acceso';span.style.color='#888';}
      toast('✓ Acceso removido — '+email, true);
    }
  }catch(e){
    console.error('Error acceso:',e);
    if(el) el.checked=!dar; // revertir checkbox
    toast('✕ Error: '+e.message, false);
  }
}

async function saveCliente(){
  const nombre=document.getElementById('cf-nombre').value.trim();
  const rfc=document.getElementById('cf-rfc').value.trim().toUpperCase();
  const tipo=document.getElementById('cf-tipo').value;
  const grupo_id=document.getElementById('cf-grupo').value||null;
  const responsable=document.getElementById('cf-resp').value;
  const notas=document.getElementById('cf-notas').value.trim();
  const editing=document.getElementById('cf-editing').value;
  const err=document.getElementById('cf-err');err.style.display='none';
  if(!nombre){err.textContent='El nombre es obligatorio.';err.style.display='block';return;}
  const dup=clientesCache.find(c=>c.nombre.toLowerCase()===nombre.toLowerCase()&&c.id!==editing);
  if(dup){err.textContent='Ya existe un cliente con ese nombre.';err.style.display='block';return;}
  const btn=document.getElementById('cf-btn');btn.innerHTML='<span class="spinner"></span> Guardando...';btn.disabled=true;
  if(editing)await sbPatch('clientes',`?id=eq.${editing}`,{nombre,rfc,tipo,grupo_id,responsable,notas});
  else await sbPost('clientes',{nombre,rfc,tipo,grupo_id,responsable,notas});
  await loadCaches(true); // force=true para refrescar aunque el caché sea reciente
  btn.innerHTML=editing?'Actualizar cliente':'Guardar cliente';btn.disabled=false;
  document.getElementById('cf-editing').value='';
  ['cf-nombre','cf-rfc','cf-notas'].forEach(i=>{document.getElementById(i).value='';});
  ['cf-tipo','cf-grupo','cf-resp'].forEach(i=>{document.getElementById(i).value='';});
  const ok=document.getElementById('cf-ok');ok.style.display='block';
  setTimeout(()=>ok.style.display='none',2000);
  renderClientesTabla();renderGrupoTabs();
}

function diasHabilesDesde(fechaStr,dias){
  const festivos=['01-01','02-05','03-21','05-01','09-16','11-20','12-25'];
  let d=new Date(fechaStr+'T12:00:00');
  let count=0;
  while(count<dias){
    d.setDate(d.getDate()+1);
    const dow=d.getDay();
    const mm=(d.getMonth()+1).toString().padStart(2,'0');
    const dd=d.getDate().toString().padStart(2,'0');
    const key=mm+'-'+dd;
    if(dow!==0&&dow!==6&&!festivos.includes(key))count++;
  }
  return d.toLocaleDateString('en-CA',{timeZone:'America/Tijuana'});
}

function calcPlazos(dev){
  if(!dev.fecha_inicio)return{};
  const fi=dev.fecha_inicio;
  const fp=dev.fecha_presentacion_sat||diasHabilesDesde(fi,10);
  return{
    presentacion:fp,
    limite_req1:diasHabilesDesde(fp,20),
    limite_resolucion:diasHabilesDesde(fp,40),
  };
}

function devStatusBadge(status){
  const s=DEV_STATUS[status]||{label:status,color:'#888',bg:'#f5f5f3'};

}

function fmtMXN(n){
  if(!n&&n!==0)return'—';
  return'$'+Number(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function diasRestantes(fechaStr){
  if(!fechaStr)return null;
  const hoy=new Date(todayKey()+'T12:00:00');
  const target=new Date(fechaStr+'T12:00:00');
  return Math.round((target-hoy)/(1000*60*60*24));
}

function sortDevoluciones(arr){
  const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return arr.slice().sort((a,b)=>{
    // Primero por cliente
    const nc=(a.cliente_nombre||'').toLowerCase();
    const nb=(b.cliente_nombre||'').toLowerCase();
    if(nc!==nb)return nc.localeCompare(nb,'es');
    // Luego por período (mes año)
    const pa=(a.periodo||'').toLowerCase().split(' ');
    const pb=(b.periodo||'').toLowerCase().split(' ');
    const ma=MESES.indexOf(pa[0]);const ya=parseInt(pa[1])||0;
    const mb=MESES.indexOf(pb[0]);const yb=parseInt(pb[1])||0;
    if(ya!==yb)return ya-yb;
    return ma-mb;
  });
}

  const ESTADOS_CERRADO=['devuelta','negada'];
  const listaFiltrada=devFiltroActual==='todos'?devCache:devCache.filter(d=>d.status===devFiltroActual);

              (d.monto_solicitado?'<span style="font-size:12px;color:#888">Solicitado: <strong>'+fmtMXN(d.monto_solicitado)+'</strong></span>':'')+
              (d.status==='devuelta'&&d.monto_devuelto?'<span style="font-size:12px;color:#5a8a1a">Devuelto: <strong>'+fmtMXN(d.monto_devuelto)+'</strong></span>':'')+
            '</div>'+
            '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">'+
              (plazos.presentacion&&!d.fecha_presentacion_sat?alertaDias(diasRestantes(plazos.presentacion),'Presentar'):'')+ 
              (d.fecha_presentacion_sat&&drp!==null?alertaDias(drp,'Resolución SAT'):'')+ 
            '</div>'+
          '</div>'+
          '<div style="text-align:right;flex-shrink:0">'+
            '<div style="font-size:11px;color:#888">Responsable</div>'+
            '<div style="font-size:12px;font-weight:500">'+escH(d.responsable||'—')+'</div>'+
            '<div style="font-size:11px;color:#888;margin-top:4px">Inicio: '+escH(d.fecha_inicio||'—')+'</div>'+
          '</div>'+
        '</div>'+
      '</div>';
    });
  }

  if(cerrados.length){
    html+='<div class="sec-label" style="margin-top:1rem;margin-bottom:8px">Concluidas / Negadas ('+cerrados.length+')</div>';
    cerrados.forEach(d=>{
      html+='<div class="card" style="margin-bottom:8px;opacity:.8;cursor:pointer" onclick="renderDetalleDevolucion(\''+d.id+'\')">'+
        '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">'+
          '<div>'+
            '<div style="font-size:13px;font-weight:600">'+escH(d.cliente_nombre||'—')+'</div>'+
            '<div style="font-size:11px;color:#888">'+escH(d.periodo)+'</div>'+
          '</div>'+
          '<div style="display:flex;align-items:center;gap:10px">'+
            devStatusBadge(d.status)+
            '<span style="font-size:12px;color:#888">'+fmtMXN(d.monto_devuelto||d.monto_solicitado)+'</span>'+
          '</div>'+
        '</div>'+
      '</div>';
    });
  }

  el.innerHTML=html;
}

async function saveDevolucion(){
  const cliSel=document.getElementById('df-cliente');
  const cliente_id=cliSel.value||null;
  const cliente_nombre=document.getElementById('df-cli-nombre').value||cliSel.options[cliSel.selectedIndex]?.dataset?.nombre||'';
  const mes=document.getElementById('df-mes').value;
  const anio=document.getElementById('df-anio').value;
  const periodo=(mes&&anio)?mes+' '+anio:'';
  const fecha_inicio=document.getElementById('df-inicio').value;
  const responsable=document.getElementById('df-resp').value;
  const monto_solicitado=parseFloat(document.getElementById('df-monto-sol').value)||null;
  const monto_devuelto=parseFloat(document.getElementById('df-monto-dev').value)||null;
  const status=document.getElementById('df-status').value;
  const folio_fed=document.getElementById('df-folio').value.trim()||null;
  const fecha_presentacion_sat=document.getElementById('df-fecpres').value||null;
  const fecha_deposito=document.getElementById('df-fecdep').value||null;
  const correos_raw=document.getElementById('df-correos').value;
  const correos_cliente=correos_raw.split(',').map(s=>s.trim()).filter(Boolean);
  const motivo_rechazo=document.getElementById('df-rechazo').value.trim()||null;
  const notas=document.getElementById('df-notas').value.trim()||null;
  const editing=document.getElementById('df-editing').value;
  const err=document.getElementById('df-err');err.style.display='none';
  if(!periodo||!fecha_inicio){err.textContent='Período y fecha de inicio son obligatorios.';err.style.display='block';return;}

  const payload={cliente_id,cliente_nombre,periodo,fecha_inicio,responsable,monto_solicitado,monto_devuelto,status,folio_fed,fecha_presentacion_sat,fecha_deposito,correos_cliente,motivo_rechazo,notas,updated_at:nowISO()};

  if(editing){
    await sbPatch('devoluciones_iva','?id=eq.'+editing,payload);
    // Si es nueva, cargar checklist de requisitos SAT
  } else {
    const res=await sbPost('devoluciones_iva',payload,'return=representation');
    const data=await res.json();
    const newId=(Array.isArray(data)?data[0]:data)?.id;
    if(newId){
      // Cargar checklist SAT por defecto
      const reqs=DEV_REQUISITOS_SAT.map(r=>({devolucion_id:newId,requisito:r,completado:false}));
      for(const r of reqs) await sbPost('dev_requisitos',r,'return=minimal');
    }
  }
  await loadDevoluciones();
  renderDevoluciones();
}

function handleCommentKey(event,devId){
  if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();agregarComentario(devId);}
}

async function agregarComentario(devId){
  const input=document.getElementById('dev-comentario-input');
  const mensaje=input?.value.trim();
  if(!mensaje)return;
  input.value='';
  input.disabled=true;
  await sbPost('dev_comentarios',{
    devolucion_id:devId,
    email:session.email,
    nombre:session.name||usersCache[session.email]?.name||session.email,
    mensaje
  },'return=minimal');
  input.disabled=false;
  // Recargar solo los comentarios sin refrescar toda la pantalla
  const nuevos=await sbGet('dev_comentarios','?devolucion_id=eq.'+devId+'&select=*&order=created_at.asc');
  const lista=document.getElementById('dev-comentarios-list');
  if(lista){
    const html=(nuevos||[]).map(c=>{
      const esPropio=c.email===session.email;
      const initials=c.nombre.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
      const u=usersCache[c.email];
      const avClass=u?'av-'+u.av.replace('av-',''):'av-x';
      const fecha=new Date(c.created_at).toLocaleString('es-MX',{timeZone:'America/Tijuana',dateStyle:'short',timeStyle:'short'});
      return '<div style="display:flex;gap:10px;margin-bottom:12px;'+(esPropio?'flex-direction:row-reverse':'')+'">' +
        '<div class="avatar '+avClass+'" style="width:32px;height:32px;font-size:11px;flex-shrink:0">'+initials+'</div>'+
        '<div style="max-width:75%">'+
          '<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;'+(esPropio?'justify-content:flex-end':'')+'">'+
            '<span style="font-size:11px;font-weight:600;color:#1a1a1a">'+escH(c.nombre)+'</span>'+
            '<span style="font-size:10px;color:#bbb">'+fecha+'</span>'+
          '</div>'+
          '<div style="background:'+(esPropio?'#EEEDFE':'#f5f5f3')+';border-radius:'+(esPropio?'12px 2px 12px 12px':'2px 12px 12px 12px')+';padding:10px 12px;font-size:13px;color:#1a1a1a;line-height:1.5">'+
            escH(c.mensaje)+
          '</div>'+
        '</div>'+
      '</div>';
    }).join('');
    lista.innerHTML=html||'<div style="font-size:13px;color:#bbb;text-align:center;padding:16px 0">Sin comentarios aún.</div>';

    // Actualizar contador
    const sec=lista.previousElementSibling;
    if(sec) sec.textContent='Comentarios ('+(nuevos||[]).length+')';
  }
  input.focus();
}

async function guardarEdicionReq(puntoId,devId){
  const punto=document.getElementById('eq-punto')?.value.trim();
  const fecha_requerimiento=document.getElementById('eq-freg')?.value||null;
  const fecha_notificacion=document.getElementById('eq-fnot')?.value||null;
  const fecha_atendido=document.getElementById('eq-fat')?.value||null;
  const atendido=document.getElementById('eq-atendido')?.value==='true';
  if(!punto){alert('El punto no puede estar vacío.');return;}
  document.getElementById('modal-edit-req')?.remove();
  await sbPatch('dev_requerimientos','?id=eq.'+puntoId,{punto,fecha_requerimiento,fecha_notificacion,fecha_atendido,atendido});
  renderDetalleDevolucion(devId);
}

async function registrarNotificacion(puntoId,devId){
  const fecha=prompt('Fecha de notificación (YYYY-MM-DD):',todayKey());
  if(!fecha||!fecha.match(/^\d{4}-\d{2}-\d{2}$/)){alert('Fecha inválida.');return;}
  await sbPatch('dev_requerimientos','?id=eq.'+puntoId,{fecha_notificacion:fecha});
  renderDetalleDevolucion(devId);
}

async function deleteDevolucion(id){
  const dev=devCache.find(d=>d.id===id);
  if(!confirm('¿Eliminar la solicitud de '+( dev?.cliente_nombre||'este cliente')+' — '+(dev?.periodo||'')+' ? Esta acción no se puede deshacer.'))return;
  await sbDelete('dev_requisitos','?devolucion_id=eq.'+id);
  await sbDelete('dev_requerimientos','?devolucion_id=eq.'+id);
  await sbDelete('devoluciones_iva','?id=eq.'+id);
  await loadDevoluciones();
  renderDevoluciones();
}

async function toggleRequisito(reqId,actual,devId){
  const nuevo=!actual;
  const patch={completado:nuevo};
  if(nuevo)patch.fecha_completado=todayKey();
  else patch.fecha_completado=null;
  await sbPatch('dev_requisitos','?id=eq.'+reqId,patch);
  renderDetalleDevolucion(devId);
}

async function togglePuntoReq(pId,actual,devId){
  const nuevo=!actual;
  const patch={atendido:nuevo};
  if(nuevo)patch.fecha_atendido=todayKey();
  else patch.fecha_atendido=null;
  await sbPatch('dev_requerimientos','?id=eq.'+pId,patch);
  renderDetalleDevolucion(devId);
}

async function activarRequerimiento(devId){
  await sbPatch('devoluciones_iva','?id=eq.'+devId,{status:'requerimiento_sat',updated_at:nowISO()});
  const idx=devCache.findIndex(d=>d.id===devId);
  if(idx>=0)devCache[idx].status='requerimiento_sat';
  renderDetalleDevolucion(devId);
}

async function agregarPuntoRequerimiento(devId,numReq){
  const punto=prompt('Describe el punto requerido por el SAT:');
  if(!punto||!punto.trim())return;
  // Verificar que no se repita
  const existing=await sbGet('dev_requerimientos','?devolucion_id=eq.'+devId+'&select=punto');
  const puntos=(existing||[]).map(p=>p.punto.toLowerCase().trim());
  if(puntos.includes(punto.trim().toLowerCase())){
    alert('Este punto ya fue registrado anteriormente.');return;
  }
  await sbPost('dev_requerimientos',{devolucion_id:devId,numero_requerimiento:numReq,punto:punto.trim(),atendido:false,fecha_requerimiento:todayKey(),subido_por:session.email,subido_por_nombre:session.name||usersCache[session.email]?.name||session.email},'return=minimal');
  renderDetalleDevolucion(devId);
}

}

function pfSetCliente(sel){
  const opt=sel.options[sel.selectedIndex];
  const nombre=opt?.dataset?.nombre||opt?.text||'';
  const el=document.getElementById('pf-cli-nombre');
  if(el) el.value=nombre;
}

async function saveProyeccion(){
  const cliSel=document.getElementById('pf-cliente');
  const cliente_id=cliSel.value||null;
  const cliente_nombre=document.getElementById('pf-cli-nombre').value||(cliSel.selectedIndex>0?cliSel.options[cliSel.selectedIndex]?.dataset?.nombre||cliSel.options[cliSel.selectedIndex]?.text||'':'');
  const ejercicio=parseInt(document.getElementById('pf-ejercicio').value);
  const tasa_isr=parseFloat(document.getElementById('pf-tasa').value)||30;
  const notas=document.getElementById('pf-notas').value.trim()||null;
  const editing=document.getElementById('pf-editing').value;
  const err=document.getElementById('pf-err');err.style.display='none';
  if(!cliente_nombre||!ejercicio){err.textContent='Cliente y ejercicio son obligatorios.';err.style.display='block';return;}
  const payload={cliente_id,cliente_nombre,ejercicio,tasa_isr,notas,updated_at:nowISO()};
  let newId=editing;
  if(editing){
    await sbPatch('pf_proyecciones','?id=eq.'+editing,payload);
  } else {
    const res=await sbPost('pf_proyecciones',payload,'return=representation');
    const data=await res.json();
    newId=(Array.isArray(data)?data[0]:data)?.id;
    // Los ajustes los agrega el usuario manualmente
  }
  const updated=await sbGet('pf_proyecciones','?select=*&order=ejercicio.desc,cliente_nombre.asc');
  pfCache=updated||[];
  if(newId) renderDetalleProyeccion(newId);
  else renderProyeccion();
}

async function agregarAjusteFiscal(proyId,tipoDefault){

  const sugerencias=tipoDefault==='suma'?
    ['Ingresos acumulables no contabilizados (LISR Art. 16)','Ajuste anual por inflación acumulable (LISR Art. 44-46)','Utilidad por enajenación de activos (LISR Art. 18)','Ganancia cambiaria (LISR Art. 20)','Otros ingresos acumulables']:
    ['Depreciación fiscal adicional (LISR Art. 31-38)','Ajuste anual por inflación deducible (LISR Art. 44-46)','PTU pagada deducible (LISR Art. 25 Fr. III)','Pérdida por enajenación de activos (LISR Art. 25 Fr. IV)','Deducción inmediata (LISR Art. 220)','Gastos no deducibles a revertir','Otras deducciones autorizadas'];
  const sugerOpts='<option value="">Elige sugerencia o escribe abajo...</option>'+sugerencias.map(s=>'<option value="'+escH(s)+'">'+escH(s)+'</option>').join('');
  overlay.innerHTML='<div class="modal-box">'+
    '<div class="modal-title">'+(tipoDefault==='suma'?'Agregar ingreso acumulable':'Agregar deducción adicional')+'</div>'+

      '<input id="aj-concepto" type="text" placeholder="Escribe o edita el concepto..." style="width:100%"></div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">'+
      '<div><div style="font-size:11px;color:#888;margin-bottom:3px">Tipo</div>'+
        '<select id="aj-tipo" style="width:100%">'+
          '<option value="suma"'+(tipoDefault==='suma'?' selected':'')+'>Acumulable (suma)</option>'+
          '<option value="resta"'+(tipoDefault==='resta'?' selected':'')+'>Deducible (resta)</option>'+
        '</select></div>'+
      '<div><div style="font-size:11px;color:#888;margin-bottom:3px">Importe</div>'+
        '<input id="aj-importe" type="number" placeholder="0.00"></div>'+
      '<div><div style="font-size:11px;color:#888;margin-bottom:3px">Referencia legal</div>'+
        '<input id="aj-ref" type="text" placeholder="LISR Art. ..."></div>'+
    '</div>'+
    '<div style="margin-bottom:12px"><div style="font-size:11px;color:#888;margin-bottom:3px">Notas / Identificación</div>'+
      '<input id="aj-notas" type="text" placeholder="Notas adicionales"></div>'+
    '<input type="hidden" id="aj-proy-id" value="'+proyId+'">'+
    '<div style="display:flex;gap:8px">'+
      '<button class="btn btn-full" onclick="document.getElementById(\'modal-ajuste\').remove()" style="flex:1;margin-top:0">Cancelar</button>'+
      '<button class="btn btn-primary btn-full" onclick="guardarAjuste()" style="flex:1;margin-top:0">Guardar</button>'+
    '</div>'+
  '</div>';
  document.body.appendChild(overlay);
}

function pfFillSuger(sel){
  const val=sel.value;if(!val)return;
  const inp=document.getElementById('aj-concepto');
  if(inp){inp.value=val;sel.value='';}
}

async function guardarAjuste(){
  const concepto=document.getElementById('aj-concepto')?.value.trim();
  const tipo=document.getElementById('aj-tipo').value;
  const importe=parseFloat(document.getElementById('aj-importe').value)||0;
  const referencia_legal=document.getElementById('aj-ref').value.trim()||null;

async function guardarEscenarioProyeccion(id){
  const proy=pfCache.find(p=>p.id===id);if(!proy)return;
  const [meses,ajustes]=await Promise.all([
    sbGet('pf_meses','?proyeccion_id=eq.'+id+'&select=*&order=mes.asc'),
    sbGet('pf_ajustes','?proyeccion_id=eq.'+id+'&select=*')
  ]);
  const mesesData=meses||[];
  const mesesConDatos=mesesData.filter(m=>m.ingresos!==null);
  const nMeses=mesesConDatos.length;
  if(!nMeses){alert('No hay datos capturados para guardar.');return;}
  const avg=campo=>nMeses?mesesConDatos.reduce((s,m)=>s+(parseFloat(m[campo])||0),0)/nMeses:0;
  const proyectados=[];
  for(let m=1;m<=12;m++){
    const real=mesesData.find(md=>md.mes===m);
    if(real&&real.ingresos!==null) proyectados.push({...real,real:true});
    else{const ing=avg('ingresos'),cv=avg('costo_ventas'),go=avg('gastos_operacion'),oi=avg('otros_ingresos'),og=avg('otros_gastos'),pp=avg('pago_provisional');
      proyectados.push({mes:m,real:false,ingresos:ing,costo_ventas:cv,gastos_operacion:go,otros_ingresos:oi,otros_gastos:og,pago_provisional:pp,utilidad_neta_contable:ing-cv-go+oi-og});}
  }
  const totalIngresos=proyectados.reduce((s,m)=>s+(parseFloat(m.ingresos)||0),0);
  const totalCosto=proyectados.reduce((s,m)=>s+(parseFloat(m.costo_ventas)||0),0);
  const totalGastosOp=proyectados.reduce((s,m)=>s+(parseFloat(m.gastos_operacion)||0),0);
  const totalOtrosIng=proyectados.reduce((s,m)=>s+(parseFloat(m.otros_ingresos)||0),0);
  const totalOtrosGas=proyectados.reduce((s,m)=>s+(parseFloat(m.otros_gastos)||0),0);
  const utilidadContable=totalIngresos-totalCosto-totalGastosOp+totalOtrosIng-totalOtrosGas;
  const ajustesData=ajustes||[];
  const totalSumas=ajustesData.filter(a=>a.tipo==='suma').reduce((s,a)=>s+(parseFloat(a.importe)||0),0);
  const totalRestas=ajustesData.filter(a=>a.tipo==='resta').reduce((s,a)=>s+(parseFloat(a.importe)||0),0);
  const utilidadFiscal=utilidadContable+totalSumas-totalRestas;
  const isrEstimado=utilidadFiscal>0?utilidadFiscal*(proy.tasa_isr/100):0;
  const totalPP=proyectados.reduce((s,m)=>s+(parseFloat(m.pago_provisional)||0),0);
  const isrACargo=Math.max(0,isrEstimado-totalPP);
  const saldoFavor=Math.max(0,totalPP-isrEstimado);
  const cu=totalIngresos>0?(utilidadFiscal/totalIngresos*100):0;
  const margenBruto=totalIngresos>0?((totalIngresos-totalCosto)/totalIngresos*100):0;
  const margenNeto=totalIngresos>0?(utilidadContable/totalIngresos*100):0;
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id='modal-escenario-save';
  overlay.innerHTML='<div class="modal-box">'+
    '<div class="modal-title">Guardar escenario de proyección</div>'+
    '<div class="modal-sub">Estado actual al '+todayKey()+'</div>'+
    '<div style="background:#f5f5f3;border-radius:8px;padding:12px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px">'+
      '<div style="font-size:11px"><span style="color:#888">Meses reales:</span> <strong>'+nMeses+'/12</strong></div>'+
      '<div style="font-size:11px"><span style="color:#888">Utilidad fiscal:</span> <strong>'+fmtMXN(utilidadFiscal)+'</strong></div>'+
      '<div style="font-size:11px"><span style="color:#888">ISR estimado:</span> <strong>'+fmtMXN(isrEstimado)+'</strong></div>'+
      '<div style="font-size:11px"><span style="color:#888">ISR a cargo:</span> <strong>'+fmtMXN(isrACargo)+'</strong></div>'+
      '<div style="font-size:11px"><span style="color:#888">CU:</span> <strong>'+cu.toFixed(2)+'%</strong></div>'+
    '</div>'+
    '<div style="margin-bottom:12px"><div style="font-size:12px;color:#888;margin-bottom:4px">Notas del escenario (opcional)</div>'+
      '<textarea id="esc-notas" rows="2" placeholder="Ej: Proyección al mes de marzo..." style="width:100%;padding:8px;border:1px solid #e0e0db;border-radius:8px;font-size:13px;font-family:inherit;resize:none;box-sizing:border-box"></textarea></div>'+
    '<div style="display:flex;gap:8px">'+
      '<button class="btn btn-full" onclick="document.getElementById(\'modal-escenario-save\').remove()" style="flex:1;margin-top:0">Cancelar</button>'+
      '<button class="btn btn-primary btn-full" onclick="confirmarEscenario(\''+id+'\','+totalIngresos+','+totalCosto+','+totalGastosOp+','+utilidadContable+','+totalSumas+','+totalRestas+','+utilidadFiscal+','+isrEstimado+','+totalPP+','+isrACargo+','+cu+','+margenBruto+','+margenNeto+','+nMeses+')" style="flex:1;margin-top:0">💾 Guardar</button>'+
    '</div>'+
  '</div>';
  document.body.appendChild(overlay);
}

async function msImportarMod4(mes){
  const proyId=document.getElementById('ms-proy-id').value;
  const msg=document.getElementById('ms-status-msg');
  msg.style.display='block';
  msg.style.background='#E6F1FB';
  msg.style.color='#3B4BC8';
  msg.innerHTML='⏳ Buscando balanza en Módulo 4...';
  try{
    // Obtener proyección para saber cliente y ejercicio
    const proy=(await sbGet('pf_proyecciones','?id=eq.'+encodeURIComponent(proyId)+'&select=cliente_id,ejercicio'))||[];
    if(!proy.length) throw new Error('Proyección no encontrada');
    const {cliente_id,ejercicio}=proy[0];
    // Buscar balanza del mes en client_documents
    const docs=await sbGet('client_documents',
      '?cliente_id=eq.'+encodeURIComponent(String(cliente_id))+
      '&tipo=eq.balanza&mes=eq.'+mes+
      '&ejercicio=eq.'+ejercicio+
      '&select=cifras,nombre_archivo,status');
    if(!docs||!docs.length) throw new Error('No hay balanza cargada para '+MESES_NOMBRES[mes-1]+' '+ejercicio+' en Módulo 4. Súbela primero.');
    const doc=docs[0];
    if(!doc.cifras||!Object.keys(doc.cifras).length) throw new Error('La balanza de '+MESES_NOMBRES[mes-1]+' no tiene cifras extraídas. Extráelas primero en Módulo 4.');
    // Mapear cifras NIF → campos del ER
    const c=doc.cifras;
    const det=c.detalle||{};
    // Ingresos = resultado_acreedor (total ingresos de la balanza)
    const ingresos=c.resultado_acreedor||det.ing_ventas||0;
    // Costo de ventas
    const costoVentas=det.gasto_costo||0;
    // Gastos financieros
    const gastosFinancieros=det.gasto_financiero||0;
    // PTU/ISR = resultado deudor específico
    const isr=det.gasto_isr||0;
    const ptu=det.gasto_ptu||0;
    // Gastos de operación = resultado_deudor - costo_ventas - gastos_financieros - isr - ptu
    const gastosOp=Math.max(0,(c.resultado_deudor||0)-costoVentas-gastosFinancieros-isr-ptu);
    // Activo fijo bruto = suma de todos los activo_fijo_* en detalle
    const activoFijo=Object.entries(det).filter(([k])=>k.startsWith('activo_fijo')).reduce((s,[,v])=>s+v,0);
    // Depreciación acumulada
    const depreciacion=det.activo_depreciacion||0;
    // Mostrar panel y rellenar campos
    document.getElementById('panel-cifras').style.display='block';
    document.getElementById('ms-save-row').style.display='flex';
    document.getElementById('ms-cancel-row').style.display='none';
    document.getElementById('ms-ing').value=ingresos.toFixed(2);
    document.getElementById('ms-cv').value=costoVentas.toFixed(2);
    document.getElementById('ms-go').value=gastosOp.toFixed(2);
    document.getElementById('ms-oi').value='0.00';
    document.getElementById('ms-og').value=gastosFinancieros.toFixed(2);
    document.getElementById('ms-afb').value=activoFijo.toFixed(2);
    document.getElementById('ms-dac').value=Math.abs(depreciacion).toFixed(2);
    document.getElementById('ms-pp').value='0.00';
    msg.style.background='#EAF3DE';
    msg.style.color='#3B6D11';
    msg.innerHTML='✅ <strong>Cifras importadas del Módulo 4</strong> — '+doc.nombre_archivo+
      '<br><span style="font-size:11px;color:#555">Revisa y ajusta si es necesario antes de guardar.</span>';
  }catch(e){
    msg.style.background='#FCEBEB';
    msg.style.color='#A32D2D';
    msg.innerHTML='⚠️ '+e.message;
  }
}

async function handlePDFUpload(input,tipo){
  const file=input.files[0];if(!file)return;
  const proyId=document.getElementById('ms-proy-id').value;
  const mes=document.getElementById('ms-mes').value;
  const statusEl=document.getElementById('ms-'+tipo+'-status');
  statusEl.innerHTML='<span style="color:#3B4BC8">Subiendo...</span>';
  try{
    const path=proyId+'/mes-'+mes+'/'+tipo+'-'+Date.now()+'.pdf';
    const res=await fetch(SB_URL+'/storage/v1/object/financieros/'+path,{
      method:'POST',headers:{'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/pdf','x-upsert':'true'},body:file
    });
    if(!res.ok) throw new Error('Error '+res.status);
    const url=SB_URL+'/storage/v1/object/public/financieros/'+path;
    document.getElementById('ms-'+tipo+'-url').value=url;
    document.getElementById('ms-'+tipo+'-nombre').value=file.name;
    msUpdateStatus(tipo,file.name);
  }catch(e){statusEl.innerHTML='<span style="color:#dc2626">Error: '+e.message+'</span>';}
}

async function extraerCifrasPDF(tipo){
  const url=document.getElementById('ms-'+tipo+'-url').value;
  if(!url)return;
  const statusEl=document.getElementById('ms-extract-status');
  statusEl.style.display='block';statusEl.style.background='#EEEDFE';statusEl.style.color='#3B4BC8';
  statusEl.textContent='Analizando PDF con Claude...';
  try{
    const res=await fetch(url);
    const blob=await res.blob();
    const base64=await new Promise(resolve=>{
      const reader=new FileReader();
      reader.onloadend=()=>resolve(reader.result.split(',')[1]);
      reader.readAsDataURL(blob);
    });
    const prompt=tipo==='er'?
      'Del Estado de Resultados extrae las cifras en MXN. Responde SOLO con JSON sin markdown: {"ingresos":0,"costo_ventas":0,"gastos_operacion":0,"otros_ingresos":0,"otros_gastos":0}':
      tipo==='bg'?
      'Del Balance General extrae el activo fijo en MXN. Responde SOLO con JSON sin markdown: {"activo_fijo_bruto":0,"depreciacion_acumulada":0}':
      'De la Balanza de Comprobacion extrae en MXN. Responde SOLO con JSON sin markdown: {"ingresos":0,"costo_ventas":0,"gastos_operacion":0,"otros_ingresos":0,"otros_gastos":0,"activo_fijo_bruto":0,"depreciacion_acumulada":0}';
    const ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzY3RnemJxYWR1Y2doaXZhbWZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0ODk2MDUsImV4cCI6MjA5MDA2NTYwNX0.w2yWu_hwSW69rnGsiD6FCqHe7GaNuLD_lU3WdgbidKI';
    const apiRes=await fetch(SB_URL+'/functions/v1/claude-analysis',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+ANON_KEY},
      body:JSON.stringify({prompt,pdf_base64:base64,pdf_media_type:'application/pdf'})
    });
    const data=await apiRes.json();
    const raw=(data.text||'').replace(/```json|```/g,'').trim();
    const cifras=JSON.parse(raw);
    if(cifras.ingresos!==undefined){
      const flds=[['ms-ing','ingresos'],['ms-cv','costo_ventas'],['ms-go','gastos_operacion'],['ms-oi','otros_ingresos'],['ms-og','otros_gastos']];
      flds.forEach(([id,key])=>{const el=document.getElementById(id);if(el) el.value=cifras[key]||0;});
    }
    if(cifras.activo_fijo_bruto!==undefined){
      if(document.getElementById('ms-afb')) document.getElementById('ms-afb').value=cifras.activo_fijo_bruto||0;
      if(document.getElementById('ms-dac')) document.getElementById('ms-dac').value=cifras.depreciacion_acumulada||0;
    }
    statusEl.style.background='#f0f7d4';statusEl.style.color='#5a8a1a';
    statusEl.textContent='Cifras extraidas. Revisa y ajusta si es necesario.';
    switchMesTab('cifras');
  }catch(e){
    statusEl.style.background='#fef2f2';statusEl.style.color='#dc2626';
    statusEl.textContent='Error: '+e.message+'. Captura manualmente.';
  }
}

async function mostrarAvisoBienvenida(){
  const today=todayKey();
  const email=session.email;

    sbGet('tareas','?email=eq.'+encodeURIComponent(email)+'&status=in.(pendiente,standby)&select=*&order=created_at.asc'),
    sbGet('sesiones','?email=eq.'+encodeURIComponent(email)+'&logout_at=not.is.null&order=login_at.desc&limit=2&select=*')
  ]);
  const sesAnterior=(sesiones||[])[1]||(sesiones||[])[0]||null;
  const fechaAnterior=(()=>{
    if(!sesAnterior)return null;
    const d=new Date(sesAnterior.login_at);
    const fecha=d.toLocaleDateString('es-MX',{timeZone:'America/Tijuana',weekday:'short',day:'numeric',month:'short'});
    const hora=d.toLocaleTimeString('es-MX',{timeZone:'America/Tijuana',hour:'2-digit',minute:'2-digit'});
    return fecha+' · '+hora;
  })();
  const durAnterior=sesAnterior&&sesAnterior.duracion_min?(sesAnterior.duracion_min>=60?Math.floor(sesAnterior.duracion_min/60)+'h '+(sesAnterior.duracion_min%60)+'min':sesAnterior.duracion_min+' min'):null;

    if(el) el.textContent='Se cierra en '+secs+' seg';
    if(secs<=0){clearInterval(countdown);cerrarAviso();}
  },1000);
  overlay._countdown=countdown;
}

function cerrarAviso(){
  const overlay=document.getElementById('aviso-bienvenida');
  if(overlay){
    if(overlay._countdown) clearInterval(overlay._countdown);
    overlay.remove();
  }
}

  // Fetch con timeout para AC

  // Cargar tareas de ActiveCollab para un usuario en el período
  async function cargarTareasAC(usuario,d0,d1){
    const proyIds=AC_PROYECTOS_POR_USUARIO[usuario.acId]||[];
    if(!proyIds.length) return {abiertas:[],completadas:[]};
    const d0ts=new Date(d0+'T00:00:00').getTime()/1000;
    const d1ts=new Date(d1+'T23:59:59').getTime()/1000;
    const abiertas=[];
    const completadas=[];
    // Obtener tareas abiertas del usuario
    try{
      const resAb=await fetchAC(AC_URL+'/api/v1/users/'+usuario.acId+'/tasks?page=1&per_page=200');
      if(resAb.ok){
        const dataAb=await resAb.json();
        const tasks=Array.isArray(dataAb)?dataAb:(dataAb.tasks||dataAb.data||[]);
        tasks.forEach(t=>{
          const creado=t.created_on||0;
          if(creado>=d0ts&&creado<=d1ts){
            abiertas.push({
              id:'ac-'+t.id,
              descripcion:t.name,
              client_name:t.project_name||('Proyecto '+t.project_id),
              status:'pendiente',
              fecha_creacion:new Date(creado*1000).toISOString().slice(0,10),
              fecha_conclusion:null,
              fuente:'activecollab',
              vence:t.due_on?new Date(t.due_on*1000).toISOString().slice(0,10):null
            });
          }
        });
      }
    }catch(e){console.warn('AC abiertas error:',e);}

    // Obtener tareas completadas por proyecto
    for(const proyId of proyIds){
      try{
        const resComp=await fetchAC(AC_URL+'/api/v1/projects/'+proyId+'/tasks?completed=1&page=1&per_page=100');
        if(resComp.ok){
          const dataComp=await resComp.json();
          const tasks=Array.isArray(dataComp)?dataComp:(dataComp.tasks||dataComp.data||[]);
          tasks.forEach(t=>{
            if(t.assignee_id===usuario.acId||t.completed_by_id===usuario.acId){
              const compTs=t.completed_on||0;
              if(compTs>=d0ts&&compTs<=d1ts){
                completadas.push({
                  id:'ac-'+t.id,
                  descripcion:t.name,
                  client_name:t.project_name||('Proy '+proyId),
                  status:'concluida',
                  fecha_creacion:t.created_on?new Date(t.created_on*1000).toISOString().slice(0,10):null,
                  fecha_conclusion:new Date(compTs*1000).toISOString().slice(0,10),
                  fuente:'activecollab',
                  vence:null
                });
              }
            }
          });
        }
      }catch(e){console.warn('AC completadas error proyecto '+proyId+':',e);}
    }
    return {abiertas,completadas};
  }

    if(status) status.textContent=' Conectando con Active Collab...';

  async function renderGconAC(sel,d0,d1){
    // Igual que renderG pero usando _acDataCache
    const ov=document.getElementById('_msstor');
    if(!ov) return;

    const usuarios=USERS.filter(u=>sel.includes(u.name));
    const emails=usuarios.map(u=>u.email);
    const todasTareas=await cargarTareas(emails,d0,d1);
    const todayStr=todayKey();

    const porUsuarioBase=usuarios.map(u=>{
      const uT=todasTareas.filter(t=>t.email===u.email);
      const registradas=uT.filter(t=>t.fecha_creacion>=d0&&t.fecha_creacion<=d1);
      const concluidas=uT.filter(t=>t.fecha_conclusion&&t.fecha_conclusion.slice(0,10)>=d0&&t.fecha_conclusion.slice(0,10)<=d1);
      const vencidas=uT.filter(t=>t.status==='pendiente'&&t.fecha_creacion&&t.fecha_creacion<todayStr);
      return {...u,registradas,concluidas,vencidas,todas:uT};
    });

    const porUsuario=porUsuarioBase.map(u=>{
      const ac=_acDataCache[u.acId]||{abiertas:[],completadas:[]};
      const taxiaDescs=new Set([...u.registradas,...u.concluidas].map(t=>t.descripcion?.toLowerCase()));
      const acAbiertasNuevas=ac.abiertas.filter(t=>!taxiaDescs.has(t.descripcion?.toLowerCase()));
      const acConclNuevas=ac.completadas.filter(t=>!taxiaDescs.has(t.descripcion?.toLowerCase()));
      return {
        ...u,
        registradas:[...u.registradas,...acAbiertasNuevas],
        concluidas:[...u.concluidas,...acConclNuevas],
        vencidas:[...u.vencidas,...ac.abiertas.filter(t=>t.vence&&t.vence<todayStr)],
        ac_abiertas:ac.abiertas.length,
        ac_completadas:ac.completadas.length
      };

    const cuerpo=document.getElementById('_msspanel');
    if(!cuerpo) return;

    // Actualizar los datos en el panel existente usando renderG completo
    renderG(sel,d0,d1,porUsuario);
  }

  ov.id='_msstor';

  document.body.appendChild(btn);
  document.body.appendChild(ov);
}

      items.map((n,i)=>'<div style="display:flex;gap:10px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid #f5f5f3">'+
        '<div style="width:18px;height:18px;border-radius:50%;background:'+color+';color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px">'+(i+1)+'</div>'+
        '<div style="font-size:11px;color:#444;line-height:1.6">'+n+'</div>'+
      '</div>').join('')+
    '</div>';
  }

  const notasBase=['La proyección se basa en '+nMeses+' mes'+(nMeses!==1?'es':'')+(nMeses<12?' real'+(nMeses!==1?'es':'')+' y '+(12-nMeses)+' meses proyectados por promedio.':' reales.')];
  if(nMeses<6) notasBase.push('Con solo '+nMeses+' mes'+(nMeses!==1?'es':'')+' real'+(nMeses!==1?'es':'')+', la proyección tiene margen de variabilidad elevado.');

  const notasRazones=[];
  notasRazones.push('Margen bruto: '+margenBruto.toFixed(2)+'% — '+(margenBruto<20?'Bajo. Revisar estructura de costos.':margenBruto<40?'Aceptable, con oportunidad de mejora.':'Saludable.'));
  notasRazones.push('Margen de operación: '+margenOperacion.toFixed(2)+'% — '+(margenOperacion<10?'Bajo. Gastos operativos absorben utilidad bruta.':margenOperacion<20?'Moderado, optimizar gastos.':'Robusto.'));
  notasRazones.push('Costo de ventas / Ingresos: '+pesoCosto.toFixed(2)+'% — '+(pesoCosto>70?'Elevado. Revisar proveedores y procesos.':pesoCosto>50?'Manejable, vigilar incrementos.':'Bien controlado.'));
  notasRazones.push('Gastos operativos / Ingresos: '+rotacionGastos.toFixed(2)+'% — '+(rotacionGastos>30?'Elevado. Analizar gastos administrativos.':rotacionGastos>20?'Moderado.':'Bien alineado.'));

  const notasFiscales=[];
  if(utilidadFiscal<0) notasFiscales.push('Pérdida fiscal estimada de '+fmtMXN(Math.abs(utilidadFiscal))+'. Evaluar aplicación conforme Art. 57 LISR.');

  notasFiscales.push('CU determinado: '+cuPDF.toFixed(2)+'%. Aplicable para pagos provisionales '+( proy.ejercicio+1)+' conforme Art. 14 LISR.');

  const notasHTML=seccionNotas('I. Bases y alcance','#888',notasBase)+seccionNotas('II. Razones financieras','#3B4BC8',notasRazones)+seccionNotas('III. Consideraciones fiscales','#8DC63F',notasFiscales);

    return '<div class="section"><div class="section-title">Historial fiscal de cierres anteriores — '+escH(proy.cliente_nombre)+'</div>'+

  })();

  const win=window.open('','_blank');
  win.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">

/* ===== HISTORIAL DE CIERRE FISCAL ===== */
let cierresCache=[];

async function renderCierres(){
  app.innerHTML=renderTopNav('proyeccion')+`
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px">
    <div style="display:flex;gap:4px;border-bottom:0.5px solid #e5e5e0;padding-bottom:0;margin-bottom:0">
      <button onclick="renderProyeccion()" style="padding:8px 16px;font-size:13px;border:none;background:none;cursor:pointer;color:#888;border-bottom:2px solid transparent;margin-bottom:-1px">Proyecciones</button>
      <button onclick="renderCierres()" style="padding:8px 16px;font-size:13px;border:none;background:none;cursor:pointer;color:#3B4BC8;border-bottom:2px solid #3B4BC8;font-weight:600;margin-bottom:-1px">Historial de cierre</button>
    </div>
    <button class="btn btn-primary btn-sm" onclick="renderNuevoCierre()">+ Nuevo cierre</button>
  </div>
  <div class="loading" id="cfl"><span class="spinner"></span>Cargando...</div>
  <div id="cf-body"></div>`;
  const data=await sbGet('pf_cierres','?select=*&order=ejercicio.desc,cliente_nombre.asc');
  cierresCache=data||[];
  document.getElementById('cfl').style.display='none';
  renderCierresList();
}

function renderCierresList(){
  const el=document.getElementById('cf-body');if(!el)return;
  if(!cierresCache.length){
    el.innerHTML='<div class="card"><div style="font-size:14px;color:#888;text-align:center;padding:1rem">Sin cierres registrados. Crea el primero con "+ Nuevo cierre".</div></div>';
    return;
  }
  const porCliente={};
  cierresCache.forEach(c=>{if(!porCliente[c.cliente_nombre])porCliente[c.cliente_nombre]=[];porCliente[c.cliente_nombre].push(c);});
  let html='';
  Object.entries(porCliente).sort((a,b)=>a[0].localeCompare(b[0],'es')).forEach(([cli,cierres])=>{
    html+='<div style="font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">'+escH(cli)+'</div>';
    html+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:1rem">';
    cierres.sort((a,b)=>b.ejercicio-a.ejercicio).forEach(c=>{
      const tieneData=c.ingresos_acumulables!==null;
      html+='<div style="background:var(--color-background-secondary);border-radius:8px;padding:12px;cursor:pointer;border:0.5px solid var(--color-border-tertiary)" onclick="renderDetalleCierre(\''+c.id+'\')">'+
        '<div style="font-size:18px;font-weight:600;color:var(--color-text-primary);margin-bottom:2px">'+c.ejercicio+'</div>'+
        '<div style="font-size:11px;color:#888;margin-bottom:6px">Ejercicio cerrado</div>'+
        (tieneData?'<div style="font-size:12px;font-weight:500;color:#3B4BC8">'+fmtMXN(parseFloat(c.isr_a_cargo)>0?c.isr_a_cargo:c.saldo_favor)+'</div>'+
          '<div style="font-size:10px;color:#888">'+(parseFloat(c.isr_a_cargo)>0?'ISR a cargo':'Saldo a favor')+'</div>':'')+
        '<div style="display:inline-block;font-size:9px;padding:2px 7px;border-radius:999px;font-weight:500;margin-top:6px;background:'+(tieneData?'#EAF3DE':'#F1EFE8')+';color:'+(tieneData?'#3B6D11':'#5F5E5A')+'">'+(tieneData?'Completo':'Sin datos')+'</div>'+
      '</div>';
    });
    html+='</div>';
  });
  el.innerHTML=html;
}

async function renderNuevoCierre(id){
  const editing=id?cierresCache.find(c=>c.id===id):null;
  const cliOpts='<option value="">Selecciona cliente...</option>'+clientesCache.map(c=>'<option value="'+c.id+'" data-nombre="'+escH(c.nombre)+'"'+(editing&&editing.cliente_id===c.id?' selected':'')+'>'+escH(c.nombre)+'</option>').join('');
  const anioActual=new Date().getFullYear();
  const anios=[anioActual-4,anioActual-3,anioActual-2,anioActual-1,anioActual];
  const anioOpts=anios.map(y=>'<option value="'+y+'"'+(editing?editing.ejercicio===y?' selected':'':y===anioActual-1?' selected':'')+'>'+y+'</option>').join('');
  app.innerHTML=renderTopNav('proyeccion')+`

function cfSetCliente(sel){
  const opt=sel.options[sel.selectedIndex];
  const nombre=opt?.dataset?.nombre||opt?.text||'';
  const el=document.getElementById('cf-cli-nombre');
  if(el) el.value=nombre;
}

async function saveCierre(){
  const cliSel=document.getElementById('cf-cliente');
  const cliente_id=cliSel.value||null;
  const cliente_nombre=document.getElementById('cf-cli-nombre').value||(cliSel.selectedIndex>0?cliSel.options[cliSel.selectedIndex]?.dataset?.nombre||cliSel.options[cliSel.selectedIndex]?.text||'':'');
  const ejercicio=parseInt(document.getElementById('cf-ejercicio').value);
  const tasa_isr=parseFloat(document.getElementById('cf-tasa').value)||30;
  const ingresos_acumulables=parseFloat(document.getElementById('cf-ing').value)||0;
  const costo_ventas=parseFloat(document.getElementById('cf-cv').value)||0;
  const gastos_operacion=parseFloat(document.getElementById('cf-go').value)||0;
  const otros_ingresos=parseFloat(document.getElementById('cf-oi').value)||0;
  const otros_gastos=parseFloat(document.getElementById('cf-og').value)||0;
  const pagos_provisionales=parseFloat(document.getElementById('cf-pp').value)||0;
  const notas=document.getElementById('cf-notas').value.trim()||null;
  const editing=document.getElementById('cf-editing').value;
  const err=document.getElementById('cf-err');err.style.display='none';
  if(!cliente_nombre||!ejercicio){err.textContent='Cliente y ejercicio son obligatorios.';err.style.display='block';return;}
  const utilidad_contable=ingresos_acumulables-costo_ventas-gastos_operacion+otros_ingresos-otros_gastos;
  let total_sumas=0,total_restas=0;
  if(editing){
    const ajustes=await sbGet('pf_cierres_ajustes','?cierre_id=eq.'+editing+'&select=*');
    total_sumas=(ajustes||[]).filter(a=>a.tipo==='suma').reduce((s,a)=>s+(parseFloat(a.importe)||0),0);
    total_restas=(ajustes||[]).filter(a=>a.tipo==='resta').reduce((s,a)=>s+(parseFloat(a.importe)||0),0);
  }
  const utilidad_fiscal=utilidad_contable+total_sumas-total_restas;
  const isr_causado=utilidad_fiscal>0?utilidad_fiscal*(tasa_isr/100):0;
  const isr_a_cargo=Math.max(0,isr_causado-pagos_provisionales);
  const saldo_favor=Math.max(0,pagos_provisionales-isr_causado);
  const cu=ingresos_acumulables>0?(utilidad_fiscal/ingresos_acumulables*100):0;
  const payload={cliente_id,cliente_nombre,ejercicio,tasa_isr,ingresos_acumulables,costo_ventas,gastos_operacion,otros_ingresos,otros_gastos,utilidad_contable,total_sumas,total_restas,utilidad_fiscal,isr_causado,pagos_provisionales,isr_a_cargo,saldo_favor,cu,notas,updated_at:nowISO()};
  if(editing) await sbPatch('pf_cierres','?id=eq.'+editing,payload);
  else await sbPost('pf_cierres',payload,'return=minimal');
  const updated=await sbGet('pf_cierres','?select=*&order=ejercicio.desc,cliente_nombre.asc');
  cierresCache=updated||[];
  renderCierres();
}

async function agregarAjusteCierre(cierreId,tipoDefault){
