    ['Depreciación fiscal adicional (LISR Art. 31-38)','Ajuste anual por inflación deducible (LISR Art. 44-46)','PTU pagada deducible (LISR Art. 25 Fr. III)','Pérdida por enajenación de activos (LISR Art. 25 Fr. IV)','Deducción inmediata (LISR Art. 220)','Gastos no deducibles a revertir'];
  const sugerOpts='<option value="">Elige sugerencia o escribe abajo...</option>'+sugerencias.map(s=>'<option value="'+escH(s)+'">'+escH(s)+'</option>').join('');
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';overlay.id='modal-ajuste-cierre';
  overlay.innerHTML='<div class="modal-box">'+
    '<div class="modal-title">'+(tipoDefault==='suma'?'Agregar ingreso acumulable':'Agregar deducción')+'</div>'+
    '<div style="margin-bottom:8px"><div style="font-size:11px;color:#888;margin-bottom:3px">Sugerencias</div>'+
      '<select id="ajc-suger" style="width:100%" onchange="cfFillSuger(this)">'+sugerOpts+'</select></div>'+
    '<div style="margin-bottom:10px"><div style="font-size:11px;color:#888;margin-bottom:3px">Concepto *</div>'+
      '<input id="ajc-concepto" type="text" placeholder="Escribe el concepto..." style="width:100%"></div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">'+
      '<div><div style="font-size:11px;color:#888;margin-bottom:3px">Tipo</div>'+
        '<select id="ajc-tipo" style="width:100%"><option value="suma"'+(tipoDefault==='suma'?' selected':'')+'>Acumulable</option><option value="resta"'+(tipoDefault==='resta'?' selected':'')+'>Deducible</option></select></div>'+
      '<div><div style="font-size:11px;color:#888;margin-bottom:3px">Importe</div><input id="ajc-importe" type="number" placeholder="0.00"></div>'+

async function recalcularCierre(cierreId){
  const cierre=cierresCache.find(c=>c.id===cierreId);if(!cierre)return;
  const ajustes=await sbGet('pf_cierres_ajustes','?cierre_id=eq.'+cierreId+'&select=*');
  const aj=ajustes||[];
  const ts=aj.filter(a=>a.tipo==='suma').reduce((s,a)=>s+(parseFloat(a.importe)||0),0);
  const tr=aj.filter(a=>a.tipo==='resta').reduce((s,a)=>s+(parseFloat(a.importe)||0),0);
  const uc=parseFloat(cierre.ingresos_acumulables||0)-parseFloat(cierre.costo_ventas||0)-parseFloat(cierre.gastos_operacion||0)+parseFloat(cierre.otros_ingresos||0)-parseFloat(cierre.otros_gastos||0);
  const uf=uc+ts-tr;
  const isr=uf>0?uf*(cierre.tasa_isr/100):0;
  const pp=parseFloat(cierre.pagos_provisionales||0);
  const iac=Math.max(0,isr-pp);const sf=Math.max(0,pp-isr);
  const cu=parseFloat(cierre.ingresos_acumulables||0)>0?(uf/parseFloat(cierre.ingresos_acumulables)*100):0;
  await sbPatch('pf_cierres','?id=eq.'+cierreId,{total_sumas:ts,total_restas:tr,utilidad_fiscal:uf,isr_causado:isr,isr_a_cargo:iac,saldo_favor:sf,cu,updated_at:nowISO()});
  const idx=cierresCache.findIndex(c=>c.id===cierreId);
  if(idx>=0) cierresCache[idx]={...cierresCache[idx],total_sumas:ts,total_restas:tr,utilidad_fiscal:uf,isr_causado:isr,isr_a_cargo:iac,saldo_favor:sf,cu};
}

async function deleteCierre(id){
  const c=cierresCache.find(x=>x.id===id);
  if(!confirm('¿Eliminar el cierre de '+(c?.cliente_nombre||'')+ ' '+(c?.ejercicio||'')+'?'))return;
  await sbDelete('pf_cierres_ajustes','?cierre_id=eq.'+id);
  await sbDelete('pf_cierres','?id=eq.'+id);
  cierresCache=cierresCache.filter(x=>x.id!==id);
  renderCierres();
}

async function permToggle(checkbox){
  const email=checkbox.dataset.email;
  const mod=checkbox.dataset.mod;
  const u=usersCache[email];
  if(!u) return;
  let mods=u.modulos&&u.modulos.length?[...u.modulos]:[...(DEFAULT_MODULES_BY_ROLE[u.role]||['plan'])];
  if(checkbox.checked){if(!mods.includes(mod))mods.push(mod);}
  else{mods=mods.filter(m=>m!==mod);}
  u.modulos=mods;
  usersCache[email]=u;
  await sbPatch('users','?email=eq.'+encodeURIComponent(email),{modulos:JSON.stringify(mods)});
  // Feedback visual
  const lbl=checkbox.closest('label');
  if(lbl){lbl.style.background=checkbox.checked?'#EAF3DE':'#fafafa';lbl.style.borderColor=checkbox.checked?'#3B6D11':'#f0f0ec';setTimeout(()=>{lbl.style.background='#fafafa';lbl.style.borderColor='#f0f0ec';},800);}
}

const pApp=()=>document.getElementById('app');
function pH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pMXN(v){if(v===null||v===undefined||v==='')return '—';return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:0,maximumFractionDigits:0}).format(parseFloat(v)||0);}
function pMes(m){return MESES_P[(m-1)]||'Mes '+m;}
function pNow(){return new Date().toISOString();}
function pCR(imp){return imp.campos.find(c=>c.tipo==='resultado')?.id||null;}
function pDet(impId,d){const imp=IMPUESTOS_FEDERALES.find(i=>i.id===impId);if(!imp)return 0;const cr=pCR(imp);return parseFloat(d[cr]||0);}

async function pSbGet(t,qs=''){
  const r=await fetch(`${SB_URL}/rest/v1/${t}${qs}`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'}});
  if(!r.ok)throw new Error(await r.text());return r.json();
}
async function pSbPost(t,body){
  const r=await fetch(`${SB_URL}/rest/v1/${t}`,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error(await r.text());return r.json();
}
async function pSbPatch(t,qs,body){
  const r=await fetch(`${SB_URL}/rest/v1/${t}${qs}`,{method:'PATCH',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error(await r.text());return r;
}

function pToast(msg,tipo){
  const t=document.createElement('div');
  const bg=tipo==='ok'?'#EAF3DE':tipo==='err'?'#FCEBEB':'#FAEEDA';
  const cl=tipo==='ok'?'#3B6D11':tipo==='err'?'#A32D2D':'#854F0B';
  t.style.cssText=`position:fixed;bottom:24px;right:24px;z-index:9999;background:${bg};color:${cl};border:1px solid;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.12)`;
  t.textContent=(tipo==='ok'?'✓ ':tipo==='err'?'✕ ':'⚠ ')+msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),3000);
}

  imp.forEach(i=>{const d=fed[i.id]||{};td+=pDet(i.id,d);tp+=parseFloat(d.importe_pagado||0);});
  est.forEach(e=>{td+=parseFloat(e.importe_determinado||0);tp+=parseFloat(e.importe_pagado||0);});

  const dok=DOCS_REQUERIDOS.filter(d=>docs[d.id]).length;

      </div>
    </div>

      <div class="kpi"><div class="kpi-label">Impuestos</div><div class="kpi-val" style="color:#185FA5">${imp.length+est.length}</div></div>
      <div class="kpi"><div class="kpi-label">Determinado</div><div class="kpi-val">${pMXN(td)}</div></div>

function pSubComp(data){
  const {anio,mes}=pPagoActual;
  const comp=data.comparativo||{};
  const ma=mes>1?mes-1:null;
  const th='background:#3B4BC8;color:#fff;padding:6px 10px;font-size:10px;font-weight:600;text-align:right';
  const thL='background:#3B4BC8;color:#fff;padding:6px 10px;font-size:10px;font-weight:600;text-align:left';
  return `
    <div class="card" style="padding:0;overflow:hidden">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #e5e5e0">
        <div class="sec-label" style="margin-bottom:0">ER comparativo acumulado ENE — ${pMes(mes)}</div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-sm" onclick="PAGOS.guardarComp()">💾 Guardar</button>
        </div>
      </div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;min-width:500px">
          <thead><tr>
            <th style="${thL}">Concepto</th>
            ${ma?`<th style="${th}">${MESES_C[ma-1]} (acum.)</th>`:''}
            <th style="${th}">${MESES_C[mes-1]} (acum.)</th>
            ${ma?`<th style="${th}">Var. $</th><th style="${th}">Var. %</th>`:''}
          </tr></thead>
          <tbody>
            ${GRUPOS_FULL.map(g=>{
              const vAct=pv(comp,g.id,mes);
              const vAnt=ma?pv(comp,g.id,ma):null;
              const varAbs=vAnt!==null?vAct-vAnt:null;
              const varPct=vAnt!==null&&vAnt!==0?((vAct-vAnt)/Math.abs(vAnt)*100):null;
              const isCal=!g.edit;
              const bg=isCal?'background:#EEEDFE':'';
              const fw=isCal?'font-weight:700;color:#3C3489':'';
              return `<tr style="${bg};border-bottom:1px solid #f0f0ec">
                <td style="padding:6px 10px;font-size:12px;${fw}">${pH(g.label)}</td>
                ${ma?`<td style="padding:6px 10px;text-align:right;font-size:12px;${fw}">${g.edit?`<input type="number" id="pcomp-${g.id}-${ma}" value="${comp[g.id+'_'+ma]||''}" step="0.01" placeholder="0" style="text-align:right;font-size:11px;padding:3px 6px;width:100%;min-width:80px;border:1px solid #e0e0db;border-radius:4px" oninput="PAGOS.recompCalc()">`:pMXN(vAnt)}</td>`:''}
                <td style="padding:6px 10px;text-align:right;font-size:12px;${fw}">${g.edit?`<input type="number" id="pcomp-${g.id}-${mes}" value="${comp[g.id+'_'+mes]||''}" step="0.01" placeholder="0" style="text-align:right;font-size:11px;padding:3px 6px;width:100%;min-width:80px;border:1px solid #e0e0db;border-radius:4px" oninput="PAGOS.recompCalc()">`:pMXN(vAct)}</td>
                ${ma?`<td id="pva-${g.id}" style="padding:6px 10px;text-align:right;font-size:12px;font-weight:600;color:${varAbs!==null&&varAbs*g.signo>=0?'#3B6D11':'#A32D2D'}">${varAbs!==null?pMXN(varAbs):'—'}</td>
                <td id="pvp-${g.id}" style="padding:6px 10px;text-align:right;font-size:12px;font-weight:600;color:${varPct!==null&&varPct*g.signo>=0?'#3B6D11':'#A32D2D'}">${varPct!==null?varPct.toFixed(1)+'%':'—'}</td>`:''}
              </tr>`;}).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

function pRenderHistorico(){

  return Object.keys(pa).sort((a,b)=>b-a).map(anio=>`
    <div class="card">
      <div class="sec-label">Ejercicio ${anio}</div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead><tr>${['Mes','Status','ISR','IVA','Total pagado','Acción'].map(h=>`<th style="background:#f5f5f3;padding:7px 10px;text-align:left;font-size:10px;font-weight:600;color:#888;text-transform:uppercase;border-bottom:1px solid #e5e5e0">${h}</th>`).join('')}</tr></thead>
          <tbody>
            ${pa[anio].sort((a,b)=>a.mes-b.mes).map(p=>{
              const f=p.impuestos_federales||{};
              const isr=parseFloat((f.isr_pm||f.isr_pf||{}).importe_pagado||0);
              const iva=parseFloat((f.iva||{}).importe_pagado||0);
              let tot=0;Object.values(f).forEach(d=>tot+=parseFloat(d.importe_pagado||0));
              (p.impuestos_estatales||[]).forEach(e=>tot+=parseFloat(e.importe_pagado||0));
              return `<tr style="border-bottom:1px solid #f0f0ec">
                <td style="padding:8px 10px;font-weight:600">${pMes(p.mes)}</td>
                <td style="padding:8px 10px"><span class="badge ${p.status==='revisado'?'badge-ok':p.status==='alerta'?'badge-warn':'badge-pend'}">${p.status==='revisado'?'Revisado':p.status==='alerta'?'Alerta':'Pendiente'}</span></td>
                <td style="padding:8px 10px;text-align:right;font-weight:600">${isr?pMXN(isr):'—'}</td>
                <td style="padding:8px 10px;text-align:right;font-weight:600">${iva?pMXN(iva):'—'}</td>
                <td style="padding:8px 10px;text-align:right;font-weight:700">${pMXN(tot)}</td>
                <td style="padding:8px 10px"><button class="btn btn-sm" onclick="PAGOS.irPago(${p.anio},${p.mes})">Ver</button></td>
              </tr>`;}).join('')}
          </tbody>
        </table>
      </div>
    </div>`).join('');
}

function pContenidoInforme(anio,per){
  const lista=pPagosCache.filter(p=>p.anio==anio&&(per==='anual'||p.mes==per)).sort((a,b)=>a.mes-b.mes);
  if(!lista.length)return `<div class="card" style="text-align:center;padding:1.5rem;color:#888">Sin datos para el período.</div>`;
  const tot={};const alertas=[];
  lista.forEach(p=>{
    IMPUESTOS_FEDERALES.forEach(imp=>{
      const d=(p.impuestos_federales||{})[imp.id]||{};
      const det=pDet(imp.id,d);const pag=parseFloat(d.importe_pagado||0);
      if(!det&&!pag)return;
      if(!tot[imp.id])tot[imp.id]={label:imp.label,det:0,pag:0};
      tot[imp.id].det+=det;tot[imp.id].pag+=pag;
      if(det>0&&Math.abs(pag-det)>1)alertas.push({mes:p.mes,imp:imp.label,det,pag,diff:pag-det});
    });
    (p.impuestos_estatales||[]).forEach(e=>{
      const k='e_'+e.tipo_id+'_'+e.estado;const det=parseFloat(e.importe_determinado||0);const pag=parseFloat(e.importe_pagado||0);
      if(!tot[k])tot[k]={label:`${e.label} (${e.estado})`,det:0,pag:0};
      tot[k].det+=det;tot[k].pag+=pag;
    });
  });
  const gdet=Object.values(tot).reduce((s,t)=>s+t.det,0);
  const gpag=Object.values(tot).reduce((s,t)=>s+t.pag,0);
  const tit=per==='anual'?'Ejercicio '+anio:pMes(parseInt(per))+' '+anio;
  const th='background:#3B4BC8;color:#fff;padding:6px 10px;font-size:10px;font-weight:600;text-align:left';
  const thr='background:#3B4BC8;color:#fff;padding:6px 10px;font-size:10px;font-weight:600;text-align:right';
  return `
    <div class="card">
      <div style="background:#3B4BC8;color:#fff;padding:8px 14px;border-radius:8px 8px 0 0;font-size:12px;font-weight:700;display:flex;justify-content:space-between;margin:-1rem -1.25rem 12px"><span>INFORME DE REVISIÓN — PAGOS PROVISIONALES</span><span>${pH(tit)}</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:12px">
        <div><div class="sec-label">Cliente</div><div style="font-size:14px;font-weight:700">${pH(pClienteActual.nombre)}</div></div>
        <div><div class="sec-label">Elaborado por</div><div style="font-size:13px;font-weight:600">MSST Consulting SC</div><div style="font-size:11px;color:#888">${new Date().toLocaleDateString('es-MX')}</div></div>
      </div>
      ${alertas.length?`<div style="background:#FAEEDA;border:1px solid #FAC775;border-radius:8px;padding:10px 14px;font-size:12px;color:#854F0B;margin-bottom:12px"><strong>${alertas.length} diferencia(s) detectada(s)</strong></div>`
      :`<div style="background:#EAF3DE;border:1px solid #C0DD97;border-radius:8px;padding:10px 14px;font-size:12px;color:#3B6D11;margin-bottom:12px"><strong>✓ Todos los impuestos revisados cuadran.</strong></div>`}
      <div style="border:1px solid #e5e5e0;border-radius:8px;overflow:hidden;margin-bottom:12px">
        <table style="width:100%;border-collapse:collapse">
          <thead><tr><th style="${th}">Impuesto</th><th style="${thr}">Determinado</th><th style="${thr}">Pagado</th><th style="${thr}">Diferencia</th><th style="background:#3B4BC8;color:#fff;padding:6px 10px;font-size:10px;font-weight:600;text-align:center">Status</th></tr></thead>
          <tbody>
            ${Object.values(tot).filter(t=>t.det||t.pag).map(t=>{const d=t.pag-t.det;return`<tr style="border-bottom:1px solid #f0f0ec">
              <td style="padding:7px 10px;font-size:12px;font-weight:500">${pH(t.label)}</td>
              <td style="padding:7px 10px;text-align:right;font-weight:600">${pMXN(t.det)}</td>
              <td style="padding:7px 10px;text-align:right;font-weight:600">${pMXN(t.pag)}</td>
              <td style="padding:7px 10px;text-align:right;font-weight:700;color:${Math.abs(d)<1?'#3B6D11':d<0?'#A32D2D':'#854F0B'}">${pMXN(d)}</td>
              <td style="padding:7px 10px;text-align:center"><span class="badge ${Math.abs(d)<1?'badge-ok':d<0?'badge-err':'badge-warn'}">${Math.abs(d)<1?'OK':d<0?'Dif.':'Exc.'}</span></td>
            </tr>`;}).join('')}
            <tr style="background:#f5f5f3;font-weight:700"><td style="padding:8px 10px">TOTAL</td><td style="padding:8px 10px;text-align:right">${pMXN(gdet)}</td><td style="padding:8px 10px;text-align:right">${pMXN(gpag)}</td><td style="padding:8px 10px;text-align:right;color:${Math.abs(gpag-gdet)<1?'#3B6D11':'#A32D2D'}">${pMXN(gpag-gdet)}</td><td style="padding:8px 10px;text-align:center"><span class="badge ${Math.abs(gpag-gdet)<1?'badge-ok':'badge-err'}">${Math.abs(gpag-gdet)<1?'Cuadrado':'Diferencia'}</span></td></tr>
          </tbody>
        </table>
      </div>
    </div>`;
}

// ===== GUARDAR =====
async function pGuardar(){
  if(!pPagoActual)return;
  const notas=document.getElementById('p-notas')?.value??pPagoActual.data.notas??'';
  pPagoActual.data.notas=notas;
  const fed=pPagoActual.data.impuestos_federales||{};
  let hayAlerta=false;
  IMPUESTOS_FEDERALES.forEach(imp=>{const d=fed[imp.id]||{};const det=pDet(imp.id,d);const pag=parseFloat(d.importe_pagado||0);if(det>0&&Math.abs(pag-det)>1)hayAlerta=true;});
  (pPagoActual.data.impuestos_estatales||[]).forEach(e=>{const det=parseFloat(e.importe_determinado||0);const pag=parseFloat(e.importe_pagado||0);if(det>0&&Math.abs(pag-det)>1)hayAlerta=true;});
  if(pPagoActual.data.status!=='revisado')pPagoActual.data.status=hayAlerta?'alerta':'pendiente';
  try{
    if(pPagoActual.data.id){
      await pSbPatch('pago_provisional','?id=eq.'+pPagoActual.data.id,{
        impuestos_federales:pPagoActual.data.impuestos_federales,
        impuestos_estatales:pPagoActual.data.impuestos_estatales,
        documentos:pPagoActual.data.documentos,
        comparativo:pPagoActual.data.comparativo,
        notas_comparativo:pPagoActual.data.notas_comparativo,
        notas:pPagoActual.data.notas,
        status:pPagoActual.data.status,
        fecha_revision:pPagoActual.data.fecha_revision||null,
        updated_at:pNow()
      });
    }else{
      const res=await pSbPost('pago_provisional',{
        cliente_id:pClienteActual.id,cliente_nombre:pClienteActual.nombre,
        anio:pPagoActual.anio,mes:pPagoActual.mes,
        impuestos_federales:pPagoActual.data.impuestos_federales||{},
        impuestos_estatales:pPagoActual.data.impuestos_estatales||[],
        documentos:pPagoActual.data.documentos||{},
        comparativo:pPagoActual.data.comparativo||{},
        notas_comparativo:pPagoActual.data.notas_comparativo||'',
        config_impuestos:pPagoActual.data.config_impuestos||IMPUESTOS_FEDERALES.map(i=>i.id),
        notas:pPagoActual.data.notas||'',status:pPagoActual.data.status||'pendiente',
        created_at:pNow(),updated_at:pNow()
      });
      const nuevo=Array.isArray(res)?res[0]:res;
      if(nuevo?.id){pPagoActual.data.id=nuevo.id;pPagosCache.push(pPagoActual.data);}
    }
    const idx=pPagosCache.findIndex(p=>p.anio===pPagoActual.anio&&p.mes===pPagoActual.mes);
    if(idx>=0)pPagosCache[idx]=pPagoActual.data;
    pToast('Guardado correctamente','ok');
  }catch(e){pToast('Error al guardar: '+e.message,'err');}
}

function pCedula(){
  if(!pPagoActual)return;
  const {anio,mes,data}=pPagoActual;
  const fed=data.impuestos_federales||{};const est=data.impuestos_estatales||[];
  const lineas=[];let td=0,tp=0;
  IMPUESTOS_FEDERALES.forEach(imp=>{const d=fed[imp.id]||{};const det=pDet(imp.id,d);const pag=parseFloat(d.importe_pagado||0);if(!det&&!pag)return;td+=det;tp+=pag;lineas.push({l:imp.label,det,pag,fecha:d.fecha_pago||'—',lc:d.linea_captura||'—'});});
  est.forEach(e=>{const det=parseFloat(e.importe_determinado||0);const pag=parseFloat(e.importe_pagado||0);lineas.push({l:`${e.label} (${e.estado||''})`,det,pag,fecha:e.fecha_pago||'—',lc:e.linea_captura||'—'});td+=det;tp+=pag;});
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Cédula ${pMes(mes)} ${anio}</title>
  <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,sans-serif;padding:20px;color:#1a1a1a}

  .tot{background:#EEEDFE;font-weight:700}.footer{border-top:1px solid #e5e5e0;padding-top:8px;font-size:9px;color:#aaa;display:flex;justify-content:space-between;margin-top:14px}
  @page{size:letter;margin:12mm}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style>
  </head><body>
  <div class="hdr"><div><div style="font-size:10px;color:#888">${pH(pClienteActual.nombre)}</div><div style="font-size:17px;font-weight:700">Cédula — ${pMes(mes)} ${anio}</div></div><div style="font-size:11px;color:#3B4BC8;font-weight:700">CONFIDENCIAL</div></div>
  <table><thead><tr><th>Impuesto</th><th style="text-align:right">Determinado</th><th style="text-align:right">Pagado</th><th style="text-align:right">Diferencia</th><th>Fecha</th><th>Línea captura</th></tr></thead>
  <tbody>${lineas.map(l=>{const d=l.pag-l.det;return`<tr><td style="font-weight:500">${pH(l.l)}</td><td style="text-align:right;font-weight:600">${pMXN(l.det)}</td><td style="text-align:right;font-weight:600">${pMXN(l.pag)}</td><td style="text-align:right;font-weight:700;color:${Math.abs(d)<1?'#3B6D11':d<0?'#A32D2D':'#854F0B'}">${pMXN(d)}</td><td>${pH(l.fecha)}</td><td style="font-size:10px;color:#888">${pH(l.lc)}</td></tr>`;}).join('')}
  <tr class="tot"><td style="padding:8px 10px">TOTAL</td><td style="padding:8px 10px;text-align:right">${pMXN(td)}</td><td style="padding:8px 10px;text-align:right">${pMXN(tp)}</td><td style="padding:8px 10px;text-align:right;color:${Math.abs(tp-td)<1?'#3B6D11':'#A32D2D'}">${pMXN(tp-td)}</td><td colspan="2"></td></tr>
  </tbody></table>
  ${data.notas?`<div style="margin-top:12px;padding:8px 12px;background:#f5f5f3;border-radius:6px;font-size:11px"><strong>Notas:</strong> ${pH(data.notas)}</div>`:''}
  <div class="footer"><span>Arts. 14 LISR · 5-D LIVA · 17-A y 21 CFF — MSST Consulting SC</span><span>Confidencial · ${new Date().toLocaleDateString('es-MX')}</span></div>
  </body></html>`);
  w.document.close();setTimeout(()=>w.print(),500);
}

    if(id==='isr_pm'){
      const ue=g('ingresos_nominales')*(g('coeficiente_utilidad'));

    if(id==='iva'){
      const cargo=Math.max(0,g('iva_trasladado')-g('iva_acreditable')-g('iva_retenido_cobrado'));

function docRenderLista(lista){
  if(!lista.length) return '<div style="text-align:center;padding:1.5rem;color:#888">Sin clientes.</div>';
  return lista.map(c=>{
    const id=escD(String(c.id)), nom=escD(c.nombre), ini=c.nombre.charAt(0).toUpperCase();
    return '<div data-id="'+id+'" data-nombre="'+nom+'" onclick="docCliClick(this)" style="display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid #e5e5e0;border-radius:10px;cursor:pointer;margin-bottom:6px;background:#fafafa" onmouseenter="this.style.borderColor=&quot;#0f4c81&quot;" onmouseleave="this.style.borderColor=&quot;#e5e5e0&quot;">'+
    '<div style="width:38px;height:38px;border-radius:10px;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#0f4c81;flex-shrink:0">'+ini+'</div>'+
    '<div style="flex:1"><div style="font-size:14px;font-weight:600">'+nom+'</div>'+(c.rfc?'<div style="font-size:11px;color:#888">'+escD(c.rfc)+'</div>':'')+'</div>'+
    '<div style="font-size:11px;color:#888;text-transform:uppercase">'+escD(c.tipo||'PM')+'</div><span style="color:#888">›</span></div>';
  }).join('');
}

function docFiltrar(q){
  const esPM=(c)=>{ const t=(c.tipo||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); return t.includes('moral')||!t; };
  const esPF=(c)=>{ const t=(c.tipo||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); return t.includes('fisica'); };
  const base=clientesCache.filter(c=>c.activo!==false&&(docTipoPers==='pm'?esPM(c):esPF(c)));
  const lista=base.filter(c=>!q||(c.nombre||'').toLowerCase().includes(q.toLowerCase()));
  const el=document.getElementById('doc-lista');if(el)el.innerHTML=docRenderLista(lista);
}

async function docSelCliente(id,nombre){
  const cli=clientesCache.find(c=>String(c.id)===String(id));
  docClienteActual={id,nombre,tipo:cli?.tipo||''};docTab='generales';
  // Usar el año actual por defecto; se ajustará al primer ejercicio con datos al cargar
  docEjercicio=new Date().getFullYear();
  app.innerHTML=renderTopNav('doc')+'<div class="loading"><span class="spinner"></span>Cargando expediente...</div>';
  try{
    [docCacheGen,docCacheFin]=await Promise.all([
      sbGet('client_documents','?cliente_id=eq.'+encodeURIComponent(id)+'&categoria=eq.general&select=*&order=tipo.asc'),
      sbGet('client_documents','?cliente_id=eq.'+encodeURIComponent(id)+'&categoria=eq.financiero&select=*&order=ejercicio.desc,mes.asc'),
    ]);
    docCacheGen=docCacheGen||[];docCacheFin=docCacheFin||[];
    // Ajustar al ejercicio más reciente con documentos
    const ejConDatos=[...new Set(docCacheFin.map(d=>d.ejercicio).filter(Boolean))].sort((a,b)=>b-a);
    if(ejConDatos.length>0) docEjercicio=ejConDatos[0];
  }catch(e){docCacheGen=[];docCacheFin=[];}
  docRenderCliente();
}

function docRenderCliente(){
  const c=docClienteActual;
  const ejercicios=[...new Set(docCacheFin.map(d=>d.ejercicio).filter(Boolean))].sort((a,b)=>b-a);
  if(!ejercicios.includes(docEjercicio))ejercicios.unshift(docEjercicio);
  app.innerHTML=renderTopNav('doc')+
  '<div style="max-width:900px;margin:0 auto">'+
  '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px">'+
  '<div style="display:flex;align-items:center;gap:10px">'+
  '<button class="btn btn-sm" onclick="renderDocumentacion()">← Clientes</button>'+
  '<div style="width:36px;height:36px;border-radius:10px;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#0f4c81">'+c.nombre.charAt(0).toUpperCase()+'</div>'+
  '<div><div style="font-size:16px;font-weight:700">'+escD(c.nombre)+'</div>'+
  '<div style="font-size:11px;color:#888">'+docCacheGen.length+' doc. generales · '+docCacheFin.length+' doc. financieros</div></div></div></div>'+
  '<div class="tab-row">'+
  '<button class="tab '+(docTab==='generales'?'active':'')+'" onclick="docSetTab(\'generales\')">📜 Generales del cliente</button>'+
  '<button class="tab '+(docTab==='financiero'?'active':'')+'" onclick="docSetTab(\'financiero\')">📊 Estados financieros</button>'+
  '</div>'+
  '<div id="doc-tab-content">'+docTabContent(ejercicios)+'</div></div>';
}

function docSetTab(tab){
  docTab=tab;
  const ejercicios=[...new Set(docCacheFin.map(d=>d.ejercicio).filter(Boolean))].sort((a,b)=>b-a);
  if(!ejercicios.includes(docEjercicio))ejercicios.unshift(docEjercicio);
  // Cargar clasificaciones y activos si entramos a la pestaña financiero
  if(tab==='financiero'){
    const clienteId=String(docClienteActual?.id||'');
    const promises=[];
    if(!docClasifCache) promises.push(docCargarClasif());
    if(clienteId&&(!window._afCount||window._afCount[clienteId]===undefined)){
      promises.push(afCargar(clienteId).then(()=>afDetectarAdiciones(clienteId,docEjercicio)));
    }
    if(promises.length){
      Promise.all(promises).then(()=>{
        const el=document.getElementById('doc-tab-content');
        if(el)el.innerHTML=docTabContent(ejercicios);
      });
      return;
    }
  }
  const el=document.getElementById('doc-tab-content');
  if(el)el.innerHTML=docTabContent(ejercicios);
  document.querySelectorAll('.tab-row .tab').forEach(b=>{
    const isGen=b.textContent.includes('Generales');
    b.classList.toggle('active',(tab==='generales'&&isGen)||(tab==='financiero'&&!isGen));
  });
}

function docTabContent(ejercicios){
  return docTab==='generales'?docRenderGenerales():docRenderFinanciero(ejercicios);
}

    if(ok&&hasCifras) html+='<button class="btn btn-sm" style="font-size:9px;padding:2px 4px;background:#EAF3DE;color:#3B6D11;border-color:#b7d9a0" data-mes="'+n+'" onclick="docVerER('+docEjercicio+',parseInt(this.dataset.mes))">ER</button>';
    if(ok) html+='<button class="btn btn-sm" style="font-size:9px;padding:2px 4px;background:#EEEDFE;color:#3C3489;border-color:#c5d0ff" data-did="'+escD(String(d.id))+'" data-url="'+escD(d.archivo_url||'')+'" onclick="docRecalcularBalanza(this.dataset.did,this.dataset.url)" title="Recalcular cifras con clasificación actual">↺</button>';
    if(ok&&!hasCifras) html+='<button class="btn btn-sm" style="font-size:9px;padding:2px 4px;background:#EEEDFE;color:#3B4BC8;border-color:#c5d0ff" data-did="'+escD(String(d.id))+'" onclick="docExtraerCifras(this.dataset.did,\'balanza\','+docEjercicio+','+n+')">✨ IA</button>';

async function afCargar(clienteId){
  try{
    const rows = await sbGet('activos_fijos',
      '?cliente_id=eq.'+encodeURIComponent(String(clienteId))+'&order=fecha_adquisicion.asc&select=*');
    afCache = rows||[];
    if(!window._afCount) window._afCount={};
    window._afCount[String(clienteId)] = afCache.filter(a=>a.en_uso!==false).length;
    return afCache;
  }catch(e){ afCache=[]; return []; }
}

// Detectar adiciones de activos en balanzas del ejercicio actual
async function afDetectarAdiciones(clienteId, ejercicio){
  if(!window._afAlerta) window._afAlerta={};
  try{
    // Buscar balanzas del ejercicio con cifras
    const docs = await sbGet('client_documents',
      '?cliente_id=eq.'+encodeURIComponent(String(clienteId))+
      '&ejercicio=eq.'+ejercicio+'&tipo=eq.balanza&select=cifras,mes');
    let totalAdiciones=0;
    (docs||[]).forEach(d=>{
      const det=(d.cifras&&d.cifras.detalle)||{};
      // Sumar cargos en cuentas activo_fijo (detalle guardado como movimiento del período)
      Object.entries(det).forEach(([k,v])=>{
        if(k.startsWith('activo_fijo')&&v>0) totalAdiciones++;
      });
    });
    window._afAlerta[String(clienteId)] = totalAdiciones>0?totalAdiciones:null;
  }catch(e){ window._afAlerta[String(clienteId)]=null; }
}

// Abrir gestión completa de activos fijos
async function afGestion(){
  if(!docClienteActual) return;
  docToast('Cargando activos fijos...','warn');
  await afCargar(String(docClienteActual.id));
  const af = afCache||[];
  const fmtM = v=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2}).format(v||0);
  const fmtF = v=>v?new Date(v+'T00:00:00').toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}):'—';

  const filas = af.map((a,i)=>{
    const pct = parseFloat(a.porcentaje_depreciacion)||0;
    const meses = a.fecha_adquisicion
      ? Math.max(0,Math.floor((new Date()-new Date(a.fecha_adquisicion+'T00:00:00'))/(1000*60*60*24*30.44)))
      : 0;
    const deprAnual = a.monto_adquisicion * pct/100;
    const deprAcum  = Math.min(a.monto_adquisicion, deprAnual * meses/12);
    const valorNeto = Math.max(0, a.monto_adquisicion - deprAcum);
    return '<tr style="border-bottom:1px solid #f0f0ec;background:'+(a.en_uso===false?'#fafafa':'#fff')+'">'+
      '<td style="padding:6px 10px;font-size:12px;color:'+(a.en_uso===false?'#aaa':'#1a1a1a')+'">'+escD(a.nombre)+'</td>'+
      '<td style="padding:6px 10px;font-size:11px;color:#555">'+pct+'%</td>'+
      '<td style="padding:6px 10px;font-size:12px;text-align:right">'+fmtM(a.monto_adquisicion)+'</td>'+
      '<td style="padding:6px 10px;font-size:11px;color:#888">'+fmtF(a.fecha_adquisicion)+'</td>'+
      '<td style="padding:6px 10px;font-size:12px;text-align:right;color:#A32D2D">'+fmtM(deprAcum)+'</td>'+
      '<td style="padding:6px 10px;font-size:12px;text-align:right;color:#185FA5;font-weight:600">'+fmtM(valorNeto)+'</td>'+
      '<td style="padding:6px 10px;text-align:center">'+
        '<button class="btn btn-sm" style="font-size:10px" onclick="afEditarActivo(\''+a.id+'\')">✏</button>'+
        '<button class="btn btn-sm" style="font-size:10px;background:#fef2f2;color:#dc2626;margin-left:3px" onclick="afEliminarActivo(\''+a.id+'\',\''+escD(a.nombre)+'\')">✕</button>'+
      '</td>'+
    '</tr>';
  }).join('');

  const totalCosto  = af.reduce((s,a)=>s+(a.monto_adquisicion||0),0);
  const totalDeprAcum = af.reduce((a,x)=>{
    const p=parseFloat(x.porcentaje_depreciacion)||0;
    const ms=x.fecha_adquisicion?Math.max(0,Math.floor((new Date()-new Date(x.fecha_adquisicion+'T00:00:00'))/(1000*60*60*24*30.44))):0;
    return a+Math.min(x.monto_adquisicion,x.monto_adquisicion*p/100*ms/12);
  },0);

  const m=document.createElement('div');m.className='modal-overlay';m.id='af-modal-gest';
  m.innerHTML='<div class="modal-box" style="max-width:900px;max-height:90vh">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'+
      '<div><div style="font-size:16px;font-weight:700">🏭 Integración de Activos Fijos — '+escD(docClienteActual.nombre)+'</div>'+
      '<div style="font-size:11px;color:#888">Base para cédula J11 — Depreciaciones contables/fiscales</div></div>'+
      '<button onclick="document.getElementById(\'af-modal-gest\').remove()" style="background:none;border:none;cursor:pointer;font-size:20px;color:#888">✕</button>'+
    '</div>'+
    // Resumen
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">'+
      '<div style="background:#E6F1FB;border-radius:8px;padding:10px 14px;text-align:center">'+
        '<div style="font-size:11px;color:#888">Total activos</div><div style="font-size:20px;font-weight:700;color:#185FA5">'+af.length+'</div></div>'+
      '<div style="background:#FCEBEB;border-radius:8px;padding:10px 14px;text-align:center">'+
        '<div style="font-size:11px;color:#888">Costo de adquisición</div><div style="font-size:16px;font-weight:700;color:#A32D2D">'+fmtM(totalCosto)+'</div></div>'+
      '<div style="background:#EAF3DE;border-radius:8px;padding:10px 14px;text-align:center">'+
        '<div style="font-size:11px;color:#888">Valor neto estimado</div><div style="font-size:16px;font-weight:700;color:#3B6D11">'+fmtM(totalCosto-totalDeprAcum)+'</div></div>'+
    '</div>'+
    '<div style="display:flex;gap:8px;margin-bottom:12px">'+
      '<button class="btn btn-primary" style="font-size:13px;flex:1" onclick="afAgregarActivo()">✚ Agregar activo</button>'+
      '<button class="btn" style="font-size:12px;background:#E6F1FB;color:#3B4BC8;border-color:#c5d0ff;flex:1" onclick="afMostrarCargaMasiva()">📥 Carga masiva CSV/Excel</button>'+
      '<button class="btn" style="font-size:12px;background:#EAF3DE;color:#3B6D11;border-color:#b7d9a0" onclick="afDescargarPlantilla()" title="Descargar plantilla">⬇ Plantilla</button>'+
    '</div>'+
    (af.length?
      '<div style="overflow-y:auto;max-height:400px"><table style="width:100%;border-collapse:collapse">'+
      '<thead><tr style="background:#3B4BC8;color:#fff">'+
        '<th style="padding:7px 10px;font-size:11px;text-align:left">Nombre del activo</th>'+
        '<th style="padding:7px 10px;font-size:11px;text-align:left">% Depr.</th>'+
        '<th style="padding:7px 10px;font-size:11px;text-align:right">Monto adquisición</th>'+
        '<th style="padding:7px 10px;font-size:11px;text-align:left">Fecha adquisición</th>'+
        '<th style="padding:7px 10px;font-size:11px;text-align:right">Depr. acumulada</th>'+
        '<th style="padding:7px 10px;font-size:11px;text-align:right">Valor neto</th>'+
        '<th style="padding:7px 10px;font-size:11px;text-align:center">Acc.</th>'+
      '</tr></thead><tbody>'+filas+'</tbody></table></div>'
      :'<div style="text-align:center;padding:40px;color:#888">Sin activos registrados.<br>Agrega los activos históricos de la empresa.</div>')+
    '<div style="display:flex;gap:8px;margin-top:12px">'+
      '<button class="btn" style="flex:1;margin-top:0" onclick="document.getElementById(\'af-modal-gest\').remove()">Cerrar</button>'+
      '<button class="btn" style="flex:1;margin-top:0;background:#EEEDFE;color:#3C3489;border-color:#c5d0ff" onclick="afCompararConBalanzas()">📊 Comparar vs Balanzas</button>'+
    '</div>'+
  '</div>';
  document.body.appendChild(m);
}

function afActualizarPct(){
  const sel = document.getElementById('af-clasif')?.value;
  if(sel && AF_PORCENTAJES.hasOwnProperty(sel)){
    document.getElementById('af-pct').value = AF_PORCENTAJES[sel];
  }
}

async function afGuardarActivo(existingId){
  const nombre = (document.getElementById('af-nombre')?.value||'').trim();
  const clasif = document.getElementById('af-clasif')?.value||'';
  const pct    = parseFloat(document.getElementById('af-pct')?.value)||0;
  const monto  = parseFloat(document.getElementById('af-monto')?.value)||0;
  const fecha  = document.getElementById('af-fecha')?.value||'';
  const desc   = (document.getElementById('af-desc')?.value||'').trim();
  const err    = document.getElementById('af-err');
  if(!nombre||!clasif||!monto||!fecha){
    err.textContent='Completa los campos obligatorios (*)'; err.style.display='block'; return;
  }
  err.style.display='none';
  const btn=document.getElementById('af-btn-save');
  btn.innerHTML='<span class="spinner"></span> Guardando...'; btn.disabled=true;
  try{
    const payload={
      cliente_id:String(docClienteActual.id),
      nombre, clasificacion_fiscal:clasif,
      porcentaje_depreciacion:pct, monto_adquisicion:monto,
      fecha_adquisicion:fecha, descripcion:desc, en_uso:true,
      updated_at:nowISO()
    };
    if(existingId){
      await sbPatch('activos_fijos','?id=eq.'+encodeURIComponent(existingId),payload);
    } else {
      await fetch(SB_URL+'/rest/v1/activos_fijos',{
        method:'POST',
        headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify(payload)
      });
    }
    document.getElementById('af-modal-form')?.remove();
    document.getElementById('af-modal-gest')?.remove();
    // Limpiar alerta si aplica
    if(window._afAlerta) window._afAlerta[String(docClienteActual.id)]=null;
    await afCargar(String(docClienteActual.id));
    docSetTab('financiero');
    docToast((existingId?'Activo actualizado':'Activo agregado'),'ok');
    await afGestion();
  }catch(e){
    err.textContent='Error: '+e.message; err.style.display='block';
    btn.innerHTML=existingId?'Guardar cambios':'Agregar activo'; btn.disabled=false;
  }
}

async function afEditarActivo(id){
  const a=(afCache||[]).find(x=>x.id===id);
  if(!a){docToast('Activo no encontrado','err');return;}
  document.getElementById('af-modal-gest')?.remove();
  afAgregarActivo(a);
}

async function afEliminarActivo(id, nombre){
  if(!confirm('¿Eliminar el activo "'+nombre+'"?')) return;
  try{
    await fetch(SB_URL+'/rest/v1/activos_fijos?id=eq.'+encodeURIComponent(id),{
      method:'DELETE', headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
    });
    afCache=(afCache||[]).filter(a=>a.id!==id);
    if(window._afCount) window._afCount[String(docClienteActual.id)]=(afCache||[]).length;
    document.getElementById('af-modal-gest')?.remove();
    docSetTab('financiero');
    docToast('Activo eliminado','ok');
    await afGestion();
  }catch(e){ docToast('Error: '+e.message,'err'); }
}

// Auto-sugerir rubro por número y nombre de cuenta
function docAutoRubro(num,nombre){
  const n=nombre.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const pre2=num.substring(0,2),pre3=num.substring(0,3),pre4=num.substring(0,4);
  // === ACTIVO ===
  if(/BANCO|CAJA|EFECTIVO/.test(n)||/^11[12]/.test(num)) return 'activo_caja';
  if(/CLIENTE|DEUDOR|DOCUM.POR COB/.test(n)||/^113/.test(num)) return 'activo_clientes';
  if(/INVENTARIO|MERCANCIA|ALMACEN/.test(n)||/^114/.test(num)) return 'activo_inventarios';
  if(/ANTICIPO.PROV|PAGO.ANTICIP/.test(n)) return 'activo_anticipos_prov';
  if(/IVA.ACRED|IMPUESTO.A.FAVOR|SALDO.A.FAVOR/.test(n)) return 'activo_iva';
  if(/PAGO.PROV|ISR.PROV|ANTICIPO.ISR/.test(n)) return 'activo_pagos_prov';
  if(/DEPRECIA|AMORTIZA/.test(n)) return 'activo_depreciacion';
  if(/INMUEBLE|EDIFICIO|TERRENO|MAQUINA|EQUIPO|MOBILIARIO|VEHICULO|ACTIVO.FIJ/.test(n)||/^12/.test(num)) return 'activo_fijo';
  if(/INTANGIB|DIFERIDO|PATENTE|MARCA|LICENCIA/.test(n)) return 'activo_intangible';
  if(num.charAt(0)==='1') return 'activo_otros_circ';
  // === PASIVO ===
  if(/PROVEEDOR/.test(n)||/^201|^220/.test(num)) return 'pasivo_proveedores';
  if(/ANTICIPO.CLI|COBRO.ANTICIP/.test(n)) return 'pasivo_anticipo_cli';
  if(/ACREEDOR/.test(n)) return 'pasivo_acreedores';
  if(/IVA.TRASLAD|IVA.POR.PAG/.test(n)) return 'pasivo_iva';
  if(/ISR.POR.PAG/.test(n)) return 'pasivo_isr';
  if(/IMSS|INFONAVIT/.test(n)) return 'pasivo_imss';
  if(/PTU|UTILIDAD.TRABAJ/.test(n)) return 'pasivo_ptu';
  if(/PRESTAMO|CREDITO.BANC|HIPOTECA/.test(n)) return 'pasivo_cp';
  if(num.charAt(0)==='2') return 'pasivo_otros';
  // === CAPITAL ===
  if(/CAPITAL.SOCIAL|ACCIONES/.test(n)) return 'capital_social';
  if(/RESERVA.LEGAL/.test(n)) return 'capital_reserva';
  if(/UTILIDAD.RETENIDA|RESULTADO.ACUM/.test(n)) return 'capital_utilidades';
  if(/PERDIDA.ACUM/.test(n)) return 'capital_perdidas';
  if(/RESULTADO.DEL.EJERCICIO/.test(n)) return 'capital_resultado';
  if(num.charAt(0)==='3') return 'capital_social';
  // === RESULTADOS ACREEDORAS ===
  if(num.charAt(0)==='4'){
    if(/GASTO|COSTO|COMPRA|INTERESES.PAGADOS|FINANCIERO/.test(n)) return 'gasto_financiero';
    if(/DESCUENTO|DEVOLUCION/.test(n)) return 'ing_descuentos';
    if(/ARRENDAMIENT/.test(n)) return 'ing_arrendamiento';
    if(/COMISION/.test(n)) return 'ing_comisiones';
    if(/INTERES.GANADO|RENDIMIENTO/.test(n)) return 'ing_intereses';
    if(/DIVIDENDO/.test(n)) return 'ing_dividendos';
    if(/CAMBIARIO|DIFERENCIA.CAMBIO/.test(n)) return 'ing_cambiario';
    return 'ing_ventas';
  }
  // === RESULTADOS DEUDORAS ===
  if(num.charAt(0)==='5'){
    if(/COSTO|COSTO.DE.LO.VENDIDO/.test(n)) return 'gasto_costo';
    return 'gasto_costo';
  }
  if(num.charAt(0)==='6'||num.charAt(0)==='7'){
    if(/SUELDO|SALARIO|NOMINA|HONORARIO/.test(n)) return 'gasto_nomina';
    if(/IMSS|INFONAVIT/.test(n)) return 'gasto_imss';
    if(/VENTA|COMERCIAL|DISTRIBUCI/.test(n)) return 'gasto_venta';
    if(/ADMIN|GERENCIA|DIRECCION/.test(n)) return 'gasto_admin';
    if(/FINANCIERO|INTERES.PAG|CAMBIARIO/.test(n)) return 'gasto_financiero';
    if(/DEPRECIA|AMORTIZA/.test(n)) return 'gasto_depreciacion';
    return 'gasto_admin';
  }
  // Detectar gastos no deducibles por nombre
  if(/NO.DEDUCIBLE|MULTA|SANCION|RECARGO|ACTUALIZACION|REPRESENTACION|DONATIVO/.test(n)){
    return 'gasto_no_deducible';
  }
  return 'no_aplica';
}

// Extraer cuentas de mayor de un CSV de catálogo
function docParseCatalogCSV(text){
  const rawLines=text.split('\n').map(l=>l.replace(/\r/,'')).filter(l=>l.trim());
  if(!rawLines.length) return {mayores:[],subcuentas:{},nodoMap:{},padreMap:{}};
  const sep=rawLines[0].includes(';')?';':',';
  const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'').toUpperCase();
  const limpiarNom=s=>s.split(/\s{2,}/).map(g=>{
    const ws=g.trim().split(/\s+/);
    return ws.every(w=>w.length<=1)?ws.join(''):g.trim();
  }).join(' ').trim();

  let headerIdx=-1,iCod=-1,iNom=-1,iClase=-1,iPadre=-1,iNivel=-1;
  for(let i=0;i<Math.min(rawLines.length,10);i++){
    const cols=rawLines[i].split(sep).map(c=>c.replace(/^"|"$/g,'').trim());
    cols.forEach((h,j)=>{
      const hn=norm(h);
      if(['CODIGO','CUENTA','COD','NUMERODECUENTA'].includes(hn)) iCod=j;
      if(['NOMBRE','DESCRIPCION','CONCEPTO','DENOMINACION'].includes(hn)) iNom=j;
      if(hn==='CLASE_CUENTA'||hn==='CLASECUENTA') iClase=j;
      if(hn==='CODIGO_PADRE'||hn==='CODIGOPADRE'||hn==='PADRE') iPadre=j;
      if(hn==='NIVEL'||hn==='LEVEL') iNivel=j;
    });
    if(iCod>=0){headerIdx=i;break;}
  }
  if(iCod<0){
    for(let i=0;i<Math.min(rawLines.length,15);i++){
      const cols=rawLines[i].split(sep).map(c=>c.replace(/^"|"$/g,'').trim());
      if(/^[1-9]$/.test(cols[0])&&/^\d{3,6}[-.]/.test(cols[1])){
        iNivel=0;iCod=1;iNom=2;headerIdx=i-1;break;
      }
    }
  }
  if(iCod<0) iCod=0;
  if(iNom<0) iNom=iCod+1;
  const startRow=headerIdx>=0?headerIdx+1:1;

  // Construir mapa completo: codigo → nodo con padre e hijos
  const nodoMap={};
  const padreMap={}; // cod → cod_padre (para walk-up en extracción)

  for(let i=startRow;i<rawLines.length;i++){
    const cols=rawLines[i].split(sep).map(c=>c.replace(/^"|"$/g,'').trim());
    const cod=(cols[iCod]||'').trim();
    if(!cod||!/^\d{3}/.test(cod)) continue;
    const nom=limpiarNom((cols[iNom]||'').trim());
    if(!nom) continue;
    const clase=iClase>=0?(cols[iClase]||'').trim():'';
    const padre=iPadre>=0?(cols[iPadre]||'').trim():'';
    const nivel=iNivel>=0?parseInt(cols[iNivel]||'0'):0;
    nodoMap[cod]={cod,nom,clase,padre,nivel,hijos:[]};
  }

  // Vincular padres e hijos
  Object.values(nodoMap).forEach(n=>{
    if(n.padre&&nodoMap[n.padre]){
      nodoMap[n.padre].hijos.push(n.cod);
      padreMap[n.cod]=n.padre;
    }
  });

  // Lista de mayores (compatibilidad con código existente)
  const mayorMap={};
  Object.values(nodoMap).forEach(n=>{
    const c=n.clase.toLowerCase();
    if(c==='mayor'||(!n.clase&&n.hijos.length>0)){
      const primer=n.cod.split(/[-. ]/)[0];
      if(!mayorMap[primer]) mayorMap[primer]={cuenta_mayor:primer,nombre_mayor:n.nom};
    }
  });
  // Fallback sin Clase_cuenta
  if(!Object.keys(mayorMap).length){
    Object.values(nodoMap).forEach(n=>{
      const partes=n.cod.split(/[-. ]/);
      const esMayor=partes.length===1||partes.slice(1).every(p=>/^0+$/.test(p));
      if(esMayor){
        const primer=partes[0];
        if(!mayorMap[primer]) mayorMap[primer]={cuenta_mayor:primer,nombre_mayor:n.nom};
      }
    });
  }

  const mayores=Object.values(mayorMap).sort((a,b)=>
    a.cuenta_mayor.localeCompare(b.cuenta_mayor,undefined,{numeric:true}));

  return {mayores, subcuentas:{}, nodoMap, padreMap};
}

// Procesar catálogo al subirse
async function docProcesarCatalogo(file){
  const ext=file.name.split('.').pop().toLowerCase();
  if(!['csv','txt'].includes(ext)){
    docToast('Por ahora solo se aceptan CSV para clasificación automática. PDF y Excel en próxima versión.','warn');
    return;
  }
  docToast('Procesando catálogo...','warn');
  const text=await file.text();
  const parsed=docParseCatalogCSV(text);
  const cuentas=parsed.mayores||parsed; // compatibilidad con llamadas antiguas
  if(!cuentas.length){docToast('No se encontraron cuentas en el archivo','err');return;}
  // Cargar clasificaciones existentes (mayor + subcuentas)
  let clasifExist={};
  try{
    const rows=await sbGet('catalogo_clasificacion',
      '?cliente_id=eq.'+encodeURIComponent(String(docClienteActual.id))+'&select=*');
    (rows||[]).forEach(r=>{clasifExist[r.cuenta_mayor]=r.rubro;});
  }catch(e){}
  window._nodoMap=parsed.nodoMap||{};
  window._padreMap=parsed.padreMap||{};
  docMostrarClasifDialog(cuentas, clasifExist, parsed.subcuentas||{}, parsed.nodoMap||{}, parsed.padreMap||{});
}

function docRenderNodo(cod, container, nivel, nodoMap, padreMap, clasifExist, optsGrupos){
  const nodo = nodoMap[cod];
  const nombre = nodo ? nodo.nom : cod;
  const hijos = nodo ? nodo.hijos : [];
  const clase = nodo ? (nodo.clase||'').toLowerCase() : '';
  const esAfectable = clase==='afectable';
  const tieneHijos = hijos.length > 0;

  // Color de fondo según nivel
  const bgLevels = ['#ffffff','#f8f9ff','#f0f4ff','#eaefff','#e5eaff'];
  const bg = bgLevels[Math.min(nivel, bgLevels.length-1)];
  const indent = nivel * 20;

  // Rubro actual
  const rubroActual = clasifExist[cod] || '';
  const catInfo = rubroActual ? DOC_CATS[(DOC_RUBROS.find(r=>r.id===rubroActual)||{cat:'no_aplica'}).cat] : null;
  const badgeColor = catInfo ? `background:${catInfo.bg};color:${catInfo.color}` : 'background:#f5f5f3;color:#999';
  const badgeLabel = rubroActual ? (DOC_RUBROS.find(r=>r.id===rubroActual)||{label:'No incluir'}).label : '— sin clasificar —';

  const row = document.createElement('div');
  row.id = 'nodo-'+cod.replace(/[-. ]/g,'_');
  row.style.cssText = `background:${bg};border-bottom:1px solid #f0f0ec;padding:5px 12px 5px ${8+indent}px;display:flex;align-items:center;gap:8px;cursor:${tieneHijos?'pointer':'default'}`;
  row.title = tieneHijos ? 'Doble clic para expandir/colapsar dependientes' : '';

  const expandIcon = tieneHijos ? `<span class="expand-icon" style="font-size:10px;color:#3B4BC8;width:14px;flex-shrink:0">▶</span>` : `<span style="width:14px;flex-shrink:0"></span>`;
  const codigoStyle = `font-size:11px;font-weight:700;color:#3B4BC8;white-space:nowrap;flex-shrink:0`;
  const nombreStyle = `font-size:12px;color:#444;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap`;

  row.innerHTML = `${expandIcon}
    <span style="${codigoStyle}">${cod}</span>
    <span style="${nombreStyle}">${escH(nombre)}</span>
    <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;min-width:280px">
      <span id="badge-${cod.replace(/[-. ]/g,'_')}" style="font-size:9px;padding:1px 6px;border-radius:10px;white-space:nowrap;${badgeColor}">${escH(badgeLabel)}</span>
      <select id="select-${cod.replace(/[-. ]/g,'_')}" onchange="docActualizarBadge('${cod}')"
        style="font-size:10px;padding:2px 4px;border:1px solid #ddd;border-radius:4px;max-width:160px">
        <option value="">— heredar de padre —</option>
        ${optsGrupos.replace(`value="${rubroActual}"`, `value="${rubroActual}" selected`)}
      </select>
    </div>`;

  if(tieneHijos){
    row.addEventListener('dblclick', ()=>docToggleNodoHijos(cod, container, nivel, nodoMap, padreMap, clasifExist, optsGrupos));
  }
  container.appendChild(row);

  // Contenedor de hijos (colapsado por defecto)
  const hijosDiv = document.createElement('div');
  hijosDiv.id = 'hijos-'+cod.replace(/[-. ]/g,'_');
  hijosDiv.style.display = 'none';
  container.appendChild(hijosDiv);
}

function docToggleNodoHijos(cod, container, nivel, nodoMap, padreMap, clasifExist, optsGrupos){
  const safeCod = cod.replace(/[-. ]/g,'_');
  const hijosDiv = document.getElementById('hijos-'+safeCod);
  const expandIcon = document.querySelector('#nodo-'+safeCod+' .expand-icon');
  if(!hijosDiv) return;

  if(hijosDiv.style.display==='none'){
    hijosDiv.style.display='block';
    if(expandIcon) expandIcon.textContent='▼';
    // Renderizar hijos si aún no se han renderizado
    if(!hijosDiv.children.length){
      const nodo = nodoMap[cod];
      if(nodo) nodo.hijos.forEach(hCod =>
        docRenderNodo(hCod, hijosDiv, nivel+1, nodoMap, padreMap, clasifExist, optsGrupos));
    }
  } else {
    hijosDiv.style.display='none';
    if(expandIcon) expandIcon.textContent='▶';
  }
}

function docActualizarBadge(cod){
  const safeCod = cod.replace(/[-. ]/g,'_');
  const sel = document.getElementById('select-'+safeCod);
  const badge = document.getElementById('badge-'+safeCod);
  if(!sel||!badge) return;
  const rubro = sel.value;
  // Registrar cambio en objeto de cambios (para guardar independientemente del DOM)
  if(!window._clasifChanges) window._clasifChanges={};
  if(rubro) window._clasifChanges[cod]=rubro;
  else delete window._clasifChanges[cod]; // heredar de padre = borrar override
  if(!rubro){
    badge.style.cssText='font-size:9px;padding:1px 6px;border-radius:10px;background:#f5f5f3;color:#999';
    badge.textContent='— heredar de padre —';
    return;
  }
  const rubroInfo = DOC_RUBROS.find(r=>r.id===rubro);
  const catInfo = rubroInfo ? DOC_CATS[rubroInfo.cat] : null;
  if(catInfo){
    badge.style.cssText=`font-size:9px;padding:1px 6px;border-radius:10px;background:${catInfo.bg};color:${catInfo.color}`;
    badge.textContent=rubroInfo.label;
  }
}


function docToggleSubcuentas(mayor){

  subRows.forEach(r=>r.style.display=expanded?'none':'table-row');
  if(btn) btn.innerHTML=(expanded?'▶':'▼')+' '+subRows.length;
}

async function docGuardarClasif(){
  const cuentas=window._clasifCuentas||[];
  const nodoMap=window._nodoMap||{};
  docToast('Guardando clasificación...','warn');
  const clienteId=String(docClienteActual.id);
  const nombre=docClienteActual.nombre;
  // Combinar: clasificaciones existentes en DB + cambios realizados en esta sesión
  // _clasifExist: rubros guardados en DB (cargados al abrir)
  // _clasifChanges: rubros modificados en esta sesión (rastreados por docActualizarBadge)
  const clasifExistLocal = window._clasifExist||{};
  const clasifChanges = window._clasifChanges||{};
  // Merge: changes anulan a exist
  const clasifFinal = Object.assign({}, clasifExistLocal, clasifChanges);

  // También leer selects visibles en el DOM (nodos expandidos no rastreados por change)
  document.querySelectorAll('#clasif-tree select[id^="select-"]').forEach(sel=>{
    if(!sel.value) return;
    const rawId=sel.id.replace(/^select-/,'');
    let codReal=null;
    Object.keys(nodoMap).forEach(cod=>{if(cod.replace(/[-. ]/g,'_')===rawId)codReal=cod;});
    if(!codReal) codReal=rawId.replace(/_/g,'-');
    if(sel.value) clasifFinal[codReal]=sel.value;
    else delete clasifFinal[codReal];
  });

  const rows=Object.entries(clasifFinal)
    .filter(([cod,rubro])=>rubro&&rubro!=='')
    .map(([cod,rubro])=>{
      const nodo=nodoMap[cod];
      return {
        cliente_id:clienteId,
        cliente_nombre:nombre,
        cuenta_mayor:cod,
        nombre_mayor:nodo?nodo.nom:cod,
        rubro,
        cedulas:'',
        updated_at:nowISO()
      };
    });

  if(!rows.length){
    docToast('Sin clasificaciones para guardar. Asigna rubros a las cuentas.','warn');
    btn.innerHTML='💾 Guardar clasificación';btn.disabled=false;return;
  }
  try{
    // Primero eliminar clasificaciones existentes del cliente
    await fetch(SB_URL+'/rest/v1/catalogo_clasificacion?cliente_id=eq.'+encodeURIComponent(clienteId),{
      method:'DELETE',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
    });
    // Luego insertar todas las nuevas
    const res=await fetch(SB_URL+'/rest/v1/catalogo_clasificacion',{
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,
        'Content-Type':'application/json',
        'Prefer':'return=minimal'},
      body:JSON.stringify(rows)
    });
    if(!res.ok) throw new Error(await res.text());
    // Actualizar cache local
    docClasifCache={};
    rows.forEach(r=>{docClasifCache[r.cuenta_mayor]=r.rubro;});
    document.getElementById('doc-clasif-modal')?.remove();
    docToast('Clasificación guardada — '+rows.length+' cuentas','ok');
    // Refrescar la vista para mostrar estado actualizado
    const ejs=[...new Set(docCacheFin.map(d=>d.ejercicio).filter(Boolean))].sort((a,b)=>b-a);
    if(!ejs.includes(docEjercicio))ejs.unshift(docEjercicio);
    docSetTab('financiero');
  }catch(e){docToast('Error guardando: '+e.message,'err');}
}

// Extractor CSV USANDO clasificaciones guardadas
function docExtraerCSVConClasif(text, clasifMap){
  // ===========================================================
  // DETECTAR FORMATO
  // A) EXTRAIDA: generado por TaxIA desde PDF
  //    Header: "linea","texto_extraido"
  //    Cada row tiene el texto crudo de la balanza
  // B) ESTÁNDAR CONTPAQi: CSV directo del sistema contable
  // ===========================================================
  const rawLines = text.split('\n').map(l=>l.replace(/\r/,'')).filter(l=>l.trim());
  if(!rawLines.length) return {};

  const sep = rawLines[0].includes(';') ? ';' : ',';
  const h0 = rawLines[0].replace(/^"|"$/g,'').toLowerCase();
  const isExtraida = h0.includes('texto_extraido') || h0.includes('tipo_registro');

  // Mapa de clasificación → categoría principal
  const catMap = {};
  DOC_RUBROS.forEach(r=>{ catMap[r.id] = r.cat; });
  const RESULTADO_CATS = new Set(['resultado_acreedor','resultado_deudor']);

  const acum = {
    activo:0, pasivo:0, capital:0,
    resultado_acreedor:0, resultado_deudor:0,
    resultado_acreedor_acum:0, resultado_deudor_acum:0,
    detalle:{}, detalle_acum:{}
  };

  // ===== PARSER PARA FORMATO EXTRAIDA =====
  if(isExtraida){
    // Extraer solo las líneas de texto de la balanza
    // CLAVE: usar regex para extraer la 2ª columna completa respetando comillas
    // (split por coma destruye los números con separador de miles: 49,091,216.00)
    const textoLines = [];
    for(let i=1; i<rawLines.length; i++){
      const line = rawLines[i];
      // Extraer segunda columna completa: "numero","CONTENIDO CON,COMAS,INTERNAS"
      const m2 = line.match(/^"[^"]*","(.*)"$/);
      if(!m2) continue;
      const txt = m2[1].trim();
      if(!txt || txt.length < 10) continue;
      // Verificar que empieza con código de cuenta XXX-XXXX-XXXX
      if(!/^\d{3}-\d{3,4}-\d{3,4}/.test(txt)) continue;
      textoLines.push(txt);
    }

    // Parsear cada línea de texto crudo de la balanza
    // Formato CONTPAQi: "XXX-XXXX-XXXXNOMBRE saldoIni cargos abonos saldoAct"
    const parseNum = s => parseFloat((s||'').replace(/,/g,'')) || 0;

    // Paso 1: detectar mayors con cuenta "XXX-0000-0000"
    const mayorConCero = new Set();
    textoLines.forEach(txt => {
      const m = txt.match(/^(\d{3})-(\d{3,4})-(\d{3,4})/);
      if(!m) return;
      const seg1=m[2], seg2=m[3];
      if(/^0+$/.test(seg1) && /^0+$/.test(seg2)){
        if(m[1]!=='000') mayorConCero.add(m[1]);
      }
    });

    // Paso 2: parsear y acumular
    textoLines.forEach(txt => {
      const m = txt.match(/^(\d{3})-(\d{3,4})-(\d{3,4})/);
      if(!m) return;
      const mayor = m[1];
      if(mayor === '000') return; // encabezados
      const seg1=m[2], seg2=m[3];
      const esCero = /^0+$/.test(seg1) && /^0+$/.test(seg2);

      // Aplicar regla: si tiene XXX-0000-0000 solo usar ese
      if(mayorConCero.has(mayor) && !esCero) return;

      // Búsqueda jerárquica: código completo → sub-mayor → mayor → ancestro
      const padreMapLocal = window._padreMap||{};
      const codCompleto = m[1]+'-'+m[2]+'-'+m[3]; // ej: "501-0601-0000"
      const subMayor = m[1]+'-'+m[2]; // ej: "501-0601"
      const subId = clasifMap[codCompleto]
        || clasifMap[subMayor]
        || clasifMap[mayor]
        || docBuscarClasifJerarquica(codCompleto, clasifMap, padreMapLocal);
      if(!subId || subId==='no_aplica') return;
      const cat = catMap[subId] || subId;

      // Extraer números del texto (últimos 4 grupos numéricos)
      const nums = [];
      const numRegex = /([\d,]+\.\d{2})/g;
      let nm;
      while((nm = numRegex.exec(txt)) !== null) nums.push(parseNum(nm[1]));

      if(nums.length < 2) return;
      // Columnas: [saldoIni, cargos, abonos, saldoAct] o [saldoIni, saldoAct]
      const saldoIni = nums[0];
      const cargos   = nums.length >= 4 ? nums[nums.length-3] : 0;
      const abonos   = nums.length >= 4 ? nums[nums.length-2] : 0;
      const saldoAct = nums[nums.length-1];

      if(RESULTADO_CATS.has(cat)){
        const mov = cat==='resultado_acreedor' ? (abonos-cargos) : (cargos-abonos);
        if(mov){
          acum[cat] += mov;
          if(!acum.detalle[subId]) acum.detalle[subId]=0;
          acum.detalle[subId] += mov;
        }
        if(saldoAct){
          const acumKey = cat+'_acum';
          acum[acumKey] = (acum[acumKey]||0) + saldoAct;
          if(!acum.detalle_acum[subId]) acum.detalle_acum[subId]=0;
          acum.detalle_acum[subId] += saldoAct;
        }
      } else {
        if(saldoAct){
          acum[cat] += saldoAct;
          if(!acum.detalle[subId]) acum.detalle[subId]=0;
          acum.detalle[subId] += saldoAct;
        }
      }
    });

    return acum;
  }

  // ===== PARSER PARA FORMATO ESTÁNDAR CONTPAQi CSV =====
  const header = rawLines[0].split(sep).map(h=>h.replace(/^"|"$/g,'').trim().toUpperCase());
  const norm = s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'');

  let iC=0, iN=1, iSI=-1, iCargos=-1, iAbonos=-1, iSA=-1;
  header.forEach((h,i)=>{
    const hn=norm(h);
    if(['CODIGO','CUENTA','COD','NUMERODECUENTA'].includes(hn)) iC=i;
    if(['NOMBRE','DESCRIPCION','CONCEPTO'].includes(hn)) iN=i;
    if(/^CARGOS$|DEBITOS|MOVIMIENTODEBE/.test(hn)) iCargos=i;
    if(/^ABONOS$|CREDITOS|MOVIMIENTOHABER/.test(hn)) iAbonos=i;
    if(/SALDOACTUAL|SALDOFINAL|SALDO_ACT/.test(hn)&&!/DEUDOR|ACREEDOR/.test(hn)) iSA=i;
  });

  if(iCargos<0||iAbonos<0||iSA<0){
    const numericCols=new Set();
    for(let row=1;row<Math.min(rawLines.length,5);row++){
      const cols=rawLines[row].split(sep).map(c=>c.replace(/^"|"$/g,'').trim());
      cols.forEach((v,i)=>{ if(i>1&&(parseFloat(v.replace(/[$, ]/g,''))!==0||v==='0.00'||v==='0')) numericCols.add(i); });
    }
    const un=[...numericCols].sort((a,b)=>a-b);
    if(un.length>=4){ if(iSI<0)iSI=un[0]; if(iCargos<0)iCargos=un[1]; if(iAbonos<0)iAbonos=un[2]; if(iSA<0)iSA=un[un.length-1]; }
  }
  if(iSA<0) iSA=header.length-1;

  // Paso 1: detectar mayors con cuenta "XXX-0000"
  const mayorConCero=new Set();
  for(let i=1;i<rawLines.length;i++){
    const cols=rawLines[i].split(sep).map(c=>c.replace(/^"|"$/g,'').trim());
    const num=(cols[iC]||'').trim();
    if(!num||!/^\d{3,6}([-.]|$)/.test(num)) continue;
    const partes=num.split(/[-. ]/);
    if(partes[0]==='000') continue;
    if(partes.length>=2&&partes.slice(1).every(p=>/^0+$/.test(p))) mayorConCero.add(partes[0]);
  }

  // Paso 2: procesar
  for(let i=1;i<rawLines.length;i++){
    const cols=rawLines[i].split(sep).map(c=>c.replace(/^"|"$/g,'').trim());
    const num=(cols[iC]||'').trim();
    if(!num||!/^\d{3,6}([-.]|$)/.test(num)) continue;
    const partes=num.split(/[-. ]/);
    const mayor=partes[0];
    if(mayor==='000') continue;
    const esCero=partes.length>=2&&partes.slice(1).every(p=>/^0+$/.test(p));
    if(mayorConCero.has(mayor)&&!esCero) continue;
    // Búsqueda jerárquica: código completo → mayor → ancestro
    const padreMapStd = window._padreMap||{};
    const codeCompleto=partes.slice(0,2).join('-');
    const subId=clasifMap[codeCompleto]
      ||clasifMap[mayor]
      ||docBuscarClasifJerarquica(mayor, clasifMap, padreMapStd);
    if(!subId||subId==='no_aplica') continue;
    const cat=catMap[subId]||subId;
    let valor=0;
    if(RESULTADO_CATS.has(cat)){
      const cargos=parseFloat((cols[iCargos]||'').replace(/[$, ]/g,''))||0;
      const abonos=parseFloat((cols[iAbonos]||'').replace(/[$, ]/g,''))||0;
      const mov=cat==='resultado_acreedor'?(abonos-cargos):(cargos-abonos);
      if(mov){ acum[cat]+=mov; if(!acum.detalle[subId])acum.detalle[subId]=0; acum.detalle[subId]+=mov; }
      const sa=Math.abs(parseFloat((cols[iSA]||'').replace(/[$, ]/g,''))||0);
      if(sa){ const ak=cat+'_acum'; acum[ak]=(acum[ak]||0)+sa; if(!acum.detalle_acum[subId])acum.detalle_acum[subId]=0; acum.detalle_acum[subId]+=sa; }
    } else {
      valor=parseFloat((cols[iSA]||'').replace(/[$, ]/g,''))||0;
      if(valor){ acum[cat]+=valor; if(!acum.detalle[subId])acum.detalle[subId]=0; acum.detalle[subId]+=valor; }
    }
  }
  return acum;
}

async function docRecalcularBalanza(docId, archivoUrl){
  if(!archivoUrl){docToast('No hay archivo disponible para recalcular','warn');return;}
  docToast('↺ Recalculando cifras con clasificación actual...','warn');
  try{
    // Cargar clasificación actualizada
    if(!docClasifCache||Object.keys(docClasifCache).length===0) await docCargarClasif();
    const tieneClasif=docClasifCache&&Object.keys(docClasifCache).filter(k=>!k.endsWith('_cedulas')).length>0;
    if(!tieneClasif){
      docToast('Clasifica el catálogo de cuentas primero para poder recalcular','warn');
      return;
    }
    // Descargar el archivo CSV desde Storage
    const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzY3RnemJxYWR1Y2doaXZhbWZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0ODk2MDUsImV4cCI6MjA5MDA2NTYwNX0.w2yWu_hwSW69rnGsiD6FCqHe7GaNuLD_lU3WdgbidKI';
    const r=await fetch(archivoUrl,{headers:{'Authorization':'Bearer '+AK,'apikey':AK}});
    if(!r.ok) throw new Error('No se pudo descargar el archivo ('+r.status+')');
    const text=await r.text();
    // Re-extraer cifras con la clasificación actual
    const cifras=docExtraerCSVConClasif(text,docClasifCache);
    if(!cifras||!Object.keys(cifras).length){
      docToast('No se pudieron extraer cifras. Verifica la clasificación del catálogo.','warn');
      return;
    }
    // Actualizar cifras en la base de datos
    await sbPatch('client_documents','?id=eq.'+encodeURIComponent(docId),{cifras});
    // Actualizar el cache local
    const idx=[...docCacheGen,...docCacheFin].findIndex(d=>String(d.id)===String(docId));
    const doc=[...docCacheGen,...docCacheFin].find(d=>String(d.id)===String(docId));
    if(doc) doc.cifras=cifras;
    docToast('✓ Cifras recalculadas con la clasificación actual','ok');
    // Refrescar la vista
    docSetTab('financiero');
  }catch(e){docToast('Error al recalcular: '+e.message,'err');}
}

function docBuscarClasifJerarquica(cod, clasifMap, padreMap){
  let cur = cod;

    if(clasifMap[cur]&&clasifMap[cur]!=='no_aplica') return clasifMap[cur];

function docExtraerCSV(text){
  // Soporta formato: cuenta,nombre,saldo_inicial,cargos,abonos,saldo_actual
  const lines=text.split('\n').map(l=>l.replace(/\r/,'')).filter(l=>l.trim());
  if(!lines.length)return{};
  const sep=lines[0].includes(';')?';':',';
  const header=lines[0].split(sep).map(h=>h.replace(/^"|"$/g,'').trim().toUpperCase());

  // Detectar columnas — preferir saldo_actual sobre saldo_inicial
  let iC=0,iN=1,iS=-1;
  header.forEach((h,i)=>{
    if(/^CUENTA$|^COD|^NUMERO/.test(h)) iC=i;
    else if(/^NOMBRE$|^DESCRIPCION|^CONCEPTO/.test(h)) iN=i;
    // Buscar columna de saldo final/actual (no inicial)
    else if(/SALDO.?ACTUAL$|^SALDO_ACTUAL$|SALDO.?FINAL$|SALDO.?NETO$|SALDO.?ACTUAL.?NETO$|^BALANCE$/.test(h)) iS=i;
  });
  // Fallback: buscar ACTUAL primero, luego cualquier SALDO
  if(iS<0){
    let iFirst=-1;
    for(let i=0;i<header.length;i++){
      if(/SALDO/i.test(header[i])){
        if(/ACTUAL/i.test(header[i])){iS=i;break;} // Preferir saldo_actual
        if(iFirst<0) iFirst=i;
      }
    }
    if(iS<0) iS=iFirst>=0?iFirst:header.length-1;
  }

  let ingresos=0,costo_ventas=0,gastos_operacion=0,otros_ingresos=0,otros_gastos=0;
  let activo_fijo_bruto=0,depreciacion_acumulada=0,cuentas_por_cobrar=0;
  let cuentas_por_pagar=0,inventarios=0,bancos=0;

  for(let i=1;i<lines.length;i++){
    const cols=lines[i].split(sep).map(c=>c.replace(/^"|"$/g,'').trim());
    const num=(cols[iC]||'').trim();
    const nom=(cols[iN]||'').toUpperCase();
    const saldo=parseFloat((cols[iS]||'').replace(/[$, ]/g,''))||0;
    if(!num||saldo===0) continue;

    // Excluir cuentas título (últimos 2 segmentos son todos ceros)
    const partes=num.split('-');
    if(partes.length>2){
      const ult=partes.slice(-2);
      if(ult.filter(p=>/^0+$/.test(p)).length>=2) continue;
    }

    const p=num.charAt(0);

    if(p==='4'){
      // Cuentas 4xxx: saldo positivo=ingreso, negativo=gasto financiero
      if(saldo>0) ingresos+=saldo;
      else otros_gastos+=Math.abs(saldo);
    } else if(p==='5'){
      costo_ventas+=Math.abs(saldo);
    } else if(p==='6'||p==='7'){
      if(/FINANCIERO|INTERES|CAMBIARIO|BANCARI/.test(nom)) otros_gastos+=Math.abs(saldo);
      else gastos_operacion+=Math.abs(saldo);
    } else if(p==='1'){
      if(/BANCO|CAJA/.test(nom)||/^112/.test(num)) bancos+=saldo;
      else if(/CLIENTE|DEUDOR/.test(nom)||/^113/.test(num)) cuentas_por_cobrar+=saldo;
      else if(/INVENTARIO|MERCANCIA|ALMACEN/.test(nom)) inventarios+=Math.abs(saldo);
      else if(/TERRENO|EDIFICIO|MAQUINARIA|EQUIPO|MOBILIARIO|VEHICULO/.test(nom)&&!/DEPRECIA/.test(nom)) activo_fijo_bruto+=Math.abs(saldo);
      else if(/DEPRECIA|AMORTIZA/.test(nom)) depreciacion_acumulada+=Math.abs(saldo);
    } else if(p==='2'){
      if(/PROVEEDOR|ACREEDOR/.test(nom)||/^220|^201|^202/.test(num)) cuentas_por_pagar+=Math.abs(saldo);
    }
  }
  return{ingresos,costo_ventas,gastos_operacion,otros_ingresos,otros_gastos,
         activo_fijo_bruto,depreciacion_acumulada,cuentas_por_cobrar,
         cuentas_por_pagar,inventarios,bancos};
}

async function docVerER(ejercicio, mes){
  // Cargar balanzas del ejercicio con cifras
  docToast('Generando Estado de Resultados...','warn');
  try{
    const clienteId=String(docClienteActual.id);
    const docs=await sbGet('client_documents',
      '?cliente_id=eq.'+encodeURIComponent(clienteId)+
      '&ejercicio=eq.'+ejercicio+'&tipo=eq.balanza&select=mes,cifras,nombre_archivo'+
      '&order=mes.asc');

    // Construir mapa mes→cifras
    const cifrasPorMes={};
    (docs||[]).forEach(d=>{
      if(d.cifras&&Object.keys(d.cifras).length>0) cifrasPorMes[d.mes]=d.cifras;
    });

    const cifrasMes=cifrasPorMes[mes];
    if(!cifrasMes){
      docToast('La balanza de '+DOC_MESES_L[mes-1]+' no tiene cifras extraídas. Extráelas primero.','warn');
      return;
    }

    // Preparar extractor de valores (mes + acumulado)
    const getMes=(rubros)=>rubros.reduce((s,r)=>s+(cifrasMes.detalle?.[r]||0),0);
    const getAcum=(rubros)=>rubros.reduce((s,r)=>s+(cifrasMes.detalle_acum?.[r]||0),0);

    const fmtM=(v,negativo)=>{
      if(!v&&v!==0) return '<span style="color:#bbb">—</span>';
      const n=negativo?-v:v;
      const style=n<0?'color:#A32D2D':n>0?'':'color:#bbb';
      return `<span style="${style}">${new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:0}).format(n)}</span>`;
    };

    // Calcular todos los subtotales
    const calc=(rubros,det,acum)=>{
      const vm=getMes(rubros);
      const va=getAcum(rubros);
      return {mes:vm,acum:va};
    };

    // Construir filas del ER
    const tots={ingresos_netos:{m:0,a:0},utilidad_bruta:{m:0,a:0},
      gastos_op:{m:0,a:0},util_op:{m:0,a:0},
      rif:{m:0,a:0},util_antes_otros:{m:0,a:0},
      otros_neto:{m:0,a:0},util_antes_isr:{m:0,a:0},util_neta:{m:0,a:0}};

    // Acumuladores rodantes
    let acum={m:0,a:0};
    const lineas=[];

    ER_ESTRUCTURA.forEach(row=>{
      if(row.tipo==='seccion'){
        lineas.push({tipo:'seccion',label:row.label});
        return;
      }
      if(row.tipo==='linea'){
        const vm=getMes(row.rubros)*row.signo;
        const va=getAcum(row.rubros)*row.signo;
        acum.m+=vm; acum.a+=va;
        if(vm!==0||va!==0){
          lineas.push({tipo:'linea',label:row.label,vm,va,signo:row.signo});
        }
        return;
      }
      if(row.tipo==='subtotal'||row.tipo==='total'){
        // El acumulador rodante 'acum' ya lleva la suma correcta.
        // Solo guardamos y mostramos su valor — sin ningún re-cálculo adicional.
        tots[row.key]={m:acum.m,a:acum.a};
        lineas.push({tipo:row.tipo,label:row.label,vm:acum.m,va:acum.a,enfasis:row.enfasis});
      }
    });

    // Renderizar HTML del ER
    const mesesDisp=Object.keys(cifrasPorMes).map(Number).sort((a,b)=>a-b);
    const mesSelector=mesesDisp.map(m=>
      `<button onclick="docVerER(${ejercicio},${m})" style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid ${m===mes?'#3B4BC8':'#ddd'};background:${m===mes?'#3B4BC8':'#fff'};color:${m===mes?'#fff':'#555'}">${DOC_MESES_L[m-1]}</button>`
    ).join('');

    const fmtCel=(v,tipo)=>{
      const fmt=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:0});
      if(v===0&&tipo==='linea') return '<span style="color:#ddd">—</span>';
      const c=v<0?'#A32D2D':v>0?'#1a1a1a':'#bbb';
      const w=(tipo==='total'||tipo==='subtotal')&&tipo!=='seccion'?'font-weight:700':'';
      return `<span style="color:${c};${w}">${fmt.format(v)}</span>`;
    };

    const rows=lineas.map(l=>{
      if(l.tipo==='seccion') return `
        <tr><td colspan="3" style="padding:10px 12px 4px;font-size:10px;font-weight:700;letter-spacing:1px;color:#3B4BC8;text-transform:uppercase;background:#E6F1FB;border-top:2px solid #3B4BC8">${escH(l.label)}</td></tr>`;
      if(l.tipo==='linea') return `
        <tr style="border-bottom:1px solid #f5f5f3">
          <td style="padding:5px 12px 5px 24px;font-size:12px;color:#444">${escH(l.label)}</td>
          <td style="padding:5px 12px;font-size:12px;text-align:right;white-space:nowrap">${fmtCel(l.vm,'linea')}</td>
          <td style="padding:5px 12px;font-size:12px;text-align:right;white-space:nowrap;background:#fafafe">${fmtCel(l.va,'linea')}</td>
        </tr>`;
      const bg=l.tipo==='total'?'#EAF3DE':l.enfasis?'#E6F1FB':'#f5f5f3';
      const bdr=l.tipo==='total'?'border-top:2px solid #3B6D11':'border-top:1px solid #c5d0ff';
      return `
        <tr style="background:${bg};${bdr}">
          <td style="padding:7px 12px;font-size:12px;font-weight:700;color:${l.tipo==='total'?'#3B6D11':'#3B4BC8'}">${escH(l.label)}</td>
          <td style="padding:7px 12px;font-size:13px;font-weight:700;text-align:right;white-space:nowrap">${fmtCel(l.vm,l.tipo)}</td>
          <td style="padding:7px 12px;font-size:13px;font-weight:700;text-align:right;white-space:nowrap;background:${bg}">${fmtCel(l.va,l.tipo)}</td>
        </tr>`;
    }).join('');

    const m2=document.createElement('div');m2.className='modal-overlay';m2.id='doc-er-modal';
    m2.innerHTML=`<div class="modal-box" style="max-width:720px;max-height:94vh;padding:0;overflow:hidden">
      <div style="padding:16px 20px 0;background:#3B4BC8;color:#fff">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
          <div>
            <div style="font-size:13px;opacity:.8">Estado de Resultados — NIF B-3</div>
            <div style="font-size:17px;font-weight:700">${escH(docClienteActual.nombre)}</div>
          </div>
          <button onclick="document.getElementById('doc-er-modal').remove()" style="background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:16px">✕</button>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px">${mesSelector}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr auto auto;padding:8px 12px 6px;background:#f5f5f3;border-bottom:1px solid #e0e0db;font-size:11px;font-weight:700;color:#888">
        <div>Concepto</div>
        <div style="text-align:right;padding:0 12px;min-width:130px">${DOC_MESES_L[mes-1]} ${ejercicio}</div>
        <div style="text-align:right;padding:0 12px;min-width:130px;background:#fafafe">Acumulado ${ejercicio}</div>
      </div>
      <div style="overflow-y:auto;max-height:calc(94vh - 180px)">
        <table style="width:100%;border-collapse:collapse">${rows}</table>
      </div>
      <div style="padding:10px 16px;border-top:1px solid #e0e0db;display:flex;justify-content:flex-end;gap:8px">
        <button class="btn btn-sm btn-purple" onclick="docImprimirER(${ejercicio},${mes})">⎙ Imprimir</button>
        <button class="btn btn-sm" onclick="document.getElementById('doc-er-modal').remove()">Cerrar</button>
      </div>
    </div>`;
    document.body.appendChild(m2);
  }catch(e){docToast('Error: '+e.message,'err');}
}

function docImprimirER(ejercicio, mes){
  const modal=document.getElementById('doc-er-modal');
  if(!modal) return;
  const contenido=modal.querySelector('.modal-box').innerHTML;
  const win=window.open('','_blank');

  win.document.close();
}

// Parsear archivo CSV o Excel
async function afProcesarArchivo(input){
  const file = input.files[0];
  if(!file) return;
  const err = document.getElementById('af-masivo-err');
  const prev = document.getElementById('af-masivo-preview');
  err.style.display='none'; prev.style.display='none';

  try{
    let rows = [];
    const ext = file.name.split('.').pop().toLowerCase();

    if(ext==='csv'){
      const txt = await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=e=>res(e.target.result);fr.onerror=rej;fr.readAsText(file,'utf-8');});
      rows = afParsearCSV(txt);
    } else if(ext==='xlsx'||ext==='xls'){
      if(typeof XLSX==='undefined'){err.textContent='Cargando librería Excel...';err.style.display='block';return;}
      const buf = await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=e=>res(e.target.result);fr.onerror=rej;fr.readAsArrayBuffer(file);});
      const wb = XLSX.read(buf,{type:'arraybuffer',cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws,{raw:false,dateNF:'YYYY-MM-DD'});
      rows = data.map(r=>({
        nombre: r['nombre']||r['Nombre']||r['NOMBRE']||'',
        clasificacion_fiscal: r['clasificacion_fiscal']||r['Clasificacion Fiscal']||r['clasificacion']||'',
        porcentaje_depreciacion: parseFloat(r['porcentaje_depreciacion']||r['Porcentaje']||r['pct']||0),
        monto_adquisicion: parseFloat((String(r['monto_adquisicion']||r['Monto']||r['monto']||0)).replace(/[$, ]/g,'')),
        fecha_adquisicion: r['fecha_adquisicion']||r['Fecha']||r['fecha']||'',
        descripcion: r['descripcion']||r['Descripcion']||r['descripción']||''
      }));
    } else {
      throw new Error('Formato no soportado. Usa CSV o Excel.');
    }

    // Validar y mostrar preview
    const validos = rows.filter(r=>r.nombre&&r.monto_adquisicion>0&&r.fecha_adquisicion);
    const invalidos = rows.length - validos.length;
    if(!validos.length) throw new Error('No se encontraron filas válidas. Verifica el formato.');

    afMostrarPreviewMasivo(validos, invalidos);

  }catch(e){
    err.textContent='Error: '+e.message; err.style.display='block';
  }
}

function afParsearCSV(txt){
  const lines = txt.split('\n').map(l=>l.replace(/\r/,'').trim()).filter(l=>l&&!l.startsWith('#'));
  if(!lines.length) return [];
  const sep = lines[0].includes(';')?';':',';
  const header = lines[0].split(sep).map(h=>h.replace(/^"|"$/g,'').trim().toLowerCase());
  return lines.slice(1).map(line=>{
    const cols = line.split(sep).map(c=>c.replace(/^"|"$/g,'').trim());
    const obj = {};
    header.forEach((h,i)=>obj[h]=cols[i]||'');
    return {
      nombre: obj.nombre||'',
      clasificacion_fiscal: obj.clasificacion_fiscal||obj.clasificacion||'',
      porcentaje_depreciacion: parseFloat(obj.porcentaje_depreciacion||obj.pct||0)||0,
      monto_adquisicion: parseFloat((obj.monto_adquisicion||obj.monto||'0').replace(/[$, ]/g,''))||0,
      fecha_adquisicion: obj.fecha_adquisicion||obj.fecha||'',
      descripcion: obj.descripcion||''
    };
  });
}
