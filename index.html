<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f3;color:#1a1a1a;min-height:100vh}
.app{max-width:780px;margin:0 auto;padding:1.5rem 1rem}
.card{background:#fff;border:1px solid #e5e5e0;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem}
.sec-label{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.av-m{background:#f0f7d4;color:#3B4BC8}.av-a{background:#f0f7d4;color:#5a8a1a}
.av-y{background:#FAEEDA;color:#633806}.av-b{background:#FBEAF0;color:#72243E}.av-x{background:#E6F1FB;color:#0C447C}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;font-weight:500}
.badge-admin{background:#f0f7d4;color:#3B4BC8}.badge-mgr{background:#f0f7d4;color:#5a8a1a}
.badge-ast{background:#FAEEDA;color:#633806}.badge-ok{background:#f0f7d4;color:#5a8a1a}
.badge-miss{background:#FEF3C7;color:#92400E}.badge-group{background:#E6F1FB;color:#0C447C}
.badge-assigned{background:#EEEDFE;color:#3B4BC8;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:500;display:inline-block}
.badge-done{background:#f0f7d4;color:#5a8a1a}.badge-pending{background:#FEF3C7;color:#92400E}
.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:1rem}
.metric{background:#f5f5f3;border-radius:8px;padding:12px}
.metric-label{font-size:12px;color:#888;margin-bottom:4px}
.metric-val{font-size:22px;font-weight:600;color:#1a1a1a}
input[type=text],input[type=email],input[type=password]{width:100%;padding:8px 10px;font-size:14px;border:1px solid #e0e0db;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;font-family:inherit}
input:focus{border-color:#7F77DD;box-shadow:0 0 0 3px rgba(127,119,221,.12)}
select{padding:8px 10px;font-size:14px;border:1px solid #e0e0db;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;font-family:inherit}
select:focus{border-color:#7F77DD}
.btn{padding:9px 16px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid #e0e0db;border-radius:8px;background:#f5f5f3;color:#1a1a1a;font-family:inherit}
.btn:hover{background:#eaeae7}.btn:active{transform:scale(.98)}
.btn-purple{border:1.5px solid #3B4BC8;background:#f0f7d4;color:#3B4BC8}.btn-purple:hover{background:#d6e8a0}
.btn-primary{background:#3B4BC8;color:#fff;border-color:#3B4BC8}.btn-primary:hover{background:#3B4BC8}
.btn-success{background:#8DC63F;color:#fff;border-color:#8DC63F}.btn-success:hover{background:#6a9e22}
.btn-full{width:100%;margin-top:8px}.btn-sm{padding:5px 12px;font-size:12px}
.btn-danger{color:#dc2626;border-color:#fca5a5;background:#fff}.btn-danger:hover{background:#fef2f2}
.err-msg{font-size:12px;color:#dc2626;margin-top:4px;display:none}
.ok-msg{font-size:13px;color:#5a8a1a;background:#f0f7d4;border-radius:8px;padding:8px 12px;margin-top:8px;display:none}

.analysis-box{background:#f5f5f3;border-radius:8px;padding:1rem;font-size:14px;color:#1a1a1a;line-height:1.7;min-height:60px}
.hist-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #e5e5e0}

.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #e0e0db;border-top-color:#3B4BC8;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-bar-wrap{background:#f0f0ec;border-radius:999px;height:10px;flex:1;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:999px;transition:width .4s}

.news-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}

.news-card:hover{border-color:#3B4BC8;box-shadow:0 4px 16px rgba(59,75,200,0.12);transform:translateY(-1px)}
.news-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.news-fuente{font-size:10px;font-weight:700;color:#3B4BC8;background:#EEEDFE;padding:2px 8px;border-radius:4px}
.news-fecha{font-size:10px;color:#bbb}
.news-titulo{font-size:13px;font-weight:600;color:#1a1a1a;margin-bottom:4px;line-height:1.4}
.news-resumen{font-size:11px;color:#666;line-height:1.5;margin-bottom:6px}
.news-link{font-size:11px;color:#3B4BC8;font-weight:600}

.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.45);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal-box{background:#fff;border-radius:14px;padding:1.5rem;width:90%;max-width:420px;box-shadow:0 8px 40px rgba(0,0,0,0.15)}
.modal-title{font-size:15px;font-weight:600;color:#1a1a1a;margin-bottom:4px}
.modal-sub{font-size:13px;color:#888;margin-bottom:1rem}
.motivo-opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid #e0e0db;border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.motivo-opt:hover{background:#f0f4ff;border-color:#3B4BC8}
.motivo-opt.selected{background:#EEEDFE;border-color:#3B4BC8}
.motivo-num{width:22px;height:22px;border-radius:50%;background:#3B4BC8;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.motivo-text{font-size:13px;color:#1a1a1a;line-height:1.4}
.tarea-header{display:flex;align-items:flex-start;gap:10px}
.tarea-check{width:20px;height:20px;border-radius:50%;border:2px solid #d1d1d1;flex-shrink:0;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.tarea-check.checked{background:#8DC63F;border-color:#8DC63F}
.tarea-check.checked::after{content:'✓';color:#fff;font-size:11px;font-weight:700}
.tarea-check.disabled{cursor:default;opacity:.4}
.tarea-body{flex:1}
.tarea-desc{font-size:14px;font-weight:500;color:#1a1a1a;margin-bottom:4px}
.tarea-desc.done-text{text-decoration:line-through;color:#999}
.tarea-meta{font-size:12px;color:#888;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tarea-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.new-tarea-row{display:flex;gap:8px;margin-top:4px}
.slot-empty{background:#fafaf8;border:1.5px dashed #e0e0db;border-radius:10px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.slot-num{font-size:12px;color:#bbb;min-width:20px;text-align:center}
@media(max-width:520px){.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.bottom-nav{gap:4px}.bnav-item{padding:7px 10px;font-size:12px}.new-tarea-row{flex-direction:column}}

/* ===== PORTADA MÓDULOS ===== */
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mod-card{background:#fff;border:1.5px solid #e5e5e0;border-radius:14px;padding:20px 16px;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.mod-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);transform:translateY(-2px)}
@media(max-width:480px){.mod-grid{grid-template-columns:repeat(2,1fr)}.mod-card{padding:14px 12px}}
</style>

<script>

  {src:'El Informador',date:'Ene 2026',title:'Buzón Tributario: SAT intensifica notificaciones electrónicas en 2026',summary:'El SAT ha incrementado el uso del Buzón Tributario para enviar requerimientos. Se recomienda revisar el buzón al menos cada 3 días para evitar notificaciones por estrados.',url:'https://www.informador.mx'}

const SB_URL='https://ysctgzbqaducghivamff.supabase.co';
const SB_KEY='sb_publishable_t3OG3DkHfRGxVA1hrnJUbg_kRZ6hbM8';
const RESEND_KEY='re_af8ioNRf_PL4mNcXJTDq7eRk6t8HM7DZr';
const FROM_EMAIL='onboarding@resend.dev';
let session=null,usersCache={},clientesCache=[],gruposCache=[];

// ===== MÓDULOS DEL SISTEMA =====
const ALL_MODULES=[
  {id:'plan',       label:'Mis Tareas',            icon:'✅', desc:'Planeación diaria y seguimiento de tareas',       color:'#3B4BC8', bg:'#EEEDFE'},
  {id:'devoluciones',label:'Devoluciones IVA',     icon:'🔄', desc:'Gestión de trámites de devolución ante el SAT',  color:'#0C447C', bg:'#E6F1FB'},
  {id:'proyeccion', label:'Proyección Fiscal',     icon:'📊', desc:'Estimación de ISR y escenarios fiscales',        color:'#5a8a1a', bg:'#EAF3DE'},
  {id:'da_pm',      label:'Declaración Anual',     icon:'📋', desc:'Papeles de trabajo Declaración Anual PM',        color:'#633806', bg:'#FAEEDA'},
  {id:'pp',         label:'Pagos Provisionales',   icon:'💳', desc:'Cálculo y control de pagos provisionales',       color:'#72243E', bg:'#FBEAF0'},
  {id:'dashboard',  label:'Dashboard',             icon:'📈', desc:'Métricas y resumen general del despacho',        color:'#1a1a1a', bg:'#f5f5f3'},
  {id:'clientes',   label:'Clientes',              icon:'🏢', desc:'Directorio de clientes y grupos',               color:'#374151', bg:'#f3f4f6'},
  {id:'historial',  label:'Historial',             icon:'📅', desc:'Registro histórico de actividades',             color:'#374151', bg:'#f3f4f6'},
  {id:'admin',      label:'Usuarios',              icon:'👥', desc:'Administración de usuarios y accesos',           color:'#374151', bg:'#f3f4f6'},
  {id:'permisos',   label:'Permisos',              icon:'🔑', desc:'Control de acceso a módulos por usuario',       color:'#374151', bg:'#f3f4f6'},
];
// Módulos que el admin SIEMPRE tiene (no configurables)
const ADMIN_ALWAYS=['plan','devoluciones','proyeccion','da_pm','pp','dashboard','clientes','historial','admin','permisos'];
// Módulos por defecto para nuevos usuarios
const DEFAULT_MODULES_BY_ROLE={
  admin: ADMIN_ALWAYS,
  manager: ['plan','devoluciones','proyeccion','dashboard','clientes','historial'],
  assistant: ['plan','devoluciones','historial'],
};

function getUserModules(email){
  const u=usersCache[email]||session;
  if(!u) return [];
  if(u.role==='admin') return ADMIN_ALWAYS;
  // leer campo modulos del usuario (array guardado en Supabase)
  if(u.modulos&&u.modulos.length) return u.modulos;
  return DEFAULT_MODULES_BY_ROLE[u.role]||['plan'];
}

function userCanAccess(email,moduleId){
  const u=usersCache[email]||session;
  if(!u) return false;
  if(u.role==='admin') return true;
  return getUserModules(email).includes(moduleId);
}
const COLORS={'av-m':'#7F77DD','av-a':'#8DC63F','av-y':'#EF9F27','av-b':'#D4537E','av-x':'#378ADD'};
const app=document.getElementById('app');

async function sbGet(t,p=''){
  const r=await fetch(`${SB_URL}/rest/v1/${t}${p}`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
  return r.json();
}
async function sbPost(t,d,pref='return=representation'){
  return fetch(`${SB_URL}/rest/v1/${t}`,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':pref},body:JSON.stringify(d)});
}
async function sbPatch(t,p,d){
  return fetch(`${SB_URL}/rest/v1/${t}${p}`,{method:'PATCH',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(d)});
}
async function sbUpsert(t,d,conflict=''){
  const pref=conflict?'resolution=merge-duplicates,return=representation':'return=representation';
  return fetch(`${SB_URL}/rest/v1/${t}`,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':pref},body:JSON.stringify(d)});
}
async function sbDelete(t,p){
  return fetch(`${SB_URL}/rest/v1/${t}${p}`,{method:'DELETE',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
}

function todayKey(){
  return new Date().toLocaleDateString('en-CA',{timeZone:'America/Tijuana'});
}
function nowISO(){return new Date().toLocaleString('sv-SE',{timeZone:'America/Tijuana',hour12:false}).replace(' ','T')+'-07:00'}
function formatDate(k){const d=new Date(k+'T12:00:00');return d.toLocaleDateString('es-MX',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}
function formatDateShort(k){const d=new Date(k+'T12:00:00');return d.toLocaleDateString('es-MX',{month:'short',day:'numeric'})}
function roleBadge(r){return r==='admin'?'<span class="badge badge-admin">Director</span>':r==='manager'?'<span class="badge badge-mgr">Líder de Práctica Fiscal</span>':'<span class="badge badge-ast">Consultor Junior</span>'}
function escH(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function av(a){return a||'av-x'}
function pc(email){const u=usersCache[email];return u?COLORS[av(u.av)]||'#888':'#888'}
function visibleEmails(){
  const all=Object.keys(usersCache);
  if(session.role==='admin') return all;
  if(session.role==='manager') return all.filter(e=>usersCache[e].role!=='admin');
  return [session.email];
}
function getNotifyEmails(){
  const admin=Object.keys(usersCache).find(e=>usersCache[e].role==='admin');
  const mgr=Object.keys(usersCache).find(e=>usersCache[e].role==='manager');
  if(session.role==='admin') return [admin].filter(Boolean);
  if(session.role==='manager') return [mgr,admin].filter(Boolean);
  return [mgr,admin].filter(Boolean);
}
async function loadCaches(){
  const [g,c]=await Promise.all([sbGet('grupos','?select=*&order=nombre.asc'),sbGet('clientes','?select=*,grupos(nombre)&order=nombre.asc')]);
  gruposCache=g||[];clientesCache=c||[];
}

async function getActiveTareas(email){
  const today=todayKey();
  const {data:tareas}=await sbGet('tareas',`?email=eq.${encodeURIComponent(email)}&select=*&order=orden.asc,created_at.asc`).then(r=>({data:r}));
  if(!tareas) return [];
  // pendientes de cualquier fecha + concluidas de hoy
  return tareas.filter(t=>t.status==='pendiente'||t.status==='standby'||t.status==='eliminada'||(t.status==='concluida'&&t.fecha_conclusion&&t.fecha_conclusion.startsWith(today)));
}

let currentSessionId=null;

async function registrarLogin(email){
  try{
    const res=await sbPost('sesiones',{email,login_at:nowISO()},'return=representation');
    const data=await res.json();
    currentSessionId=(Array.isArray(data)?data[0]:data)?.id||null;
  }catch(e){console.warn('Session log error:',e);}
}

async function registrarLogout(){
  if(!currentSessionId||!session)return;
  try{
    const loginRes=await sbGet('sesiones',`?id=eq.${currentSessionId}&select=login_at`);
    const loginAt=loginRes?.[0]?.login_at;
    const logoutAt=nowISO();
    let duracion_min=null;
    if(loginAt){
      const diff=new Date(logoutAt)-new Date(loginAt);
      duracion_min=Math.round(diff/60000);
    }
    await sbPatch('sesiones',`?id=eq.${currentSessionId}`,{logout_at:logoutAt,duracion_min});
    currentSessionId=null;
  }catch(e){console.warn('Logout log error:',e);}
}

async function doLogout(porInactividad=false){
  await registrarLogout();
  session=null;usersCache={};clientesCache=[];gruposCache=[];
  clearInactivityTimer();
  if(porInactividad){
    renderLogin();
    setTimeout(()=>{
      const msg=document.createElement('div');
      msg.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;font-size:13px;padding:10px 20px;border-radius:8px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.2)';
      msg.textContent='Sesión cerrada por inactividad (10 min)';
      document.body.appendChild(msg);
      setTimeout(()=>msg.remove(),3500);
    },100);
  } else {
    renderLogin();
  }
}

// ===== AUTO-LOGOUT POR INACTIVIDAD =====
let inactivityTimer=null;
const INACTIVITY_MS=10*60*1000; // 10 minutos

function resetInactivityTimer(){
  if(!session)return;
  clearTimeout(inactivityTimer);
  inactivityTimer=setTimeout(()=>{
    if(session) doLogout(true);
  },INACTIVITY_MS);
}

function clearInactivityTimer(){
  clearTimeout(inactivityTimer);
  inactivityTimer=null;
}

function startInactivityWatcher(){
  ['mousemove','mousedown','keydown','touchstart','scroll','click'].forEach(ev=>{
    document.addEventListener(ev,resetInactivityTimer,{passive:true});
  });
  resetInactivityTimer();
}

async function doLogin(){
  const em=document.getElementById('lemail').value.trim().toLowerCase();
  const pw=document.getElementById('lpass').value;
  const btn=document.getElementById('lbtn');
  btn.innerHTML='<span class="spinner"></span> Verificando...';btn.disabled=true;
  try{

    if(!data||!data.length){document.getElementById('lerr').style.display='block';btn.innerHTML='Entrar';btn.disabled=false;return;}
    session={...data[0]};
    const [allU]=await Promise.all([sbGet('users','?select=*'),loadCaches()]);
    allU.forEach(u=>{usersCache[u.email]=u;});
    await registrarLogin(session.email);
    startInactivityWatcher();
    initReporteGerencial();
    renderPortada();
  }catch(e){
    console.error('doLogin error:',e.message,e.stack);

}

function mostrarModalConclusion(tareaId, targetEmail){

    {id:'satisfactorio',txt:'Satisfactoriamente'},
    {id:'no_satisfactorio',txt:'No satisfactoriamente'},
    {id:'no_aplica',txt:'Se concluye porque ya no aplica'},
    {id:'genera_nueva',txt:'Se concluye pero se genera una nueva tarea'},
    {id:'comentar_superior',txt:'Se comentará con superior'}
  ];
  let selected=null;
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id='modal-conclusion';
  overlay.innerHTML=`
    <div class="modal-box">
      <div class="modal-title">Concluir tarea</div>
      <div class="modal-sub">Selecciona el motivo de conclusión:</div>
      ${motivos.map((m,i)=>`<div class="motivo-opt" id="mopt-${m.id}" onclick="selectMotivo('${m.id}')">
        <div class="motivo-num">${i+1}</div>
        <div class="motivo-text">${m.txt}</div>
      </div>`).join('')}
      <div style="display:flex;gap:8px;margin-top:1rem">

  document.body.appendChild(overlay);
}

function selectMotivo(id){
  document.querySelectorAll('.motivo-opt').forEach(el=>el.classList.remove('selected'));
  document.getElementById('mopt-'+id)?.classList.add('selected');
  const btn=document.getElementById('btn-confirmar-conclusion');
  if(btn){btn.disabled=false;btn.dataset.motivo=id;}
}

function cerrarModal(){
  document.getElementById('modal-conclusion')?.remove();
}

const MOTIVOS_TEXTO={
  satisfactorio:'Satisfactoriamente',
  no_satisfactorio:'No satisfactoriamente',
  no_aplica:'Ya no aplica',
  genera_nueva:'Genera nueva tarea',
  comentar_superior:'Se comentará con superior'
};

async function confirmarConclusion(tareaId,targetEmail){
  const btn=document.getElementById('btn-confirmar-conclusion');
  const motivoId=btn?.dataset?.motivo;
  if(!motivoId) return;
  cerrarModal();
  const motivoTxt=MOTIVOS_TEXTO[motivoId]||motivoId;
  const generaNueva=motivoId==='genera_nueva';
  const {data:t}=await sbGet('tareas',`?id=eq.${tareaId}&select=bitacora,descripcion,client_id,client_name,fecha_creacion`).then(r=>({data:r?.[0]}));
  const bits=[...(t?.bitacora||[]),{fecha:nowISO(),evento:`Concluida por ${session.name} — ${motivoTxt}`}];
  await sbPatch('tareas',`?id=eq.${tareaId}`,{status:'concluida',fecha_conclusion:nowISO(),updated_at:nowISO(),motivo_conclusion:motivoTxt,genera_nueva_tarea:generaNueva,bitacora:bits});
  if(generaNueva){
    const today=todayKey();
    const tareas=await getActiveTareas(targetEmail);
    const pendientes=tareas.filter(x=>x.status==='pendiente');
    if(pendientes.length<5){
      const bitNueva=[{fecha:nowISO(),evento:`Generada por conclusión de tarea anterior — ${session.name}`}];
      await sbPost('tareas',{email:targetEmail,descripcion:'[NUEVA] '+escH(t?.descripcion||''),client_id:t?.client_id||null,client_name:t?.client_name||'',fecha_creacion:today,status:'pendiente',orden:tareas.length,asignada_por:session.email,bitacora:bitNueva});
    }
  }
  renderMisPlan(targetEmail);
}

async function eliminarTarea(tareaId,targetEmail){
  if(!confirm('¿Eliminar esta tarea? Quedará marcada como eliminada en el historial.')) return;
  const {data:t}=await sbGet('tareas',`?id=eq.${tareaId}&select=bitacora`).then(r=>({data:r?.[0]}));
  const bits=[...(t?.bitacora||[]),{fecha:nowISO(),evento:`Eliminada por ${session.name}`}];
  await sbPatch('tareas',`?id=eq.${tareaId}`,{status:'eliminada',updated_at:nowISO(),bitacora:bits});
  renderMisPlan(targetEmail);
}

async function addTarea(idx){await addTareaRemota(idx,session.email);}

async function addTareaRemota(idx,targetEmail){
  const desc=document.getElementById(`ndesc-${idx}`).value.trim();
  const cliId=document.getElementById(`ncli-${idx}`).value;
  const cliName=cliId?(clientesCache.find(c=>c.id===cliId)||{}).nombre||'':'';
  const err=document.getElementById('tarea-err');
  if(!desc){err.textContent='Escribe una descripción.';err.style.display='block';setTimeout(()=>err.style.display='none',2500);return;}
  const today=todayKey();
  const tareas=await getActiveTareas(targetEmail);
  const pendientes=tareas.filter(t=>t.status==='pendiente');
  if(pendientes.length>=5){
    const nm=usersCache[targetEmail]?.name||targetEmail;
    err.textContent=`${nm} ya tiene 5 tareas pendientes activas.`;err.style.display='block';
    setTimeout(()=>err.style.display='none',3000);return;
  }
  const asignadaPor=targetEmail!==session.email?session.email:null;
  const nombreCorto=session.name.split(' ').slice(0,2).join(' ');
  const bitInicial=[{fecha:nowISO(),evento:asignadaPor?`Asignada por ${nombreCorto}`:`Creada por ${nombreCorto}`}];
  await sbPost('tareas',{email:targetEmail,descripcion:desc,client_id:cliId||null,client_name:cliName,fecha_creacion:today,status:'pendiente',orden:tareas.length,asignada_por:asignadaPor,bitacora:bitInicial});
  await sendPlanNotification([...tareas,{descripcion:desc,client_name:cliName,status:'pendiente'}],targetEmail);
  const ok=document.getElementById('tarea-ok');
  const nm=targetEmail!==session.email?` a ${usersCache[targetEmail]?.name||targetEmail}`:'';
  ok.textContent=`Tarea asignada${nm}.`;ok.style.display='block';
  setTimeout(()=>ok.style.display='none',2000);
  renderMisPlan(targetEmail);
}

async function concluirTarea(id){await concluirTareaRemota(id,session.email);}

async function concluirTareaRemota(id,targetEmail){
  mostrarModalConclusion(id,targetEmail);
}

async function toggleTarea(id,newStatus,targetEmail){
  const email=targetEmail||session.email;
  if(newStatus==='concluida'){await concluirTareaRemota(id,email);return;}
  const bit={fecha:nowISO(),evento:'Reactivada'};
  const {data:t}=await sbGet('tareas',`?id=eq.${id}&select=bitacora`).then(r=>({data:r?.[0]}));
  const bits=[...(t?.bitacora||[]),bit];
  await sbPatch('tareas',`?id=eq.${id}`,{status:'pendiente',fecha_conclusion:null,updated_at:nowISO(),bitacora:bits});
  renderMisPlan(email);
}

async function toggleStandby(id,currentlyStandby,targetEmail){
  const email=targetEmail||session.email;
  const isStandby=currentlyStandby==='true'||currentlyStandby===true;
  const newStatus=isStandby?'pendiente':'standby';
  const evento=isStandby?'Reactivada desde Stand By':'Puesta en Stand By';
  const {data:t}=await sbGet('tareas',`?id=eq.${id}&select=bitacora,fecha_creacion,updated_at`).then(r=>({data:r?.[0]}));
  const bits=[...(t?.bitacora||[]),{fecha:nowISO(),evento}];
  await sbPatch('tareas',`?id=eq.${id}`,{status:newStatus,updated_at:nowISO(),fecha_standup:isStandby?null:nowISO(),bitacora:bits});
  renderMisPlan(email);
}

function buildCharts(visible,allTareas,byEmail){
  // Historial: últimos 14 días, tareas concluidas por día por persona
  const dateMap={};
  allTareas.forEach(t=>{
    if(!visible.includes(t.email)||t.status!=='concluida'||!t.fecha_conclusion)return;
    const d=t.fecha_conclusion.slice(0,10);
    if(!dateMap[d])dateMap[d]={};
    dateMap[d][t.email]=(dateMap[d][t.email]||0)+1;
  });
  const dates=Object.keys(dateMap).sort().slice(-14);
  const labels=dates.map(formatDateShort);
  const datasets=visible.map(em=>{
    const u=usersCache[em];
    return{label:u?u.name.split(' ')[0]:em,data:dates.map(d=>(dateMap[d]||{})[em]||0),borderColor:pc(em),backgroundColor:pc(em)+'33',tension:.3,fill:false,pointRadius:4};
  });
  const ctx1=document.getElementById('chart-hist');
  if(ctx1&&labels.length) new Chart(ctx1,{type:'line',data:{labels,datasets},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}},scales:{y:{min:0,ticks:{stepSize:1},grid:{color:'#f0f0ec'}},x:{grid:{display:false},ticks:{font:{size:10}}}}}});
  else if(ctx1) ctx1.parentElement.innerHTML+='<div style="font-size:13px;color:#bbb;padding:1rem 0;text-align:center">Sin historial aún</div>';

  const ctx2=document.getElementById('chart-comp');
  if(ctx2) new Chart(ctx2,{type:'bar',data:{
    labels:visible.map(em=>usersCache[em]?usersCache[em].name.split(' ')[0]:em),
    datasets:[
      {label:'Total',data:visible.map(em=>(byEmail[em]||[]).length),backgroundColor:'#e5e5e0'},
      {label:'Concluidas',data:visible.map(em=>(byEmail[em]||[]).filter(t=>t.status==='concluida').length),backgroundColor:visible.map(em=>pc(em))}
    ]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}},scales:{y:{min:0,ticks:{stepSize:1},grid:{color:'#f0f0ec'}},x:{grid:{display:false}}}}});
}

async function runAnalysis(){
  const visible=visibleEmails();
  // Excluir al Director del análisis — solo analizar el equipo
  const equipo=visible.filter(em=>em!==session.email);

  const box=document.getElementById('abox');

  const allT=await sbGet('tareas',`?email=in.(${equipo.map(e=>`"${e}"`).join(',')})&select=*`);
  // Devoluciones activas asignadas al equipo
  const allDev=await sbGet('devoluciones_iva','?status=neq.devuelta&status=neq.negada&select=cliente_nombre,periodo,status,monto_solicitado,responsable');

    const u=usersCache[em];if(!u)return'';
    const tareas=(allT||[]).filter(t=>t.email===em&&(t.status==='pendiente'||t.status==='standby'||(t.status==='concluida'&&t.fecha_conclusion?.startsWith(today))));
    if(!tareas.length)return u.name+' ('+( u.role==='manager'?'Líder de Práctica Fiscal':'Consultor Junior')+'): sin tareas hoy';
    const done=tareas.filter(t=>t.status==='concluida').length;

    return u.name+' ('+(u.role==='manager'?'Líder de Práctica Fiscal':'Consultor Junior')+') — '+done+'/'+tareas.length+' concluidas'+(sb?' · '+sb+' en Stand By':'')+': \n'+tareas.map(t=>'  '+(t.status==='concluida'?'✓':t.status==='standby'?'⏸':'·')+' '+t.descripcion+(t.client_name?' ['+t.client_name+']':'')).join('\n');

  const devLines=(allDev||[]).length?'\n\nDevoluciones IVA activas:\n'+(allDev||[]).map(d=>'  · '+d.cliente_nombre+' ('+d.periodo+') — '+d.status+(d.responsable?' — Resp: '+d.responsable:'')+(d.monto_solicitado?' — $'+Number(d.monto_solicitado).toLocaleString('es-MX'):'')).join('\n'):'';
  try{

    const ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzY3RnemJxYWR1Y2doaXZhbWZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0ODk2MDUsImV4cCI6MjA5MDA2NTYwNX0.w2yWu_hwSW69rnGsiD6FCqHe7GaNuLD_lU3WdgbidKI';
    const res=await fetch(SB_URL+'/functions/v1/claude-analysis',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+ANON_KEY},body:JSON.stringify({prompt})});
    const data=await res.json();

async function loadHistorial(){
  const sel=document.getElementById('hist-user-sel');
  const desde=document.getElementById('hist-desde')?.value||todayKey();
  const hasta=document.getElementById('hist-hasta')?.value||todayKey();
  const filterEmail=sel?sel.value:'all';
  const body=document.getElementById('hist-body');
  if(!body)return;
  body.innerHTML='<div class="loading"><span class="spinner"></span>Cargando reporte...</div>';

  const visible=visibleEmails();
  const emailSafe=filterEmail==='all'||!visible.includes(filterEmail)?'all':filterEmail;
  const emails=emailSafe==='all'?visible:[emailSafe];

  // Cargar sesiones y tareas en paralelo
  const emailFilter='('+emails.map(e=>'"'+e+'"').join(',')+')';
  const [sesiones,tareas]=await Promise.all([
    sbGet('sesiones','?email=in.'+emailFilter+'&order=login_at.desc&select=*'),
    sbGet('tareas','?email=in.'+emailFilter+'&select=*&order=created_at.asc')
  ]);

  // Filtrar por rango de fechas
  const desdeDt=new Date(desde+'T00:00:00');
  const hastaDt=new Date(hasta+'T23:59:59');

  const sesionesFilt=(sesiones||[]).filter(s=>{
    const d=new Date(s.login_at);return d>=desdeDt&&d<=hastaDt;
  });

  // Agrupar sesiones por email
  const sesByEmail={};
  emails.forEach(e=>{sesByEmail[e]=[];});
  sesionesFilt.forEach(s=>{if(sesByEmail[s.email])sesByEmail[s.email].push(s);});

  // Agrupar tareas por email y fecha
  const tareasByEmail={};
  emails.forEach(e=>{tareasByEmail[e]=[];});
  (tareas||[]).forEach(t=>{
    const fechaAlta=t.created_at?t.created_at.slice(0,10):t.fecha_creacion;
    const fechaCon=t.fecha_conclusion?t.fecha_conclusion.slice(0,10):null;
    const enRango=(fechaAlta&&new Date(fechaAlta+'T12:00:00')>=desdeDt&&new Date(fechaAlta+'T12:00:00')<=hastaDt)||
                  (fechaCon&&new Date(fechaCon+'T12:00:00')>=desdeDt&&new Date(fechaCon+'T12:00:00')<=hastaDt);
    if(enRango&&tareasByEmail[t.email])tareasByEmail[t.email].push(t);
  });

  if(!emails.length){body.innerHTML='<div class="card"><div style="font-size:14px;color:#888">Sin datos.</div></div>';return;}

  let html='';
  emails.forEach(em=>{
    const u=usersCache[em];if(!u)return;
    const sesUser=sesByEmail[em]||[];
    const tareasUser=tareasByEmail[em]||[];

    // Estadísticas resumen
    const totalSes=sesUser.length;
    const totalMin=sesUser.reduce((s,x)=>s+(x.duracion_min||0),0);
    const totalHrs=Math.floor(totalMin/60);
    const restMin=totalMin%60;
    const tareasAlta=tareasUser.filter(t=>{
      const f=t.created_at?t.created_at.slice(0,10):t.fecha_creacion;
      return f&&new Date(f+'T12:00:00')>=desdeDt&&new Date(f+'T12:00:00')<=hastaDt;
    });
    const tareasCon=tareasUser.filter(t=>t.status==='concluida'&&t.fecha_conclusion&&new Date(t.fecha_conclusion.slice(0,10)+'T12:00:00')>=desdeDt);

    // Tabla de sesiones
    let sesRows='';
    if(sesUser.length){
      sesRows=sesUser.map(s=>{
        const entrada=new Date(s.login_at).toLocaleString('es-MX',{timeZone:'America/Tijuana',dateStyle:'short',timeStyle:'short'});
        const salida=s.logout_at?new Date(s.logout_at).toLocaleString('es-MX',{timeZone:'America/Tijuana',dateStyle:'short',timeStyle:'short'}):'<span style="color:#EF9F27;font-weight:500">Activa</span>';
        const dur=s.duracion_min!=null?(s.duracion_min>=60?Math.floor(s.duracion_min/60)+'h '+(s.duracion_min%60)+'min':s.duracion_min+' min'):'—';
        return '<tr>'+

        '</tr>';

      sesRows='<tr><td colspan="3" style="color:#bbb;text-align:center">Sin sesiones en este período</td></tr>';
    }

    html+='<div class="card" style="margin-bottom:1.25rem">'+

      '</div>'+
      // Tabla tareas
      '<div style="font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Tareas del período</div>'+
      '<div class="table-wrap">'+
        '<table class="data-table">'+
          '<thead><tr><th>Descripción</th><th>Estatus</th><th>Alta</th><th>Conclusión</th></tr></thead>'+
          '<tbody>'+tarRows+'</tbody>'+
        '</table>'+
      '</div>'+
    '</div>';
  });

  // ===== GRÁFICA GLOBAL: tareas por día =====
  // Recopilar todos los datos de tareas de todos los usuarios visibles
  const allTareasGraf=await sbGet('tareas','?email=in.'+emailFilter+'&select=created_at,fecha_creacion,fecha_conclusion,status&order=created_at.asc');
  const desdeDt2=new Date(document.getElementById('hist-desde').value+'T00:00:00');
  const hastaDt2=new Date(document.getElementById('hist-hasta').value+'T23:59:59');

  // Construir mapa de días en el rango
  const diasMap={};
  const cursor=new Date(desdeDt2);
  while(cursor<=hastaDt2){
    const k=cursor.toLocaleDateString('en-CA',{timeZone:'America/Tijuana'});
    diasMap[k]={alta:0,concluida:0};
    cursor.setDate(cursor.getDate()+1);
  }

  (allTareasGraf||[]).forEach(t=>{
    const fa=t.created_at?t.created_at.slice(0,10):t.fecha_creacion;
    const fc=t.fecha_conclusion?t.fecha_conclusion.slice(0,10):null;
    if(fa&&diasMap[fa])diasMap[fa].alta++;
    if(fc&&diasMap[fc]&&t.status==='concluida')diasMap[fc].concluida++;
  });

  const dias=Object.keys(diasMap).sort();
  const labelsGraf=dias.map(d=>new Date(d+'T12:00:00').toLocaleDateString('es-MX',{month:'short',day:'numeric'}));
  const dataAlta=dias.map(d=>diasMap[d].alta);
  const dataCon=dias.map(d=>diasMap[d].concluida);

  // Agregar canvas de gráfica al final del html
  html+='<div class="card" id="hist-graf-card" style="margin-bottom:1.25rem">'+
    '<div style="font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px">Tareas registradas vs concluidas por día</div>'+
    '<canvas id="hist-chart" height="120"></canvas>'+
  '</div>';

  body.innerHTML=html||'<div class="card"><div style="font-size:14px;color:#888">Sin actividad en el período seleccionado.</div></div>';

  // Renderizar gráfica con Chart.js
  const ctx=document.getElementById('hist-chart');
  if(ctx&&dias.length){
    new Chart(ctx,{
      type:'bar',
      data:{
        labels:labelsGraf,
        datasets:[
          {label:'Dadas de alta',data:dataAlta,backgroundColor:'#EF9F2788',borderColor:'#EF9F27',borderWidth:1.5,borderRadius:4},
          {label:'Concluidas',data:dataCon,backgroundColor:'#8DC63F88',borderColor:'#8DC63F',borderWidth:1.5,borderRadius:4}
        ]
      },
      options:{
        responsive:true,
        plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}},
        scales:{
          y:{min:0,ticks:{stepSize:1},grid:{color:'#f0f0ec'}},
          x:{grid:{display:false},ticks:{font:{size:10},maxRotation:45}}
        }
      }
    });
  }
}

async function loadSesiones(){
  const sel=document.getElementById('ses-user-sel');
  const desde=document.getElementById('ses-desde')?.value||todayKey();
  const hasta=document.getElementById('ses-hasta')?.value||todayKey();
  const filterEmail=sel?sel.value:'all';
  const body=document.getElementById('ses-body');
  if(!body)return;
  body.innerHTML='<div class="loading"><span class="spinner"></span>Cargando sesiones...</div>';

  const visible=visibleEmails();
  const emailSafe=filterEmail==='all'||!visible.includes(filterEmail)?'all':filterEmail;
  const emails=emailSafe==='all'?visible:[emailSafe];

  const desdeDt=new Date(desde+'T00:00:00');
  const hastaDt=new Date(hasta+'T23:59:59');
  const emailFilter='('+emails.map(e=>'"'+e+'"').join(',')+')';

  const sesiones=await sbGet('sesiones','?email=in.'+emailFilter+'&order=login_at.desc&select=*');
  const sesFilt=(sesiones||[]).filter(s=>{
    const d=new Date(s.login_at);return d>=desdeDt&&d<=hastaDt;
  });

  if(!sesFilt.length){
    body.innerHTML='<div style="font-size:13px;color:#888;padding:8px 0">Sin sesiones en el período seleccionado.</div>';
    return;
  }

  // Agrupar por usuario
  const byUser={};
  emails.forEach(e=>{byUser[e]=[];});
  sesFilt.forEach(s=>{if(byUser[s.email])byUser[s.email].push(s);});

  let html='';
  emails.forEach(em=>{
    const u=usersCache[em];if(!u)return;
    const sess=byUser[em]||[];
    if(!sess.length)return;
    const totalMin=sess.reduce((s,x)=>s+(x.duracion_min||0),0);
    const hrs=Math.floor(totalMin/60);
    const mins=totalMin%60;

    html+='<div style="margin-bottom:14px">'+
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;padding-bottom:6px;border-bottom:0.5px solid #e5e5e0">'+
        '<div class="avatar '+av(u.av)+'" style="width:28px;height:28px;font-size:11px">'+(u.initials||'??')+'</div>'+
        '<div style="flex:1;font-size:13px;font-weight:600">'+escH(u.name)+'</div>'+
        '<div style="font-size:11px;color:#888">'+sess.length+' sesiones · '+(totalMin>0?hrs+'h '+mins+'m total':'—')+'</div>'+
      '</div>'+
      '<div class="table-wrap">'+
        '<table class="data-table">'+
          '<thead><tr><th>Entrada</th><th>Salida</th><th>Duración</th><th>Estado</th></tr></thead>'+
          '<tbody>'+
          sess.map(s=>{
            const entrada=new Date(s.login_at).toLocaleString('es-MX',{timeZone:'America/Tijuana',dateStyle:'short',timeStyle:'short'});
            const salida=s.logout_at?new Date(s.logout_at).toLocaleString('es-MX',{timeZone:'America/Tijuana',dateStyle:'short',timeStyle:'short'}):'—';
            const dur=s.duracion_min!=null?(s.duracion_min>=60?Math.floor(s.duracion_min/60)+'h '+(s.duracion_min%60)+'min':s.duracion_min+' min'):'—';
            const estado=s.logout_at?
              '<span style="background:#f0f7d4;color:#5a8a1a;padding:1px 8px;border-radius:999px;font-size:10px;font-weight:600">Cerrada</span>':
              '<span style="background:#FEF3C7;color:#92400E;padding:1px 8px;border-radius:999px;font-size:10px;font-weight:600">Activa</span>';
            return '<tr><td>'+entrada+'</td><td>'+salida+'</td><td style="font-weight:500">'+dur+'</td><td>'+estado+'</td></tr>';
          }).join('')+
          '</tbody>'+
        '</table>'+
      '</div>'+
    '</div>';
  });

  body.innerHTML=html;
}

function editCliente(id){

async function saveCliente(){
  const nombre=document.getElementById('cf-nombre').value.trim();
  const rfc=document.getElementById('cf-rfc').value.trim().toUpperCase();
  const tipo=document.getElementById('cf-tipo').value;
  const grupo_id=document.getElementById('cf-grupo').value||null;
  const responsable=document.getElementById('cf-resp').value;
  const notas=document.getElementById('cf-notas').value.trim();
  const editing=document.getElementById('cf-editing').value;
  const err=document.getElementById('cf-err');err.style.display='none';
  if(!nombre){err.textContent='El nombre es obligatorio.';err.style.display='block';return;}
  const dup=clientesCache.find(c=>c.nombre.toLowerCase()===nombre.toLowerCase()&&c.id!==editing);
  if(dup){err.textContent='Ya existe un cliente con ese nombre.';err.style.display='block';return;}
  const btn=document.getElementById('cf-btn');btn.innerHTML='<span class="spinner"></span> Guardando...';btn.disabled=true;
  if(editing)await sbPatch('clientes',`?id=eq.${editing}`,{nombre,rfc,tipo,grupo_id,responsable,notas});
  else await sbPost('clientes',{nombre,rfc,tipo,grupo_id,responsable,notas});
  await loadCaches();
  btn.innerHTML=editing?'Actualizar cliente':'Guardar cliente';btn.disabled=false;
  document.getElementById('cf-editing').value='';
  ['cf-nombre','cf-rfc','cf-notas'].forEach(i=>{document.getElementById(i).value='';});
  ['cf-tipo','cf-grupo','cf-resp'].forEach(i=>{document.getElementById(i).value='';});
  const ok=document.getElementById('cf-ok');ok.style.display='block';
  setTimeout(()=>ok.style.display='none',2000);
  renderClientesTabla();renderGrupoTabs();
}
async function deleteCliente(id){
  const c=clientesCache.find(x=>x.id===id);
  if(!confirm(`¿Eliminar "${c?.nombre}"?`))return;
  await sbDelete('clientes',`?id=eq.${id}`);
  await loadCaches();renderClientesTabla();
}

let devCache=[];

function diasHabilesDesde(fechaStr,dias){
  const festivos=['01-01','02-05','03-21','05-01','09-16','11-20','12-25'];
  let d=new Date(fechaStr+'T12:00:00');
  let count=0;
  while(count<dias){
    d.setDate(d.getDate()+1);
    const dow=d.getDay();
    const mm=(d.getMonth()+1).toString().padStart(2,'0');
    const dd=d.getDate().toString().padStart(2,'0');
    const key=mm+'-'+dd;
    if(dow!==0&&dow!==6&&!festivos.includes(key))count++;
  }
  return d.toLocaleDateString('en-CA',{timeZone:'America/Tijuana'});
}

function calcPlazos(dev){
  if(!dev.fecha_inicio)return{};
  const fi=dev.fecha_inicio;
  const fp=dev.fecha_presentacion_sat||diasHabilesDesde(fi,10);
  return{
    presentacion:fp,
    limite_req1:diasHabilesDesde(fp,20),
    limite_resolucion:diasHabilesDesde(fp,40),
  };
}

function devStatusBadge(status){
  const s=DEV_STATUS[status]||{label:status,color:'#888',bg:'#f5f5f3'};
  return '<span style="background:'+s.bg+';color:'+s.color+';padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600">'+s.label+'</span>';
}

function fmtMXN(n){
  if(!n&&n!==0)return'—';
  return'$'+Number(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function diasRestantes(fechaStr){
  if(!fechaStr)return null;
  const hoy=new Date(todayKey()+'T12:00:00');
  const target=new Date(fechaStr+'T12:00:00');
  return Math.round((target-hoy)/(1000*60*60*24));
}

function alertaDias(d,label){
  if(d===null)return'';
  if(d<0)return'<span style="background:#fef2f2;color:#dc2626;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:600">'+label+': vencido hace '+Math.abs(d)+' días</span>';
  if(d<=5)return'<span style="background:#FEF3C7;color:#92400E;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:600">'+label+': '+d+' días</span>';
  return'<span style="background:#f0f7d4;color:#5a8a1a;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:600">'+label+': '+d+' días</span>';
}

async function loadDevoluciones(){
  const data=await sbGet('devoluciones_iva','?select=*&order=created_at.desc');
  devCache=data||[];
  document.getElementById('devl').style.display='none';
  renderDevList();
}


function sortDevoluciones(arr){
  const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return arr.slice().sort((a,b)=>{
    // Primero por cliente
    const nc=(a.cliente_nombre||'').toLowerCase();
    const nb=(b.cliente_nombre||'').toLowerCase();
    if(nc!==nb)return nc.localeCompare(nb,'es');
    // Luego por período (mes año)
    const pa=(a.periodo||'').toLowerCase().split(' ');
    const pb=(b.periodo||'').toLowerCase().split(' ');
    const ma=MESES.indexOf(pa[0]);const ya=parseInt(pa[1])||0;
    const mb=MESES.indexOf(pb[0]);const yb=parseInt(pb[1])||0;
    if(ya!==yb)return ya-yb;
    return ma-mb;
  });
}

function renderDevList(){

  if(!devCache.length){
    el.innerHTML='<div class="card"><div style="font-size:14px;color:#888;text-align:center;padding:1rem">Sin solicitudes registradas. Crea la primera con "+ Nueva solicitud".</div></div>';
    return;
  }

  // Agrupar por status activos vs concluidos — ordenados por cliente y período
  const activos=sortDevoluciones(devCache.filter(d=>d.status!=='devuelta'&&d.status!=='negada'));
  const cerrados=sortDevoluciones(devCache.filter(d=>d.status==='devuelta'||d.status==='negada'));

  let html='';

  if(activos.length){
    html+='<div class="sec-label" style="margin-bottom:8px">En proceso ('+activos.length+')</div>';
    activos.forEach(d=>{
      const plazos=calcPlazos(d);
      const drp=d.fecha_presentacion_sat?diasRestantes(plazos.limite_resolucion):null;
      const drr=d.status==='requerimiento_sat'?diasRestantes(d.fecha_limite_req):null;
      html+='<div class="card" style="margin-bottom:10px;cursor:pointer" onclick="renderDetalleDevolucion(\''+d.id+'\')">'+
        '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap">'+
          '<div style="flex:1">'+
            '<div style="font-size:14px;font-weight:600;margin-bottom:4px">'+escH(d.cliente_nombre||'—')+'</div>'+
            '<div style="font-size:12px;color:#888;margin-bottom:6px">Período: '+escH(d.periodo)+(d.folio_fed?' · Folio: '+escH(d.folio_fed):'')+'</div>'+
            '<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">'+
              devStatusBadge(d.status)+
              (d.monto_solicitado?'<span style="font-size:12px;color:#888">Solicitado: <strong>'+fmtMXN(d.monto_solicitado)+'</strong></span>':'')+
              (d.status==='devuelta'&&d.monto_devuelto?'<span style="font-size:12px;color:#5a8a1a">Devuelto: <strong>'+fmtMXN(d.monto_devuelto)+'</strong></span>':'')+
            '</div>'+
            '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">'+
              (plazos.presentacion&&!d.fecha_presentacion_sat?alertaDias(diasRestantes(plazos.presentacion),'Presentar'):'')+ 
              (d.fecha_presentacion_sat&&drp!==null?alertaDias(drp,'Resolución SAT'):'')+ 
            '</div>'+
          '</div>'+
          '<div style="text-align:right;flex-shrink:0">'+
            '<div style="font-size:11px;color:#888">Responsable</div>'+
            '<div style="font-size:12px;font-weight:500">'+escH(d.responsable||'—')+'</div>'+
            '<div style="font-size:11px;color:#888;margin-top:4px">Inicio: '+escH(d.fecha_inicio||'—')+'</div>'+
          '</div>'+
        '</div>'+
      '</div>';
    });
  }

  if(cerrados.length){
    html+='<div class="sec-label" style="margin-top:1rem;margin-bottom:8px">Concluidas / Negadas ('+cerrados.length+')</div>';
    cerrados.forEach(d=>{
      html+='<div class="card" style="margin-bottom:8px;opacity:.8;cursor:pointer" onclick="renderDetalleDevolucion(\''+d.id+'\')">'+
        '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">'+
          '<div>'+
            '<div style="font-size:13px;font-weight:600">'+escH(d.cliente_nombre||'—')+'</div>'+
            '<div style="font-size:11px;color:#888">'+escH(d.periodo)+'</div>'+
          '</div>'+
          '<div style="display:flex;align-items:center;gap:10px">'+
            devStatusBadge(d.status)+
            '<span style="font-size:12px;color:#888">'+fmtMXN(d.monto_devuelto||d.monto_solicitado)+'</span>'+
          '</div>'+
        '</div>'+
      '</div>';
    });
  }

  el.innerHTML=html;
}

async function saveDevolucion(){
  const cliSel=document.getElementById('df-cliente');
  const cliente_id=cliSel.value||null;
  const cliente_nombre=document.getElementById('df-cli-nombre').value||cliSel.options[cliSel.selectedIndex]?.dataset?.nombre||'';
  const mes=document.getElementById('df-mes').value;
  const anio=document.getElementById('df-anio').value;
  const periodo=(mes&&anio)?mes+' '+anio:'';
  const fecha_inicio=document.getElementById('df-inicio').value;
  const responsable=document.getElementById('df-resp').value;
  const monto_solicitado=parseFloat(document.getElementById('df-monto-sol').value)||null;
  const monto_devuelto=parseFloat(document.getElementById('df-monto-dev').value)||null;
  const status=document.getElementById('df-status').value;
  const folio_fed=document.getElementById('df-folio').value.trim()||null;
  const fecha_presentacion_sat=document.getElementById('df-fecpres').value||null;
  const fecha_deposito=document.getElementById('df-fecdep').value||null;
  const correos_raw=document.getElementById('df-correos').value;
  const correos_cliente=correos_raw.split(',').map(s=>s.trim()).filter(Boolean);
  const motivo_rechazo=document.getElementById('df-rechazo').value.trim()||null;
  const notas=document.getElementById('df-notas').value.trim()||null;
  const editing=document.getElementById('df-editing').value;
  const err=document.getElementById('df-err');err.style.display='none';
  if(!periodo||!fecha_inicio){err.textContent='Período y fecha de inicio son obligatorios.';err.style.display='block';return;}

  const payload={cliente_id,cliente_nombre,periodo,fecha_inicio,responsable,monto_solicitado,monto_devuelto,status,folio_fed,fecha_presentacion_sat,fecha_deposito,correos_cliente,motivo_rechazo,notas,updated_at:nowISO()};

  if(editing){
    await sbPatch('devoluciones_iva','?id=eq.'+editing,payload);
    // Si es nueva, cargar checklist de requisitos SAT
  } else {
    const res=await sbPost('devoluciones_iva',payload,'return=representation');
    const data=await res.json();
    const newId=(Array.isArray(data)?data[0]:data)?.id;
    if(newId){
      // Cargar checklist SAT por defecto
      const reqs=DEV_REQUISITOS_SAT.map(r=>({devolucion_id:newId,requisito:r,completado:false}));
      for(const r of reqs) await sbPost('dev_requisitos',r,'return=minimal');
    }
  }
  await loadDevoluciones();
  renderDevoluciones();
}

    sbGet('dev_comentarios','?devolucion_id=eq.'+id+'&select=*&order=created_at.asc')
  ]);

  // ---- LÍNEA DE TIEMPO ----

    {label:'Día 0 — Inicio trámite',fecha:dev.fecha_inicio,done:!!dev.fecha_inicio,color:'#3B4BC8'},
    {label:'Día 10 hábil — Presentar ante SAT',fecha:plazos.presentacion,done:!!dev.fecha_presentacion_sat,color:dev.fecha_presentacion_sat?'#8DC63F':'#EF9F27'},
    {label:'Día 20 hábil — Límite requerimiento SAT',fecha:plazos.limite_req1,done:dev.status==='informacion_entregada'||dev.status==='devuelta',color:'#EF9F27'},
    {label:'Día 40 hábil — Resolución SAT',fecha:plazos.limite_resolucion,done:dev.status==='devuelta'||dev.status==='negada',color:dev.status==='devuelta'?'#8DC63F':dev.status==='negada'?'#dc2626':'#888'},
  ];
  if(dev.fecha_presentacion_sat) hitos[1]={...hitos[1],fecha:dev.fecha_presentacion_sat,done:true,color:'#8DC63F'};

  // ---- GRÁFICA HORIZONTAL SVG DE LÍNEA DE TIEMPO ----
  const totalDias=40;
  const fi=dev.fecha_inicio?new Date(dev.fecha_inicio+'T12:00:00'):new Date();
  const hoy=new Date(todayKey()+'T12:00:00');
  const diasTranscurridos=Math.max(0,Math.round((hoy-fi)/(1000*60*60*24)));
  const pctHoy=Math.min(100,Math.round((diasTranscurridos/60)*100));

  // Posiciones relativas de cada hito en la barra (sobre 60 días calendario aprox)
  const posHitos=[
    {pct:0,   label:'Inicio',      sublabel:dev.fecha_inicio||'—',      done:!!dev.fecha_inicio,       color:hitos[0].color},
    {pct:14,  label:'Presentar',   sublabel:hitos[1].fecha||'—',         done:hitos[1].done,            color:hitos[1].color},
    {pct:42,  label:'Req. SAT',    sublabel:hitos[2].fecha||'—',         done:hitos[2].done,            color:hitos[2].color},
    {pct:72,  label:'Resolución',  sublabel:hitos[3].fecha||'—',         done:hitos[3].done,            color:hitos[3].color},
  ];
  if(dev.fecha_deposito) posHitos.push({pct:85,label:'Depósito',sublabel:dev.fecha_deposito,done:true,color:'#8DC63F'});

  const svgW=560; const svgH=110;
  const barY=54; const barH=8; const barX=30; const barW=svgW-60;

  // Barra de fondo
  let svgParts='<rect x="'+barX+'" y="'+barY+'" width="'+barW+'" height="'+barH+'" rx="4" fill="#e5e5e0"/>';

  // Barra de progreso
  const progW=Math.round((pctHoy/100)*barW);
  const progColor=dev.status==='devuelta'?'#8DC63F':dev.status==='negada'?'#dc2626':'#3B4BC8';
  svgParts+='<rect x="'+barX+'" y="'+barY+'" width="'+progW+'" height="'+barH+'" rx="4" fill="'+progColor+'"/>';

  // Marcador de hoy
  if(pctHoy>0&&pctHoy<100&&dev.status!=='devuelta'&&dev.status!=='negada'){
    const hoyX=barX+progW;
    svgParts+='<line x1="'+hoyX+'" y1="'+(barY-8)+'" x2="'+hoyX+'" y2="'+(barY+barH+8)+'" stroke="#EF9F27" stroke-width="2" stroke-dasharray="3,2"/>';
    svgParts+='<text x="'+hoyX+'" y="'+(barY-12)+'" text-anchor="middle" font-size="9" fill="#EF9F27" font-weight="600">HOY</text>';
  }

  // Hitos
  posHitos.forEach((h,i)=>{
    const cx=barX+Math.round((h.pct/100)*barW);
    const arriba=i%2===0;
    const labelY=arriba?barY-22:barY+barH+22;
    const sublabelY=arriba?barY-10:barY+barH+34;
    const lineY1=arriba?barY-4:barY+barH;
    const lineY2=arriba?barY-16:barY+barH+14;
    const dotColor=h.done?h.color:'#d1d1d1';

    if(h.done) svgParts+='<text x="'+cx+'" y="'+(barY+barH/2+4)+'" text-anchor="middle" font-size="8" fill="#fff" font-weight="700">✓</text>';
    svgParts+='<line x1="'+cx+'" y1="'+lineY1+'" x2="'+cx+'" y2="'+lineY2+'" stroke="'+dotColor+'" stroke-width="1.5"/>';
    svgParts+='<text x="'+cx+'" y="'+labelY+'" text-anchor="middle" font-size="10" fill="'+textColor+'" font-weight="600">'+h.label+'</text>';
    svgParts+='<text x="'+cx+'" y="'+sublabelY+'" text-anchor="middle" font-size="9" fill="#aaa">'+h.sublabel+'</text>';
  });

  const timelineHTML='<div style="overflow-x:auto;padding:4px 0">'+
    '<svg width="100%" viewBox="0 0 '+svgW+' '+svgH+'" xmlns="http://www.w3.org/2000/svg" style="min-width:320px">'+
      svgParts+
    '</svg>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;flex-wrap:wrap;gap:6px">'+
      '<div style="font-size:10px;color:#888">'+diasTranscurridos+' días calendario desde el inicio</div>'+
      '<div style="display:flex;gap:10px">'+
        '<div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;border-radius:50%;background:'+progColor+'"></div><span style="font-size:10px;color:#888">Progreso</span></div>'+
        '<div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;border-radius:50%;background:#8DC63F"></div><span style="font-size:10px;color:#888">Completado</span></div>'+
        '<div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;border-radius:50%;background:#e5e5e0"></div><span style="font-size:10px;color:#888">Pendiente</span></div>'+
      '</div>'+
    '</div>'+
  '</div>';

function handleCommentKey(event,devId){
  if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();agregarComentario(devId);}
}

async function agregarComentario(devId){
  const input=document.getElementById('dev-comentario-input');
  const mensaje=input?.value.trim();
  if(!mensaje)return;
  input.value='';
  input.disabled=true;
  await sbPost('dev_comentarios',{
    devolucion_id:devId,
    email:session.email,
    nombre:session.name||usersCache[session.email]?.name||session.email,
    mensaje
  },'return=minimal');
  input.disabled=false;
  // Recargar solo los comentarios sin refrescar toda la pantalla
  const nuevos=await sbGet('dev_comentarios','?devolucion_id=eq.'+devId+'&select=*&order=created_at.asc');
  const lista=document.getElementById('dev-comentarios-list');
  if(lista){
    const html=(nuevos||[]).map(c=>{
      const esPropio=c.email===session.email;
      const initials=c.nombre.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
      const u=usersCache[c.email];
      const avClass=u?'av-'+u.av.replace('av-',''):'av-x';
      const fecha=new Date(c.created_at).toLocaleString('es-MX',{timeZone:'America/Tijuana',dateStyle:'short',timeStyle:'short'});
      return '<div style="display:flex;gap:10px;margin-bottom:12px;'+(esPropio?'flex-direction:row-reverse':'')+'">' +
        '<div class="avatar '+avClass+'" style="width:32px;height:32px;font-size:11px;flex-shrink:0">'+initials+'</div>'+
        '<div style="max-width:75%">'+
          '<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;'+(esPropio?'justify-content:flex-end':'')+'">'+
            '<span style="font-size:11px;font-weight:600;color:#1a1a1a">'+escH(c.nombre)+'</span>'+
            '<span style="font-size:10px;color:#bbb">'+fecha+'</span>'+
          '</div>'+
          '<div style="background:'+(esPropio?'#EEEDFE':'#f5f5f3')+';border-radius:'+(esPropio?'12px 2px 12px 12px':'2px 12px 12px 12px')+';padding:10px 12px;font-size:13px;color:#1a1a1a;line-height:1.5">'+
            escH(c.mensaje)+
          '</div>'+
        '</div>'+
      '</div>';
    }).join('');
    lista.innerHTML=html||'<div style="font-size:13px;color:#bbb;text-align:center;padding:16px 0">Sin comentarios aún.</div>';
    lista.scrollTop=lista.scrollHeight;
    // Actualizar contador
    const sec=lista.previousElementSibling;
    if(sec) sec.textContent='Comentarios ('+(nuevos||[]).length+')';
  }
  input.focus();
}

  const puntos=await sbGet('dev_requerimientos','?id=eq.'+puntoId+'&select=*');
  const p=puntos?.[0];
  if(!p)return;

  // Crear modal de edición
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id='modal-edit-req';
  overlay.innerHTML='<div class="modal-box">'+
    '<div class="modal-title">Editar punto de requerimiento</div>'+
    '<div style="margin-bottom:12px">'+
      '<div style="font-size:12px;color:#888;margin-bottom:4px">Descripción del punto *</div>'+
      '<textarea id="eq-punto" rows="3" style="width:100%;padding:8px;border:1px solid #e0e0db;border-radius:8px;font-size:13px;font-family:inherit;resize:none;box-sizing:border-box">'+escH(p.punto||'')+'</textarea>'+

      '<div>'+

      '</div>'+
      '<div>'+
        '<div style="font-size:12px;color:#888;margin-bottom:4px">Fecha notificado</div>'+
        '<input id="eq-fnot" type="date" value="'+(p.fecha_notificacion||'')+'" style="width:100%;padding:8px;border:1px solid #e0e0db;border-radius:8px;font-size:13px">'+
      '</div>'+
      '<div>'+
        '<div style="font-size:12px;color:#888;margin-bottom:4px">Fecha atendido</div>'+
        '<input id="eq-fat" type="date" value="'+(p.fecha_atendido||'')+'" style="width:100%;padding:8px;border:1px solid #e0e0db;border-radius:8px;font-size:13px">'+
      '</div>'+
      '<div>'+
        '<div style="font-size:12px;color:#888;margin-bottom:4px">Estatus</div>'+
        '<select id="eq-atendido" style="width:100%;padding:8px;border:1px solid #e0e0db;border-radius:8px;font-size:13px">'+
          '<option value="false"'+(p.atendido?'':' selected')+'>Pendiente</option>'+

        '</select>'+
      '</div>'+

      '<button class="btn btn-full" onclick="document.getElementById(\'modal-edit-req\').remove()" style="flex:1;margin-top:0">Cancelar</button>'+
      '<button class="btn btn-primary btn-full" onclick="guardarEdicionReq(\''+puntoId+'\',\''+devId+'\')" style="flex:1;margin-top:0">Guardar</button>'+
    '</div>'+
  '</div>';
  document.body.appendChild(overlay);
}

async function guardarEdicionReq(puntoId,devId){
  const punto=document.getElementById('eq-punto')?.value.trim();
  const fecha_requerimiento=document.getElementById('eq-freg')?.value||null;
  const fecha_notificacion=document.getElementById('eq-fnot')?.value||null;
  const fecha_atendido=document.getElementById('eq-fat')?.value||null;
  const atendido=document.getElementById('eq-atendido')?.value==='true';
  if(!punto){alert('El punto no puede estar vacío.');return;}
  document.getElementById('modal-edit-req')?.remove();
  await sbPatch('dev_requerimientos','?id=eq.'+puntoId,{punto,fecha_requerimiento,fecha_notificacion,fecha_atendido,atendido});
  renderDetalleDevolucion(devId);
}

async function registrarNotificacion(puntoId,devId){
  const fecha=prompt('Fecha de notificación (YYYY-MM-DD):',todayKey());
  if(!fecha||!fecha.match(/^\d{4}-\d{2}-\d{2}$/)){alert('Fecha inválida.');return;}
  await sbPatch('dev_requerimientos','?id=eq.'+puntoId,{fecha_notificacion:fecha});
  renderDetalleDevolucion(devId);
}

async function deleteDevolucion(id){
  const dev=devCache.find(d=>d.id===id);
  if(!confirm('¿Eliminar la solicitud de '+( dev?.cliente_nombre||'este cliente')+' — '+(dev?.periodo||'')+' ? Esta acción no se puede deshacer.'))return;
  await sbDelete('dev_requisitos','?devolucion_id=eq.'+id);
  await sbDelete('dev_requerimientos','?devolucion_id=eq.'+id);
  await sbDelete('devoluciones_iva','?id=eq.'+id);
  await loadDevoluciones();
  renderDevoluciones();
}

async function toggleRequisito(reqId,actual,devId){
  const nuevo=!actual;
  const patch={completado:nuevo};
  if(nuevo)patch.fecha_completado=todayKey();
  else patch.fecha_completado=null;
  await sbPatch('dev_requisitos','?id=eq.'+reqId,patch);
  renderDetalleDevolucion(devId);
}

async function togglePuntoReq(pId,actual,devId){
  const nuevo=!actual;
  const patch={atendido:nuevo};
  if(nuevo)patch.fecha_atendido=todayKey();
  else patch.fecha_atendido=null;
  await sbPatch('dev_requerimientos','?id=eq.'+pId,patch);
  renderDetalleDevolucion(devId);
}

async function activarRequerimiento(devId){
  await sbPatch('devoluciones_iva','?id=eq.'+devId,{status:'requerimiento_sat',updated_at:nowISO()});
  const idx=devCache.findIndex(d=>d.id===devId);
  if(idx>=0)devCache[idx].status='requerimiento_sat';
  renderDetalleDevolucion(devId);
}

async function agregarPuntoRequerimiento(devId,numReq){
  const punto=prompt('Describe el punto requerido por el SAT:');
  if(!punto||!punto.trim())return;
  // Verificar que no se repita
  const existing=await sbGet('dev_requerimientos','?devolucion_id=eq.'+devId+'&select=punto');
  const puntos=(existing||[]).map(p=>p.punto.toLowerCase().trim());
  if(puntos.includes(punto.trim().toLowerCase())){
    alert('Este punto ya fue registrado anteriormente.');return;
  }
  await sbPost('dev_requerimientos',{devolucion_id:devId,numero_requerimiento:numReq,punto:punto.trim(),atendido:false,fecha_requerimiento:todayKey(),subido_por:session.email,subido_por_nombre:session.name||usersCache[session.email]?.name||session.email},'return=minimal');
  renderDetalleDevolucion(devId);
}

function renderPFList(){
  const el=document.getElementById('pf-body');if(!el)return;
  if(!pfCache.length){
    el.innerHTML='<div class="card"><div style="font-size:14px;color:#888;text-align:center;padding:1rem">Sin proyecciones. Crea la primera con "+ Nueva proyección".</div></div>';
    return;
  }
  const porEjercicio={};
  pfCache.forEach(p=>{if(!porEjercicio[p.ejercicio])porEjercicio[p.ejercicio]=[];porEjercicio[p.ejercicio].push(p);});
  let html='';
  Object.keys(porEjercicio).sort((a,b)=>b-a).forEach(ej=>{
    html+='<div style="font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Ejercicio '+ej+'</div>';
    porEjercicio[ej].forEach(p=>{
      html+='<div class="card" style="margin-bottom:10px;cursor:pointer" onclick="renderDetalleProyeccion(\''+p.id+'\')">'+
        '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">'+
          '<div><div style="font-size:14px;font-weight:600">'+escH(p.cliente_nombre)+'</div>'+
          '<div style="font-size:12px;color:#888;margin-top:2px">Ejercicio '+p.ejercicio+' · Tasa ISR: '+p.tasa_isr+'%'+(p.notas?' · '+escH(p.notas):'')+'</div></div>'+
          '<div style="font-size:11px;color:#888">'+new Date(p.created_at).toLocaleDateString('es-MX',{timeZone:'America/Tijuana'})+'</div>'+
        '</div>'+
      '</div>';
    });
  });
  el.innerHTML=html;
}

function pfSetCliente(sel){
  const opt=sel.options[sel.selectedIndex];
  const nombre=opt?.dataset?.nombre||opt?.text||'';
  const el=document.getElementById('pf-cli-nombre');
  if(el) el.value=nombre;
}

async function saveProyeccion(){
  const cliSel=document.getElementById('pf-cliente');
  const cliente_id=cliSel.value||null;
  const cliente_nombre=document.getElementById('pf-cli-nombre').value||(cliSel.selectedIndex>0?cliSel.options[cliSel.selectedIndex]?.dataset?.nombre||cliSel.options[cliSel.selectedIndex]?.text||'':'');
  const ejercicio=parseInt(document.getElementById('pf-ejercicio').value);
  const tasa_isr=parseFloat(document.getElementById('pf-tasa').value)||30;
  const notas=document.getElementById('pf-notas').value.trim()||null;
  const editing=document.getElementById('pf-editing').value;
  const err=document.getElementById('pf-err');err.style.display='none';
  if(!cliente_nombre||!ejercicio){err.textContent='Cliente y ejercicio son obligatorios.';err.style.display='block';return;}
  const payload={cliente_id,cliente_nombre,ejercicio,tasa_isr,notas,updated_at:nowISO()};
  let newId=editing;
  if(editing){
    await sbPatch('pf_proyecciones','?id=eq.'+editing,payload);
  } else {
    const res=await sbPost('pf_proyecciones',payload,'return=representation');
    const data=await res.json();
    newId=(Array.isArray(data)?data[0]:data)?.id;
    // Los ajustes los agrega el usuario manualmente
  }
  const updated=await sbGet('pf_proyecciones','?select=*&order=ejercicio.desc,cliente_nombre.asc');
  pfCache=updated||[];
  if(newId) renderDetalleProyeccion(newId);
  else renderProyeccion();
}

async function agregarAjusteFiscal(proyId,tipoDefault){
  document.getElementById('modal-ajuste')?.remove();
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';

async function guardarEscenarioProyeccion(id){
  const proy=pfCache.find(p=>p.id===id);if(!proy)return;
  const [meses,ajustes]=await Promise.all([
    sbGet('pf_meses','?proyeccion_id=eq.'+id+'&select=*&order=mes.asc'),
    sbGet('pf_ajustes','?proyeccion_id=eq.'+id+'&select=*')
  ]);
  const mesesData=meses||[];
  const mesesConDatos=mesesData.filter(m=>m.ingresos!==null);
  const nMeses=mesesConDatos.length;
  if(!nMeses){alert('No hay datos capturados para guardar.');return;}
  const avg=campo=>nMeses?mesesConDatos.reduce((s,m)=>s+(parseFloat(m[campo])||0),0)/nMeses:0;
  const proyectados=[];
  for(let m=1;m<=12;m++){
    const real=mesesData.find(md=>md.mes===m);
    if(real&&real.ingresos!==null) proyectados.push({...real,real:true});
    else{const ing=avg('ingresos'),cv=avg('costo_ventas'),go=avg('gastos_operacion'),oi=avg('otros_ingresos'),og=avg('otros_gastos'),pp=avg('pago_provisional');
      proyectados.push({mes:m,real:false,ingresos:ing,costo_ventas:cv,gastos_operacion:go,otros_ingresos:oi,otros_gastos:og,pago_provisional:pp,utilidad_neta_contable:ing-cv-go+oi-og});}
  }
  const totalIngresos=proyectados.reduce((s,m)=>s+(parseFloat(m.ingresos)||0),0);
  const totalCosto=proyectados.reduce((s,m)=>s+(parseFloat(m.costo_ventas)||0),0);
  const totalGastosOp=proyectados.reduce((s,m)=>s+(parseFloat(m.gastos_operacion)||0),0);
  const totalOtrosIng=proyectados.reduce((s,m)=>s+(parseFloat(m.otros_ingresos)||0),0);
  const totalOtrosGas=proyectados.reduce((s,m)=>s+(parseFloat(m.otros_gastos)||0),0);
  const utilidadContable=totalIngresos-totalCosto-totalGastosOp+totalOtrosIng-totalOtrosGas;
  const ajustesData=ajustes||[];
  const totalSumas=ajustesData.filter(a=>a.tipo==='suma').reduce((s,a)=>s+(parseFloat(a.importe)||0),0);
  const totalRestas=ajustesData.filter(a=>a.tipo==='resta').reduce((s,a)=>s+(parseFloat(a.importe)||0),0);
  const utilidadFiscal=utilidadContable+totalSumas-totalRestas;
  const isrEstimado=utilidadFiscal>0?utilidadFiscal*(proy.tasa_isr/100):0;
  const totalPP=proyectados.reduce((s,m)=>s+(parseFloat(m.pago_provisional)||0),0);
  const isrACargo=Math.max(0,isrEstimado-totalPP);
  const saldoFavor=Math.max(0,totalPP-isrEstimado);
  const cu=totalIngresos>0?(utilidadFiscal/totalIngresos*100):0;
  const margenBruto=totalIngresos>0?((totalIngresos-totalCosto)/totalIngresos*100):0;
  const margenNeto=totalIngresos>0?(utilidadContable/totalIngresos*100):0;
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id='modal-escenario-save';
  overlay.innerHTML='<div class="modal-box">'+
    '<div class="modal-title">Guardar escenario de proyección</div>'+
    '<div class="modal-sub">Estado actual al '+todayKey()+'</div>'+
    '<div style="background:#f5f5f3;border-radius:8px;padding:12px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px">'+
      '<div style="font-size:11px"><span style="color:#888">Meses reales:</span> <strong>'+nMeses+'/12</strong></div>'+
      '<div style="font-size:11px"><span style="color:#888">Utilidad fiscal:</span> <strong>'+fmtMXN(utilidadFiscal)+'</strong></div>'+
      '<div style="font-size:11px"><span style="color:#888">ISR estimado:</span> <strong>'+fmtMXN(isrEstimado)+'</strong></div>'+
      '<div style="font-size:11px"><span style="color:#888">ISR a cargo:</span> <strong>'+fmtMXN(isrACargo)+'</strong></div>'+
      '<div style="font-size:11px"><span style="color:#888">CU:</span> <strong>'+cu.toFixed(2)+'%</strong></div>'+
    '</div>'+
    '<div style="margin-bottom:12px"><div style="font-size:12px;color:#888;margin-bottom:4px">Notas del escenario (opcional)</div>'+
      '<textarea id="esc-notas" rows="2" placeholder="Ej: Proyección al mes de marzo..." style="width:100%;padding:8px;border:1px solid #e0e0db;border-radius:8px;font-size:13px;font-family:inherit;resize:none;box-sizing:border-box"></textarea></div>'+
    '<div style="display:flex;gap:8px">'+
      '<button class="btn btn-full" onclick="document.getElementById(\'modal-escenario-save\').remove()" style="flex:1;margin-top:0">Cancelar</button>'+
      '<button class="btn btn-primary btn-full" onclick="confirmarEscenario(\''+id+'\','+totalIngresos+','+totalCosto+','+totalGastosOp+','+utilidadContable+','+totalSumas+','+totalRestas+','+utilidadFiscal+','+isrEstimado+','+totalPP+','+isrACargo+','+cu+','+margenBruto+','+margenNeto+','+nMeses+')" style="flex:1;margin-top:0">💾 Guardar</button>'+
    '</div>'+
  '</div>';
  document.body.appendChild(overlay);
}

  <tbody>${rows.map(r=>'<tr>'+r.map((c,ci)=>'<td'+(ci>1&&ci<12?' class="right"':'')+'>'+c+'</td>').join('')+'</tr>').join('')}</tbody></table>
  <div class="footer">TaxIA · MSST Consulting SC · ${hoy} · Confidencial</div></div></body></html>`);
  win.document.close();

}


async function guardarMes(){
  const proyId=document.getElementById('ms-proy-id').value;
  const mes=parseInt(document.getElementById('ms-mes').value);
  const mesId=document.getElementById('ms-id').value;
  const ingresos=parseFloat(document.getElementById('ms-ing').value)||0;
  const costo_ventas=parseFloat(document.getElementById('ms-cv').value)||0;
  const gastos_operacion=parseFloat(document.getElementById('ms-go').value)||0;
  const otros_ingresos=parseFloat(document.getElementById('ms-oi').value)||0;
  const otros_gastos=parseFloat(document.getElementById('ms-og').value)||0;
  const activo_fijo_bruto=parseFloat(document.getElementById('ms-afb').value)||0;
  const depreciacion_acumulada_contable=parseFloat(document.getElementById('ms-dac').value)||0;
  const pago_provisional=parseFloat(document.getElementById('ms-pp')?.value)||0;
  const pdf_er=document.getElementById('ms-er-url')?.value||null;
  const pdf_er_nombre=document.getElementById('ms-er-nombre')?.value||null;
  const pdf_balance=document.getElementById('ms-bg-url')?.value||null;
  const pdf_balance_nombre=document.getElementById('ms-bg-nombre')?.value||null;
  const pdf_balanza=document.getElementById('ms-bc-url')?.value||null;
  const pdf_balanza_nombre=document.getElementById('ms-bc-nombre')?.value||null;
  const utilidad_bruta=ingresos-costo_ventas;
  const utilidad_operacion=utilidad_bruta-gastos_operacion;
  const utilidad_neta_contable=utilidad_operacion+otros_ingresos-otros_gastos;
  const payload={proyeccion_id:proyId,mes,ingresos,costo_ventas,utilidad_bruta,gastos_operacion,utilidad_operacion,otros_ingresos,otros_gastos,utilidad_neta_contable,activo_fijo_bruto,depreciacion_acumulada_contable,pago_provisional,pdf_er,pdf_er_nombre,pdf_balance,pdf_balance_nombre,pdf_balanza,pdf_balanza_nombre,fuente:'manual'};
  document.getElementById('modal-mes')?.remove();
  if(mesId) await sbPatch('pf_meses','?id=eq.'+mesId,payload);
  else await sbPost('pf_meses',payload,'return=minimal');
  renderDetalleProyeccion(proyId);
}
