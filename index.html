async function handlePDFUpload(input,tipo){
  const file=input.files[0];if(!file)return;
  const proyId=document.getElementById('ms-proy-id').value;
  const mes=document.getElementById('ms-mes').value;
  const statusEl=document.getElementById('ms-'+tipo+'-status');
  statusEl.innerHTML='<span style="color:#3B4BC8">Subiendo...</span>';
  try{
    const path=proyId+'/mes-'+mes+'/'+tipo+'-'+Date.now()+'.pdf';
    const res=await fetch(SB_URL+'/storage/v1/object/financieros/'+path,{
      method:'POST',headers:{'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/pdf','x-upsert':'true'},body:file
    });
    if(!res.ok) throw new Error('Error '+res.status);
    const url=SB_URL+'/storage/v1/object/public/financieros/'+path;
    document.getElementById('ms-'+tipo+'-url').value=url;
    document.getElementById('ms-'+tipo+'-nombre').value=file.name;
    msUpdateStatus(tipo,file.name);
  }catch(e){statusEl.innerHTML='<span style="color:#dc2626">Error: '+e.message+'</span>';}
}

async function extraerCifrasPDF(tipo){
  const url=document.getElementById('ms-'+tipo+'-url').value;
  if(!url)return;
  const statusEl=document.getElementById('ms-extract-status');
  statusEl.style.display='block';statusEl.style.background='#EEEDFE';statusEl.style.color='#3B4BC8';
  statusEl.textContent='Analizando PDF con Claude...';
  try{
    const res=await fetch(url);
    const blob=await res.blob();
    const base64=await new Promise(resolve=>{
      const reader=new FileReader();
      reader.onloadend=()=>resolve(reader.result.split(',')[1]);
      reader.readAsDataURL(blob);
    });
    const prompt=tipo==='er'?
      'Del Estado de Resultados extrae las cifras en MXN. Responde SOLO con JSON sin markdown: {"ingresos":0,"costo_ventas":0,"gastos_operacion":0,"otros_ingresos":0,"otros_gastos":0}':
      tipo==='bg'?
      'Del Balance General extrae el activo fijo en MXN. Responde SOLO con JSON sin markdown: {"activo_fijo_bruto":0,"depreciacion_acumulada":0}':
      'De la Balanza de Comprobacion extrae en MXN. Responde SOLO con JSON sin markdown: {"ingresos":0,"costo_ventas":0,"gastos_operacion":0,"otros_ingresos":0,"otros_gastos":0,"activo_fijo_bruto":0,"depreciacion_acumulada":0}';
    const ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzY3RnemJxYWR1Y2doaXZhbWZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0ODk2MDUsImV4cCI6MjA5MDA2NTYwNX0.w2yWu_hwSW69rnGsiD6FCqHe7GaNuLD_lU3WdgbidKI';
    const apiRes=await fetch(SB_URL+'/functions/v1/claude-analysis',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+ANON_KEY},
      body:JSON.stringify({prompt,pdf_base64:base64,pdf_media_type:'application/pdf'})
    });
    const data=await apiRes.json();
    const raw=(data.text||'').replace(/```json|```/g,'').trim();
    const cifras=JSON.parse(raw);
    if(cifras.ingresos!==undefined){
      const flds=[['ms-ing','ingresos'],['ms-cv','costo_ventas'],['ms-go','gastos_operacion'],['ms-oi','otros_ingresos'],['ms-og','otros_gastos']];
      flds.forEach(([id,key])=>{const el=document.getElementById(id);if(el) el.value=cifras[key]||0;});
    }
    if(cifras.activo_fijo_bruto!==undefined){
      if(document.getElementById('ms-afb')) document.getElementById('ms-afb').value=cifras.activo_fijo_bruto||0;
      if(document.getElementById('ms-dac')) document.getElementById('ms-dac').value=cifras.depreciacion_acumulada||0;
    }
    statusEl.style.background='#f0f7d4';statusEl.style.color='#5a8a1a';
    statusEl.textContent='Cifras extraidas. Revisa y ajusta si es necesario.';
    switchMesTab('cifras');
  }catch(e){
    statusEl.style.background='#fef2f2';statusEl.style.color='#dc2626';
    statusEl.textContent='Error: '+e.message+'. Captura manualmente.';
  }
}


/* ===== AVISO DE BIENVENIDA ===== */
async function mostrarAvisoBienvenida(){
  const today=todayKey();
  const email=session.email;
  const [tareas,sesiones]=await Promise.all([
    sbGet('tareas','?email=eq.'+encodeURIComponent(email)+'&status=in.(pendiente,standby)&select=*&order=created_at.asc'),
    sbGet('sesiones','?email=eq.'+encodeURIComponent(email)+'&logout_at=not.is.null&order=login_at.desc&limit=2&select=*')
  ]);
  const sesAnterior=(sesiones||[])[1]||(sesiones||[])[0]||null;
  const fechaAnterior=(()=>{
    if(!sesAnterior)return null;
    const d=new Date(sesAnterior.login_at);
    const fecha=d.toLocaleDateString('es-MX',{timeZone:'America/Tijuana',weekday:'short',day:'numeric',month:'short'});
    const hora=d.toLocaleTimeString('es-MX',{timeZone:'America/Tijuana',hour:'2-digit',minute:'2-digit'});
    return fecha+' · '+hora;
  })();
  const durAnterior=sesAnterior&&sesAnterior.duracion_min?(sesAnterior.duracion_min>=60?Math.floor(sesAnterior.duracion_min/60)+'h '+(sesAnterior.duracion_min%60)+'min':sesAnterior.duracion_min+' min'):null;
  const tareasData=tareas||[];
  const vencidas=tareasData.filter(t=>{
    if(t.status!=='pendiente')return false;
    const fc=t.fecha_creacion||t.created_at?.slice(0,10);
    return fc&&fc<today;
  });
  const hoy=tareasData.filter(t=>{
    const fc=t.fecha_creacion||t.created_at?.slice(0,10);
    return fc&&fc===today&&t.status==='pendiente';
  });
  const standby=tareasData.filter(t=>t.status==='standby').slice(0,2);
  const prioritarias=[...vencidas,...hoy,...standby].slice(0,5);
  if(!prioritarias.length&&!sesAnterior){
    if(session.role==='assistant') renderMisPlan();
    else renderDashboard(today);
    return;
  }
  if(session.role==='assistant') renderMisPlan();
  else renderDashboard(today);
  const overlay=document.createElement('div');
  overlay.id='aviso-bienvenida';
  overlay.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.45);z-index:8000;display:flex;align-items:center;justify-content:center;padding:1rem';
  const hora=new Date().getHours();
  const saludo=hora<12?'Buenos días':hora<19?'Buenas tardes':'Buenas noches';
  const u=usersCache[email]||session;
  const taskRows=prioritarias.map(t=>{
    const fc=t.fecha_creacion||t.created_at?.slice(0,10)||'';
    const esVencida=t.status==='pendiente'&&fc&&fc<today;
    const esHoy=fc===today;
    const dotColor=esVencida?'#E24B4A':esHoy?'#EF9F27':'#378ADD';
    const badgeStyle=esVencida?'background:#FCEBEB;color:#A32D2D':esHoy?'background:#FAEEDA;color:#854F0B':'background:#E6F1FB;color:#185FA5';
    const badgeLabel=esVencida?'Vencida':esHoy?'Hoy':'Stand By';
    const diasVenc=esVencida&&fc?Math.round((new Date(today)-new Date(fc))/(86400000)):0;
    const meta=esVencida?'Vencida hace '+diasVenc+' día'+(diasVenc!==1?'s':''):esHoy?'Vence hoy':'Stand By pendiente';
    return '<div style="display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:0.5px solid #e5e5e0">'+
      '<div style="width:7px;height:7px;border-radius:50%;background:'+dotColor+';flex-shrink:0;margin-top:5px"></div>'+
      '<div style="flex:1;min-width:0">'+
        '<div style="font-size:13px;color:#1a1a1a;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+escH(t.descripcion)+'</div>'+
        '<div style="font-size:11px;color:#888;margin-top:2px">'+meta+(t.client_name?' · '+escH(t.client_name):'')+'</div>'+
      '</div>'+
      '<span style="'+badgeStyle+';padding:2px 8px;border-radius:999px;font-size:10px;font-weight:600;flex-shrink:0">'+badgeLabel+'</span>'+
    '</div>';
  }).join('');
  const pillsHtml=
    (vencidas.length?'<span style="background:#FCEBEB;color:#A32D2D;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600">'+vencidas.length+' vencida'+(vencidas.length!==1?'s':'')+'</span>':'')+
    (hoy.length?'<span style="background:#FAEEDA;color:#854F0B;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;margin-left:4px">'+hoy.length+' para hoy</span>':'')+
    (standby.length?'<span style="background:#E6F1FB;color:#185FA5;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;margin-left:4px">'+standby.length+' en stand by</span>':'');
  overlay.innerHTML=
    '<div style="background:#fff;border-radius:12px;width:100%;max-width:480px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.18)">'+
      '<div style="background:#3B4BC8;padding:16px 20px;display:flex;align-items:flex-start;justify-content:space-between">'+
        '<div>'+
          '<div style="font-size:12px;color:rgba(255,255,255,.75);margin-bottom:2px">'+saludo+' — '+new Date().toLocaleDateString('es-MX',{timeZone:'America/Tijuana',weekday:'long',day:'numeric',month:'long'})+'</div>'+
          '<div style="font-size:17px;font-weight:600;color:#fff">'+escH(u.name||email)+'</div>'+
        '</div>'+
        '<button id="btn-cerrar-aviso" style="width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.15);border:none;cursor:pointer;color:#fff;font-size:16px">✕</button>'+
      '</div>'+
      (sesAnterior?
        '<div style="background:#2d3db0;padding:8px 20px;display:flex;gap:20px;flex-wrap:wrap">'+
          '<div style="font-size:11px;color:rgba(255,255,255,.85)"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#8DC63F;margin-right:5px"></span>Última sesión: '+fechaAnterior+'</div>'+
          (durAnterior?'<div style="font-size:11px;color:rgba(255,255,255,.85)">&#9201; '+durAnterior+'</div>':'')+
        '</div>':'')+
      '<div style="padding:16px 20px">'+
        (pillsHtml?'<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px">'+pillsHtml+'</div>':'')+
        (prioritarias.length?
          '<div style="font-size:10px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Tareas que requieren atención</div>'+
          '<div>'+taskRows+'</div>':
          '<div style="text-align:center;padding:12px 0;color:#888;font-size:13px">Sin tareas pendientes.</div>')+
      '</div>'+
      '<div style="padding:12px 20px;border-top:0.5px solid #e5e5e0;display:flex;justify-content:space-between;align-items:center">'+
        '<span id="aviso-countdown" style="font-size:11px;color:#888">Se cierra en 15 seg</span>'+
        '<button id="btn-entrar-aviso" style="background:#3B4BC8;color:#fff;border:none;padding:8px 20px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer">Entrar al dashboard</button>'+
      '</div>'+
    '</div>';
  document.body.appendChild(overlay);
  document.getElementById('btn-cerrar-aviso').onclick=cerrarAviso;
  document.getElementById('btn-entrar-aviso').onclick=cerrarAviso;
  let secs=15;
  const countdown=setInterval(()=>{
    secs--;
    const el=document.getElementById('aviso-countdown');
    if(el) el.textContent='Se cierra en '+secs+' seg';
    if(secs<=0){clearInterval(countdown);cerrarAviso();}
  },1000);
  overlay._countdown=countdown;
}

function cerrarAviso(){
  const overlay=document.getElementById('aviso-bienvenida');
  if(overlay){
    if(overlay._countdown) clearInterval(overlay._countdown);
    overlay.remove();
  }
}

  // Fetch con timeout para AC
  function fetchAC(url,ms=5000){
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),ms);
    return fetch(url,{headers:{'X-Requested-With':'XMLHttpRequest'},credentials:'include',signal:ctrl.signal})
      .finally(()=>clearTimeout(timer));
  }

  // Cargar tareas de ActiveCollab para un usuario en el período
  async function cargarTareasAC(usuario,d0,d1){
    const proyIds=AC_PROYECTOS_POR_USUARIO[usuario.acId]||[];
    if(!proyIds.length) return {abiertas:[],completadas:[]};
    const d0ts=new Date(d0+'T00:00:00').getTime()/1000;
    const d1ts=new Date(d1+'T23:59:59').getTime()/1000;
    const abiertas=[];
    const completadas=[];
    // Obtener tareas abiertas del usuario
    try{
      const resAb=await fetchAC(AC_URL+'/api/v1/users/'+usuario.acId+'/tasks?page=1&per_page=200');
      if(resAb.ok){
        const dataAb=await resAb.json();
        const tasks=Array.isArray(dataAb)?dataAb:(dataAb.tasks||dataAb.data||[]);
        tasks.forEach(t=>{
          const creado=t.created_on||0;
          if(creado>=d0ts&&creado<=d1ts){
            abiertas.push({
              id:'ac-'+t.id,
              descripcion:t.name,
              client_name:t.project_name||('Proyecto '+t.project_id),
              status:'pendiente',
              fecha_creacion:new Date(creado*1000).toISOString().slice(0,10),
              fecha_conclusion:null,
              fuente:'activecollab',
              vence:t.due_on?new Date(t.due_on*1000).toISOString().slice(0,10):null
            });
          }
        });
      }
    }catch(e){console.warn('AC abiertas error:',e);}

    // Obtener tareas completadas por proyecto
    for(const proyId of proyIds){
      try{
        const resComp=await fetchAC(AC_URL+'/api/v1/projects/'+proyId+'/tasks?completed=1&page=1&per_page=100');
        if(resComp.ok){
          const dataComp=await resComp.json();
          const tasks=Array.isArray(dataComp)?dataComp:(dataComp.tasks||dataComp.data||[]);
          tasks.forEach(t=>{
            if(t.assignee_id===usuario.acId||t.completed_by_id===usuario.acId){
              const compTs=t.completed_on||0;
              if(compTs>=d0ts&&compTs<=d1ts){
                completadas.push({
                  id:'ac-'+t.id,
                  descripcion:t.name,
                  client_name:t.project_name||('Proy '+proyId),
                  status:'concluida',
                  fecha_creacion:t.created_on?new Date(t.created_on*1000).toISOString().slice(0,10):null,
                  fecha_conclusion:new Date(compTs*1000).toISOString().slice(0,10),
                  fuente:'activecollab',
                  vence:null
                });
              }
            }
          });
        }
      }catch(e){console.warn('AC completadas error proyecto '+proyId+':',e);}
    }
    return {abiertas,completadas};
  }

    if(btn) btn.disabled=true;
    if(status) status.textContent=' Conectando con Active Collab...';

    const d0=document.getElementById('_msd0')?.value||d0val;
    const d1=document.getElementById('_msd1')?.value||d1val;
    const sel=[];document.querySelectorAll('[name=_mu]:checked').forEach(c=>sel.push(c.value));
    const usuarios=USERS.filter(u=>sel.includes(u.name));

    let ok=0;let err=0;
    for(const u of usuarios){
      try{
        if(status) status.textContent=' Cargando '+u.name.split(' ')[0]+'...';
        const ac=await cargarTareasAC(u,d0,d1);

        ok++;

      }
    }

    }
    if(btn){btn.disabled=false;btn.textContent='🔄 Recargar AC';}

    if(ok>0) renderGconAC(sel,d0,d1);

  async function renderGconAC(sel,d0,d1){
    // Igual que renderG pero usando _acDataCache
    const ov=document.getElementById('_msstor');
    if(!ov) return;

    const usuarios=USERS.filter(u=>sel.includes(u.name));
    const emails=usuarios.map(u=>u.email);
    const todasTareas=await cargarTareas(emails,d0,d1);
    const todayStr=todayKey();

    const porUsuarioBase=usuarios.map(u=>{
      const uT=todasTareas.filter(t=>t.email===u.email);
      const registradas=uT.filter(t=>t.fecha_creacion>=d0&&t.fecha_creacion<=d1);
      const concluidas=uT.filter(t=>t.fecha_conclusion&&t.fecha_conclusion.slice(0,10)>=d0&&t.fecha_conclusion.slice(0,10)<=d1);
      const vencidas=uT.filter(t=>t.status==='pendiente'&&t.fecha_creacion&&t.fecha_creacion<todayStr);
      return {...u,registradas,concluidas,vencidas,todas:uT};
    });

    const porUsuario=porUsuarioBase.map(u=>{
      const ac=_acDataCache[u.acId]||{abiertas:[],completadas:[]};
      const taxiaDescs=new Set([...u.registradas,...u.concluidas].map(t=>t.descripcion?.toLowerCase()));
      const acAbiertasNuevas=ac.abiertas.filter(t=>!taxiaDescs.has(t.descripcion?.toLowerCase()));
      const acConclNuevas=ac.completadas.filter(t=>!taxiaDescs.has(t.descripcion?.toLowerCase()));
      return {
        ...u,
        registradas:[...u.registradas,...acAbiertasNuevas],
        concluidas:[...u.concluidas,...acConclNuevas],
        vencidas:[...u.vencidas,...ac.abiertas.filter(t=>t.vence&&t.vence<todayStr)],
        ac_abiertas:ac.abiertas.length,
        ac_completadas:ac.completadas.length
      };
    });

    // Reconstruir solo el cuerpo del panel (mantener header y filtros)
    const cuerpo=document.getElementById('_msspanel');
    if(!cuerpo) return;

    // Actualizar los datos en el panel existente usando renderG completo
    renderG(sel,d0,d1,porUsuario);
  }

  const btn=document.createElement('button');
  btn.id='_msstbtn';
  btn.innerHTML='📊 Mi Reporte';
  btn.title='Reporte Gerencial — Solo CPC Manuel Santana';
  btn.onclick=()=>renderG(USERS.map(u=>u.name),d0val,d1val);

  const ov=document.createElement('div');
  ov.id='_msstor';

  document.body.appendChild(btn);
  document.body.appendChild(ov);
}

  const notasBase=['La proyección se basa en '+nMeses+' mes'+(nMeses!==1?'es':'')+(nMeses<12?' real'+(nMeses!==1?'es':'')+' y '+(12-nMeses)+' meses proyectados por promedio.':' reales.')];
  if(nMeses<6) notasBase.push('Con solo '+nMeses+' mes'+(nMeses!==1?'es':'')+' real'+(nMeses!==1?'es':'')+', la proyección tiene margen de variabilidad elevado.');

  const notasRazones=[];
  notasRazones.push('Margen bruto: '+margenBruto.toFixed(2)+'% — '+(margenBruto<20?'Bajo. Revisar estructura de costos.':margenBruto<40?'Aceptable, con oportunidad de mejora.':'Saludable.'));
  notasRazones.push('Margen de operación: '+margenOperacion.toFixed(2)+'% — '+(margenOperacion<10?'Bajo. Gastos operativos absorben utilidad bruta.':margenOperacion<20?'Moderado, optimizar gastos.':'Robusto.'));
  notasRazones.push('Costo de ventas / Ingresos: '+pesoCosto.toFixed(2)+'% — '+(pesoCosto>70?'Elevado. Revisar proveedores y procesos.':pesoCosto>50?'Manejable, vigilar incrementos.':'Bien controlado.'));
  notasRazones.push('Gastos operativos / Ingresos: '+rotacionGastos.toFixed(2)+'% — '+(rotacionGastos>30?'Elevado. Analizar gastos administrativos.':rotacionGastos>20?'Moderado.':'Bien alineado.'));
  notasRazones.push('Margen neto contable: '+margenNeto.toFixed(2)+'% — '+(margenNeto<0?'Pérdida neta. Medidas correctivas inmediatas.':margenNeto<5?'Muy reducido. Alta sensibilidad ante variaciones.':margenNeto<15?'Aceptable.':'Sólido.'));

  const notasFiscales=[];
  if(utilidadFiscal<0) notasFiscales.push('Pérdida fiscal estimada de '+fmtMXN(Math.abs(utilidadFiscal))+'. Evaluar aplicación conforme Art. 57 LISR.');
  if(utilidadFiscal>0&&utilidadFiscal>utilidadContable) notasFiscales.push('Utilidad fiscal ('+fmtMXN(utilidadFiscal)+') mayor a contable ('+fmtMXN(utilidadContable)+'). Diferencia temporal de '+fmtMXN(difFiscalContable)+'.');
  if(utilidadFiscal>0&&utilidadFiscal<utilidadContable) notasFiscales.push('Ajustes fiscales reducen base gravable en '+fmtMXN(Math.abs(difFiscalContable))+'. Gestión fiscal eficiente.');
  if(isrEstimado>0){

  }
  notasFiscales.push('CU determinado: '+cuPDF.toFixed(2)+'%. Aplicable para pagos provisionales '+( proy.ejercicio+1)+' conforme Art. 14 LISR.');
  notasFiscales.push('Cifras estimadas sujetas a revisión definitiva al cierre del ejercicio '+proy.ejercicio+'. MSST Consulting SC.');

  const notasHTML=seccionNotas('I. Bases y alcance','#888',notasBase)+seccionNotas('II. Razones financieras','#3B4BC8',notasRazones)+seccionNotas('III. Consideraciones fiscales','#8DC63F',notasFiscales);

  // Historial cierres
  const histHTML=(()=>{
    const hist=(cierresHist||[]).filter(c=>c.ejercicio<proy.ejercicio&&c.ingresos_acumulables!=null);
    if(!hist.length)return'';

      const isr_cargo=parseFloat(c.isr_a_cargo||0);const sf=parseFloat(c.saldo_favor||0);
      return '<tr><td style="padding:5px 8px;font-size:11px;font-weight:600;border-bottom:1px solid #f0f0ec">'+c.ejercicio+'</td>'+

    }).join('');
    return '<div class="section"><div class="section-title">Historial fiscal de cierres anteriores — '+escH(proy.cliente_nombre)+'</div>'+

      '<tbody>'+filas+
      '<tr style="background:#f0f4ff"><td style="padding:6px 8px;font-size:11px;font-weight:700;color:#3B4BC8" colspan="3">Proyección '+proy.ejercicio+' (estimado)</td>'+
      '<td style="padding:6px 8px;font-size:11px;text-align:right;font-weight:700;color:#3B4BC8">'+fmtMXN(utilidadFiscal)+'</td>'+
      '<td style="padding:6px 8px;font-size:11px;text-align:right;font-weight:700;color:#dc2626">'+fmtMXN(isrEstimado)+'</td>'+
      '<td style="padding:6px 8px;font-size:11px;text-align:right;font-weight:700;color:#3B4BC8">'+fmtMXN(totalPP2)+'</td>'+
      '<td style="padding:6px 8px;font-size:11px;text-align:right;font-weight:700;color:'+(isrACargoP>0?'#dc2626':'#5a8a1a')+'">'+(isrACargoP>0?fmtMXN(isrACargoP):'('+fmtMXN(saldoFavorP)+')')+'</td>'+

      '</tbody></table></div>';
  })();

  const win=window.open('','_blank');
  win.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">

/* ===== HISTORIAL DE CIERRE FISCAL ===== */
let cierresCache=[];

async function renderCierres(){
  app.innerHTML=renderTopNav('proyeccion')+`
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px">
    <div style="display:flex;gap:4px;border-bottom:0.5px solid #e5e5e0;padding-bottom:0;margin-bottom:0">
      <button onclick="renderProyeccion()" style="padding:8px 16px;font-size:13px;border:none;background:none;cursor:pointer;color:#888;border-bottom:2px solid transparent;margin-bottom:-1px">Proyecciones</button>
      <button onclick="renderCierres()" style="padding:8px 16px;font-size:13px;border:none;background:none;cursor:pointer;color:#3B4BC8;border-bottom:2px solid #3B4BC8;font-weight:600;margin-bottom:-1px">Historial de cierre</button>
    </div>
    <button class="btn btn-primary btn-sm" onclick="renderNuevoCierre()">+ Nuevo cierre</button>
  </div>
  <div class="loading" id="cfl"><span class="spinner"></span>Cargando...</div>
  <div id="cf-body"></div>`;
  const data=await sbGet('pf_cierres','?select=*&order=ejercicio.desc,cliente_nombre.asc');
  cierresCache=data||[];
  document.getElementById('cfl').style.display='none';
  renderCierresList();
}

function renderCierresList(){
  const el=document.getElementById('cf-body');if(!el)return;
  if(!cierresCache.length){
    el.innerHTML='<div class="card"><div style="font-size:14px;color:#888;text-align:center;padding:1rem">Sin cierres registrados. Crea el primero con "+ Nuevo cierre".</div></div>';
    return;
  }
  const porCliente={};
  cierresCache.forEach(c=>{if(!porCliente[c.cliente_nombre])porCliente[c.cliente_nombre]=[];porCliente[c.cliente_nombre].push(c);});
  let html='';
  Object.entries(porCliente).sort((a,b)=>a[0].localeCompare(b[0],'es')).forEach(([cli,cierres])=>{
    html+='<div style="font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">'+escH(cli)+'</div>';
    html+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:1rem">';
    cierres.sort((a,b)=>b.ejercicio-a.ejercicio).forEach(c=>{
      const tieneData=c.ingresos_acumulables!==null;
      html+='<div style="background:var(--color-background-secondary);border-radius:8px;padding:12px;cursor:pointer;border:0.5px solid var(--color-border-tertiary)" onclick="renderDetalleCierre(\''+c.id+'\')">'+
        '<div style="font-size:18px;font-weight:600;color:var(--color-text-primary);margin-bottom:2px">'+c.ejercicio+'</div>'+
        '<div style="font-size:11px;color:#888;margin-bottom:6px">Ejercicio cerrado</div>'+
        (tieneData?'<div style="font-size:12px;font-weight:500;color:#3B4BC8">'+fmtMXN(parseFloat(c.isr_a_cargo)>0?c.isr_a_cargo:c.saldo_favor)+'</div>'+
          '<div style="font-size:10px;color:#888">'+(parseFloat(c.isr_a_cargo)>0?'ISR a cargo':'Saldo a favor')+'</div>':'')+
        '<div style="display:inline-block;font-size:9px;padding:2px 7px;border-radius:999px;font-weight:500;margin-top:6px;background:'+(tieneData?'#EAF3DE':'#F1EFE8')+';color:'+(tieneData?'#3B6D11':'#5F5E5A')+'">'+(tieneData?'Completo':'Sin datos')+'</div>'+
      '</div>';
    });
    html+='</div>';
  });
  el.innerHTML=html;
}

async function renderNuevoCierre(id){
  const editing=id?cierresCache.find(c=>c.id===id):null;
  const cliOpts='<option value="">Selecciona cliente...</option>'+clientesCache.map(c=>'<option value="'+c.id+'" data-nombre="'+escH(c.nombre)+'"'+(editing&&editing.cliente_id===c.id?' selected':'')+'>'+escH(c.nombre)+'</option>').join('');
  const anioActual=new Date().getFullYear();
  const anios=[anioActual-4,anioActual-3,anioActual-2,anioActual-1,anioActual];
  const anioOpts=anios.map(y=>'<option value="'+y+'"'+(editing?editing.ejercicio===y?' selected':'':y===anioActual-1?' selected':'')+'>'+y+'</option>').join('');
  app.innerHTML=renderTopNav('proyeccion')+`
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:1rem">
    <button class="btn btn-sm" onclick="renderCierres()">← Cierres</button>
    <div style="font-size:15px;font-weight:600">${editing?'Editar cierre fiscal':'Nuevo cierre fiscal'}</div>
  </div>
  <div class="card">
    <div class="sec-label" style="margin-bottom:12px">Datos generales</div>
    <div class="grid2" style="margin-bottom:12px">
      <div><div style="font-size:12px;color:#888;margin-bottom:4px">Cliente *</div>
        <select id="cf-cliente" style="width:100%" onchange="cfSetCliente(this)">${cliOpts}</select>
        <input type="hidden" id="cf-cli-nombre" value="${escH(editing?.cliente_nombre||'')}"></div>
      <div><div style="font-size:12px;color:#888;margin-bottom:4px">Ejercicio *</div>

function cfSetCliente(sel){
  const opt=sel.options[sel.selectedIndex];
  const nombre=opt?.dataset?.nombre||opt?.text||'';

async function saveCierre(){
  const cliSel=document.getElementById('cf-cliente');
  const cliente_id=cliSel.value||null;
  const cliente_nombre=document.getElementById('cf-cli-nombre').value||(cliSel.selectedIndex>0?cliSel.options[cliSel.selectedIndex]?.dataset?.nombre||cliSel.options[cliSel.selectedIndex]?.text||'':'');
  const ejercicio=parseInt(document.getElementById('cf-ejercicio').value);
  const tasa_isr=parseFloat(document.getElementById('cf-tasa').value)||30;
  const ingresos_acumulables=parseFloat(document.getElementById('cf-ing').value)||0;
  const costo_ventas=parseFloat(document.getElementById('cf-cv').value)||0;
  const gastos_operacion=parseFloat(document.getElementById('cf-go').value)||0;
  const otros_ingresos=parseFloat(document.getElementById('cf-oi').value)||0;
  const otros_gastos=parseFloat(document.getElementById('cf-og').value)||0;
  const pagos_provisionales=parseFloat(document.getElementById('cf-pp').value)||0;
  const notas=document.getElementById('cf-notas').value.trim()||null;
  const editing=document.getElementById('cf-editing').value;
  const err=document.getElementById('cf-err');err.style.display='none';
  if(!cliente_nombre||!ejercicio){err.textContent='Cliente y ejercicio son obligatorios.';err.style.display='block';return;}
  const utilidad_contable=ingresos_acumulables-costo_ventas-gastos_operacion+otros_ingresos-otros_gastos;
  let total_sumas=0,total_restas=0;
  if(editing){
    const ajustes=await sbGet('pf_cierres_ajustes','?cierre_id=eq.'+editing+'&select=*');
    total_sumas=(ajustes||[]).filter(a=>a.tipo==='suma').reduce((s,a)=>s+(parseFloat(a.importe)||0),0);
    total_restas=(ajustes||[]).filter(a=>a.tipo==='resta').reduce((s,a)=>s+(parseFloat(a.importe)||0),0);
  }
  const utilidad_fiscal=utilidad_contable+total_sumas-total_restas;
  const isr_causado=utilidad_fiscal>0?utilidad_fiscal*(tasa_isr/100):0;
  const isr_a_cargo=Math.max(0,isr_causado-pagos_provisionales);
  const saldo_favor=Math.max(0,pagos_provisionales-isr_causado);
  const cu=ingresos_acumulables>0?(utilidad_fiscal/ingresos_acumulables*100):0;
  const payload={cliente_id,cliente_nombre,ejercicio,tasa_isr,ingresos_acumulables,costo_ventas,gastos_operacion,otros_ingresos,otros_gastos,utilidad_contable,total_sumas,total_restas,utilidad_fiscal,isr_causado,pagos_provisionales,isr_a_cargo,saldo_favor,cu,notas,updated_at:nowISO()};
  if(editing) await sbPatch('pf_cierres','?id=eq.'+editing,payload);
  else await sbPost('pf_cierres',payload,'return=minimal');
  const updated=await sbGet('pf_cierres','?select=*&order=ejercicio.desc,cliente_nombre.asc');
  cierresCache=updated||[];
  renderCierres();
}

    ['Depreciación fiscal adicional (LISR Art. 31-38)','Ajuste anual por inflación deducible (LISR Art. 44-46)','PTU pagada deducible (LISR Art. 25 Fr. III)','Pérdida por enajenación de activos (LISR Art. 25 Fr. IV)','Deducción inmediata (LISR Art. 220)','Gastos no deducibles a revertir'];
  const sugerOpts='<option value="">Elige sugerencia o escribe abajo...</option>'+sugerencias.map(s=>'<option value="'+escH(s)+'">'+escH(s)+'</option>').join('');

    '</div>'+

      '<button class="btn btn-primary btn-full" onclick="guardarAjusteCierre()" style="flex:1;margin-top:0">Guardar</button>'+
    '</div>'+
  '</div>';
  document.body.appendChild(overlay);
}

async function recalcularCierre(cierreId){
  const cierre=cierresCache.find(c=>c.id===cierreId);if(!cierre)return;
  const ajustes=await sbGet('pf_cierres_ajustes','?cierre_id=eq.'+cierreId+'&select=*');
  const aj=ajustes||[];
  const ts=aj.filter(a=>a.tipo==='suma').reduce((s,a)=>s+(parseFloat(a.importe)||0),0);
  const tr=aj.filter(a=>a.tipo==='resta').reduce((s,a)=>s+(parseFloat(a.importe)||0),0);
  const uc=parseFloat(cierre.ingresos_acumulables||0)-parseFloat(cierre.costo_ventas||0)-parseFloat(cierre.gastos_operacion||0)+parseFloat(cierre.otros_ingresos||0)-parseFloat(cierre.otros_gastos||0);
  const uf=uc+ts-tr;
  const isr=uf>0?uf*(cierre.tasa_isr/100):0;
  const pp=parseFloat(cierre.pagos_provisionales||0);
  const iac=Math.max(0,isr-pp);const sf=Math.max(0,pp-isr);
  const cu=parseFloat(cierre.ingresos_acumulables||0)>0?(uf/parseFloat(cierre.ingresos_acumulables)*100):0;
  await sbPatch('pf_cierres','?id=eq.'+cierreId,{total_sumas:ts,total_restas:tr,utilidad_fiscal:uf,isr_causado:isr,isr_a_cargo:iac,saldo_favor:sf,cu,updated_at:nowISO()});
  const idx=cierresCache.findIndex(c=>c.id===cierreId);
  if(idx>=0) cierresCache[idx]={...cierresCache[idx],total_sumas:ts,total_restas:tr,utilidad_fiscal:uf,isr_causado:isr,isr_a_cargo:iac,saldo_favor:sf,cu};
}

async function deleteCierre(id){
  const c=cierresCache.find(x=>x.id===id);
  if(!confirm('¿Eliminar el cierre de '+(c?.cliente_nombre||'')+ ' '+(c?.ejercicio||'')+'?'))return;
  await sbDelete('pf_cierres_ajustes','?cierre_id=eq.'+id);
  await sbDelete('pf_cierres','?id=eq.'+id);
  cierresCache=cierresCache.filter(x=>x.id!==id);
  renderCierres();
}

async function permToggle(checkbox){
  const email=checkbox.dataset.email;
  const mod=checkbox.dataset.mod;
  const u=usersCache[email];
  if(!u) return;
  let mods=u.modulos&&u.modulos.length?[...u.modulos]:[...(DEFAULT_MODULES_BY_ROLE[u.role]||['plan'])];
  if(checkbox.checked){if(!mods.includes(mod))mods.push(mod);}
  else{mods=mods.filter(m=>m!==mod);}
  u.modulos=mods;
  usersCache[email]=u;
  await sbPatch('users','?email=eq.'+encodeURIComponent(email),{modulos:JSON.stringify(mods)});
  // Feedback visual
  const lbl=checkbox.closest('label');
  if(lbl){lbl.style.background=checkbox.checked?'#EAF3DE':'#fafafa';lbl.style.borderColor=checkbox.checked?'#3B6D11':'#f0f0ec';setTimeout(()=>{lbl.style.background='#fafafa';lbl.style.borderColor='#f0f0ec';},800);}
}

async function ppSeleccionarCliente(clientId, nombre, ejercicioInicial) {

  // Cargar config del cliente
  const cfgRows = await sbGet('pp_config', `?client_id=eq.${clientId}&select=*`);
  const cfg = cfgRows && cfgRows[0] ? cfgRows[0] : null;
  ppConfigCache[clientId] = cfg ? {
    impuestos_fed: typeof cfg.impuestos_fed === 'string' ? JSON.parse(cfg.impuestos_fed) : (cfg.impuestos_fed || ['isr_pm','iva','ret_s','ret_h']),

function ppSetTab(tab) {
  ppTabActiva = tab;
  ppMesActivo = null;
  document.querySelectorAll('[id^="pptab-"]').forEach(b => {
    const isOn = b.id === 'pptab-' + tab;
    b.style.color = isOn ? '#3B4BC8' : '#888';
    b.style.fontWeight = isOn ? '600' : '400';
    b.style.borderBottom = isOn ? '2px solid #3B4BC8' : '2px solid transparent';
  });
  ppRenderTab();
}

function ppRenderTab() {
  const el = document.getElementById('pp-tab-content');
  if (!el) return;
  if (ppTabActiva === 'revision') ppRenderRevision(el);
  else if (ppTabActiva === 'historico') ppRenderHistorico(el);
  else if (ppTabActiva === 'informe') ppRenderInforme(el);
  else if (ppTabActiva === 'config') ppRenderConfig(el);
}

// ===== TAB: REVISIÓN MENSUAL =====
function ppRenderRevision(el) {
  if (ppMesActivo) { ppRenderMesDetalle(el); return; }
  const ej_sel = ppClienteActivo?.ejercicio || new Date().getFullYear();
  const ejercicios_disponibles = [...new Set(ppCache.filter(p=>String(p.client_id)===String(ppClienteActivo.id)).map(p=>p.ejercicio))].sort((a,b)=>b-a);
  if (!ejercicios_disponibles.includes(ej_sel)) ejercicios_disponibles.unshift(ej_sel);
  ppRenderRevisionGrid(el, ej_sel, ejercicios_disponibles);
}

function ppRenderRevisionGrid(el, ej_sel, ejercicios_disponibles) {
  const periodosMes = {};
  ppCache.filter(p=>String(p.client_id)===String(ppClienteActivo.id)&&p.ejercicio===ej_sel).forEach(p=>{periodosMes[p.mes]=p;});

  let ejOpts = '';
  (ejercicios_disponibles||[ej_sel]).forEach(function(e){
    ejOpts += '<option value="'+e+'"'+(e===ej_sel?' selected':'')+'>'+e+'</option>';
  });
  if (!(ejercicios_disponibles||[]).includes(ej_sel-1)) {
    ejOpts += '<option value="'+(ej_sel-1)+'">'+(ej_sel-1)+'</option>';
  }

  let botonesMes = '';
  PP_MESES_LARGO.forEach(function(mes, i) {
    const numMes = i + 1;
    const periodo = periodosMes[numMes];
    const revisado = periodo && periodo.revisado;
    const alerta = periodo && !revisado && periodo.status === 'alerta';
    const color = revisado ? '#3B6D11' : alerta ? '#854F0B' : '#444';
    const bg = revisado ? '#EAF3DE' : alerta ? '#FAEEDA' : '#f5f5f3';
    const border = revisado ? '#3B6D11' : alerta ? '#e0b44a' : '#e5e5e0';
    botonesMes += '<button onclick="ppAbrirMes('+ej_sel+','+numMes+')"'
      +' style="padding:10px;font-size:13px;font-weight:600;border:1.5px solid '+border
      +';border-radius:8px;background:'+bg+';color:'+color
      +';cursor:pointer;font-family:inherit;transition:all .15s">'
      +PP_MESES_CORTO[i]+'</button>';
  });

  el.innerHTML = '<div class="card" style="margin-bottom:12px">'
    +'<div class="sec-label">SELECCIONAR PERÍODO</div>'
    +'<div style="margin-bottom:12px">'
    +'<div style="font-size:11px;color:#888;font-weight:600;margin-bottom:6px">EJERCICIO FISCAL</div>'
    +'<select onchange="ppCambiarEjercicio(parseInt(this.value))" style="width:220px;font-size:14px;padding:8px 10px;border:1px solid #e0e0db;border-radius:8px">'
    +ejOpts+'</select></div>'
    +'<div id="pp-meses-grid" style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px">'
    +botonesMes+'</div>'
    +'<div style="display:flex;gap:14px;font-size:11px;color:#888">'
    +'<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#3B6D11;margin-right:4px"></span>Revisado</span>'
    +'<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#854F0B;margin-right:4px"></span>Con alertas</span>'
    +'<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#ccc;margin-right:4px"></span>Sin iniciar</span>'
    +'</div></div>';
}

function ppCambiarEjercicio(ej) {
  ppClienteActivo.ejercicio = ej;
  ppMesActivo = null;
  const el = document.getElementById('pp-tab-content');
  if (!el) return;
  const ejercicios_disponibles = [...new Set(ppCache.filter(p=>String(p.client_id)===String(ppClienteActivo.id)).map(p=>p.ejercicio))].sort((a,b)=>b-a);
  if (!ejercicios_disponibles.includes(ej)) ejercicios_disponibles.unshift(ej);
  ppRenderRevisionGrid(el, ej, ejercicios_disponibles);
}

async function ppAbrirMes(ejercicio, mes) {
  // Buscar o crear período
  let periodo = ppCache.find(p => String(p.client_id)===String(ppClienteActivo.id) && p.ejercicio===ejercicio && p.mes===mes);
  if (!periodo) {
    const nuevo = {
      client_id: ppClienteActivo.id, cliente_nombre: ppClienteActivo.nombre,
      ejercicio, mes, revisado: false, status: 'pendiente',
      impuestos: {}, updated_at: nowISO()
    };
    const res = await sbPost('pp_periodos', nuevo, 'return=representation');
    const data = await res.json();
    periodo = Array.isArray(data) ? data[0] : data;
    if (periodo) ppCache.push(periodo);
  }
  ppMesActivo = { ejercicio, mes, data: periodo };
  ppRenderTab();
}

// ===== MODAL: CAPTURA DE IMPUESTO =====
function ppAbrirImpuesto(impId) {
  const fedImp = PP_IMPUESTOS_FED.find(i => i.id === impId);
  const estImp = PP_IMPUESTOS_EST.find(i => i.id === impId);
  const imp = fedImp || estImp;
  if (!imp) return;

  const data = ppMesActivo?.data?.impuestos?.[impId] || {};
  const mesLabel = PP_MESES_LARGO[ppMesActivo.mes - 1] + ' ' + ppMesActivo.ejercicio;
  const cfg = ppConfigCache[ppClienteActivo.id] || {};
  const cu = cfg.cu || 0;

  let formHTML = '';
  if (impId === 'isr_pm') {
    const ing = parseFloat(data.ing_nominales || 0);
    const cuVal = parseFloat(data.cu || cu || 0);
    const util_est = ing * cuVal;
    const perdidas = parseFloat(data.perdidas || 0);
    const base = Math.max(0, util_est - perdidas);
    const tasa = parseFloat(data.tasa_isr || cfg.tasa_isr || 30);
    const isr_cargo = base * (tasa / 100);
    const pp_ant = parseFloat(data.pp_anteriores || 0);
    const ret_acum = parseFloat(data.retenciones_acum || 0);
    const isr_pagar = Math.max(0, isr_cargo - pp_ant - ret_acum);

function ppCampo(id, label, valor, tipo, nota, prefix) {
  return `<div style="margin-bottom:12px">
    <div style="font-size:12px;color:#555;font-weight:500;margin-bottom:4px">${label}</div>
    <input type="${tipo}" value="${escH(String(valor||''))}" id="pp-f-${prefix}-${id}"
      style="width:100%;padding:9px 12px;font-size:14px;border:1px solid #e0e0db;border-radius:8px;background:#fff;font-family:inherit;outline:none"
      onfocus="this.style.borderColor='#3B4BC8'" onblur="this.style.borderColor='#e0e0db'">
    ${nota?`<div style="font-size:10px;color:#888;margin-top:3px;font-style:italic">${nota}</div>`:''}
  </div>`;
}

function ppCampoCalc(id, label, valor) {
  return `<div style="margin-bottom:12px">
    <div style="font-size:12px;color:#555;font-weight:500;margin-bottom:4px">${label}</div>
    <div id="pp-calc-${id}" style="width:100%;padding:9px 12px;font-size:14px;border:1px solid #e5e5e0;border-radius:8px;background:#f5f5f3;color:#888;font-family:inherit">${valor}</div>
  </div>`;
}

function ppRecalcularModal(impId, cfg) {
  if (impId === 'isr_pm') {
    const ing = parseFloat(document.getElementById('pp-f-isr_pm-ing_nominales')?.value) || 0;
    const cu = parseFloat(document.getElementById('pp-f-isr_pm-cu')?.value) || 0;
    const tasa = parseFloat(document.getElementById('pp-f-isr_pm-tasa_isr')?.value) || 30;
    const perdidas = parseFloat(document.getElementById('pp-f-isr_pm-perdidas')?.value) || 0;
    const pp_ant = parseFloat(document.getElementById('pp-f-isr_pm-pp_anteriores')?.value) || 0;
    const ret_acum = parseFloat(document.getElementById('pp-f-isr_pm-retenciones_acum')?.value) || 0;
    const util_est = ing * cu;
    const base = Math.max(0, util_est - perdidas);
    const isr_cargo = base * (tasa / 100);
    const isr_pagar = Math.max(0, isr_cargo - pp_ant - ret_acum);
    const el_util = document.getElementById('pp-calc-util_est'); if (el_util) el_util.textContent = fmtMXN(util_est);
    const el_base = document.getElementById('pp-calc-base_isr'); if (el_base) el_base.textContent = fmtMXN(base);
    const el_cargo = document.getElementById('pp-calc-isr_cargo'); if (el_cargo) el_cargo.textContent = fmtMXN(isr_cargo);
    const el_pagar = document.getElementById('pp-result-isr_pagar'); if (el_pagar) el_pagar.value = isr_pagar.toFixed(2);
  } else if (impId === 'isn_bc') {
    const base_rem = parseFloat(document.getElementById('pp-f-isn_bc-base_rem')?.value) || 0;
    const erog_excl = parseFloat(document.getElementById('pp-f-isn_bc-erog_excluidas')?.value) || 0;
    const tasa = parseFloat(document.getElementById('pp-f-isn_bc-tasa_isn')?.value) || 3;
    const imp_pag = parseFloat(document.getElementById('pp-f-isn_bc-importe_pagado')?.value) || 0;
    const base_grav = Math.max(0, base_rem - erog_excl);
    const isn_cargo = base_grav * (tasa / 100);
    const diferencia = imp_pag - isn_cargo;
    const el_bg = document.getElementById('pp-calc-base_gravable'); if (el_bg) el_bg.textContent = fmtMXN(base_grav);
    const el_cargo = document.getElementById('pp-calc-isn_cargo_calc'); if (el_cargo) el_cargo.textContent = fmtMXN(isn_cargo);
    const el_pagar = document.getElementById('pp-result-isn_pagar'); if (el_pagar) el_pagar.value = isn_cargo.toFixed(2);
    const el_dif = document.getElementById('pp-calc-diferencia_calc'); if (el_dif) el_dif.textContent = fmtMXN(diferencia);
  }
}

async function ppGuardarImpuesto(impId) {
  if (!ppMesActivo) return;
  const modal = document.getElementById('pp-modal-imp');
  const impData = {};
  modal.querySelectorAll('input[id^="pp-f-"]').forEach(inp => {
    const key = inp.id.replace(`pp-f-${impId}-`, '').replace(/^pp-f-[a-z_]+-/, '');
    impData[key] = inp.type === 'number' ? (parseFloat(inp.value) || 0) : inp.value;
  });
  // Resultado calculado
  const resultEl = modal.querySelector('[id^="pp-result-"]');
  if (resultEl) {
    const rKey = resultEl.id.replace('pp-result-', '');
    impData[rKey] = parseFloat(resultEl.value) || 0;
  }
  impData.revisado = true;

  if (!ppMesActivo.data) ppMesActivo.data = {};
  if (!ppMesActivo.data.impuestos) ppMesActivo.data.impuestos = {};
  ppMesActivo.data.impuestos[impId] = impData;

  // Guardar en Supabase
  const idx = ppCache.findIndex(p => p.id === ppMesActivo.data.id);
  if (idx >= 0) {
    await sbPatch('pp_periodos', `?id=eq.${ppMesActivo.data.id}`, { impuestos: ppMesActivo.data.impuestos, updated_at: nowISO() });
    ppCache[idx] = { ...ppCache[idx], impuestos: ppMesActivo.data.impuestos };
  }
  modal.remove();
  ppRenderMesDetalle(document.getElementById('pp-tab-content'));
}

async function ppGuardarMes() {
  if (!ppMesActivo?.data?.id) return;
  await sbPatch('pp_periodos', `?id=eq.${ppMesActivo.data.id}`, { impuestos: ppMesActivo.data.impuestos || {}, updated_at: nowISO() });
  // Toast
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999';
  t.textContent = '✓ Guardado'; document.body.appendChild(t); setTimeout(() => t.remove(), 2000);
}

async function ppMarcarRevisado() {
  if (!ppMesActivo?.data?.id) return;
  ppMesActivo.data.revisado = !ppMesActivo.data.revisado;
  await sbPatch('pp_periodos', `?id=eq.${ppMesActivo.data.id}`, { revisado: ppMesActivo.data.revisado, updated_at: nowISO() });
  const idx = ppCache.findIndex(p => p.id === ppMesActivo.data.id);
  if (idx >= 0) ppCache[idx].revisado = ppMesActivo.data.revisado;
  ppRenderMesDetalle(document.getElementById('pp-tab-content'));
}

function ppBuildInformeHTML(ejercicio, mesFiltro) {
  const periodos = ppCache.filter(p => String(p.client_id)===String(ppClienteActivo.id) && p.ejercicio===ejercicio && (mesFiltro===0||p.mes===mesFiltro)).sort((a,b)=>a.mes-b.mes);

  const rows = periodos.map(p => {
    const imp = p.impuestos || {};
    let det = 0, pag = 0, obs = [];
    Object.entries(imp).forEach(([k,d])=>{ det+=parseFloat(d.isr_pagar||d.isn_pagar||d.importe_determinado||0); pag+=parseFloat(d.importe_pagado||0); if(d.observaciones)obs.push(d.observaciones); });

      <td style="padding:6px 8px;font-size:12px;text-align:right;color:${pag>0?'#3B6D11':'#888'}">${pag>0?fmtMXN(pag):'—'}</td>
      <td style="padding:6px 8px;font-size:12px;text-align:right;color:${dif>=0?'#3B6D11':'#dc2626'}">${det>0||pag>0?fmtMXN(dif):'—'}</td>

      <td style="padding:6px 8px;text-align:center"><span style="background:${p.revisado?'#EAF3DE':'#f5f5f3'};color:${p.revisado?'#3B6D11':'#888'};padding:1px 6px;border-radius:999px;font-size:10px;font-weight:600">${p.revisado?'✓':''}</span></td>
    </tr>`;
  }).join('');
  return `<div style="font-size:12px;color:#888;margin-bottom:8px">Informe de revisión — ${ejercicio} · ${escH(ppClienteActivo.nombre)}</div>
  <table style="width:100%;border-collapse:collapse;font-size:12px">

    <tbody>${rows}</tbody>
  </table>`;

// ===== TAB: CONFIGURACIÓN =====
function ppRenderConfig(el) {
  const cfg = ppConfigCache[ppClienteActivo.id] || { impuestos_fed:['isr_pm','iva','ret_s','ret_h'], impuestos_est:['isn_bc'], cu:0, tasa_isr:30 };
  const fedChecks = PP_IMPUESTOS_FED.map(imp => `
    <div style="display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid #f0f0ec">
      <input type="checkbox" id="cfg-fed-${imp.id}" ${cfg.impuestos_fed.includes(imp.id)?'checked':''}
        style="width:18px;height:18px;margin-top:2px;accent-color:#3B4BC8;flex-shrink:0">
      <div>
        <div style="font-size:14px;font-weight:600;color:#1a1a1a">${imp.label}</div>
        <div style="font-size:11px;color:#888;margin-top:1px">${imp.ley}</div>
      </div>
    </div>`).join('');

  const estChecks = PP_IMPUESTOS_EST.map(imp => `
    <div style="border:1.5px solid ${cfg.impuestos_est.includes(imp.id)?'#3B6D11':'#e5e5e0'};border-radius:10px;padding:14px;margin-bottom:8px;background:${cfg.impuestos_est.includes(imp.id)?'#f0f7f0':'#fafafa'}">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:${cfg.impuestos_est.includes(imp.id)?'10px':'0'}">
        <input type="checkbox" id="cfg-est-${imp.id}" ${cfg.impuestos_est.includes(imp.id)?'checked':''}
          style="width:18px;height:18px;accent-color:#3B6D11;flex-shrink:0">
        <div style="flex:1">
          <div style="font-size:14px;font-weight:600">${imp.label} <span style="background:#e5e5e0;color:#555;font-size:10px;padding:1px 6px;border-radius:4px;font-weight:700">${imp.estado}</span></div>
          <div style="font-size:11px;color:#5a8a1a;font-weight:600">Estado: ${imp.estado==='BC'?'Baja California':imp.estado} · Tasa ${imp.tasa_default}%</div>
          <div style="font-size:11px;color:#888;margin-top:2px">${imp.ley}</div>
          <div style="font-size:11px;color:#888">${imp.vence} · ${imp.sistema||''}</div>
        </div>
      </div>
      ${cfg.impuestos_est.includes(imp.id)?`<div style="font-size:10px;font-weight:600;color:#888;text-transform:uppercase;margin-bottom:4px">CAMPOS DE CAPTURA MENSUAL</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${(imp.campos||[]).map(c=>`<span style="background:#fff;border:1px solid #ddd;border-radius:6px;padding:3px 8px;font-size:11px">${c.replace(/_/g,' ')}</span>`).join('')}</div>`:''}
    </div>`).join('');

  el.innerHTML = `
  <div class="card" style="margin-bottom:12px">
    <div style="font-size:10px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px">IMPUESTOS FEDERALES APLICABLES A ${escH(ppClienteActivo.nombre.toUpperCase())}</div>
    ${fedChecks}
  </div>
  <div class="card" style="margin-bottom:12px">
    <div style="font-size:10px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">OBLIGACIONES FISCALES ESTATALES FIJAS</div>
    <div style="font-size:12px;color:#888;margin-bottom:12px">Estas obligaciones se incluyen automáticamente en cada período mensual nuevo. Su cédula aparece en la sección de revisión junto a los impuestos federales.</div>
    ${estChecks}
  </div>
  <div class="card" style="margin-bottom:12px">
    <div style="font-size:10px;font-weight:600;color:#888;text-transform:uppercase;margin-bottom:10px">PARÁMETROS FISCALES DEL CLIENTE</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div>
        <div style="font-size:12px;color:#888;margin-bottom:4px">Coeficiente de Utilidad (CU) — Art. 14 LISR</div>
        <input type="number" id="cfg-cu" value="${cfg.cu||0}" step="0.0001" min="0" max="1"
          style="width:100%;padding:8px 10px;font-size:14px;border:1px solid #e0e0db;border-radius:8px;font-family:inherit">
        <div style="font-size:10px;color:#888;margin-top:3px">Determinado en la declaración anual del ejercicio anterior</div>
      </div>
      <div>
        <div style="font-size:12px;color:#888;margin-bottom:4px">Tasa ISR (%)</div>
        <input type="number" id="cfg-tasa" value="${cfg.tasa_isr||30}" min="0" max="100"
          style="width:100%;padding:8px 10px;font-size:14px;border:1px solid #e0e0db;border-radius:8px;font-family:inherit">
      </div>
    </div>
  </div>
  <button class="btn btn-primary" onclick="ppGuardarConfig()" style="width:100%;padding:12px;font-size:14px">💾 Guardar configuración</button>
  <div style="font-size:11px;color:#888;margin-top:8px;text-align:center">Los cambios aplican a nuevos períodos. Los períodos ya guardados conservan sus datos.</div>`;
}

async function ppGuardarConfig() {
  const clientId = ppClienteActivo.id;
  const fed = PP_IMPUESTOS_FED.filter(i=>document.getElementById('cfg-fed-'+i.id)?.checked).map(i=>i.id);
  const est = PP_IMPUESTOS_EST.filter(i=>document.getElementById('cfg-est-'+i.id)?.checked).map(i=>i.id);
  const cu = parseFloat(document.getElementById('cfg-cu')?.value) || 0;
  const tasa = parseFloat(document.getElementById('cfg-tasa')?.value) || 30;
  ppConfigCache[clientId] = { impuestos_fed:fed, impuestos_est:est, cu, tasa_isr:tasa };
  // Upsert en Supabase
  const existing = await sbGet('pp_config', `?client_id=eq.${clientId}&select=id`);
  if (existing && existing.length) {
    await sbPatch('pp_config', `?client_id=eq.${clientId}`, { impuestos_fed:JSON.stringify(fed), impuestos_est:JSON.stringify(est), cu, tasa_isr:tasa, updated_at:nowISO() });
  } else {
    await sbPost('pp_config', { client_id:clientId, cliente_nombre:ppClienteActivo.nombre, impuestos_fed:JSON.stringify(fed), impuestos_est:JSON.stringify(est), cu, tasa_isr:tasa, updated_at:nowISO() });
  }
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#3B6D11;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999';
  t.textContent = '✓ Configuración guardada'; document.body.appendChild(t); setTimeout(() => t.remove(), 2000);
  ppRenderConfig(document.getElementById('pp-tab-content'));
}

async function ppNuevoPeriodo() {
  const ej = parseInt(prompt('Ejercicio fiscal:', new Date().getFullYear())); if (!ej) return;
  const mes = parseInt(prompt('Mes (1-12):', new Date().getMonth()+1)); if (!mes || mes<1||mes>12) return;
  await ppAbrirMes(ej, mes);
  ppTabActiva = 'revision';
  ppRenderCliente();
}
